---
# Parameters:
# recipe_content_url: A recipe URL in a raw format, for example "https://api.github.com/repos/newrelic/open-install-library/contents/recipes/newrelic/infrastructure/awslinux.yml"
# newrelic_personal_api_key: The newrelic personal api key. It typically starts with NRAK-
# newrelic_account_id: (optional) The newrelic account id
# newrelic_region: (optional) The newrelic region. Typically "US".
# newrelic_cli_path: (optional) The newrelic-cli to use instead of using latest published
# command_should_fail: (optional) Should the newrelic install command fail? False by default.
# validate_output: (optional) An array of Strings that must appear in stdout for this test to pass.
# use_organization_id: (optional) A boolean value to control if NEW_RELIC_ORGANIZATION_ID should be added to env_vars. False by default.
# newrelic_organization_id: (optional) The NewRelic Organization ID if use_organization_id is set to True.
# nr_host_fleet_id: (optional) A NewRelic host fleet id to add if NR_CLI_FLEET_ID should be added to env_vars.
# use_system_identity_auth: (optional) A boolean value to control if system identity authentication should be used. False by default.
# env_var: (optional) A ";"-joined string of PowerShell $env: assignments (e.g. '$env:FOO="bar"; $env:BAZ="qux"') injected into the environment before running newrelic install.

- name: Prepare command_should_fail option
  when: command_should_fail is not defined
  set_fact:
    command_should_fail: False

- name: Prepare newrelic_organization_id
  set_fact:
    use_organization_id: false
  when: use_organization_id is not defined

- name: Prepare nr_l1_system_identity_auth
  set_fact:
    use_system_identity_auth: false
  when: use_system_identity_auth is not defined

- fail:
    msg: "A newrelic_personal_api_key is required. Create this entry in your user config file"
  when: newrelic_personal_api_key is not defined

- fail:
    msg: "A recipe_content_url is required. Create this entry in your deploy config file"
  when: recipe_content_url is not defined

- name: set api key
  win_environment:
    state: present
    name: NEW_RELIC_API_KEY
    value: "{{ newrelic_personal_api_key }}"
    level: machine
  no_log: true

- name: Prepare environment variables for newrelic-cli execution
  set_fact:
    env_vars: ""

- name: Get environment variables from "env_var"
  set_fact:
    env_vars: "{{ env_vars }}; {{ env_var }}"
  when: env_var is defined

- name: Adding newrelic accountId environment variable
  set_fact:
    env_vars: "{{ env_vars }}; $env:NEW_RELIC_ACCOUNT_ID=\"{{ newrelic_account_id }}\""
  when: newrelic_account_id is defined

- name: Adding newrelic organization environment variable
  set_fact:
    env_vars: "{{ env_vars }}; $env:NEW_RELIC_ORGANIZATION=\"{{ newrelic_organization_id }}\""
  when: use_organization_id | bool == True
  no_log: true

- name: Adding L1 System Identities Auth Client ID environment variable
  set_fact:
    env_vars: "{{ env_vars }}; $env:NEW_RELIC_AUTH_CLIENT_ID=\"{{ lookup('env', 'SYSTEM_IDENTITY_CLIENT_ID') }}\""
  when: use_system_identity_auth | bool == True
  no_log: true

- name: Adding L1 System Identities Auth Client Secret environment variable
  set_fact:
    env_vars: "{{ env_vars }}; $env:NEW_RELIC_AUTH_CLIENT_SECRET=\"{{ lookup('env', 'SYSTEM_IDENTITY_CLIENT_SECRET') }}\""
  when: use_system_identity_auth | bool == True
  no_log: true

- name: Adding newrelic host fleet id environment variable
  set_fact:
    env_vars: "{{ env_vars }}; $env:NR_CLI_FLEET_ID=\"{{ nr_host_fleet_id }}\""
  when: nr_host_fleet_id is defined
  no_log: true

- name: Adding newrelic region environment variable
  set_fact:
    env_vars: "{{ env_vars }}; $env:NEW_RELIC_REGION=\"{{ newrelic_region|upper }}\""
  when: newrelic_region is defined

- name: Prepare newrelic-cli option
  set_fact:
    newrelic_cli_option: "-y --debug"

- name: Adding any targeted option
  set_fact:
    newrelic_cli_option: "{{ newrelic_cli_option }} -n {{recipe_targeted}}"
  when: recipe_targeted is defined

- name: Adding optional local recipes
  set_fact:
    newrelic_cli_option: "{{ newrelic_cli_option }} --localRecipes C:\\Temp\\open-install-library-recipes\\"
  when: local_recipes is defined and (local_recipes | bool == True)

- name: Copy all recipes
  ansible.windows.win_copy:
    src: "{{ role_path }}/../../../../../../../recipes"
    dest: "C:\\Temp\\open-install-library-recipes"
    mode: '0777'
  when: local_recipes is defined and (local_recipes | bool == True)

- name: Copy newrelic-cli if local exists
  ansible.windows.win_copy:
    src: "{{ newrelic_cli_path }}"
    dest: '%SystemRoot%\System32\newrelic.exe'
    mode: '0777'
  when: newrelic_cli_path is defined

- name: Install newrelic cli
  win_shell: |
    [Net.ServicePointManager]::SecurityProtocol = 'tls13, tls12, tls'
    (New-Object System.Net.WebClient).DownloadFile("https://download.newrelic.com/install/newrelic-cli/scripts/install.ps1", "$env:TEMP\install.ps1");
    & $env:TEMP\install.ps1 | Out-Null;
  when: newrelic_cli_path is not defined

# NR-620798: WinRM's live stdout/stderr capture for this win_shell task has been confirmed
# (via a controlled A/B test across dependency versions, plus an async: 600 attempt, neither
# of which changed the outcome) to unreliably drop the tail of long-running (70-150s+) command
# output - the command itself completes fine (rc:0 / correct pass-fail exit code every time),
# but the *captured text* is truncated. Redirecting to a file on the host and reading it back
# in a separate task sidesteps live-capture reliability entirely, regardless of its cause.
- name: Ensure output capture directory exists
  ansible.windows.win_file:
    path: C:\Temp
    state: directory

- block:
  - name: Run recipe, expect failure
    win_shell: |
      {{ env_vars }}; newrelic install {{newrelic_cli_option}} -c {{ recipe_content_url }} *> C:\Temp\nr_install_output.log;
    register: output
    ignore_errors: true
  - name: Read captured install output from file (NR-620798)
    win_shell: Get-Content C:\Temp\nr_install_output.log -Raw
    register: captured_output
  - fail:
      msg: "The recipe installed when it was expected to fail:{{ captured_output.stdout }}"
    when: output is not failed
  - fail:
      msg: "Failed to validate that {{ validate_output }} is in output:{{ captured_output.stdout }}"
    when: validate_output is defined and captured_output.stdout is not search(validate_output)
  when: command_should_fail == True

- block:
  - name: Record timestamp before install (NR-620798 diagnostics)
    win_shell: Get-Date -Format o
    register: ts_before

  - name: Run recipe, expect success
    win_shell: |
      {{ env_vars }}; newrelic install {{newrelic_cli_option}} -c {{ recipe_content_url }} *> C:\Temp\nr_install_output.log;
    register: output
    ignore_errors: true

  - name: Record timestamp after install (NR-620798 diagnostics)
    win_shell: Get-Date -Format o
    register: ts_after

  - name: Read captured install output from file (NR-620798)
    win_shell: Get-Content C:\Temp\nr_install_output.log -Raw
    register: captured_output

  - name: Independently check newrelic-infra service status (NR-620798 diagnostics)
    ansible.windows.win_service_info:
      name: newrelic-infra
    register: infra_service_status

  - name: Report NR-620798 diagnostics (always shown, pass or fail)
    debug:
      msg:
        - "ts_before: {{ ts_before.stdout | default('n/a') | trim }}"
        - "ts_after:  {{ ts_after.stdout | default('n/a') | trim }}"
        - "ansible-reported rc: {{ output.rc | default('n/a') }}, failed: {{ output.failed | default('n/a') }}"
        - "live-captured stdout (output.stdout): {{ output.stdout | default('') }}"
        - "file-captured stdout (captured_output.stdout): {{ captured_output.stdout | default('') }}"
        - "newrelic-infra service info: {{ infra_service_status.services | default('n/a') }}"

  - fail:
      msg: "The recipe failed to install when it was expected to succeed:{{ captured_output.stdout }}"
    when: output is failed
  - fail:
      msg: "Failed to validate that {{ validate_output }} is in output:{{ captured_output.stdout }}"
    when: validate_output is defined and captured_output.stdout is not search(validate_output)
  when: command_should_fail == False