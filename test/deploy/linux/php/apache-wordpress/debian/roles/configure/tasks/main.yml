---
- debug:
    msg: Install PHP

- name: install PHP and pre-reqs
  # The apt mirrors can be flaky (hash-sum mismatches, transient 503s).
  # Retry to absorb mirror flakes.
  apt:
    pkg:
      - libapache2-mod-php
      - mariadb-server
      - mariadb-client
      # the recipe requires gpg; a bare cloud image may not have it
      - gnupg
      - php-mysql
    update_cache: yes
  become: yes
  register: apt_install_php
  until: apt_install_php is succeeded
  retries: 3
  delay: 10

- template:
    src: "{{ item }}"
    dest: ~/templates/
    mode: 0755
  with_fileglob:
    - ../../../../../templates/*
  become: yes

- shell:
    cmd: ~/templates/install-wordpress.sh
  become: yes
