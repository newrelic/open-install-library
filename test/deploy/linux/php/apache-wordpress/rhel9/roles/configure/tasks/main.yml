---
- debug:
    msg: Install PHP

# RHEL 9 defaults to PHP 8.0; use a supported stream instead.
- name: enable PHP 8.3 module stream
  shell: "dnf -y module enable php:8.3"
  become: yes

- name: install PHP and pre-reqs
  yum:
    pkg:
      - php
      - php-mysqlnd
      - httpd
      - mariadb
      - mariadb-server
    state: present
  become: yes

- template:
    src: "{{ item }}"
    dest: ~/templates/
    mode: 0755
  with_fileglob:
    - ../../../../../templates/*
  become: yes

- shell:
    cmd: ~/templates/install-wordpress.sh
  become: yes
