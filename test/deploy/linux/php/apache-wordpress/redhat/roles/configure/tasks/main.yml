---
- debug:
    msg: Install PHP

- name: use the PHP 8.3 module stream (the default stream is PHP 8.0, which is end of life)
  shell: dnf module reset -y php && dnf module enable -y php:8.3
  become: yes

- name: install PHP and httpd
  yum:
    pkg:
      - php
      - php-mysqlnd
      - httpd
      - mariadb
      - mariadb-server
      # the recipe requires chkconfig; a RHEL host has it, the bare image of the test does not
      - chkconfig
    state: present
    lock_timeout: 180
  become: yes

- template:
    src: "{{ item }}"
    dest: ~/templates/
    mode: 0755
  with_fileglob:
    - ../../../../../templates/*
  become: yes

- shell:
    cmd: ~/templates/install-wordpress.sh
  become: yes
