---
- debug:
    msg: Install Docker and PHP
    
########################################
# Docker installation
########################################
- block:
  - name: install Docker 
    package:
      name: docker
      update_cache: yes
      state: present
  
  - name: Start docker service
    systemd:
      name: docker
      state: started
      enabled: yes
  
  - name: Granting permissions to docker from ec2-user
    shell: "usermod -a -G docker ec2-user"

  - name: Flush user/group permissions change
    meta: reset_connection

  - name: Verify docker service is ready
    shell: docker info
    register: output
    retries: 20
    delay: 15
    until: output is not failed    

  become: true

- name: Create templates directory
  file:
    path: /home/ec2-user/templates
    state: directory

- name: Copy files to templates directory
  synchronize:
      src: "{{ item }}"
      dest: /home/ec2-user/templates
      mode: push
  with_fileglob:
    - "../../../../docker-templates/*"
  become: true

########################################
# PHP installation
########################################

- name: Install PHP
  yum:
    name: php8.4
    state: present
    update_cache: yes
  become: true

