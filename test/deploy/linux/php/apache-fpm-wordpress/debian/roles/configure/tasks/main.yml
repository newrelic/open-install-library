---
- debug:
    msg: Install PHP

- name: install PHP and pre-reqs
  apt:
    pkg:
      - apache2
      - php-fpm
      - mariadb-server
      - mariadb-client
      - php-mysql
    update_cache: yes
  become: yes
  # The apt run of the first boot can hold the dpkg lock, and the mirrors can be flaky.
  # Retry to absorb both.
  register: apt_install_php
  until: apt_install_php is succeeded
  retries: 3
  delay: 10

- template:
    src: "{{ item }}"
    dest: ~/templates/
    mode: 0755
  with_fileglob:
    - ../../../../../templates/*
  become: yes

- shell:
    cmd: ~/templates/install-wordpress.sh
  become: yes
