---
- debug:
    msg: Install PHP

- name: install PHP and httpd
  yum:
    pkg:
      - httpd
      - php
      - php-fpm
      - php-mysqlnd
      - mariadb
      - mariadb-server
    state: present
    lock_timeout: 180
  become: yes

- name: start php-fpm service
  systemd:
    name: php-fpm
    state: started
    enabled: yes
  become: yes

- template:
    src: "{{ item }}"
    dest: ~/templates/
    mode: 0755
  with_fileglob:
    - ../../../../../templates/*
  become: yes

- shell:
    cmd: ~/templates/install-wordpress.sh
  become: yes
