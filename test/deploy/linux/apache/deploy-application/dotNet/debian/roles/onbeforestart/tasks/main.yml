---
- debug:
    msg: Install .NET App

- name: Set default proxy_port (default to 5000)
  set_fact:
    proxy_port: "5005"
  when: proxy_port is undefined

- name: Set default is_selfcontained (default to false)
  set_fact:
    is_selfcontained: "false"
  when: is_selfcontained is undefined

- name: Set default use_executable for how to run the .NET process (default to false)
  set_fact:
    use_executable: "false"
  when: use_executable is undefined

- name: Set default dotnet_app_name (published entrypoint name of the app)
  set_fact:
    dotnet_app_name: "testwebapp"
  when: dotnet_app_name is undefined

- name: Set default dotnet_channel (SDK channel used to build the app; match the installed runtime)
  set_fact:
    dotnet_channel: "10.0"
  when: dotnet_channel is undefined

- name: Set startup_command to executable (not dotnet xx.dll)
  set_fact:
    startup_command: "/var/www/{{ service_id }}/{{ dotnet_app_name }}"
  when: use_executable|bool

- name: Set startup_command to dotnet command (use dotnet xx.dll)
  set_fact:
    startup_command: "/usr/bin/dotnet /var/www/{{ service_id }}/{{ dotnet_app_name }}.dll"
  when: use_executable|bool == False

- name: Init template variable for self contained application
  set_fact:
    apache_service_description: Self Contained ASP.NET Core Web app
    apache_proxy_port: 5006
  when: is_selfcontained|bool

- name: Init template variable for framework dependent application
  set_fact:
    apache_service_description: Framework Dependent ASP.NET Core Web app
    apache_proxy_port: 5001
  when: is_selfcontained|bool == False


- name: Copy dotnet webapp service file
  template:
    src: dotnetwebapplication.service
    dest: /etc/systemd/system/{{ service_id }}.service
  become: true

- name: Download web app
  shell: |
    set -e
    mkdir -p ~/{{ service_id }}
    cd ~/{{ service_id }}
    curl -fsSL --retry 3 "{{ web_app_url }}" -o {{ service_id }}.zip
    mkdir -p /var/www/{{ service_id }}
    unzip -o ./{{ service_id }}.zip -d /var/www/{{ service_id }}
  become: true
  when: web_app_url is defined

- name: Build web app on the host
  script: "{{ role_path }}/../../../../../../dotNet/build-test-app.sh /var/www/{{ service_id }} {{ dotnet_app_name }} {{ dotnet_channel }} {{ is_selfcontained | bool | lower }}"
  become: true
  when: web_app_url is undefined

- name: Set web app permissions
  shell: |
    set -e
    chmod -R 777 /var/www/{{ service_id }}
    chown -R ubuntu:ubuntu /var/www/{{ service_id }}
  become: true

- name: Listen on port {{ service_port }} for {{ service_id }}
  shell: echo 'Listen {{ service_port }}' >> /etc/apache2/ports.conf
  become: true

- name: Copy apache server {{ service_id }} status file
  template:
    src: dotnetwebapplication.conf
    dest: /etc/apache2/conf-enabled/{{ service_id }}.conf
  become: true