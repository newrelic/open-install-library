---
# Parameters:
# newrelic_personal_api_key: The newrelic personal api key. It typically starts with NRAK-
# newrelic_account_id: (optional) The newrelic account id
# newrelic_region: (optional) The newrelic region. Typically "US".
# newrelic_cli_path: (optional) The newrelic-cli to use instead of using latest published
# validate_output: (optional) A string that must appear in stdout for this test to pass.
#
# Test scenario:
#   1. Run a standard first install (no preserve flag) — installs agent and creates config.
#   2. Append a custom marker key to newrelic-infra.yml.
#   3. Re-run install WITH NEW_RELIC_PRESERVE_INFRA_CONFIG=true.
#   4. Assert the agent is still installed and reporting.
#   5. Assert the custom marker key survived the second install unchanged.

- name: Prepare newrelic_region
  set_fact:
    newrelic_region: "US"
  when: newrelic_region is not defined

- fail:
    msg: "A newrelic_personal_api_key is required. Create this entry in your user config file"
  when: newrelic_personal_api_key is not defined

- name: set api key
  lineinfile:
    path: "/etc/environment"
    state: present
    regexp: "^NEW_RELIC_API_KEY="
    line: "NEW_RELIC_API_KEY={{ newrelic_personal_api_key }}"
  become: true
  no_log: true

- name: Prepare environment variables for newrelic-cli execution
  set_fact:
    env_vars: ""

- name: Adding newrelic accountId environment variable
  set_fact:
    env_vars: "{{ env_vars }} NEW_RELIC_ACCOUNT_ID={{ newrelic_account_id }}"
  when: newrelic_account_id is defined

- name: Adding newrelic region environment variable
  set_fact:
    env_vars: "{{ env_vars }} NEW_RELIC_REGION={{ newrelic_region|upper }}"
  when: newrelic_region is defined

- name: Adding sudo user environment variable
  set_fact:
    env_vars: "{{ env_vars }} SUDO_USER={{ ansible_user }}"

- name: Prepare newrelic-cli option for first install
  set_fact:
    newrelic_cli_option_first: "-y --debug"

- name: Adding optional local recipes (first install)
  set_fact:
    newrelic_cli_option_first: "{{ newrelic_cli_option_first }} --localRecipes /home/{{ansible_user}}/open-install-library-recipes/"
  when: local_recipes is defined and (local_recipes | bool == True)

- name: Copy all recipes
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../../../../../recipes"
    dest: "/home/{{ansible_user}}/open-install-library-recipes"
    mode: '0777'
  become: true
  when: local_recipes is defined and (local_recipes | bool == True)

- name: Copy newrelic-cli if local exists
  ansible.builtin.copy:
    src: "{{ newrelic_cli_path }}"
    dest: /usr/local/bin/newrelic
    mode: '0777'
  become: true
  when: newrelic_cli_path is defined

- name: ensure tar is installed for script execution yum
  yum:
    pkg:
      - tar
    state: present
  become: true
  ignore_errors: true

- name: ensure tar is installed for script execution dnf
  dnf:
    name: tar
    state: present
  become: true
  ignore_errors: true

- name: Install newrelic-cli
  shell: "curl -Ls https://raw.githubusercontent.com/newrelic/newrelic-cli/master/scripts/install.sh | bash"
  when: newrelic_cli_path is not defined

- name: CLI install profile
  shell: "/usr/local/bin/newrelic profiles add --profile install --apiKey {{ newrelic_personal_api_key }} --region {{ newrelic_region|upper }} --accountId {{ newrelic_account_id }} -y"
  become: true
  no_log: true

- name: Default CLI profile
  shell: "/usr/local/bin/newrelic profiles default --profile install"
  become: true

- name: Display CLI version
  shell: "/usr/local/bin/newrelic version"
  become: true

- name: Export NEW_RELIC_EMAIL_CONTINUE
  shell: "echo export NEW_RELIC_EMAIL_CONTINUE=N >> ~/.bashrc"

# ── Step 1: First standard install (no preserve flag) ───────────────────────
- name: Run first install (standard, no preserve flag)
  shell: "sudo -E {{ env_vars }} /usr/local/bin/newrelic install {{ newrelic_cli_option_first }}"
  async: 600
  register: first_install_output
  become: true
  ignore_errors: true

- fail:
    msg: "First install failed: {{ first_install_output.stdout }}"
  when: first_install_output is failed

# ── Step 2: Add custom marker to config ─────────────────────────────────────
- name: Append custom marker key to newrelic-infra.yml
  shell: |
    echo 'custom_preserve_test_key: preserved_value_12345' >> /etc/newrelic-infra.yml
    echo 'custom_preserve_section:' >> /etc/newrelic-infra.yml
    echo '  nested_key: nested_value_67890' >> /etc/newrelic-infra.yml
  become: true

- name: Capture config state before second install
  shell: "cat /etc/newrelic-infra.yml"
  become: true
  register: config_before

- name: Display config before second install
  debug:
    msg: "Config before second install:\n{{ config_before.stdout }}"

# ── Step 3: Second install WITH preserve flag ────────────────────────────────
- name: Run second install with NEW_RELIC_PRESERVE_INFRA_CONFIG=true
  shell: "sudo -E {{ env_vars }} NEW_RELIC_PRESERVE_INFRA_CONFIG=true /usr/local/bin/newrelic install {{ newrelic_cli_option_first }}"
  async: 600
  register: second_install_output
  become: true
  ignore_errors: true

- fail:
    msg: "Second install (with preserve flag) failed: {{ second_install_output.stdout }}"
  when: second_install_output is failed

- fail:
    msg: "Failed to validate that {{ validate_output }} is in output: {{ second_install_output.stdout }}"
  when: validate_output is defined and second_install_output.stdout is not search(validate_output)

# ── Step 4: Verify custom marker survived ───────────────────────────────────
- name: Read config after second install
  shell: "cat /etc/newrelic-infra.yml"
  become: true
  register: config_after

- name: Display config after second install
  debug:
    msg: "Config after second install:\n{{ config_after.stdout }}"

- name: Assert custom_preserve_test_key survived the second install
  shell: "grep -q 'custom_preserve_test_key: preserved_value_12345' /etc/newrelic-infra.yml"
  become: true
  register: assert_key
  failed_when: assert_key.rc != 0

- name: Assert custom_preserve_section survived the second install
  shell: "grep -q 'custom_preserve_section:' /etc/newrelic-infra.yml"
  become: true
  register: assert_section
  failed_when: assert_section.rc != 0

- name: Config preservation verified successfully
  debug:
    msg: "SUCCESS: Custom configuration keys were preserved through the second install."
