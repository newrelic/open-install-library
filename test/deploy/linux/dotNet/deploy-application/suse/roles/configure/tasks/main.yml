---
# SUSE's useradd doesn't create a group named after the user, so create it explicitly.
- name: Create the group that runs the .NET web apps
  ansible.builtin.group:
    name: dotnetapp
    system: true
  become: true

- name: Create the user that runs the .NET web apps
  ansible.builtin.user:
    name: dotnetapp
    group: dotnetapp
    system: true
    create_home: false
    shell: /sbin/nologin
  become: true
