---
- debug:
    msg: Configure

- name: Set default create_newrelic_user (default not create)
  set_fact:
    create_newrelic_user: "false"
  when: create_newrelic_user is undefined

- name: Set default create_env_var (default not create)
  set_fact:
    create_env_var: "false"
  when: create_env_var is undefined

# By default JMX security is disabled.
- name: Require authentication
  become: true
  ansible.builtin.lineinfile:
    path: /etc/cassandra/cassandra-env.sh
    regexp: "jmxremote.authenticate=false"
    line: '  JVM_OPTS="$JVM_OPTS -Dcom.sun.management.jmxremote.authenticate=true"'

- name: Configure access file
  become: true
  ansible.builtin.lineinfile:
    path: /etc/cassandra/cassandra-env.sh
    regexp: "jmxremote.access.file"
    line: JVM_OPTS="$JVM_OPTS -Dcom.sun.management.jmxremote.access.file=/etc/cassandra/jmxremote.access"

- name: Add passwords file
  become: true
  ansible.builtin.copy:
    dest: /etc/cassandra/jmxremote.password
    content: |
      cassandra cassandra
      newrelic Virtuoso4all!

- name: Add access file
  become: true
  ansible.builtin.copy:
    dest: /etc/cassandra/jmxremote.access
    content: |
      cassandra readwrite
      newrelic readonly

- name: Pin JAVA_HOME to JDK 17 for Cassandra (Debian 12 ships JDK 17)
  become: true
  ansible.builtin.lineinfile:
    path: /etc/cassandra/cassandra-env.sh
    regexp: '^export JAVA_HOME='
    line: 'export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64'
    insertbefore: '^# JVM_OPTS'
    firstmatch: true

- name: Restart Cassandra
  become: true
  ansible.builtin.systemd:
    name: cassandra
    state: restarted
    daemon_reload: yes

- name: Verify java binary and actual path
  become: true
  ansible.builtin.command: readlink -f /usr/bin/java
  register: java_path
  ignore_errors: true
  changed_when: false

- name: Show java path
  ansible.builtin.debug:
    msg: "Java binary resolves to: {{ java_path.stdout }}"

- name: Capture Cassandra startup log file (not journald — Cassandra logs here)
  become: true
  ansible.builtin.command: cat /var/log/cassandra/system.log
  register: cass_log
  ignore_errors: true
  changed_when: false

- name: Show Cassandra system.log
  ansible.builtin.debug:
    msg: "{{ cass_log.stdout_lines[-50:] }}"

- name: Wait for Cassandra to be ready (native transport port 9042)
  ansible.builtin.wait_for:
    host: localhost
    port: 9042
    timeout: 300
    delay: 15
  become: true

- block:
  - name: Export USERNAME
    shell: "echo export NR_CLI_DB_USERNAME=newrelic >> ~/.bashrc"
  - name: Export PASSWORD
    shell: "echo export NR_CLI_DB_PASSWORD=Virtuoso4all! >> ~/.bashrc"
  - name: Export HOSTNAME
    shell: "echo export NR_CLI_DB_HOSTNAME=localhost >> ~/.bashrc"
  - name: Export DB_PORT
    shell: "echo export NR_CLI_DB_PORT=7199 >> ~/.bashrc"
  when: create_env_var|bool
