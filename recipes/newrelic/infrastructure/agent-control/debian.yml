# Visit our schema definition for additional information on this file format.
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition

name: agent-control
displayName: Agent Control
description: New Relic install recipe for Agent Control
repository: https://github.com/newrelic/newrelic-agent-control

installTargets:
  - type: host
    os: linux
    platformFamily: debian
    platformVersion: "(10|11|12)\\.*" # Buster, Bullseye, Bookworm #
  - type: host
    os: linux
    platform: ubuntu
    platformVersion: "(16|18|20|22|24|26)\\.04"

keywords:
  - AgentControl
  - OpenTelemetry
  - OTel
  - Infrastructure
  - Agent
  - Linux
  - Debian
  - jammy
  - focal
  - bionic
  - xenial
  - bullseye
  - buster

processMatch: []

preInstall:
  # Autodiscovery checks disabled to improve installation performance
  # Docker/WSL validations removed to avoid slow discovery of unrelated recipes
  requireAtDiscovery: |
    exit 0

  discoveryMode:
    - targeted
install:
  version: "3"
  silent: true
  vars:
    IS_SYSTEMCTL:
      sh: command -v systemctl | wc -l
    IS_INITCTL:
      sh: command -v initctl | wc -l

  tasks:
    default:
      cmds:
        - task: write_recipe_metadata
        - task: detect_previous_install
        - task: assert_pre_req
        - task: prepare_proxy_ca
        - task: check_connectivity
        - task: log_ssl_ciphers
        - task: update_apt
        - task: install_gnupg
        - task: add_gpg_key
        - task: add_nr_source
        - task: update_apt_nr_source
        - task: install_agent_control
        - task: config_agent_control
        - task: restart_agent_control
        - task: assert_agent_control_status_ok
        - task: signal_recipe_applied
        - task: post_install

    write_recipe_metadata:
      cmds:
        - |
          echo '{"Metadata":{"CapturedCliOutput":"true"}}' | tee {{.NR_CLI_OUTPUT}} > /dev/null

    detect_previous_install:
      cmds:
        - |
          if [ -f /etc/newrelic-agent-control/.nr-cli ] ; then
            echo "A previous execution of this installation was detected. Some installation tasks will be skipped."
            echo "If you would like to run all the tasks, please remove the /etc/newrelic-agent-control/.nr-cli file and re-run the installation."
          fi

    assert_pre_req:
      cmds:
        - |
          BITS=$(getconf LONG_BIT)
          if [ "$BITS" != "64" ]; then
            echo "64-bit architecture is required. Detected: ${BITS}-bit system" >&2
            exit 131
          fi
        - |
          IS_ROOT_OR_SUDO=$([ ! -z "$SUDO_USER" ] || [ $(whoami) = "root" ] && echo "true" || echo "false") # Assert root or sudo user
          if [ "$IS_ROOT_OR_SUDO" = "false" ]; then
            echo "This newrelic install must be run under sudo or root" >&2
            exit 3
          fi
        - |
          IS_GREP_INSTALLED=$(which grep | wc -l)
          if [ $IS_GREP_INSTALLED -eq 0 ] ; then
            echo "grep is required to run the newrelic install. Please install grep and re-run the installation." >&2
            exit 10
          fi
        - |
          IS_SED_INSTALLED=$(which sed | wc -l)
          if [ $IS_SED_INSTALLED -eq 0 ] ; then
            echo "sed is required to run the newrelic install. Please install sed and re-run the installation." >&2
            exit 11
          fi
        - |
          IS_AWK_INSTALLED=$(which awk | wc -l)
          if [ $IS_AWK_INSTALLED -eq 0 ] ; then
            echo "awk is required to run the newrelic install. Please install awk and re-run the installation." >&2
            exit 12
          fi
        - |
          IS_CAT_INSTALLED=$(which cat | wc -l)
          if [ $IS_CAT_INSTALLED -eq 0 ] ; then
            echo "cat is required to run the newrelic install. Please install cat and re-run the installation." >&2
            exit 13
          fi
        - |
          IS_TEE_INSTALLED=$(which tee | wc -l)
          if [ $IS_TEE_INSTALLED -eq 0 ] ; then
            echo "tee is required to run the newrelic install. Please install tee and re-run the installation." >&2
            exit 14
          fi
        - |
          IS_TOUCH_INSTALLED=$(which touch | wc -l)
          if [ $IS_TOUCH_INSTALLED -eq 0 ] ; then
            echo "touch is required to run the newrelic install. Please install touch and re-run the installation." >&2
            exit 15
          fi
        - |
          IS_CURL_INSTALLED=$(which curl | wc -l)
          if [ $IS_CURL_INSTALLED -eq 0 ] ; then
            echo "curl is required to run the newrelic install. Please install curl and re-run the installation." >&2
            exit 16
          fi
        - |
          IS_OPENSSL_INSTALLED=$(which openssl | wc -l)
          if [ $IS_OPENSSL_INSTALLED -eq 0 ] ; then
            echo "openssl is required to run the newrelic install. Please install openssl and re-run the installation." >&2
            exit 17
          fi
        - |
          IS_MKTEMP_INSTALLED=$(which mktemp | wc -l)
          if [ $IS_MKTEMP_INSTALLED -eq 0 ] ; then
            echo "mktemp is required to run the newrelic install. Please install coreutils and re-run the installation." >&2
            exit 18
          fi

    # Builds one CA bundle (system CAs plus the proxy CA given by the user) for the steps that run before
    # Agent Control is installed. The bundle lives in /run, which only root can write to.
    prepare_proxy_ca:
      cmds:
        - |
          NR_DIR=/run/newrelic-agent-control-install
          NR_CA_BUNDLE=$NR_DIR/ca-bundle.pem
          rm -rf "$NR_DIR"
          mkdir -p "$NR_DIR"
          chmod 755 "$NR_DIR"
          CA_FILE="{{.NEW_RELIC_AGENT_CONTROL_PROXY_CA_BUNDLE_FILE}}"
          CA_DIR="{{.NEW_RELIC_AGENT_CONTROL_PROXY_CA_BUNDLE_DIR}}"
          if [ -z "$CA_FILE" ] && [ -z "$CA_DIR" ]; then
            exit 0
          fi
          if [ -n "$CA_FILE" ]; then
            case "$CA_FILE" in
              /*) ;;
              *) echo "The proxy CA file '$CA_FILE' must be an absolute path, because Agent Control resolves it from its own working directory." >&2; exit 41 ;;
            esac
            if [ ! -f "$CA_FILE" ] || [ ! -r "$CA_FILE" ]; then
              echo "The proxy CA file '$CA_FILE' does not exist or is not readable. Check NEW_RELIC_AGENT_CONTROL_PROXY_CA_BUNDLE_FILE." >&2
              exit 41
            fi
            if ! grep -q -e '-----BEGIN CERTIFICATE-----' "$CA_FILE"; then
              echo "The proxy CA file '$CA_FILE' is not in PEM format, and Agent Control only reads PEM. Convert a DER file with: openssl x509 -inform der -in <file> -out <file>.pem" >&2
              exit 41
            fi
          fi
          if [ -n "$CA_DIR" ]; then
            case "$CA_DIR" in
              /*) ;;
              *) echo "The proxy CA directory '$CA_DIR' must be an absolute path, because Agent Control resolves it from its own working directory." >&2; exit 41 ;;
            esac
            if [ ! -d "$CA_DIR" ]; then
              echo "The proxy CA directory '$CA_DIR' does not exist. Check NEW_RELIC_AGENT_CONTROL_PROXY_CA_BUNDLE_DIR." >&2
              exit 41
            fi
            FOUND_PEM=0
            for f in "$CA_DIR"/*.pem; do
              if [ -f "$f" ] && grep -q -e '-----BEGIN CERTIFICATE-----' "$f"; then
                FOUND_PEM=1
              fi
            done
            if [ $FOUND_PEM -eq 0 ]; then
              echo "The proxy CA directory '$CA_DIR' has no .pem file with a certificate. Agent Control only reads files with the .pem extension and ignores others such as .crt or .cer." >&2
              exit 41
            fi
          fi
          for p in "$CA_FILE" "$CA_DIR"; do
            case "$p" in
              /tmp/*|/var/tmp/*|/run/*|/dev/shm/*) echo "WARNING: '$p' is in a temporary location. If it is removed (for example at reboot) the Agent Control service will fail to start. Use a persistent path such as /etc/newrelic-agent-control/." ;;
            esac
          done
          for SYS in /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt /etc/ssl/ca-bundle.pem; do
            if [ -f "$SYS" ]; then
              cat "$SYS" > "$NR_CA_BUNDLE"
              break
            fi
          done
          if [ -n "$CA_FILE" ]; then
            echo >> "$NR_CA_BUNDLE"
            cat "$CA_FILE" >> "$NR_CA_BUNDLE"
          fi
          if [ -n "$CA_DIR" ]; then
            for f in "$CA_DIR"/*.pem; do
              if [ -f "$f" ]; then
                echo >> "$NR_CA_BUNDLE"
                cat "$f" >> "$NR_CA_BUNDLE"
              fi
            done
          fi
          chmod 644 "$NR_CA_BUNDLE"

    # Checks, through the proxy when there is one, that the hosts needed by the installation answer, and
    # reports which one fails and why. Exit codes: 131 distribution not available, 40 connectivity problem.
    check_connectivity:
      cmds:
        - |
          NR_DIR=/run/newrelic-agent-control-install
          NR_CA_BUNDLE=$NR_DIR/ca-bundle.pem
          NR_ERR=$NR_DIR/probe.err
          mkdir -p "$NR_DIR"
          DL="{{.NEW_RELIC_DOWNLOAD_URL}}"
          DL_HOST=$(echo "$DL" | sed -e 's#^[a-z]*://##' -e 's#[/:].*$##')
          AC_URL="{{.NEW_RELIC_AGENT_CONTROL_PROXY_URL}}"
          AC_IGNORE_SYS="{{.NEW_RELIC_AGENT_CONTROL_PROXY_IGNORE_SYSTEM}}"
          PX="${HTTPS_PROXY:-$https_proxy}"

          PROBE_FOLLOW=""

          # probe <env|ac> <url>: sets PROBE_CODE and PROBE_RC. Set PROBE_FOLLOW=1 first to follow redirects. "env" uses the proxy environment variables like
          # the installation steps do, "ac" uses the proxy settings that Agent Control will use.
          probe() {
            PROBE_MODE="$1"
            PROBE_URL="$2"
            set -- -sS --max-time 20 -o "$NR_DIR/probe.body" -w '%{http_code}'
            if [ -n "$PROBE_FOLLOW" ]; then
              set -- "$@" -L
            fi
            if [ -f "$NR_CA_BUNDLE" ]; then
              set -- "$@" --cacert "$NR_CA_BUNDLE"
            fi
            if [ "$PROBE_MODE" = "ac" ]; then
              if [ -n "$AC_URL" ]; then
                set -- "$@" -x "$AC_URL"
              elif [ "$AC_IGNORE_SYS" = "true" ]; then
                set -- "$@" --noproxy '*'
              fi
            fi
            # The status goes through files because the recipe shell does not return the exit code of $(...).
            curl "$@" "$PROBE_URL" > "$NR_DIR/probe.code" 2> "$NR_ERR" && PROBE_RC=0 || PROBE_RC=$?
            PROBE_CODE=$(cat "$NR_DIR/probe.code")
          }

          # explain: turns the result of the last probe into a sentence in PROBE_WHY. A refused CONNECT is recognised from the
          # curl message because the exit code differs between curl versions (7 or 56).
          explain() {
            # curl 8 says "CONNECT tunnel failed, response N" and curl 7 says "Received HTTP code N from proxy after CONNECT"
            TUNNEL_CODE=$(sed -n -e 's/.*CONNECT tunnel failed, response \([0-9][0-9]*\).*/\1/p' -e 's/.*Received HTTP code \([0-9][0-9]*\) from proxy after CONNECT.*/\1/p' "$NR_ERR" | head -n 1)
            if [ -n "$TUNNEL_CODE" ]; then
              case "$TUNNEL_CODE" in
                407) PROBE_WHY="the proxy requires authentication (HTTP 407)" ;;
                *) PROBE_WHY="the proxy refused the connection with HTTP $TUNNEL_CODE, check that it allows this host" ;;
              esac
              return 0
            fi
            case $PROBE_RC in
              5) PROBE_WHY="the proxy host name could not be resolved" ;;
              6) PROBE_WHY="the host name could not be resolved and no proxy is being used for it" ;;
              7) PROBE_WHY="the connection was refused before reaching the proxy or the host" ;;
              28) PROBE_WHY="the connection timed out" ;;
              35|51|58|59|60|77|82|83|90|91) PROBE_WHY="the TLS certificate is not trusted. If the proxy inspects TLS, its CA must be trusted: add it to the system trust store or set NEW_RELIC_AGENT_CONTROL_PROXY_CA_BUNDLE_FILE" ;;
              56) PROBE_WHY="the proxy closed the connection or rejected the request, check that it allows this host" ;;
              *) PROBE_WHY="curl error $PROBE_RC: $(tr '\n' ' ' < "$NR_ERR" | cut -c1-160)" ;;
            esac
          }

          HINT=""
          if [ -n "$AC_URL" ] && [ -z "$PX" ]; then
            HINT=" Note that NEW_RELIC_AGENT_CONTROL_PROXY_URL is set but HTTPS_PROXY is not: the installation steps only use HTTPS_PROXY."
          fi

          # 1. Download server, which also tells whether the distribution is supported.
          if [ -z "{{.DEBIAN_CODENAME}}" ]; then
            echo "Unable to determine distribution codename from /etc/os-release" >&2
            exit 131
          fi
          probe env "${DL}preview/linux/apt/dists/{{.DEBIAN_CODENAME}}/InRelease"
          if [ $PROBE_RC -ne 0 ]; then
            explain
            echo "Cannot reach the New Relic download server $DL_HOST: $PROBE_WHY.$HINT" >&2
            exit 40
          fi
          case "$PROBE_CODE" in
            200) ;;
            404)
              echo "there is no New Relic Agent Control available for the distribution with codename '{{.DEBIAN_CODENAME}}'." >&2
              exit 131
              ;;
            *)
              echo "Cannot reach the New Relic download server $DL_HOST: it answered HTTP $PROBE_CODE, which usually means that the proxy blocked or could not complete the request.$HINT" >&2
              exit 40
              ;;
          esac

          # 2. Hosts used by Agent Control when Fleet Control is enabled.
          if [ "{{.NEW_RELIC_AGENT_CONTROL_FLEET_ENABLED}}" = "false" ] || [ "{{.NEW_RELIC_AGENT_CONTROL_SKIP_CONNECTIVITY_CHECK}}" = "true" ]; then
            exit 0
          fi
          # host/path pairs that Agent Control uses, per region. The real paths are probed because some of these
          # hosts do not answer on "/".
          JWKS=r/blob-management/global/agentconfiguration/jwks.json
          case "$(echo "{{.NEW_RELIC_REGION}}" | tr '[:upper:]' '[:lower:]')" in
            eu) ENDPOINTS="opamp.service.eu.newrelic.com/v1/opamp publickeys.eu.newrelic.com/$JWKS system-identity-oauth.service.newrelic.com/oauth2/token"; API_ENDPOINT=api.eu.newrelic.com/graphql ;;
            jp) ENDPOINTS="opamp.service.jp.newrelic.com/v1/opamp publickeys.jp.newrelic.com/$JWKS system-identity-oauth.service.newrelic.com/oauth2/token"; API_ENDPOINT=api.jp.newrelic.com/graphql ;;
            staging|stg) ENDPOINTS="opamp.staging-service.newrelic.com/v1/opamp staging-publickeys.newrelic.com/$JWKS system-identity-oauth.staging-service.newrelic.com/oauth2/token"; API_ENDPOINT=staging-api.newrelic.com/graphql ;;
            *) ENDPOINTS="opamp.service.newrelic.com/v1/opamp publickeys.newrelic.com/$JWKS system-identity-oauth.service.newrelic.com/oauth2/token"; API_ENDPOINT=api.newrelic.com/graphql ;;
          esac
          if [ -z "{{.NEW_RELIC_AUTH_PROVISIONED_CLIENT_ID}}" ]; then
            ENDPOINTS="$ENDPOINTS $API_ENDPOINT"
          fi
          FAILURES=0
          LAST=""
          for E in $ENDPOINTS; do
            H=${E%%/*}
            probe ac "https://$E"
            if [ $PROBE_RC -ne 0 ]; then
              explain
              FAILURES=$((FAILURES + 1))
              LAST="Cannot reach $H, which Agent Control needs: $PROBE_WHY."
              echo "$LAST" >&2
            else
              case "$PROBE_CODE" in
                502|503|504)
                  FAILURES=$((FAILURES + 1))
                  LAST="Cannot reach $H, which Agent Control needs: it answered HTTP $PROBE_CODE, which usually means that the proxy could not reach the host."
                  echo "$LAST" >&2
                  ;;
                *) echo "$H is reachable (HTTP $PROBE_CODE)." ;;
              esac
            fi
          done
          if [ $FAILURES -gt 0 ]; then
            echo "$LAST Set NEW_RELIC_AGENT_CONTROL_SKIP_CONNECTIVITY_CHECK=true to skip this check." >&2
            exit 40
          fi
      vars:
        DEBIAN_CODENAME:
          sh: awk -F= '/VERSION_CODENAME/ {print $2}' /etc/os-release

    log_ssl_ciphers:
      cmds:
        - |
          IS_SORT_INSTALLED=$(which sort | wc -l)
          IS_UNIQ_INSTALLED=$(which uniq | wc -l)
          if [ $IS_SORT_INSTALLED -gt 0 ] && [ $IS_UNIQ_INSTALLED -gt 0 ]; then
            echo "Detecting available SSL ciphers..."
            openssl ciphers -v | awk '{print " - " $2}' | sort | uniq
          fi
      ignore_error: true

    update_apt:
      cmds:
        - |
          # Get latest definitions and skip any failure because of deprecation
          OPTIONS="-o DPkg::Lock::Timeout=60 -o Acquire::Check-Valid-Until=false"
          PX="${HTTPS_PROXY:-$https_proxy}"
          if [ ! -z "$PX" ]; then
            OPTIONS="$OPTIONS -o Acquire::Http::Proxy=$PX"
          fi
          if [ -f /run/newrelic-agent-control-install/ca-bundle.pem ]; then
            OPTIONS="$OPTIONS -o Acquire::https::CaInfo=/run/newrelic-agent-control-install/ca-bundle.pem"
          fi
          apt-get $OPTIONS update -yq
      silent: true
      # apt will return an error if fails to update any of its sources. Ignore these errors and let the "install_infra" task fail.
      ignore_error: true

    install_gnupg:
      cmds:
        - |
          if [ {{.HAS_GPG}} -eq 0 ] ; then
            OPTIONS="-o DPkg::Lock::Timeout=60"
            PX="${HTTPS_PROXY:-$https_proxy}"
            if [ ! -z "$PX" ]; then
              OPTIONS="$OPTIONS -o Acquire::Http::Proxy=$PX"
            fi
            if [ -f /run/newrelic-agent-control-install/ca-bundle.pem ]; then
              OPTIONS="$OPTIONS -o Acquire::https::CaInfo=/run/newrelic-agent-control-install/ca-bundle.pem"
            fi
            apt-get $OPTIONS install gnupg2 -y
          fi
      vars:
        HAS_GPG:
          sh: command -v gpg | wc -l

    add_gpg_key:
      cmds:
        - |
          mkdir -p /etc/apt/keyrings
          NR_DIR=/run/newrelic-agent-control-install
          mkdir -p "$NR_DIR"
          KEY_FILE=$NR_DIR/newrelic_apt_key_current.gpg
          CA_OPT=""
          if [ -f "$NR_DIR/ca-bundle.pem" ]; then
            CA_OPT="--cacert $NR_DIR/ca-bundle.pem"
          fi
          if ! curl -fsS $CA_OPT {{.NEW_RELIC_DOWNLOAD_URL}}infrastructure_agent/keys/newrelic_apt_key_current.gpg -o "$KEY_FILE" 2> "$NR_DIR/key.err"; then
            echo "Could not download the New Relic repository key: $(tr '\n' ' ' < "$NR_DIR/key.err" | cut -c1-200)" >&2
            exit 42
          fi
          if ! gpg --dearmor --batch --yes -o /etc/apt/keyrings/newrelic-infra.gpg < "$KEY_FILE"; then
            echo "The New Relic repository key that was downloaded is not a valid key. A proxy may have returned an error page instead of the key." >&2
            exit 42
          fi
      silent: true

    add_nr_source:
      cmds:
        - |
          ARCH="amd64"
          IS_ARM=$(uname -m | grep -i 'aarch64' | wc -l)
          if [ $IS_ARM -gt 0 ] ; then
            ARCH="arm64"
          fi

          if [ -n "{{.DEBIAN_CODENAME}}" ]; then
            printf "deb [arch="$ARCH" signed-by=/etc/apt/keyrings/newrelic-infra.gpg] {{.NEW_RELIC_DOWNLOAD_URL}}infrastructure_agent/linux/apt {{.DEBIAN_CODENAME}} main" | tee /etc/apt/sources.list.d/newrelic-infra.list > /dev/null
            printf "\ndeb [arch="$ARCH" signed-by=/etc/apt/keyrings/newrelic-infra.gpg] {{.NEW_RELIC_DOWNLOAD_URL}}preview/linux/apt {{.DEBIAN_CODENAME}} main" | tee -a /etc/apt/sources.list.d/newrelic-infra.list > /dev/null
          else
            echo "Unable to determine distribution codename from /etc/os-release" >&2
            exit 131
          fi
      vars:
        DEBIAN_CODENAME:
          sh: awk -F= '/VERSION_CODENAME/ {print $2}' /etc/os-release
      silent: true

    update_apt_nr_source:
      cmds:
        - |
          # Get latest definitions and skip any failure because of deprecation
          OPTIONS="-o DPkg::Lock::Timeout=60 -o Acquire::Check-Valid-Until=false"
          PX="${HTTPS_PROXY:-$https_proxy}"
          if [ ! -z "$PX" ]; then
            OPTIONS="$OPTIONS -o Acquire::Http::Proxy=$PX"
          fi
          if [ -f /run/newrelic-agent-control-install/ca-bundle.pem ]; then
            OPTIONS="$OPTIONS -o Acquire::https::CaInfo=/run/newrelic-agent-control-install/ca-bundle.pem"
          fi
          apt-get $OPTIONS update -yq
      # apt will return an error if fails to update any of its sources. Ignore these errors and let the "install_infra" task fail. Just to trigger the pipeline
      ignore_error: true

    install_agent_control:
      cmds:
        - |
          OPTIONS="-o DPkg::Lock::Timeout=60"
          PX="${HTTPS_PROXY:-$https_proxy}"
          if [ ! -z "$PX" ]; then
            OPTIONS="$OPTIONS -o Acquire::Http::Proxy=$PX"
          fi
          if [ -f /run/newrelic-agent-control-install/ca-bundle.pem ]; then
            OPTIONS="$OPTIONS -o Acquire::https::CaInfo=/run/newrelic-agent-control-install/ca-bundle.pem"
          fi
          apt-get $OPTIONS install newrelic-agent-control={{.NEW_RELIC_AGENT_VERSION}} -y -qq
          # Check the exit status of the previous command
          if [ $? -ne 0 ]; then
            echo "Error: newrelic-agent-control installation failed"
            echo "Attempting to configure the packages again"
            dpkg --configure -a
            # Check if there was an error
            if [ $? -ne 0 ]; then
              echo "Error found while reconfiguring dpkg database"
              # Force-Install the Software
              echo "Attempting to install any missing dependencies or fixes broken packages."
              apt-get $OPTIONS install -f
              if [ $? -ne 0 ]; then
                exit 1
              fi
              echo "Installation is successful"
            fi
          fi
      vars:
        # Allows to set a specific version from the cli
        NEW_RELIC_AGENT_VERSION: '{{ .NEW_RELIC_AGENT_VERSION | default "1.28.0" }}'
      silent: true

    config_agent_control:
      status:
        - test -f /etc/newrelic-agent-control/.nr-cli
      cmds:
        - |
          # Proxy configuration
          # Empty values are ignored by the cli (--proxy-url="" is the same as not setting --proxy-url)
          AC_PROXY_ARGS="--proxy-url={{.NEW_RELIC_AGENT_CONTROL_PROXY_URL}} --proxy-ca-bundle-file={{.NEW_RELIC_AGENT_CONTROL_PROXY_CA_BUNDLE_FILE}} --proxy-ca-bundle-dir={{.NEW_RELIC_AGENT_CONTROL_PROXY_CA_BUNDLE_DIR}} --ignore-system-proxy={{.NEW_RELIC_AGENT_CONTROL_PROXY_IGNORE_SYSTEM}}"
          # Config generation
          if [ "{{.NEW_RELIC_AGENT_CONTROL_FLEET_ENABLED}}" = "false" ]; then
            newrelic-agent-control-cli generate-config \
              --fleet-disabled \
              --output-path /etc/newrelic-agent-control/local-data/agent-control/local_config.yaml \
              --region {{.NEW_RELIC_REGION}} \
              --newrelic-license-key {{.NEW_RELIC_LICENSE_KEY}} \
              --env-vars-file-path /etc/newrelic-agent-control/environment_variables.yaml $AC_PROXY_ARGS
          else
            if [ -z "{{ .NEW_RELIC_AUTH_PRIVATE_KEY_PATH }}" ]; then
              mkdir -p /etc/newrelic-agent-control/keys
              AC_AUTH_PRIVATE_KEY_PATH="/etc/newrelic-agent-control/keys/agent-control-identity.key"
            else
              AC_AUTH_PRIVATE_KEY_PATH="{{ .NEW_RELIC_AUTH_PRIVATE_KEY_PATH }}"
            fi
            newrelic-agent-control-cli generate-config \
              --output-path /etc/newrelic-agent-control/local-data/agent-control/local_config.yaml \
              --region {{.NEW_RELIC_REGION}} \
              --newrelic-license-key {{.NEW_RELIC_LICENSE_KEY}} \
              --env-vars-file-path /etc/newrelic-agent-control/environment_variables.yaml \
              --fleet-id {{.NR_CLI_FLEET_ID}} \
              --organization-id "{{.NEW_RELIC_ORGANIZATION}}" \
              --auth-client-id "{{.NEW_RELIC_AUTH_PROVISIONED_CLIENT_ID}}" \
              --auth-parent-token "{{.NEW_RELIC_AUTH_TOKEN}}" \
              --auth-parent-client-id "{{.NEW_RELIC_AUTH_CLIENT_ID}}" \
              --auth-parent-client-secret "{{.NEW_RELIC_AUTH_CLIENT_SECRET}}" \
              --auth-private-key-path $AC_AUTH_PRIVATE_KEY_PATH $AC_PROXY_ARGS
            if [ -z "{{ .NEW_RELIC_AUTH_PRIVATE_KEY_PATH }}" ]; then
              chmod 600 /etc/newrelic-agent-control/keys/agent-control-identity.key
            fi
          fi

    restart_agent_control:
      cmds:
        - |
          if [ {{.IS_SYSTEMCTL}} -gt 0 ]; then
            systemctl restart newrelic-agent-control
          else
            if [ {{.IS_INITCTL}} -gt 0 ]; then
              initctl restart newrelic-agent-control
            else
              /etc/init.d/newrelic-agent-control restart
            fi
          fi

    assert_agent_control_status_ok:
      cmds:
        - |
          MAX_RETRIES=10
          INTERVAL_SECONDS=15
          TRIES=0

          echo "Running agent status check..."
          while [ $TRIES -lt $MAX_RETRIES ]; do
            ((TRIES++))
            statusCheckOutput=$(curl -s --noproxy '*' http://localhost:51200/status)
            if [ -z "$statusCheckOutput" ]; then
              # so jq doesn't fail if empty
              statusCheckOutput="{}"
            fi
            STATUS=$(echo $statusCheckOutput | /usr/local/bin/newrelic utils jq '.agent_control.healthy')
            if [ "$STATUS" == "true" ]; then
              echo "Agent status check ok."
              break
            else
              echo "Agent status check attempt $TRIES/$MAX_RETRIES failed. Status response: $statusCheckOutput"
              if [ "$TRIES" -eq "$MAX_RETRIES" ]; then
                echo "New Relic Agent Control verification failed. Visit https://docs.newrelic.com/docs/new-relic-control/agent-control/troubleshooting/#cli-debug for troubleshooting guidance." >&2

                if [ {{.IS_SYSTEMCTL}} -gt 0 ]; then
                  journalctl -u newrelic-agent-control --no-pager
                fi

                exit 31
              fi
            fi

            sleep $INTERVAL_SECONDS
          done

    signal_recipe_applied:
      cmds:
        - |
          touch /etc/newrelic-agent-control/.nr-cli

    post_install:
      cmds:
        - |
          echo "⚙️  New Relic Agent Control configuration file can be found in /etc/newrelic-agent-control/local-data/agent-control/local_config.yaml"
          rm -rf /run/newrelic-agent-control-install
