# Visit our schema definition for additional information on this file format.
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition
# WORK IN PROGRESS - not for use.

name: nrdot-collector-mssql
displayName: NRDOT MSSQL (Debian/Ubuntu)
description: New Relic install recipe for MSSQL monitoring via NRDOT Collector on Debian/Ubuntu self-hosted environments, one or more local instances
repository: https://github.com/newrelic/nrdot-collector-releases

installTargets:
  - type: host
    os: linux
    platformFamily: debian
  - type: host
    os: linux
    platform: ubuntu

keywords:
  - MSSQL
  - SQL Server
  - NRDOT
  - OpenTelemetry
  - OTel
  - Database
  - Linux
  - Debian
  - Ubuntu

processMatch:
  - sqlservr

preInstall:
  discoveryMode:
    - targeted
  info: |
    To capture data from one or more local SQL Server instances, we need to
    create/authorize a monitoring identity (a SQL login) on each, using an
    existing login with sysadmin privileges (or equivalent) on each instance.

    You will be asked for two files:

      1. An instances file (YAML) listing every local SQL Server instance to monitor,
         in the order you want them numbered (instance 1, 2, 3, ...). If you're running
         a single SQL Server, this is still one entry - multiple entries are only
         needed if you run multiple separate SQL Server instances on this host (e.g. on
         different ports):

           instances:
             - host: localhost
               port: 1433
               login_name: newrelic
             - host: localhost
               port: 1434
               login_name: newrelic

      2. A secrets file (KEY=VALUE per line) supplying an admin login and password
         for each instance above, indexed to match the instances file's order
         (1-based). Any login with sysadmin privileges works - it doesn't have to
         be 'sa':

           NR_CLI_MSSQL_ADMIN_USER_1=sa
           NR_CLI_MSSQL_ADMIN_PASSWORD_1=<admin password for instance 1>
           NR_CLI_MSSQL_ADMIN_USER_2=sa
           NR_CLI_MSSQL_ADMIN_PASSWORD_2=<admin password for instance 2>

         Both NR_CLI_MSSQL_ADMIN_USER_<i> and NR_CLI_MSSQL_ADMIN_PASSWORD_<i> are
         required for every instance.

    Any instance that fails its version check or login setup is skipped (with a reason)
    rather than aborting the whole install - the rest are still configured.

inputVars:
  - name: NR_CLI_MSSQL_CONFIG_PRESET
    prompt: "NRDOT configuration - 1) Standard  2) Full-feature: "
    default: "1"
  - name: NR_CLI_MSSQL_INSTANCES_FILE
    prompt: "Path to the MSSQL instances YAML file: "
  - name: NR_CLI_MSSQL_SECRETS_FILE
    prompt: "Path to the MSSQL secrets file (KEY=VALUE per instance): "

validationNrql: "SELECT count(*) FROM Metric WHERE metricName LIKE 'sqlserver.%' AND instrumentation.provider = 'opentelemetry' SINCE 10 minutes ago"

successLinkConfig:
  type: EXPLORER

install:
  version: "3"
  silent: true

  vars:
    IS_SYSTEMCTL:
      sh: command -v systemctl | wc -l

  tasks:
    write_recipe_metadata:
      cmds:
        - |
          echo '{"Metadata":{"CapturedCliOutput":"true"}}' | tee {{.NR_CLI_OUTPUT}} > /dev/null

    assert_pre_req:
      cmds:
        - |
          if [ "$(id -u)" != "0" ]; then
            echo "This newrelic install must be run under sudo or root" >&2
            exit 131
          fi
        - |
          if ! command -v curl > /dev/null 2>&1; then
            echo "curl is required to run the newrelic install. Please install curl and re-run the installation." >&2
            exit 16
          fi
        - |
          if [ "{{.IS_SYSTEMCTL}}" -eq 0 ]; then
            echo "systemd is required for the nrdot-collector service configuration." >&2
            exit 131
          fi

    parse_instances:
      cmds:
        - |
          INSTANCES_FILE="{{.NR_CLI_MSSQL_INSTANCES_FILE}}"
          SECRETS_FILE="{{.NR_CLI_MSSQL_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-mssql-instances.tsv"
          SKIP_FILE="/tmp/nr-mssql-skip.tmp"

          rm -f "$INSTANCES_TSV" "$SKIP_FILE"

          if [ ! -f "$INSTANCES_FILE" ]; then
            echo "Instances file not found: $INSTANCES_FILE" >&2
            exit 131
          fi
          if [ ! -f "$SECRETS_FILE" ]; then
            echo "Secrets file not found: $SECRETS_FILE" >&2
            exit 131
          fi

          SECRETS_PERMS=$(stat -c '%a' "$SECRETS_FILE" 2>/dev/null || stat -f '%Lp' "$SECRETS_FILE" 2>/dev/null)
          if [ -n "$SECRETS_PERMS" ]; then
            GROUP_OTHER_BITS=$(printf '%s' "$SECRETS_PERMS" | tail -c 2)
            if [ "$GROUP_OTHER_BITS" != "00" ]; then
              echo "WARNING: $SECRETS_FILE is readable by group/other (permissions: $SECRETS_PERMS)." >&2
              echo "         Consider running: chmod 600 $SECRETS_FILE" >&2
            fi
          fi

          # shellcheck disable=SC1090
          . "$SECRETS_FILE"

          # Parses the fixed 3-key-per-item shape documented in preInstall.info
          # (host, port, login_name) - not a general-purpose YAML parser.
          awk '
            /^[[:space:]]*-[[:space:]]*host:/ {
              if (have) { print host "\t" port "\t" login_name }
              host=$0; sub(/^[[:space:]]*-[[:space:]]*host:[[:space:]]*/, "", host)
              port=""; login_name=""; have=1; next
            }
            /^[[:space:]]*port:/ { port=$0; sub(/^[[:space:]]*port:[[:space:]]*/, "", port); next }
            /^[[:space:]]*login_name:/ { login_name=$0; sub(/^[[:space:]]*login_name:[[:space:]]*/, "", login_name); next }
            END { if (have) { print host "\t" port "\t" login_name } }
          ' "$INSTANCES_FILE" > "$INSTANCES_TSV"

          INSTANCE_COUNT=$(wc -l < "$INSTANCES_TSV" | tr -d ' ')
          if [ "$INSTANCE_COUNT" -eq 0 ]; then
            echo "No instances found in $INSTANCES_FILE" >&2
            exit 131
          fi
          echo "Found $INSTANCE_COUNT MSSQL instance(s) in $INSTANCES_FILE"

          # TEMPORARY DIAGNOSTIC: an extra/mismatched instance has been observed on real
          # infra downstream in assert_sql_server_version despite this count being
          # correct - dump the raw TSV so we can see exactly what was parsed. Remove
          # once root-caused.
          echo "DIAG: raw INSTANCES_TSV content (cat -A):" >&2
          cat -A "$INSTANCES_TSV" >&2 2>/dev/null || cat -A "$INSTANCES_TSV" >&2

          i=0
          while IFS="$(printf '\t')" read -r ENTRY_HOST ENTRY_PORT ENTRY_LOGIN_NAME; do
            i=$((i + 1))
            eval "ADMIN_USER_VAL=\"\${NR_CLI_MSSQL_ADMIN_USER_${i}:-}\""
            eval "ADMIN_PASSWORD_VAL=\"\${NR_CLI_MSSQL_ADMIN_PASSWORD_${i}:-}\""
            if [ -z "$ADMIN_USER_VAL" ] || [ -z "$ADMIN_PASSWORD_VAL" ]; then
              echo "${i}: missing NR_CLI_MSSQL_ADMIN_USER_${i}/NR_CLI_MSSQL_ADMIN_PASSWORD_${i} in secrets file" >> "$SKIP_FILE"
              echo "Instance ${i} (${ENTRY_HOST}:${ENTRY_PORT}) SKIPPED: missing admin credentials in secrets file" >&2
            fi
          done < "$INSTANCES_TSV"

    assert_sql_server_version:
      cmds:
        - |
          export PATH="/opt/mssql-tools18/bin:/opt/mssql-tools/bin:$PATH"

          SECRETS_FILE="{{.NR_CLI_MSSQL_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-mssql-instances.tsv"
          SKIP_FILE="/tmp/nr-mssql-skip.tmp"

          # shellcheck disable=SC1090
          . "$SECRETS_FILE"

          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))

            # TEMPORARY DIAGNOSTIC: an unexplained extra iteration/version mismatch has
            # been observed on real infra - print exactly what this iteration read
            # before anything else can short-circuit it. Remove once root-caused.
            echo "DIAG: loop iteration i=${i} HOST=[${HOST}] PORT=[${PORT}] LOGIN_NAME=[${LOGIN_NAME}]" >&2

            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            eval "ADMIN_USER=\"\${NR_CLI_MSSQL_ADMIN_USER_${i}}\""
            eval "ADMIN_PASSWORD=\"\${NR_CLI_MSSQL_ADMIN_PASSWORD_${i}}\""
            export SQLCMDPASSWORD="$ADMIN_PASSWORD"

            RESULT=$(sqlcmd -S "${HOST},${PORT}" -U "${ADMIN_USER}" -C -b -h -1 -Q "SET NOCOUNT ON; SELECT SERVERPROPERTY('ProductMajorVersion');" 2>&1 < /dev/null)
            SQL_STATUS=$?
            unset SQLCMDPASSWORD

            # TEMPORARY DIAGNOSTIC: dump the raw sqlcmd result unconditionally (not
            # just on failure) so we can see exactly what text MAJOR_VERSION is being
            # extracted from. Remove once root-caused.
            echo "DIAG: raw sqlcmd RESULT for instance ${i} (status=${SQL_STATUS}):" >&2
            echo "$RESULT" | sed 's/^/DIAG: | /' >&2

            if [ $SQL_STATUS -ne 0 ]; then
              echo "${i}: failed to connect / check version - $(echo "$RESULT" | tr '\n' ' ' | sed 's/  */ /g')" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}:${PORT}) SKIPPED: failed to connect to check its version" >&2
              continue
            fi

            MAJOR_VERSION=$(echo "$RESULT" | grep -oE '[0-9]+' | head -1)

            if [ -z "$MAJOR_VERSION" ] || [ "$MAJOR_VERSION" -lt 14 ]; then
              echo "${i}: unsupported SQL Server version ${MAJOR_VERSION:-unknown} (2017 / major version 14+ required)" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}:${PORT}) SKIPPED: unsupported SQL Server version ${MAJOR_VERSION:-unknown}" >&2
              continue
            fi

            echo "Instance ${i} (${HOST}:${PORT}): SQL Server major version ${MAJOR_VERSION} detected - supported."
          done < "$INSTANCES_TSV"

    install_nrdot:
      cmds:
        - |
          COLLECTOR_DISTRO="nrdot-collector"

          if dpkg -l | grep -q "^ii.*${COLLECTOR_DISTRO} "; then
            echo "NRDOT Collector is already installed."
            echo ""
            echo "Please follow the steps below to complete the setup:"
            echo ""
            echo "  1. Create mssql-config.yaml"
            echo "     if not present. Refer to:"
            echo "     https://docs.newrelic.com/docs/opentelemetry/database/mssql/linux-hosted/"
            echo ""
            echo "  2. Make sure the monitoring user is created"
            echo "     and has the required permissions granted."
            echo ""
            echo "  3. After making the above changes, restart the NRDOT Collector:"
            echo "     sudo systemctl restart nrdot-collector"
            echo ""
            exit 131
          fi

          COLLECTOR_VERSION=$(curl -sf "https://api.github.com/repos/newrelic/nrdot-collector-releases/releases/latest" | grep '"tag_name":' | awk -F'"' '{print $4}')
          if [ -z "$COLLECTOR_VERSION" ]; then
            echo "Failed to fetch the latest release version from GitHub. Please check your internet connection." >&2
            exit 1
          fi

          if [ "$(uname -m)" = "aarch64" ]; then
            ARCH="arm64"
          else
            ARCH="amd64"
          fi

          DOWNLOAD_URL="https://github.com/newrelic/nrdot-collector-releases/releases/download/${COLLECTOR_VERSION}/${COLLECTOR_DISTRO}_${COLLECTOR_VERSION}_linux_${ARCH}.deb"
          echo "Installing ${COLLECTOR_DISTRO} version: ${COLLECTOR_VERSION}"
          echo "Downloading from: ${DOWNLOAD_URL}"

          curl -L --output /tmp/nrdot-collector.deb "$DOWNLOAD_URL"
          if [ $? -ne 0 ]; then
            echo "Failed to download the nrdot-collector package." >&2
            exit 1
          fi

          dpkg -i /tmp/nrdot-collector.deb
          if [ $? -ne 0 ]; then
            echo "Failed to install the nrdot-collector package." >&2
            exit 1
          fi

          rm -f /tmp/nrdot-collector.deb
          echo "${COLLECTOR_DISTRO} installed successfully."

    configure_database_user:
      cmds:
        - |
          export PATH="/opt/mssql-tools18/bin:/opt/mssql-tools/bin:$PATH"

          SECRETS_FILE="{{.NR_CLI_MSSQL_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-mssql-instances.tsv"
          SKIP_FILE="/tmp/nr-mssql-skip.tmp"

          # shellcheck disable=SC1090
          . "$SECRETS_FILE"

          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            if ! printf '%s' "$LOGIN_NAME" | grep -qE '^[A-Za-z][A-Za-z0-9_]*$'; then
              echo "${i}: invalid monitoring username '${LOGIN_NAME}' in instances file" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}:${PORT}) SKIPPED: invalid monitoring username '${LOGIN_NAME}'" >&2
              continue
            fi

            eval "ADMIN_USER=\"\${NR_CLI_MSSQL_ADMIN_USER_${i}}\""
            eval "ADMIN_PASSWORD=\"\${NR_CLI_MSSQL_ADMIN_PASSWORD_${i}}\""
            export SQLCMDPASSWORD="$ADMIN_PASSWORD"

            SQL_FILE=$(mktemp "/tmp/nr-mssql-grant-${i}.sql.XXXXXX")
            NR_PASSWORD=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24)

            cat > "$SQL_FILE" << EOF
          USE [master];
          GO
          IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = '${LOGIN_NAME}')
            CREATE LOGIN [${LOGIN_NAME}] WITH PASSWORD = '${NR_PASSWORD}';
          ELSE
            ALTER LOGIN [${LOGIN_NAME}] WITH PASSWORD = '${NR_PASSWORD}';
          GO
          GRANT VIEW SERVER STATE TO [${LOGIN_NAME}];
          GRANT VIEW ANY DEFINITION TO [${LOGIN_NAME}];
          GRANT VIEW ANY DATABASE TO [${LOGIN_NAME}];
          GO
          DECLARE @name SYSNAME;
          DECLARE db_cursor CURSOR READ_ONLY FORWARD_ONLY FOR
          SELECT [name]
          FROM [master].[sys].[databases]
          WHERE [name] NOT IN ('master', 'msdb', 'model', 'rdsadmin', 'distribution')
          AND [state] = 0;
          OPEN db_cursor;
          FETCH NEXT FROM db_cursor INTO @name;
          WHILE @@FETCH_STATUS = 0
          BEGIN
            BEGIN TRY
              EXEC('USE [' + @name + '];
              IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = ''${LOGIN_NAME}'')
              BEGIN
                CREATE USER [${LOGIN_NAME}] FOR LOGIN [${LOGIN_NAME}];
              END;
              GRANT VIEW DATABASE STATE TO [${LOGIN_NAME}];');
            END TRY
            BEGIN CATCH
              PRINT 'Error on ' + @name + ': ' + ERROR_MESSAGE();
            END CATCH
            FETCH NEXT FROM db_cursor INTO @name;
          END
          CLOSE db_cursor;
          DEALLOCATE db_cursor;
          GO
          EOF

            RESULT=$(sqlcmd -S "${HOST},${PORT}" -U "${ADMIN_USER}" -C -b -i "$SQL_FILE" 2>&1 < /dev/null)
            SQL_STATUS=$?
            rm -f "$SQL_FILE"
            unset SQLCMDPASSWORD

            if [ $SQL_STATUS -ne 0 ]; then
              echo "${i}: monitoring login setup failed - $(echo "$RESULT" | tr '\n' ' ' | sed 's/  */ /g')" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}:${PORT}) SKIPPED: monitoring login setup failed" >&2
              continue
            fi

            echo "Instance ${i} (${HOST}:${PORT}): SQL Server monitoring identity configured successfully: $LOGIN_NAME"
          done < "$INSTANCES_TSV"

    create_collector_config:
      cmds:
        - |
          export PATH="/opt/mssql-tools18/bin:/opt/mssql-tools/bin:$PATH"

          PRESET="{{.NR_CLI_MSSQL_CONFIG_PRESET}}"
          REGION="{{.NEW_RELIC_REGION}}"
          LICENSE_KEY="{{.NEW_RELIC_LICENSE_KEY}}"
          CONFIG_DIR="/etc/nrdot-collector"
          CONFIG_PATH="${CONFIG_DIR}/mssql-config.yaml"
          ENV_FILE="${CONFIG_DIR}/nrdot-collector.conf"
          INSTANCES_TSV="/tmp/nr-mssql-instances.tsv"
          SKIP_FILE="/tmp/nr-mssql-skip.tmp"

          mkdir -p "$CONFIG_DIR"

          if [ "$PRESET" = "2" ]; then
            LIMIT_MIB=500
          else
            LIMIT_MIB=200
          fi

          case "$REGION" in
            staging) OTLP_ENDPOINT="https://staging-otlp.nr-data.net" ;;
            EU)      OTLP_ENDPOINT="https://otlp.eu01.nr-data.net" ;;
            JP)      OTLP_ENDPOINT="https://otlp.jp.nr-data.net" ;;
            *)       OTLP_ENDPOINT="https://otlp.nr-data.net" ;;
          esac

          # Shared receiver settings differ by preset (Full-feature carries a longer
          # metrics list than Standard) but are identical across instances within a
          # preset. Captured once here and echoed per instance below instead of relying
          # on the collector's YAML loader to support merge-key aliases via a fragile
          # split - username/password/server/port are the only fields that vary.
          if [ "$PRESET" = "2" ]; then
            METRICS_LIST=$(cat << 'BLOCK'
                sqlserver.database.count:
                  enabled: true
                sqlserver.database.file.size:
                  enabled: true
                sqlserver.database.io:
                  enabled: true
                sqlserver.database.latency:
                  enabled: true
                sqlserver.database.operations:
                  enabled: true
                sqlserver.database.page_file.size:
                  enabled: true
                sqlserver.database.transactions.active:
                  enabled: true
                sqlserver.database.backup_or_restore.rate:
                  enabled: true
                sqlserver.database.execution.errors:
                  enabled: true
                sqlserver.database.full_scan.rate:
                  enabled: true
                sqlserver.database.tempdb.space:
                  enabled: true
                sqlserver.database.tempdb.version_store.size:
                  enabled: true
                sqlserver.database.principals.count:
                  enabled: true
                sqlserver.database.principals.old:
                  enabled: true
                sqlserver.database.principals.orphaned_users:
                  enabled: true
                sqlserver.database.principals.recently_created:
                  enabled: true
                sqlserver.database.role.members.count:
                  enabled: true
                sqlserver.database.role.memberships.count:
                  enabled: true
                sqlserver.database.role.permission.risk_level:
                  enabled: true
                sqlserver.database.role.roles.count:
                  enabled: true
                sqlserver.database.security.role_membership.count:
                  enabled: true
                sqlserver.server.security.principal.count:
                  enabled: true
                sqlserver.server.security.role_membership.count:
                  enabled: true
                sqlserver.lock.by_mode.count:
                  enabled: true
                sqlserver.lock.by_resource.count:
                  enabled: true
                sqlserver.lock.timeout.rate:
                  enabled: true
                sqlserver.lock.wait.count:
                  enabled: true
                sqlserver.lock.wait.rate:
                  enabled: true
                sqlserver.deadlock.rate:
                  enabled: true
                sqlserver.transaction.delay:
                  enabled: true
                sqlserver.transaction.mirror_write.rate:
                  enabled: true
                sqlserver.transaction.longest_running_time:
                  enabled: true
                sqlserver.transaction.version_cleanup.rate:
                  enabled: true
                sqlserver.transaction.version_generation.rate:
                  enabled: true
                sqlserver.memory.area:
                  enabled: true
                sqlserver.memory.cache.object.count:
                  enabled: true
                sqlserver.memory.grants.pending.count:
                  enabled: true
                sqlserver.memory.page.count:
                  enabled: true
                sqlserver.memory.target:
                  enabled: true
                sqlserver.memory.usage:
                  enabled: true
                sqlserver.os.disk.size:
                  enabled: true
                sqlserver.os.memory.usage:
                  enabled: true
                sqlserver.os.memory.utilization:
                  enabled: true
                sqlserver.os.scheduler.runnable_tasks.count:
                  enabled: true
                sqlserver.os.wait.duration:
                  enabled: true
                sqlserver.os.wait.tasks.count:
                  enabled: true
                sqlserver.page.buffer_cache.hit_ratio:
                  enabled: true
                sqlserver.page.buffer_cache.free_list.stalls.rate:
                  enabled: true
                sqlserver.page.life_expectancy:
                  enabled: true
                sqlserver.page.lookup.rate:
                  enabled: true
                sqlserver.batch.request.rate:
                  enabled: true
                sqlserver.batch.sql_compilation.rate:
                  enabled: true
                sqlserver.batch.sql_recompilation.rate:
                  enabled: true
                sqlserver.batch.compilation.utilization:
                  enabled: true
                sqlserver.batch.page_split.utilization:
                  enabled: true
                sqlserver.recompilation.ratio:
                  enabled: true
                sqlserver.parameterization.rate:
                  enabled: true
                sqlserver.plan.execution.rate:
                  enabled: true
                sqlserver.attention.rate:
                  enabled: true
                sqlserver.process.count:
                  enabled: true
                sqlserver.processes.blocked:
                  enabled: true
                sqlserver.user.connection.count:
                  enabled: true
                sqlserver.login.rate:
                  enabled: true
                sqlserver.logout.rate:
                  enabled: true
                sqlserver.thread_pool.tasks.count:
                  enabled: true
                sqlserver.thread_pool.workers.count:
                  enabled: true
                sqlserver.thread_pool.workers.max:
                  enabled: true
                sqlserver.thread_pool.workers.utilization:
                  enabled: true
                sqlserver.tempdb.allocation.wait_time.total:
                  enabled: true
                sqlserver.tempdb.contention.waiters.count:
                  enabled: true
                sqlserver.tempdb.data_files.count:
                  enabled: true
                sqlserver.tempdb.file.size:
                  enabled: true
                sqlserver.tempdb.space.usage:
                  enabled: true
                sqlserver.latch.superlatch.count:
                  enabled: true
                sqlserver.latch.superlatch.transition.rate:
                  enabled: true
                sqlserver.latch.wait.rate:
                  enabled: true
                sqlserver.latch.wait_time.avg:
                  enabled: true
                sqlserver.latch.wait_time.total:
                  enabled: true
                sqlserver.index.search.rate:
                  enabled: true
                sqlserver.resource_pool.disk.operations:
                  enabled: true
                sqlserver.resource_pool.disk.throttled.read.rate:
                  enabled: true
                sqlserver.resource_pool.disk.throttled.write.rate:
                  enabled: true
                sqlserver.replica.data.rate:
                  enabled: true
                sqlserver.failover_cluster.ag.cluster_type:
                  enabled: true
                sqlserver.failover_cluster.ag.failure_condition_level:
                  enabled: true
                sqlserver.failover_cluster.ag.health_check_timeout:
                  enabled: true
                sqlserver.failover_cluster.ag.required_sync_secondaries:
                  enabled: true
                sqlserver.failover_cluster.replica.database.queue_size:
                  enabled: true
                sqlserver.failover_cluster.replica.database.redo.rate:
                  enabled: true
                sqlserver.failover_cluster.replica.flow_control_time:
                  enabled: true
                sqlserver.failover_cluster.replica.role:
                  enabled: true
                sqlserver.failover_cluster.replica.synchronization_health:
                  enabled: true
                sqlserver.computer.uptime:
                  enabled: true
                sqlserver.cpu.count:
                  enabled: true
                sqlserver.table.count:
                  enabled: true
                sqlserver.kill_connection.error.rate:
                  enabled: true
          BLOCK
          )
          else
            METRICS_LIST=$(cat << 'BLOCK'
                sqlserver.database.count:
                  enabled: true
                sqlserver.database.io:
                  enabled: true
                sqlserver.database.latency:
                  enabled: true
                sqlserver.database.operations:
                  enabled: true
                sqlserver.database.tempdb.space:
                  enabled: true
                sqlserver.database.tempdb.version_store.size:
                  enabled: true
                sqlserver.deadlock.rate:
                  enabled: true
                sqlserver.os.wait.duration:
                  enabled: true
                sqlserver.processes.blocked:
                  enabled: true
                sqlserver.memory.grants.pending.count:
                  enabled: true
                sqlserver.database.file.size:
                  enabled: true
                sqlserver.memory.area:
                  enabled: true
          BLOCK
          )
          fi

          RECEIVER_TAIL=$(cat << 'BLOCK'
              events:
                db.server.query_sample:
                  enabled: true
                db.server.top_query:
                  enabled: true

              top_query_collection:
                lookback_time: 60s
                max_query_sample_count: 1000
                top_query_count: 250
                collection_interval: 60s

              collect_full_query_text: true
              allowed_comment_keys:
                - nr_service_guid

              query_sample_collection:
                max_rows_per_query: 100
          BLOCK
          )

          cat > "$CONFIG_PATH" << 'EOF'
          receivers:
          EOF

          # Count survivors up front to decide whether the anchor/merge-key pattern
          # applies - a single instance has nothing to merge into, so it gets a plain
          # receiver. No published multi-receiver doc exists for MSSQL yet, so this
          # mirrors MySQL's documented naming convention (nrsqlserver/instanceN) rather
          # than inventing a new one.
          SURVIVOR_COUNT=0
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi
            SURVIVOR_COUNT=$((SURVIVOR_COUNT + 1))
          done < "$INSTANCES_TSV"

          MONITORED_COUNT=0
          IS_FIRST_SURVIVOR=1
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            eval "ADMIN_USER=\"\${NR_CLI_MSSQL_ADMIN_USER_${i}}\""
            eval "ADMIN_PASSWORD=\"\${NR_CLI_MSSQL_ADMIN_PASSWORD_${i}}\""
            export SQLCMDPASSWORD="$ADMIN_PASSWORD"

            NR_PASSWORD=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24)

            ALTER_RESULT=$(sqlcmd -S "${HOST},${PORT}" -U "${ADMIN_USER}" -C -b -Q "ALTER LOGIN [${LOGIN_NAME}] WITH PASSWORD = '${NR_PASSWORD}';" 2>&1 < /dev/null)
            ALTER_STATUS=$?

            if [ $ALTER_STATUS -ne 0 ]; then
              unset SQLCMDPASSWORD
              echo "${i}: failed to set the monitoring login's password - $(echo "$ALTER_RESULT" | tr '\n' ' ')" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}:${PORT}) SKIPPED: failed to set the monitoring login's password" >&2
              continue
            fi

            # TEMPORARY DIAGNOSTIC: query the server's own catalog for this login's
            # actual state right after the ALTER, using the same admin connection that
            # just set it - direct evidence instead of inferring from a client's error.
            CATALOG_RESULT=$(sqlcmd -S "${HOST},${PORT}" -U "${ADMIN_USER}" -C -b -h -1 -Q "SET NOCOUNT ON; SELECT name, is_disabled, is_policy_checked, is_expiration_checked, type_desc FROM sys.sql_logins WHERE name = '${LOGIN_NAME}';" 2>&1 < /dev/null)
            echo "DIAG: sys.sql_logins catalog row(s) for '${LOGIN_NAME}' on instance ${i}:" >&2
            echo "$CATALOG_RESULT" | sed 's/^/DIAG: | /' >&2

            # TEMPORARY DIAGNOSTIC: verify the monitoring login's own credentials work
            # with a fresh connection, immediately after setting them, using the same
            # host/port/protocol the receiver's endpoint will use.
            unset SQLCMDPASSWORD
            export SQLCMDPASSWORD="$NR_PASSWORD"
            VERIFY_RESULT=$(sqlcmd -S "${HOST},${PORT}" -U "${LOGIN_NAME}" -C -b -h -1 -Q "SELECT 1;" 2>&1 < /dev/null)
            VERIFY_STATUS=$?
            echo "DIAG: monitoring-login connection test for instance ${i} (status=${VERIFY_STATUS}):" >&2
            echo "$VERIFY_RESULT" | sed 's/^/DIAG: | /' >&2
            unset SQLCMDPASSWORD

            if [ "$SURVIVOR_COUNT" -eq 1 ]; then
              {
                echo "  nrsqlserver/instance${i}:"
                echo "    collection_interval: 15s"
                echo "    username: ${LOGIN_NAME}"
                echo "    password: \"${NR_PASSWORD}\""
                echo "    server: ${HOST}"
                echo "    port: ${PORT}"
                echo "    metrics:"
                echo "$METRICS_LIST"
                echo ""
                echo "$RECEIVER_TAIL"
              } >> "$CONFIG_PATH"
            elif [ "$IS_FIRST_SURVIVOR" -eq 1 ]; then
              {
                echo "  nrsqlserver/instance${i}: &nrsqlserver-common"
                echo "    collection_interval: 15s"
                echo "    username: ${LOGIN_NAME}"
                echo "    password: \"${NR_PASSWORD}\""
                echo "    server: ${HOST}"
                echo "    port: ${PORT}"
                echo "    metrics:"
                echo "$METRICS_LIST"
                echo ""
                echo "$RECEIVER_TAIL"
              } >> "$CONFIG_PATH"
              IS_FIRST_SURVIVOR=0
            else
              {
                echo "  nrsqlserver/instance${i}:"
                echo "    <<: *nrsqlserver-common"
                echo "    username: ${LOGIN_NAME}"
                echo "    password: \"${NR_PASSWORD}\""
                echo "    server: ${HOST}"
                echo "    port: ${PORT}"
              } >> "$CONFIG_PATH"
            fi

            MONITORED_COUNT=$((MONITORED_COUNT + 1))
          done < "$INSTANCES_TSV"

          if [ "$MONITORED_COUNT" -eq 0 ]; then
            echo "No MSSQL instance passed its checks - nothing to monitor. Aborting install." >&2
            exit 1
          fi

          # Per-instance server.address/server.port tagging - the original single-
          # instance recipe had no such processor (nothing else to disambiguate), but
          # with multiple nrsqlserver receivers now sharing config, each needs its own
          # tag or every instance's data reads as coming from the first one.
          cat >> "$CONFIG_PATH" << EOF

          processors:
            memory_limiter:
              check_interval: \${env:NR_MEM_LIMITER_CHECK_INTERVAL:-1s}
              limit_mib:       \${env:NR_MEM_LIMITER_LIMIT_MIB:-${LIMIT_MIB}}
              spike_limit_mib: \${env:NR_MEM_LIMITER_SPIKE_MIB:-50}

            batch:
          EOF

          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi
            cat >> "$CONFIG_PATH" << EOF

            resource/sqlserver/instance${i}:
              attributes:
                - key: server.address
                  value: "${HOST}"
                  action: upsert
                - key: server.port
                  value: ${PORT}
                  action: upsert
          EOF
          done < "$INSTANCES_TSV"

          cat >> "$CONFIG_PATH" << EOF

          exporters:
            otlphttp:
              endpoint: ${OTLP_ENDPOINT}
              headers:
                api-key: ${LICENSE_KEY}
              tls:
                insecure: false
              compression: gzip

          service:
            telemetry:
              metrics:
                level: none

            pipelines:
          EOF

          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi
            cat >> "$CONFIG_PATH" << EOF
              metrics/instance${i}:
                receivers: [nrsqlserver/instance${i}]
                processors: [resource/sqlserver/instance${i}, memory_limiter, batch]
                exporters: [otlphttp]
              logs/instance${i}:
                receivers: [nrsqlserver/instance${i}]
                processors: [resource/sqlserver/instance${i}, memory_limiter, batch]
                exporters: [otlphttp]
          EOF
          done < "$INSTANCES_TSV"

          cat > "$ENV_FILE" << EOF
          OTELCOL_OPTIONS="--config=${CONFIG_PATH}"
          EOF

          chown nrdot-collector:nrdot-collector "$CONFIG_PATH"
          chmod 600 "$CONFIG_PATH"

          # TEMPORARY DIAGNOSTIC: dump the actual receiver block as written to disk -
          # zero new external-tool invocations (unlike the sys.sql_logins catalog query
          # and connection verification test above, which have shown a separate,
          # unrelated failure to reconnect as admin/the monitoring login on a SECOND
          # client invocation within this same script - suspect a task-runner shell
          # quirk, not a real account problem). This isolates whether the config file
          # itself holds the right value.
          echo "DIAG: generated receiver block in ${CONFIG_PATH}:" >&2
          grep -A 6 "^  nrsqlserver" "$CONFIG_PATH" | sed 's/^/DIAG: | /' >&2

          echo "MSSQL OTel config written to ${CONFIG_PATH} (${MONITORED_COUNT} instance(s))"
          echo "Env file written to ${ENV_FILE}"

    restart_nrdot:
      cmds:
        - |
          systemctl restart nrdot-collector

          echo "Waiting for NRDOT Collector to start..."
          NR_STARTED=""
          for i in $(seq 1 30); do
            if systemctl is-active --quiet nrdot-collector; then
              echo "NRDOT Collector is running."
              NR_STARTED=1
              break
            fi
            sleep 2
          done

          if [ -z "$NR_STARTED" ]; then
            echo "NRDOT Collector did not start in time. Check logs:" >&2
            journalctl -u nrdot-collector --no-pager -n 50 >&2
            exit 31
          fi

          # TEMPORARY DIAGNOSTIC: systemd reporting the service "active" doesn't mean
          # the nrsqlserver receiver is actually authenticating/scraping successfully -
          # a connection/auth failure just logs an error and keeps retrying every
          # collection_interval without crashing the process. Dump recent logs
          # unconditionally (after giving it time for at least one scrape cycle) so a
          # failing CI run shows the collector's own error instead of just "no data
          # received downstream." Remove once the sqlserver.% data-delivery issue is
          # root-caused.
          echo ""
          echo "==> NRDOT Collector recent logs (diagnostic):"
          sleep 15
          journalctl -u nrdot-collector --no-pager -n 100
          echo ""

          INSTANCES_TSV="/tmp/nr-mssql-instances.tsv"
          SKIP_FILE="/tmp/nr-mssql-skip.tmp"

          echo ""
          echo "==> MSSQL instance summary:"
          echo ""
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))
            REASON=$(grep "^${i}:" "$SKIP_FILE" 2>/dev/null | sed "s/^${i}: //")
            if [ -n "$REASON" ]; then
              echo "  [SKIP] ${i}: ${HOST}:${PORT} - ${REASON}"
            else
              echo "  [OK]   ${i}: ${HOST}:${PORT}"
            fi
          done < "$INSTANCES_TSV"

          rm -f /tmp/nr-mssql-grant-*.sql.* "$INSTANCES_TSV" "$SKIP_FILE"

    default:
      cmds:
        - task: write_recipe_metadata
        - task: assert_pre_req
        - task: parse_instances
        - task: assert_sql_server_version
        - task: install_nrdot
        - task: configure_database_user
        - task: create_collector_config
        - task: restart_nrdot

postInstall:
  info: |2
      MSSQL OTel config: /etc/nrdot-collector/mssql-config.yaml
      Env file:           /etc/nrdot-collector/nrdot-collector.conf
      Service status:     systemctl status nrdot-collector
      View logs:           journalctl -u nrdot-collector -f
      Restart service:     sudo systemctl restart nrdot-collector
