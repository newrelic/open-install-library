# Visit our schema definition for additional information on this file format.
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition

name: nrdot-collector-mssql-rds
displayName: NRDOT MSSQL RDS (RHEL/CentOS)
description: New Relic install recipe for MSSQL monitoring via NRDOT Collector on RHEL/CentOS hosts connecting to AWS RDS SQL Server instances
repository: https://github.com/newrelic/nrdot-collector-releases

installTargets:
  - type: host
    os: linux
    platform: centos
  - type: host
    os: linux
    platform: redhat

keywords:
  - MSSQL
  - SQL Server
  - NRDOT
  - OpenTelemetry
  - OTel
  - Database
  - Linux
  - CentOS
  - RHEL
  - RDS
  - AWS

processMatch: []

preInstall:
  discoveryMode:
    - targeted
  info: |
    To capture data from your AWS RDS SQL Server instance, we need to create/authorize
    a monitoring identity (a SQL login). This requires the RDS master user credentials
    for your instance, and network connectivity from this host to the RDS endpoint
    (inbound access on the SQL Server port in the RDS security group).

inputVars:
  - name: NR_CLI_MSSQL_CONFIG_PRESET
    prompt: "NRDOT configuration - 1) Standard  2) Full-feature: "
    default: "1"
  - name: NR_CLI_MSSQL_SERVER
    prompt: "RDS SQL Server endpoint (e.g. mydb.xxxxxxxxxx.us-east-1.rds.amazonaws.com): "
  - name: NR_CLI_MSSQL_PORT
    prompt: "SQL Server port: "
    default: "1433"
  - name: NR_CLI_MSSQL_MASTER_USER
    prompt: "RDS master username: "
  - name: NR_CLI_MSSQL_MASTER_PASSWORD
    prompt: "RDS master user password (used once to create the monitoring login): "
    secret: true
  - name: NR_CLI_MSSQL_LOGIN_NAME
    prompt: "Monitoring username: "
    default: "newrelic"

validationNrql: "SELECT count(*) FROM Metric WHERE metricName LIKE 'sqlserver.%' AND instrumentation.provider = 'opentelemetry' SINCE 10 minutes ago"

successLinkConfig:
  type: EXPLORER

install:
  version: "3"
  silent: true

  vars:
    IS_SYSTEMCTL:
      sh: command -v systemctl | wc -l

  tasks:
    write_recipe_metadata:
      cmds:
        - |
          echo '{"Metadata":{"CapturedCliOutput":"true"}}' | tee {{.NR_CLI_OUTPUT}} > /dev/null

    assert_pre_req:
      cmds:
        - |
          if [ "$(id -u)" != "0" ]; then
            echo "This newrelic install must be run under sudo or root" >&2
            exit 131
          fi
        - |
          if ! command -v curl > /dev/null 2>&1; then
            echo "curl is required to run the newrelic install. Please install curl and re-run the installation." >&2
            exit 16
          fi
        - |
          if [ "{{.IS_SYSTEMCTL}}" -eq 0 ]; then
            echo "systemd is required for the nrdot-collector service configuration." >&2
            exit 131
          fi

    assert_sql_server_version:
      cmds:
        - |
          export PATH="/opt/mssql-tools18/bin:/opt/mssql-tools/bin:$PATH"

          SERVER="{{.NR_CLI_MSSQL_SERVER}}"
          PORT="${NR_CLI_MSSQL_PORT:-1433}"
          MASTER_USER="{{.NR_CLI_MSSQL_MASTER_USER}}"
          MASTER_PASSWORD=$(cat << 'NR_MASTER_PW_EOF'
          {{.NR_CLI_MSSQL_MASTER_PASSWORD}}
          NR_MASTER_PW_EOF
          )

          RESULT=$(sqlcmd -S "${SERVER},${PORT}" -U "${MASTER_USER}" -P "${MASTER_PASSWORD}" -C -b -h -1 -Q "SET NOCOUNT ON; SELECT SERVERPROPERTY('ProductMajorVersion');" 2>&1)
          if [ $? -ne 0 ]; then
            echo "Failed to connect to SQL Server to check its version:" >&2
            echo "$RESULT" >&2
            exit 1
          fi

          MAJOR_VERSION=$(echo "$RESULT" | grep -oE '[0-9]+' | head -1)

          if [ -z "$MAJOR_VERSION" ] || [ "$MAJOR_VERSION" -lt 14 ]; then
            echo "SQL Server version ${MAJOR_VERSION:-unknown} is not supported. SQL Server 2017 or later (major version 14+) is required." >&2
            exit 1
          fi

          echo "SQL Server major version ${MAJOR_VERSION} detected - supported."

    install_nrdot:
      cmds:
        - |
          COLLECTOR_DISTRO="nrdot-collector"

          if rpm -q "$COLLECTOR_DISTRO" > /dev/null 2>&1; then
            echo "NRDOT Collector is already installed."
            echo ""
            echo "Please follow the steps below to complete the setup:"
            echo ""
            echo "  1. Create mssql-config.yaml"
            echo "     if not present. Refer to:"
            echo "     https://docs.newrelic.com/docs/opentelemetry/database/mssql/linux-rds/"
            echo ""
            echo "  2. Make sure the monitoring user is created"
            echo "     and has the required permissions granted."
            echo ""
            echo "  3. After making the above changes, restart the NRDOT Collector:"
            echo "     sudo systemctl restart nrdot-collector"
            echo ""
            exit 131
          fi

          COLLECTOR_VERSION=$(curl -sf "https://api.github.com/repos/newrelic/nrdot-collector-releases/releases/latest" | grep '"tag_name":' | awk -F'"' '{print $4}')
          if [ -z "$COLLECTOR_VERSION" ]; then
            echo "Failed to fetch the latest release version from GitHub. Please check your internet connection." >&2
            exit 1
          fi

          if [ "$(uname -m)" = "aarch64" ]; then
            ARCH="arm64"
          else
            ARCH="x86_64"
          fi

          DOWNLOAD_URL="https://github.com/newrelic/nrdot-collector-releases/releases/download/${COLLECTOR_VERSION}/${COLLECTOR_DISTRO}_${COLLECTOR_VERSION}_linux_${ARCH}.rpm"
          echo "Installing ${COLLECTOR_DISTRO} version: ${COLLECTOR_VERSION}"
          echo "Downloading from: ${DOWNLOAD_URL}"

          curl -L --output /tmp/nrdot-collector.rpm "$DOWNLOAD_URL"
          if [ $? -ne 0 ]; then
            echo "Failed to download the nrdot-collector package." >&2
            exit 1
          fi

          rpm -ivh /tmp/nrdot-collector.rpm
          if [ $? -ne 0 ]; then
            echo "Failed to install the nrdot-collector package." >&2
            exit 1
          fi

          rm -f /tmp/nrdot-collector.rpm
          echo "${COLLECTOR_DISTRO} installed successfully."

    configure_database_user:
      cmds:
        - |
          export PATH="/opt/mssql-tools18/bin:/opt/mssql-tools/bin:$PATH"

          LOGIN_NAME="${NR_CLI_MSSQL_LOGIN_NAME:-newrelic}"
          SERVER="{{.NR_CLI_MSSQL_SERVER}}"
          PORT="${NR_CLI_MSSQL_PORT:-1433}"
          MASTER_USER="{{.NR_CLI_MSSQL_MASTER_USER}}"
          MASTER_PASSWORD=$(cat << 'NR_MASTER_PW_EOF'
          {{.NR_CLI_MSSQL_MASTER_PASSWORD}}
          NR_MASTER_PW_EOF
          )
          SQL_FILE=$(mktemp /tmp/nr-mssql-grant.sql.XXXXXX)
          trap 'rm -f "$SQL_FILE"' EXIT

          NR_PASSWORD=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24)

          cat > "$SQL_FILE" << EOF
          USE [master];
          GO
          IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = '${LOGIN_NAME}')
            CREATE LOGIN [${LOGIN_NAME}] WITH PASSWORD = '${NR_PASSWORD}';
          ELSE
            ALTER LOGIN [${LOGIN_NAME}] WITH PASSWORD = '${NR_PASSWORD}';
          GO
          GRANT VIEW SERVER STATE TO [${LOGIN_NAME}];
          GRANT VIEW ANY DEFINITION TO [${LOGIN_NAME}];
          GRANT VIEW ANY DATABASE TO [${LOGIN_NAME}];
          GO
          DECLARE @name SYSNAME;
          DECLARE db_cursor CURSOR READ_ONLY FORWARD_ONLY FOR
          SELECT [name]
          FROM [master].[sys].[databases]
          WHERE [name] NOT IN ('master', 'msdb', 'model', 'rdsadmin', 'distribution')
          AND [state] = 0;
          OPEN db_cursor;
          FETCH NEXT FROM db_cursor INTO @name;
          WHILE @@FETCH_STATUS = 0
          BEGIN
            BEGIN TRY
              EXEC('USE [' + @name + '];
              IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = ''${LOGIN_NAME}'')
              BEGIN
                CREATE USER [${LOGIN_NAME}] FOR LOGIN [${LOGIN_NAME}];
              END;
              GRANT VIEW DATABASE STATE TO [${LOGIN_NAME}];');
            END TRY
            BEGIN CATCH
              PRINT 'Error on ' + @name + ': ' + ERROR_MESSAGE();
            END CATCH
            FETCH NEXT FROM db_cursor INTO @name;
          END
          CLOSE db_cursor;
          DEALLOCATE db_cursor;
          GO
          EOF

          RESULT=$(sqlcmd -S "${SERVER},${PORT}" -U "${MASTER_USER}" -P "${MASTER_PASSWORD}" -C -b -i "$SQL_FILE" 2>&1)
          if [ $? -ne 0 ]; then
            echo "SQL script failed:" >&2
            echo "$RESULT" >&2
            exit 1
          fi
          echo "$RESULT"

          echo "SQL Server monitoring identity configured successfully."

    create_collector_config:
      cmds:
        - |
          PRESET="{{.NR_CLI_MSSQL_CONFIG_PRESET}}"
          LOGIN_NAME="${NR_CLI_MSSQL_LOGIN_NAME:-newrelic}"
          SERVER="{{.NR_CLI_MSSQL_SERVER}}"
          PORT="${NR_CLI_MSSQL_PORT:-1433}"
          MASTER_USER="{{.NR_CLI_MSSQL_MASTER_USER}}"
          MASTER_PASSWORD=$(cat << 'NR_MASTER_PW_EOF'
          {{.NR_CLI_MSSQL_MASTER_PASSWORD}}
          NR_MASTER_PW_EOF
          )
          REGION="{{.NEW_RELIC_REGION}}"
          LICENSE_KEY="{{.NEW_RELIC_LICENSE_KEY}}"
          CONFIG_DIR="/etc/nrdot-collector"
          CONFIG_PATH="${CONFIG_DIR}/mssql-config.yaml"
          ENV_FILE="${CONFIG_DIR}/nrdot-collector.conf"

          mkdir -p "$CONFIG_DIR"

          export PATH="/opt/mssql-tools18/bin:/opt/mssql-tools/bin:$PATH"

          NR_PASSWORD=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24)

          ALTER_RESULT=$(sqlcmd -S "${SERVER},${PORT}" -U "${MASTER_USER}" -P "${MASTER_PASSWORD}" -C -b -Q "ALTER LOGIN [${LOGIN_NAME}] WITH PASSWORD = '${NR_PASSWORD}';" 2>&1)
          if [ $? -ne 0 ]; then
            echo "Failed to set the monitoring login's password:" >&2
            echo "$ALTER_RESULT" >&2
            exit 1
          fi

          case "$REGION" in
            staging) OTLP_ENDPOINT="https://staging-otlp.nr-data.net" ;;
            EU)      OTLP_ENDPOINT="https://otlp.eu01.nr-data.net" ;;
            JP)      OTLP_ENDPOINT="https://otlp.jp.nr-data.net" ;;
            *)       OTLP_ENDPOINT="https://otlp.nr-data.net" ;;
          esac

          if [ "$PRESET" = "2" ]; then
            cat > "$CONFIG_PATH" << EOF
          extensions:
            health_check:

          receivers:
            otlp:
              protocols:
                grpc:
                http:

            host_metrics:
              collection_interval: 30s
              scrapers:
                cpu:
                  metrics:
                    system.cpu.time:
                      enabled: false
                    system.cpu.utilization:
                      enabled: true
                load:
                memory:
                  metrics:
                    system.memory.utilization:
                      enabled: true
                paging:
                  metrics:
                    system.paging.utilization:
                      enabled: false
                    system.paging.faults:
                      enabled: false
                disk:
                  metrics:
                    system.disk.merged:
                      enabled: false
                    system.disk.pending_operations:
                      enabled: false
                    system.disk.weighted_io_time:
                      enabled: false
                network:
                  metrics:
                    system.network.connections:
                      enabled: false
                processes:
                process:
                  mute_process_name_error: true
                  mute_process_exe_error: true
                  mute_process_user_error: true
                  mute_process_io_error: true
                  metrics:
                    process.cpu.utilization:
                      enabled: true
                    process.memory.utilization:
                      enabled: true

            nrsqlserver:
              collection_interval: 30s
              username: ${LOGIN_NAME}
              password: ${NR_PASSWORD}
              server: ${SERVER}
              port: ${PORT}
              max_concurrent_queries: 4

              metrics:
                sqlserver.database.count:
                  enabled: true
                sqlserver.database.file.size:
                  enabled: true
                sqlserver.database.io:
                  enabled: true
                sqlserver.database.latency:
                  enabled: true
                sqlserver.database.operations:
                  enabled: true
                sqlserver.database.transactions.active:
                  enabled: true
                sqlserver.database.backup_or_restore.rate:
                  enabled: true
                sqlserver.database.full_scan.rate:
                  enabled: true
                sqlserver.database.tempdb.space:
                  enabled: true
                sqlserver.database.tempdb.version_store.size:
                  enabled: true
                sqlserver.lock.timeout.rate:
                  enabled: true
                sqlserver.lock.wait.count:
                  enabled: true
                sqlserver.deadlock.rate:
                  enabled: true
                sqlserver.transaction.delay:
                  enabled: true
                sqlserver.transaction.longest_running_time:
                  enabled: true
                sqlserver.transaction.version_cleanup.rate:
                  enabled: true
                sqlserver.transaction.version_generation.rate:
                  enabled: true
                sqlserver.memory.area:
                  enabled: true
                sqlserver.memory.cache.object.count:
                  enabled: true
                sqlserver.memory.grants.pending.count:
                  enabled: true
                sqlserver.memory.page.count:
                  enabled: true
                sqlserver.memory.usage:
                  enabled: true
                sqlserver.os.memory.usage:
                  enabled: true
                sqlserver.os.memory.utilization:
                  enabled: true
                sqlserver.os.scheduler.runnable_tasks.count:
                  enabled: true
                sqlserver.os.wait.duration:
                  enabled: true
                sqlserver.os.wait.tasks.count:
                  enabled: true
                sqlserver.page.buffer_cache.free_list.stalls.rate:
                  enabled: true
                sqlserver.page.lookup.rate:
                  enabled: true
                sqlserver.batch.compilation.utilization:
                  enabled: true
                sqlserver.batch.page_split.utilization:
                  enabled: true
                sqlserver.recompilation.ratio:
                  enabled: true
                sqlserver.parameterization.rate:
                  enabled: true
                sqlserver.plan.execution.rate:
                  enabled: true
                sqlserver.attention.rate:
                  enabled: true
                sqlserver.process.count:
                  enabled: true
                sqlserver.processes.blocked:
                  enabled: true
                sqlserver.login.rate:
                  enabled: true
                sqlserver.logout.rate:
                  enabled: true
                sqlserver.thread_pool.tasks.count:
                  enabled: true
                sqlserver.thread_pool.workers.count:
                  enabled: true
                sqlserver.thread_pool.workers.max:
                  enabled: true
                sqlserver.thread_pool.workers.utilization:
                  enabled: true
                sqlserver.tempdb.allocation.wait_time.total:
                  enabled: true
                sqlserver.tempdb.contention.waiters.count:
                  enabled: true
                sqlserver.tempdb.data_files.count:
                  enabled: true
                sqlserver.tempdb.file.size:
                  enabled: true
                sqlserver.tempdb.space.usage:
                  enabled: true
                sqlserver.latch.superlatch.count:
                  enabled: true
                sqlserver.latch.superlatch.transition.rate:
                  enabled: true
                sqlserver.latch.wait.rate:
                  enabled: true
                sqlserver.latch.wait_time.avg:
                  enabled: true
                sqlserver.latch.wait_time.total:
                  enabled: true
                sqlserver.index.search.rate:
                  enabled: true
                sqlserver.resource_pool.disk.operations:
                  enabled: true
                sqlserver.resource_pool.disk.throttled.read.rate:
                  enabled: true
                sqlserver.resource_pool.disk.throttled.write.rate:
                  enabled: true
                sqlserver.replica.data.rate:
                  enabled: true
                sqlserver.failover_cluster.ag.cluster_type:
                  enabled: true
                sqlserver.failover_cluster.ag.failure_condition_level:
                  enabled: true
                sqlserver.failover_cluster.ag.health_check_timeout:
                  enabled: true
                sqlserver.failover_cluster.ag.required_sync_secondaries:
                  enabled: true
                sqlserver.failover_cluster.replica.database.queue_size:
                  enabled: true
                sqlserver.failover_cluster.replica.database.redo.rate:
                  enabled: true
                sqlserver.failover_cluster.replica.flow_control_time:
                  enabled: true
                sqlserver.failover_cluster.replica.role:
                  enabled: true
                sqlserver.failover_cluster.replica.synchronization_health:
                  enabled: true
                sqlserver.computer.uptime:
                  enabled: true
                sqlserver.cpu.count:
                  enabled: true
                sqlserver.table.count:
                  enabled: true

              events:
                db.server.query_sample:
                  enabled: true
                db.server.top_query:
                  enabled: true

              top_query_collection:
                lookback_time: 45s
                max_query_sample_count: 100
                top_query_count: 30
                collection_interval: 30s

              collect_full_query_text: true
              allowed_comment_keys:
                - nr_service_guid

              query_sample_collection:
                max_rows_per_query: 50

          processors:
            metrics_transform:
              transforms:
                - include: system.cpu.utilization
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [state]
                      aggregation_type: mean
                - include: system.paging.operations
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [direction]
                      aggregation_type: sum

            filter/exclude_cpu_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "interrupt"'
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "nice"'
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "softirq"'

            filter/exclude_memory_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_unreclaimable"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "inactive"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "cached"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "buffered"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_reclaimable"'

            filter/exclude_memory_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "slab_unreclaimable"'
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "inactive"'

            filter/exclude_filesystem_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.utilization" and attributes["type"] == "squashfs"'

            filter/exclude_filesystem_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.usage" and attributes["type"] == "squashfs"'
                  - 'metric.name == "system.filesystem.usage" and attributes["state"] == "reserved"'

            filter/exclude_filesystem_inodes_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.inodes.usage" and attributes["type"] == "squashfs"'
                  - 'metric.name == "system.filesystem.inodes.usage" and attributes["state"] == "reserved"'

            filter/exclude_system_disk:
              metrics:
                datapoint:
                  - 'metric.name == "system.disk.operations" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.merged" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.io" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.io_time" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.operation_time" and IsMatch(attributes["device"], "^loop.*") == true'

            filter/exclude_network:
              metrics:
                datapoint:
                  - 'IsMatch(metric.name, "^system.network.*") == true and attributes["device"] == "lo"'

            attributes/exclude_system_paging:
              include:
                match_type: strict
                metric_names:
                  - system.paging.operations
              actions:
                - key: type
                  action: delete

            cumulativetodelta:

            transform/host:
              metric_statements:
                - context: metric
                  statements:
                    - set(metric.description, "")
                    - set(metric.unit, "")

            memory_limiter:
              check_interval: \${env:NR_MEM_LIMITER_CHECK_INTERVAL:-1s}
              limit_mib:       \${env:NR_MEM_LIMITER_LIMIT_MIB:-1000}
              spike_limit_mib: \${env:NR_MEM_LIMITER_SPIKE_MIB:-50}

            batch:

            batch/logs:
              send_batch_size: 15
              send_batch_max_size: 15
              timeout: 5s

            resource_detection:
              detectors: ["system"]
              system:
                hostname_sources: ["os"]
                resource_attributes:
                  host.id:
                    enabled: true
            resource_detection/cloud:
              detectors: ["gcp", "ec2", "azure"]
              timeout: 2s
              override: true
            resource_detection/env:
              detectors: ["env"]
              timeout: 2s
              override: true

          exporters:
            otlphttp:
              endpoint: ${OTLP_ENDPOINT}
              headers:
                api-key: ${LICENSE_KEY}
              tls:
                insecure: false
              compression: gzip

          service:
            telemetry:
              metrics:
                level: none

            extensions: [health_check]

            pipelines:
              metrics/host:
                receivers: [host_metrics, nrsqlserver]
                processors:
                  - metrics_transform
                  - filter/exclude_cpu_utilization
                  - filter/exclude_memory_utilization
                  - filter/exclude_memory_usage
                  - filter/exclude_filesystem_utilization
                  - filter/exclude_filesystem_usage
                  - filter/exclude_filesystem_inodes_usage
                  - filter/exclude_system_disk
                  - filter/exclude_network
                  - attributes/exclude_system_paging
                  - transform/host
                  - resource_detection
                  - resource_detection/cloud
                  - resource_detection/env
                  - cumulativetodelta
                  - memory_limiter
                  - batch
                exporters: [otlphttp]

              logs/host:
                receivers: [nrsqlserver]
                processors:
                  - resource_detection
                  - resource_detection/cloud
                  - resource_detection/env
                  - batch/logs
                exporters: [otlphttp]

              traces:
                receivers: [otlp]
                processors: [resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlphttp]

              metrics:
                receivers: [otlp]
                processors: [resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlphttp]

              logs:
                receivers: [otlp]
                processors: [resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlphttp]
          EOF
          else
            cat > "$CONFIG_PATH" << EOF
          receivers:
            nrsqlserver:
              collection_interval: 15s
              username: ${LOGIN_NAME}
              password: ${NR_PASSWORD}
              server: ${SERVER}
              port: ${PORT}

              metrics:
                sqlserver.database.count:
                  enabled: true
                sqlserver.database.io:
                  enabled: true
                sqlserver.database.latency:
                  enabled: true
                sqlserver.database.operations:
                  enabled: true
                sqlserver.database.tempdb.space:
                  enabled: true
                sqlserver.database.tempdb.version_store.size:
                  enabled: true
                sqlserver.deadlock.rate:
                  enabled: true
                sqlserver.os.wait.duration:
                  enabled: true
                sqlserver.processes.blocked:
                  enabled: true
                sqlserver.memory.grants.pending.count:
                  enabled: true
                sqlserver.database.file.size:
                  enabled: true
                sqlserver.memory.area:
                  enabled: true

              events:
                db.server.query_sample:
                  enabled: true
                db.server.top_query:
                  enabled: true

              top_query_collection:
                lookback_time: 60s
                max_query_sample_count: 1000
                top_query_count: 250
                collection_interval: 60s

              collect_full_query_text: true
              allowed_comment_keys:
                - nr_service_guid

              query_sample_collection:
                max_rows_per_query: 100

          processors:
            memory_limiter:
              check_interval: \${env:NR_MEM_LIMITER_CHECK_INTERVAL:-1s}
              limit_mib:       \${env:NR_MEM_LIMITER_LIMIT_MIB:-200}
              spike_limit_mib: \${env:NR_MEM_LIMITER_SPIKE_MIB:-50}

            batch:

          exporters:
            otlphttp:
              endpoint: ${OTLP_ENDPOINT}
              headers:
                api-key: ${LICENSE_KEY}
              tls:
                insecure: false
              compression: gzip

          service:
            telemetry:
              metrics:
                level: none

            pipelines:
              metrics:
                receivers: [nrsqlserver]
                processors: [memory_limiter, batch]
                exporters: [otlphttp]

              logs:
                receivers: [nrsqlserver]
                processors: [memory_limiter, batch]
                exporters: [otlphttp]
          EOF
          fi

          cat > "$ENV_FILE" << EOF
          OTELCOL_OPTIONS="--config=${CONFIG_PATH}"
          EOF

          chown nrdot-collector:nrdot-collector "$CONFIG_PATH"
          chmod 600 "$CONFIG_PATH"

          echo "MSSQL OTel config written to ${CONFIG_PATH}"
          echo "Env file written to ${ENV_FILE}"

    restart_nrdot:
      cmds:
        - |
          systemctl restart nrdot-collector

          echo "Waiting for NRDOT Collector to start..."
          for i in $(seq 1 30); do
            if systemctl is-active --quiet nrdot-collector; then
              echo "NRDOT Collector is running."
              exit 0
            fi
            sleep 2
          done

          echo "NRDOT Collector did not start in time. Check logs:" >&2
          journalctl -u nrdot-collector --no-pager -n 50 >&2
          exit 31

    default:
      cmds:
        - task: write_recipe_metadata
        - task: assert_pre_req
        - task: assert_sql_server_version
        - task: install_nrdot
        - task: configure_database_user
        - task: create_collector_config
        - task: restart_nrdot

postInstall:
  info: |2
      MSSQL OTel config: /etc/nrdot-collector/mssql-config.yaml
      Env file:           /etc/nrdot-collector/nrdot-collector.conf
      Service status:     systemctl status nrdot-collector
      View logs:           journalctl -u nrdot-collector -f
      Restart service:     sudo systemctl restart nrdot-collector
