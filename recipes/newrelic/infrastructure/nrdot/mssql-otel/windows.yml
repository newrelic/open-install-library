# Visit our schema definition for additional information on this file format.
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition
# WORK IN PROGRESS - not for use.

name: nrdot-collector-mssql
displayName: NRDOT MSSQL (Windows)
description: New Relic install recipe for MSSQL monitoring via NRDOT Collector on Windows self-hosted environments (SQL Server Authentication), one or more local instances
repository: https://github.com/newrelic/nrdot-collector-releases

installTargets:
  - type: host
    os: windows

keywords:
  - MSSQL
  - SQL Server
  - NRDOT
  - OpenTelemetry
  - OTel
  - Database
  - Windows

processMatch:
  - sqlservr

preInstall:
  discoveryMode:
    - targeted
  info: |
    To capture data from one or more local SQL Server instances, we need to create a
    SQL Server login for monitoring on each, using an existing login with sysadmin
    privileges (or equivalent) on each instance.

    You will be asked for two files:

      1. An instances file (YAML) listing every local SQL Server instance to monitor,
         in the order you want them numbered (instance 1, 2, 3, ...). If you're running
         a single SQL Server, this is still one entry - multiple entries are only
         needed if you run multiple separate SQL Server instances on this host (e.g. on
         different ports):

           instances:
             - host: localhost
               port: 1433
               login_name: newrelic
             - host: localhost
               port: 1434
               login_name: newrelic

      2. A secrets file (KEY=VALUE per line) supplying an admin login and password
         for each instance above, indexed to match the instances file's order
         (1-based). Any login with sysadmin privileges works - it doesn't have to
         be 'sa':

           NR_CLI_MSSQL_ADMIN_USER_1=sa
           NR_CLI_MSSQL_ADMIN_PASSWORD_1=<admin password for instance 1>
           NR_CLI_MSSQL_ADMIN_USER_2=sa
           NR_CLI_MSSQL_ADMIN_PASSWORD_2=<admin password for instance 2>

         Both NR_CLI_MSSQL_ADMIN_USER_<i> and NR_CLI_MSSQL_ADMIN_PASSWORD_<i> are
         required for every instance.

    Any instance that fails its version check or login setup is skipped (with a reason)
    rather than aborting the whole install - the rest are still configured.

inputVars:
  - name: NR_CLI_MSSQL_CONFIG_PRESET
    prompt: "NRDOT configuration - 1) Standard  2) Full-feature: "
    default: "1"
  - name: NR_CLI_MSSQL_INSTANCES_FILE
    prompt: "Path to the MSSQL instances YAML file: "
  - name: NR_CLI_MSSQL_SECRETS_FILE
    prompt: "Path to the MSSQL secrets file (KEY=VALUE per instance): "

validationNrql: "SELECT count(*) FROM Metric WHERE metricName LIKE 'sqlserver.%' AND instrumentation.provider = 'opentelemetry' SINCE 10 minutes ago"

successLinkConfig:
  type: EXPLORER

install:
  version: "3"
  silent: true

  tasks:
    write_recipe_metadata:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-write_recipe_metadata.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $metadata = '{"Metadata":{"CapturedCliOutput":"true"}}'
          try { $metadata | Set-Content {{.NR_CLI_OUTPUT}} } catch {}
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    assert_pre_req:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-assert_pre_req.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $currentPrincipal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          $isAdmin = $currentPrincipal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $isAdmin) {
            Write-Host -ForegroundColor Red "This newrelic install must be run in an Administrator PowerShell session."
            exit 131
          }

          $sqlcmdPath = Get-Command sqlcmd.exe -ErrorAction SilentlyContinue
          if (-not $sqlcmdPath) {
            Write-Host -ForegroundColor Red "sqlcmd is required to configure SQL Server monitoring. Install the sqlcmd utility (https://learn.microsoft.com/sql/tools/sqlcmd/sqlcmd-utility) and re-run this recipe."
            exit 16
          }
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    parse_instances:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-parse_instances.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $instancesFile = '{{.NR_CLI_MSSQL_INSTANCES_FILE}}'
          $secretsFile = '{{.NR_CLI_MSSQL_SECRETS_FILE}}'
          $instancesJsonPath = "$env:TEMP\nr-mssql-instances.json"
          $skipJsonPath = "$env:TEMP\nr-mssql-skip.json"

          Remove-Item $instancesJsonPath, $skipJsonPath -ErrorAction SilentlyContinue

          if (-not (Test-Path $instancesFile)) {
            Write-Host -ForegroundColor Red "Instances file not found: $instancesFile"
            exit 131
          }
          if (-not (Test-Path $secretsFile)) {
            Write-Host -ForegroundColor Red "Secrets file not found: $secretsFile"
            exit 131
          }

          # Parses the fixed 3-key-per-item shape documented in preInstall.info
          # (host, port, login_name) - not a general-purpose YAML parser.
          $lines = Get-Content $instancesFile
          $instances = @()
          $current = $null
          foreach ($line in $lines) {
            if ($line -match '^\s*-\s*host:\s*(.+?)\s*$') {
              if ($current) { $instances += [PSCustomObject]$current }
              $current = @{ host = $matches[1]; port = $null; login_name = $null }
            } elseif ($current -and $line -match '^\s*port:\s*(.+?)\s*$') {
              $current.port = $matches[1]
            } elseif ($current -and $line -match '^\s*login_name:\s*(.+?)\s*$') {
              $current.login_name = $matches[1]
            }
          }
          if ($current) { $instances += [PSCustomObject]$current }

          if ($instances.Count -eq 0) {
            Write-Host -ForegroundColor Red "No instances found in $instancesFile"
            exit 131
          }
          Write-Host "Found $($instances.Count) MSSQL instance(s) in $instancesFile"

          $secrets = @{}
          Get-Content $secretsFile | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $secrets[$matches[1]] = $matches[2] }
          }

          $skip = @{}
          for ($i = 0; $i -lt $instances.Count; $i++) {
            $idx = $i + 1
            $userKey = "NR_CLI_MSSQL_ADMIN_USER_$idx"
            $passKey = "NR_CLI_MSSQL_ADMIN_PASSWORD_$idx"
            if (-not $secrets.ContainsKey($userKey) -or [string]::IsNullOrWhiteSpace($secrets[$userKey]) -or -not $secrets.ContainsKey($passKey) -or [string]::IsNullOrWhiteSpace($secrets[$passKey])) {
              $skip["$idx"] = "missing $userKey/$passKey in secrets file"
              Write-Host -ForegroundColor Yellow "Instance $idx ($($instances[$i].host)) SKIPPED: missing admin credentials in secrets file"
              continue
            }
            $loginName = $instances[$i].login_name
            if ($loginName -notmatch '^[A-Za-z][A-Za-z0-9_]*$') {
              $skip["$idx"] = "invalid monitoring username '$loginName' in instances file"
              Write-Host -ForegroundColor Yellow "Instance $idx ($($instances[$i].host)) SKIPPED: invalid monitoring username '$loginName'"
            }
          }

          ConvertTo-Json -InputObject $instances -Depth 5 | Set-Content -Path $instancesJsonPath
          $skip | ConvertTo-Json | Set-Content -Path $skipJsonPath
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    assert_sql_server_version:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-assert_sql_server_version.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $instancesJsonPath = "$env:TEMP\nr-mssql-instances.json"
          $skipJsonPath = "$env:TEMP\nr-mssql-skip.json"
          $secretsFile = '{{.NR_CLI_MSSQL_SECRETS_FILE}}'

          $instances = [array](Get-Content $instancesJsonPath -Raw | ConvertFrom-Json)
          $skip = @{}
          (Get-Content $skipJsonPath | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $skip[$_.Name] = $_.Value }

          $secrets = @{}
          Get-Content $secretsFile | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $secrets[$matches[1]] = $matches[2] }
          }

          for ($i = 0; $i -lt $instances.Count; $i++) {
            $idx = $i + 1
            if ($skip.ContainsKey("$idx")) { continue }
            $inst = $instances[$i]

            $env:SQLCMDPASSWORD = $secrets["NR_CLI_MSSQL_ADMIN_PASSWORD_$idx"]
            $connArgs = @("-S", "$($inst.host),$($inst.port)", "-U", $secrets["NR_CLI_MSSQL_ADMIN_USER_$idx"], "-C")

            $query = "SET NOCOUNT ON; SELECT SERVERPROPERTY('ProductMajorVersion');"
            $result = & sqlcmd @connArgs -b -h -1 -Q $query 2>&1
            $sqlExit = $LASTEXITCODE
            Remove-Item Env:\SQLCMDPASSWORD -ErrorAction SilentlyContinue

            if ($sqlExit -ne 0) {
              $skip["$idx"] = "failed to connect / check version - $($result -join ' ')"
              Write-Host -ForegroundColor Yellow "Instance $idx ($($inst.host):$($inst.port)) SKIPPED: failed to connect to check its version"
              continue
            }

            $majorVersionLine = ($result | Where-Object { $_ -match '^\s*\d+\s*$' } | Select-Object -First 1)
            $majorVersion = if ($majorVersionLine) { [int]$majorVersionLine.Trim() } else { $null }

            if (-not $majorVersion -or $majorVersion -lt 14) {
              $skip["$idx"] = "unsupported SQL Server version $majorVersion (2017 / major version 14+ required)"
              Write-Host -ForegroundColor Yellow "Instance $idx ($($inst.host):$($inst.port)) SKIPPED: unsupported SQL Server version $majorVersion"
              continue
            }

            Write-Host "Instance $idx ($($inst.host):$($inst.port)): SQL Server major version $majorVersion detected - supported."
          }

          $skip | ConvertTo-Json | Set-Content -Path $skipJsonPath
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    install_nrdot:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-install_nrdot.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          [Net.ServicePointManager]::SecurityProtocol = "tls12, tls"

          $CollectorService = "nrdot-collector"

          $LatestVersion = (Invoke-RestMethod -Uri "https://api.github.com/repos/newrelic/nrdot-collector-releases/releases/latest").tag_name
          if (-not $LatestVersion) {
            Write-Host -ForegroundColor Red "Failed to fetch the latest release version from GitHub. Please check your internet connection."
            exit 1
          }

          $ExistingService = Get-Service -Name $CollectorService -ErrorAction SilentlyContinue

          if ($ExistingService) {
            Write-Host -ForegroundColor Yellow "NRDOT Collector is already installed."
            Write-Host ""
            Write-Host "Please follow the steps below to complete the setup:"
            Write-Host ""
            Write-Host "  1. Create mssql-config.yaml"
            Write-Host "     if not present. Refer to:"
            Write-Host "     https://docs.newrelic.com/docs/opentelemetry/database/mssql/windows-hosted/"
            Write-Host ""
            Write-Host "  2. Make sure the monitoring user is created"
            Write-Host "     and has the required permissions granted."
            Write-Host ""
            Write-Host "  3. After making the above changes, restart the NRDOT Collector:"
            Write-Host "     net stop nrdot-collector; net start nrdot-collector"
            Write-Host ""
            exit 131
          }

          Write-Host "Installing nrdot-collector version: $LatestVersion"

          $MsiPath = "$env:TEMP\nrdot-collector.msi"
          $LogPath = "$env:TEMP\nrdot_install.log"
          $DownloadUrl = "https://github.com/newrelic/nrdot-collector-releases/releases/download/$LatestVersion/nrdot-collector_${LatestVersion}_windows_x64.msi"
          Write-Host "Downloading from: $DownloadUrl"

          $WebClient = New-Object System.Net.WebClient
          $WebClient.Headers.Add("User-Agent", "Mozilla/5.0")
          if ($env:HTTPS_PROXY) {
            $WebClient.Proxy = New-Object System.Net.WebProxy($env:HTTPS_PROXY, $true)
          }
          try {
            $WebClient.DownloadFile($DownloadUrl, $MsiPath)
          } catch {
            Write-Host -ForegroundColor Red "Failed to download the nrdot-collector package: $_"
            exit 1
          }

          $Process = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$MsiPath`" /qn /norestart /L*V `"$LogPath`"" -Wait -NoNewWindow -PassThru
          if ($Process.ExitCode -ne 0) {
            Write-Host -ForegroundColor Red "msiexec failed with exit code $($Process.ExitCode). See $LogPath for details."
            exit $Process.ExitCode
          }

          Remove-Item -Path $MsiPath -ErrorAction SilentlyContinue

          $Service = Get-Service -Name $CollectorService -ErrorAction SilentlyContinue
          if (-not $Service) {
            Write-Host -ForegroundColor Red "nrdot-collector service was not found after installation."
            exit 1
          }

          Write-Host "nrdot-collector installed successfully."
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    configure_database_user:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-configure_database_user.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $instancesJsonPath = "$env:TEMP\nr-mssql-instances.json"
          $skipJsonPath = "$env:TEMP\nr-mssql-skip.json"
          $secretsFile = '{{.NR_CLI_MSSQL_SECRETS_FILE}}'

          $instances = [array](Get-Content $instancesJsonPath -Raw | ConvertFrom-Json)
          $skip = @{}
          (Get-Content $skipJsonPath | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $skip[$_.Name] = $_.Value }

          $secrets = @{}
          Get-Content $secretsFile | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $secrets[$matches[1]] = $matches[2] }
          }

          function Protect-TempFile($path) {
            icacls $path /inheritance:r /grant:r "SYSTEM:(F)" "BUILTIN\Administrators:(F)" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host -ForegroundColor Red "Failed to restrict permissions on $path."
              exit 1
            }
          }

          for ($i = 0; $i -lt $instances.Count; $i++) {
            $idx = $i + 1
            if ($skip.ContainsKey("$idx")) { continue }
            $inst = $instances[$i]
            $loginName = $inst.login_name

            $sqlFile = "$env:TEMP\nr-mssql-grant-$idx.sql"
            $chars = (48..57) + (65..90) + (97..122)
            $NrPassword = -join ($chars | Get-Random -Count 24 | ForEach-Object {[char]$_})

            $sql = "USE [master];`nGO`nIF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = '$loginName')`n  CREATE LOGIN [$loginName] WITH PASSWORD = '$NrPassword';`nELSE`n  ALTER LOGIN [$loginName] WITH PASSWORD = '$NrPassword';`nGO`nGRANT VIEW SERVER STATE TO [$loginName];`nGRANT VIEW ANY DEFINITION TO [$loginName];`nGRANT VIEW ANY DATABASE TO [$loginName];`nGO`nDECLARE @name SYSNAME;`nDECLARE db_cursor CURSOR READ_ONLY FORWARD_ONLY FOR`nSELECT [name]`nFROM [master].[sys].[databases]`nWHERE [name] NOT IN ('master', 'msdb', 'model', 'rdsadmin', 'distribution')`nAND [state] = 0;`nOPEN db_cursor;`nFETCH NEXT FROM db_cursor INTO @name;`nWHILE @@FETCH_STATUS = 0`nBEGIN`n  BEGIN TRY`n    EXEC('USE [' + @name + '];`n    IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = ''$loginName'')`n    BEGIN`n      CREATE USER [$loginName] FOR LOGIN [$loginName];`n    END;`n    GRANT VIEW DATABASE STATE TO [$loginName];');`n  END TRY`n  BEGIN CATCH`n    PRINT 'Error on ' + @name + ': ' + ERROR_MESSAGE();`n  END CATCH`n  FETCH NEXT FROM db_cursor INTO @name;`nEND`nCLOSE db_cursor;`nDEALLOCATE db_cursor;`nGO"
            $sql | Set-Content -Path $sqlFile
            Protect-TempFile $sqlFile

            $env:SQLCMDPASSWORD = $secrets["NR_CLI_MSSQL_ADMIN_PASSWORD_$idx"]
            $result = & sqlcmd -S "$($inst.host),$($inst.port)" -U $secrets["NR_CLI_MSSQL_ADMIN_USER_$idx"] -C -b -i $sqlFile 2>&1
            $sqlExit = $LASTEXITCODE
            Remove-Item Env:\SQLCMDPASSWORD -ErrorAction SilentlyContinue
            Remove-Item -Path $sqlFile -ErrorAction SilentlyContinue

            if ($sqlExit -ne 0) {
              $skip["$idx"] = "monitoring login setup failed - $($result -join ' ')"
              Write-Host -ForegroundColor Yellow "Instance $idx ($($inst.host):$($inst.port)) SKIPPED: monitoring login setup failed"
              continue
            }

            Write-Host "Instance $idx ($($inst.host):$($inst.port)): SQL Server monitoring identity configured successfully: $loginName"
          }

          $skip | ConvertTo-Json | Set-Content -Path $skipJsonPath
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    create_collector_config:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-create_collector_config.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $preset = "{{.NR_CLI_MSSQL_CONFIG_PRESET}}"
          $region = "{{.NEW_RELIC_REGION}}"
          $licenseKey = "{{.NEW_RELIC_LICENSE_KEY}}"
          $configDir = "C:\Program Files\nrdot-collector"
          $configPath = "$configDir\mssql-config.yaml"
          $instancesJsonPath = "$env:TEMP\nr-mssql-instances.json"
          $skipJsonPath = "$env:TEMP\nr-mssql-skip.json"
          $secretsFile = '{{.NR_CLI_MSSQL_SECRETS_FILE}}'

          New-Item -Path $configDir -ItemType Directory -Force | Out-Null

          $instances = [array](Get-Content $instancesJsonPath -Raw | ConvertFrom-Json)
          $skip = @{}
          (Get-Content $skipJsonPath | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $skip[$_.Name] = $_.Value }

          $secrets = @{}
          Get-Content $secretsFile | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $secrets[$matches[1]] = $matches[2] }
          }

          $interval = if ($preset -eq "2") { "30s" } else { "15s" }

          switch ($region) {
            "staging" { $otlpEndpoint = "https://staging-otlp.nr-data.net" }
            "EU"      { $otlpEndpoint = "https://otlp.eu01.nr-data.net" }
            "JP"      { $otlpEndpoint = "https://otlp.jp.nr-data.net" }
            default   { $otlpEndpoint = "https://otlp.nr-data.net" }
          }

          # Shared receiver settings differ by preset (Full-feature carries a longer
          # metrics list than Standard) but are identical across instances within a
          # preset. Built once here as plain strings and echoed per instance below
          # instead of relying on the collector's YAML loader to support merge-key
          # aliases via a fragile split - username/password/server/port are the only
          # fields that vary per instance.
          if ($preset -eq "2") {
            $metricsList = @'
                sqlserver.database.count:
                  enabled: true
                sqlserver.database.file.size:
                  enabled: true
                sqlserver.database.io:
                  enabled: true
                sqlserver.database.latency:
                  enabled: true
                sqlserver.database.operations:
                  enabled: true
                sqlserver.database.transactions.active:
                  enabled: true
                sqlserver.database.backup_or_restore.rate:
                  enabled: true
                sqlserver.database.execution.errors:
                  enabled: true
                sqlserver.database.full_scan.rate:
                  enabled: true
                sqlserver.database.tempdb.space:
                  enabled: true
                sqlserver.database.tempdb.version_store.size:
                  enabled: true
                sqlserver.lock.timeout.rate:
                  enabled: true
                sqlserver.lock.wait.count:
                  enabled: true
                sqlserver.deadlock.rate:
                  enabled: true
                sqlserver.transaction.delay:
                  enabled: true
                sqlserver.transaction.longest_running_time:
                  enabled: true
                sqlserver.transaction.version_cleanup.rate:
                  enabled: true
                sqlserver.transaction.version_generation.rate:
                  enabled: true
                sqlserver.memory.area:
                  enabled: true
                sqlserver.memory.cache.object.count:
                  enabled: true
                sqlserver.memory.grants.pending.count:
                  enabled: true
                sqlserver.memory.page.count:
                  enabled: true
                sqlserver.memory.usage:
                  enabled: true
                sqlserver.os.memory.usage:
                  enabled: true
                sqlserver.os.memory.utilization:
                  enabled: true
                sqlserver.os.scheduler.runnable_tasks.count:
                  enabled: true
                sqlserver.os.wait.duration:
                  enabled: true
                sqlserver.os.wait.tasks.count:
                  enabled: true
                sqlserver.page.buffer_cache.free_list.stalls.rate:
                  enabled: true
                sqlserver.page.lookup.rate:
                  enabled: true
                sqlserver.batch.compilation.utilization:
                  enabled: true
                sqlserver.batch.page_split.utilization:
                  enabled: true
                sqlserver.recompilation.ratio:
                  enabled: true
                sqlserver.parameterization.rate:
                  enabled: true
                sqlserver.plan.execution.rate:
                  enabled: true
                sqlserver.attention.rate:
                  enabled: true
                sqlserver.process.count:
                  enabled: true
                sqlserver.processes.blocked:
                  enabled: true
                sqlserver.login.rate:
                  enabled: true
                sqlserver.logout.rate:
                  enabled: true
                sqlserver.thread_pool.tasks.count:
                  enabled: true
                sqlserver.thread_pool.workers.count:
                  enabled: true
                sqlserver.thread_pool.workers.max:
                  enabled: true
                sqlserver.thread_pool.workers.utilization:
                  enabled: true
                sqlserver.tempdb.allocation.wait_time.total:
                  enabled: true
                sqlserver.tempdb.contention.waiters.count:
                  enabled: true
                sqlserver.tempdb.data_files.count:
                  enabled: true
                sqlserver.tempdb.file.size:
                  enabled: true
                sqlserver.tempdb.space.usage:
                  enabled: true
                sqlserver.latch.superlatch.count:
                  enabled: true
                sqlserver.latch.superlatch.transition.rate:
                  enabled: true
                sqlserver.latch.wait.rate:
                  enabled: true
                sqlserver.latch.wait_time.avg:
                  enabled: true
                sqlserver.latch.wait_time.total:
                  enabled: true
                sqlserver.index.search.rate:
                  enabled: true
                sqlserver.resource_pool.disk.operations:
                  enabled: true
                sqlserver.resource_pool.disk.throttled.read.rate:
                  enabled: true
                sqlserver.resource_pool.disk.throttled.write.rate:
                  enabled: true
                sqlserver.replica.data.rate:
                  enabled: true
                sqlserver.failover_cluster.ag.cluster_type:
                  enabled: true
                sqlserver.failover_cluster.ag.failure_condition_level:
                  enabled: true
                sqlserver.failover_cluster.ag.health_check_timeout:
                  enabled: true
                sqlserver.failover_cluster.ag.required_sync_secondaries:
                  enabled: true
                sqlserver.failover_cluster.replica.database.queue_size:
                  enabled: true
                sqlserver.failover_cluster.replica.database.redo.rate:
                  enabled: true
                sqlserver.failover_cluster.replica.flow_control_time:
                  enabled: true
                sqlserver.failover_cluster.replica.role:
                  enabled: true
                sqlserver.failover_cluster.replica.synchronization_health:
                  enabled: true
                sqlserver.computer.uptime:
                  enabled: true
                sqlserver.cpu.count:
                  enabled: true
                sqlserver.table.count:
                  enabled: true
          '@
          } else {
            $metricsList = @'
                sqlserver.database.count:
                  enabled: true
                sqlserver.database.io:
                  enabled: true
                sqlserver.database.latency:
                  enabled: true
                sqlserver.database.operations:
                  enabled: true
                sqlserver.database.tempdb.space:
                  enabled: true
                sqlserver.database.tempdb.version_store.size:
                  enabled: true
                sqlserver.deadlock.rate:
                  enabled: true
                sqlserver.os.wait.duration:
                  enabled: true
                sqlserver.processes.blocked:
                  enabled: true
                sqlserver.memory.grants.pending.count:
                  enabled: true
                sqlserver.database.file.size:
                  enabled: true
                sqlserver.memory.area:
                  enabled: true
          '@
          }

          $receiverTail = @'
              events:
                db.server.query_sample:
                  enabled: true
                db.server.top_query:
                  enabled: true

              top_query_collection:
                lookback_time: 60s
                max_query_sample_count: 1000
                top_query_count: 250
                collection_interval: 60s

              collect_full_query_text: true
              allowed_comment_keys:
                - nr_service_guid

              query_sample_collection:
                max_rows_per_query: 100
          '@

          $survivors = @()
          for ($i = 0; $i -lt $instances.Count; $i++) {
            if (-not $skip.ContainsKey("$($i + 1)")) { $survivors += ($i + 1) }
          }

          $receiversYaml = New-Object System.Text.StringBuilder
          $isFirst = $true
          foreach ($idx in $survivors) {
            $inst = $instances[$idx - 1]
            $loginName = $inst.login_name

            $chars = (48..57) + (65..90) + (97..122)
            $NrPassword = -join ($chars | Get-Random -Count 24 | ForEach-Object {[char]$_})
            $env:SQLCMDPASSWORD = $secrets["NR_CLI_MSSQL_ADMIN_PASSWORD_$idx"]
            $alterResult = & sqlcmd -S "$($inst.host),$($inst.port)" -U $secrets["NR_CLI_MSSQL_ADMIN_USER_$idx"] -C -b -Q "ALTER LOGIN [$loginName] WITH PASSWORD = '$NrPassword';" 2>&1
            $alterExit = $LASTEXITCODE
            Remove-Item Env:\SQLCMDPASSWORD -ErrorAction SilentlyContinue

            if ($alterExit -ne 0) {
              $skip["$idx"] = "failed to set the monitoring login's password - $($alterResult -join ' ')"
              Write-Host -ForegroundColor Yellow "Instance $idx ($($inst.host):$($inst.port)) SKIPPED: failed to set the monitoring login's password"
              continue
            }

            if ($survivors.Count -eq 1) {
              [void]$receiversYaml.AppendLine("  nrsqlserver/instance$idx" + ":")
              [void]$receiversYaml.AppendLine("    collection_interval: $interval")
              [void]$receiversYaml.AppendLine("    username: $loginName")
              [void]$receiversYaml.AppendLine("    password: $NrPassword")
              [void]$receiversYaml.AppendLine("    server: $($inst.host)")
              [void]$receiversYaml.AppendLine("    port: $($inst.port)")
              [void]$receiversYaml.AppendLine("    metrics:")
              [void]$receiversYaml.AppendLine($metricsList)
              [void]$receiversYaml.AppendLine("")
              [void]$receiversYaml.AppendLine($receiverTail)
            } elseif ($isFirst) {
              [void]$receiversYaml.AppendLine("  nrsqlserver/instance$idx" + ": &nrsqlserver-common")
              [void]$receiversYaml.AppendLine("    collection_interval: $interval")
              [void]$receiversYaml.AppendLine("    username: $loginName")
              [void]$receiversYaml.AppendLine("    password: $NrPassword")
              [void]$receiversYaml.AppendLine("    server: $($inst.host)")
              [void]$receiversYaml.AppendLine("    port: $($inst.port)")
              [void]$receiversYaml.AppendLine("    metrics:")
              [void]$receiversYaml.AppendLine($metricsList)
              [void]$receiversYaml.AppendLine("")
              [void]$receiversYaml.AppendLine($receiverTail)
              $isFirst = $false
            } else {
              [void]$receiversYaml.AppendLine("  nrsqlserver/instance$idx" + ":")
              [void]$receiversYaml.AppendLine("    <<: *nrsqlserver-common")
              [void]$receiversYaml.AppendLine("    username: $loginName")
              [void]$receiversYaml.AppendLine("    password: $NrPassword")
              [void]$receiversYaml.AppendLine("    server: $($inst.host)")
              [void]$receiversYaml.AppendLine("    port: $($inst.port)")
            }
          }

          $skip | ConvertTo-Json | Set-Content -Path $skipJsonPath

          $monitoredCount = 0
          foreach ($idx in $survivors) { if (-not $skip.ContainsKey("$idx")) { $monitoredCount++ } }
          if ($monitoredCount -eq 0) {
            Write-Host -ForegroundColor Red "No MSSQL instance passed its checks - nothing to monitor. Aborting install."
            exit 1
          }

          $processorsAndTail = New-Object System.Text.StringBuilder
          if ($preset -eq "2") {
            [void]$processorsAndTail.AppendLine(@'
          processors:
            metrics_transform:
              transforms:
                - include: system.cpu.utilization
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [state]
                      aggregation_type: mean
                - include: system.paging.operations
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [direction]
                      aggregation_type: sum

            filter/exclude_cpu_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "interrupt"'
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "nice"'
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "softirq"'

            filter/exclude_memory_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_unreclaimable"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "inactive"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "cached"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "buffered"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_reclaimable"'

            filter/exclude_memory_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "slab_unreclaimable"'
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "inactive"'

            filter/exclude_filesystem_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.utilization" and attributes["type"] == "squashfs"'

            filter/exclude_filesystem_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.usage" and attributes["type"] == "squashfs"'
                  - 'metric.name == "system.filesystem.usage" and attributes["state"] == "reserved"'

            filter/exclude_filesystem_inodes_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.inodes.usage" and attributes["type"] == "squashfs"'
                  - 'metric.name == "system.filesystem.inodes.usage" and attributes["state"] == "reserved"'

            filter/exclude_system_disk:
              metrics:
                datapoint:
                  - 'metric.name == "system.disk.operations" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.merged" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.io" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.io_time" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.operation_time" and IsMatch(attributes["device"], "^loop.*") == true'

            filter/exclude_system_paging:
              metrics:
                datapoint:
                  - 'metric.name == "system.paging.usage" and attributes["state"] == "cached"'
                  - 'metric.name == "system.paging.operations" and attributes["type"] == "cached"'

            filter/exclude_network:
              metrics:
                datapoint:
                  - 'IsMatch(metric.name, "^system.network.*") == true and attributes["device"] == "lo"'

            attributes/exclude_system_paging:
              include:
                match_type: strict
                metric_names:
                  - system.paging.operations
              actions:
                - key: type
                  action: delete

            cumulativetodelta:

            transform/host:
              metric_statements:
                - context: metric
                  statements:
                    - set(metric.description, "")
                    - set(metric.unit, "")

            batch:

            resource_detection:
              detectors: ["system"]
              system:
                hostname_sources: ["os"]
                resource_attributes:
                  host.id:
                    enabled: true

            resource_detection/cloud:
              detectors: ["gcp", "ec2", "azure"]
              timeout: 2s
              override: true

            resource_detection/env:
              detectors: ["env"]
              timeout: 2s
              override: true
          '@)
          } else {
            [void]$processorsAndTail.AppendLine(@'
          processors:
            memory_limiter:
              check_interval: ${env:NR_MEM_LIMITER_CHECK_INTERVAL:-1s}
              limit_mib:       ${env:NR_MEM_LIMITER_LIMIT_MIB:-200}
              spike_limit_mib: ${env:NR_MEM_LIMITER_SPIKE_MIB:-50}

            batch:
          '@)
          }

          # Per-instance server.address/server.port tagging - the original single-
          # instance recipe had no such processor (nothing else to disambiguate), but
          # with multiple nrsqlserver receivers now sharing config, each needs its own
          # tag or every instance's data reads as coming from the first one.
          foreach ($idx in $survivors) {
            if ($skip.ContainsKey("$idx")) { continue }
            $inst = $instances[$idx - 1]
            [void]$processorsAndTail.AppendLine("")
            [void]$processorsAndTail.AppendLine("  resource/sqlserver/instance$idx" + ":")
            [void]$processorsAndTail.AppendLine("    attributes:")
            [void]$processorsAndTail.AppendLine("      - key: server.address")
            [void]$processorsAndTail.AppendLine("        value: `"$($inst.host)`"")
            [void]$processorsAndTail.AppendLine("        action: upsert")
            [void]$processorsAndTail.AppendLine("      - key: server.port")
            [void]$processorsAndTail.AppendLine("        value: $($inst.port)")
            [void]$processorsAndTail.AppendLine("        action: upsert")
          }

          [void]$processorsAndTail.AppendLine("")
          [void]$processorsAndTail.AppendLine("exporters:")
          [void]$processorsAndTail.AppendLine("  otlphttp:")
          [void]$processorsAndTail.AppendLine("    endpoint: $otlpEndpoint")
          [void]$processorsAndTail.AppendLine("    headers:")
          [void]$processorsAndTail.AppendLine("      api-key: $licenseKey")
          [void]$processorsAndTail.AppendLine("    tls:")
          [void]$processorsAndTail.AppendLine("      insecure: false")
          [void]$processorsAndTail.AppendLine("    compression: gzip")
          [void]$processorsAndTail.AppendLine("")
          [void]$processorsAndTail.AppendLine("service:")
          [void]$processorsAndTail.AppendLine("  telemetry:")
          [void]$processorsAndTail.AppendLine("    metrics:")
          [void]$processorsAndTail.AppendLine("      level: none")
          [void]$processorsAndTail.AppendLine("")
          if ($preset -eq "2") {
            [void]$processorsAndTail.AppendLine("  extensions: [health_check]")
            [void]$processorsAndTail.AppendLine("")
          }
          [void]$processorsAndTail.AppendLine("  pipelines:")
          if ($preset -eq "2") {
            [void]$processorsAndTail.AppendLine(@'
              metrics/host:
                receivers: [host_metrics]
                processors:
                  - metrics_transform
                  - filter/exclude_cpu_utilization
                  - filter/exclude_memory_utilization
                  - filter/exclude_memory_usage
                  - filter/exclude_filesystem_utilization
                  - filter/exclude_filesystem_usage
                  - filter/exclude_filesystem_inodes_usage
                  - filter/exclude_system_disk
                  - filter/exclude_network
                  - attributes/exclude_system_paging
                  - transform/host
                  - resource_detection
                  - resource_detection/cloud
                  - resource_detection/env
                  - cumulativetodelta
                  - batch
                exporters: [otlphttp]
          '@)
          }
          foreach ($idx in $survivors) {
            if ($skip.ContainsKey("$idx")) { continue }
            if ($preset -eq "2") {
              [void]$processorsAndTail.AppendLine("    metrics/instance$idx" + ":")
              [void]$processorsAndTail.AppendLine("      receivers: [nrsqlserver/instance$idx]")
              [void]$processorsAndTail.AppendLine("      processors:")
              [void]$processorsAndTail.AppendLine("        - resource/sqlserver/instance$idx")
              [void]$processorsAndTail.AppendLine("        - resource_detection")
              [void]$processorsAndTail.AppendLine("        - resource_detection/cloud")
              [void]$processorsAndTail.AppendLine("        - resource_detection/env")
              [void]$processorsAndTail.AppendLine("        - cumulativetodelta")
              [void]$processorsAndTail.AppendLine("        - batch")
              [void]$processorsAndTail.AppendLine("      exporters: [otlphttp]")
              [void]$processorsAndTail.AppendLine("    logs/instance$idx" + ":")
              [void]$processorsAndTail.AppendLine("      receivers: [nrsqlserver/instance$idx]")
              [void]$processorsAndTail.AppendLine("      processors: [resource/sqlserver/instance$idx, resource_detection, resource_detection/cloud, resource_detection/env, batch]")
              [void]$processorsAndTail.AppendLine("      exporters: [otlphttp]")
            } else {
              [void]$processorsAndTail.AppendLine("    metrics/instance$idx" + ":")
              [void]$processorsAndTail.AppendLine("      receivers: [nrsqlserver/instance$idx]")
              [void]$processorsAndTail.AppendLine("      processors: [resource/sqlserver/instance$idx, memory_limiter, batch]")
              [void]$processorsAndTail.AppendLine("      exporters: [otlphttp]")
              [void]$processorsAndTail.AppendLine("    logs/instance$idx" + ":")
              [void]$processorsAndTail.AppendLine("      receivers: [nrsqlserver/instance$idx]")
              [void]$processorsAndTail.AppendLine("      processors: [resource/sqlserver/instance$idx, memory_limiter, batch]")
              [void]$processorsAndTail.AppendLine("      exporters: [otlphttp]")
            }
          }
          if ($preset -eq "2") {
            [void]$processorsAndTail.AppendLine(@'
              traces:
                receivers: [otlp]
                processors: [resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlphttp]
              metrics:
                receivers: [otlp]
                processors: [resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlphttp]
              logs:
                receivers: [otlp]
                processors: [resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlphttp]
          '@)
          }

          $configText = "receivers:`n" + $receiversYaml.ToString() + "`n" + $processorsAndTail.ToString()
          $configText | Set-Content -Path $configPath -Encoding utf8

          $grants = @("SYSTEM:(F)", "BUILTIN\Administrators:(F)")

          icacls $configPath /inheritance:r /grant:r $grants | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host -ForegroundColor Red "Failed to restrict permissions on $configPath."
            exit 1
          }

          Write-Host "MSSQL OTel config written to $configPath ($monitoredCount instance(s))"
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    configure_service:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-configure_service.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $service = "nrdot-collector"
          $exePath = "C:\Program Files\nrdot-collector\nrdot-collector.exe"
          $configPath = "C:\Program Files\nrdot-collector\mssql-config.yaml"
          $regPath = "HKLM:\SYSTEM\CurrentControlSet\Services\nrdot-collector"

          $existingImagePath = (Get-ItemProperty -Path $regPath -Name "ImagePath" -ErrorAction SilentlyContinue).ImagePath

          if ($existingImagePath -and $existingImagePath -match [regex]::Escape("mssql-config.yaml")) {
            Write-Host "nrdot-collector service is already configured to use mssql-config.yaml."
          } else {
            $newImagePath = "`"$exePath`" --config `"$configPath`""
            Set-ItemProperty -Path $regPath -Name "ImagePath" -Value $newImagePath
            Write-Host "nrdot-collector service ImagePath updated to use mssql-config.yaml."
          }

          $validateOutput = & $exePath validate --config="$configPath" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host -ForegroundColor Red "mssql-config.yaml failed validation:"
            Write-Host $validateOutput
            exit 1
          }
          Write-Host "mssql-config.yaml validated successfully."
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    restart_nrdot:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-restart_nrdot.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          net stop nrdot-collector
          net start nrdot-collector
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    assert_nrdot_status_ok:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-assert_nrdot_status_ok.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $maxRetries = 30
          $tries = 0
          Write-Host "Waiting for NRDOT Collector to start..."
          $started = $false
          while ($tries -lt $maxRetries) {
            $tries++
            $service = Get-Service -Name "nrdot-collector" -ErrorAction SilentlyContinue
            if ($service -and $service.Status -eq "Running") {
              Write-Host "NRDOT Collector is running."
              $started = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $started) {
            Write-Host -ForegroundColor Red "NRDOT Collector did not start in time. Install log:"
            Get-Content "$env:TEMP\nrdot_install.log" -ErrorAction SilentlyContinue | Select-Object -Last 50
            exit 31
          }

          $instancesJsonPath = "$env:TEMP\nr-mssql-instances.json"
          $skipJsonPath = "$env:TEMP\nr-mssql-skip.json"
          $instances = [array](Get-Content $instancesJsonPath -Raw | ConvertFrom-Json)
          $skip = @{}
          (Get-Content $skipJsonPath | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $skip[$_.Name] = $_.Value }

          Write-Host ""
          Write-Host "==> MSSQL instance summary:"
          Write-Host ""
          for ($i = 0; $i -lt $instances.Count; $i++) {
            $idx = $i + 1
            $inst = $instances[$i]
            if ($skip.ContainsKey("$idx")) {
              Write-Host "  [SKIP] $idx`: $($inst.host):$($inst.port) - $($skip["$idx"])"
            } else {
              Write-Host "  [OK]   $idx`: $($inst.host):$($inst.port)"
            }
          }

          Remove-Item $instancesJsonPath, $skipJsonPath -ErrorAction SilentlyContinue
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    default:
      cmds:
        - task: write_recipe_metadata
        - task: assert_pre_req
        - task: parse_instances
        - task: assert_sql_server_version
        - task: install_nrdot
        - task: configure_database_user
        - task: create_collector_config
        - task: configure_service
        - task: restart_nrdot
        - task: assert_nrdot_status_ok

postInstall:
  info: |2
      MSSQL OTel config: C:\Program Files\nrdot-collector\mssql-config.yaml
      Service status:    Get-Service nrdot-collector
      Restart service:   net stop nrdot-collector; net start nrdot-collector
