# Visit our schema definition for additional information on this file format.
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition
# WORK IN PROGRESS - not for use.

name: nrdot-collector-mssql-winauth
displayName: NRDOT MSSQL Windows Auth (Windows)
description: New Relic install recipe for MSSQL monitoring via NRDOT Collector on Windows self-hosted environments (Windows Domain Authentication or gMSA), one or more instances
repository: https://github.com/newrelic/nrdot-collector-releases

installTargets:
  - type: host
    os: windows

keywords:
  - MSSQL
  - SQL Server
  - NRDOT
  - OpenTelemetry
  - OTel
  - Database
  - Windows

processMatch:
  - sqlservr

preInstall:
  discoveryMode:
    - targeted
  info: |
    To capture data from SQL Server, we need to authorize a monitoring identity
    (a Windows domain account or a gMSA account) on every SQL Server instance you
    list. The Windows account running this installation must be able to connect
    with Windows authentication, and hold the sysadmin role (or equivalent), on
    every instance.

    You will be asked for an instances file (YAML) listing every SQL Server instance
    to monitor, in the order you want them numbered (instance 1, 2, 3, ...). A single
    SQL Server is still one entry:

      instances:
        - host: sql01.contoso.com
          port: 1433
        - host: sql02.contoso.com
          port: 1433

    One Windows identity monitors every instance in the file, so it must be allowed
    on all of them:
      - Windows Domain Auth, same host: the Windows user running this install.
        List only instances on this machine; use "different host" for remote or
        clustered (failover) instances.
      - Windows Domain Auth, different host: one domain account and its password.
      - gMSA: one gMSA account (recommended for production - AD rotates its password).

    For a named instance, use host plus the instance's static TCP port (not
    host\INSTANCE).

    Any instance that fails its version check or permission setup is skipped (with a
    reason) and the rest are still configured. If no instance is left, the install
    stops before changing anything else.

inputVars:
  - name: NR_CLI_MSSQL_CONFIG_PRESET
    prompt: "NRDOT configuration - 1) Standard  2) Full-feature: "
    default: "1"
  - name: NR_CLI_MSSQL_AUTH_MODE
    prompt: "SQL Server authentication - 1) Windows Domain Auth  2) gMSA: "
    default: "1"
  - name: NR_CLI_MSSQL_WINAUTH_LOCATION
    prompt: "Collector location (Windows Domain Auth only) - 1) Same host as SQL Server  2) Different host: "
    default: "1"
  - name: NR_CLI_MSSQL_INSTANCES_FILE
    prompt: "Path to the MSSQL instances YAML file: "
  - name: NR_CLI_MSSQL_WIN_ACCOUNT
    prompt: "Domain account to grant permissions to, DOMAIN\\username (Windows Domain Auth, different host only; leave blank otherwise): "
    default: " "
  - name: NR_CLI_MSSQL_WIN_PASSWORD
    prompt: "Password for that domain account (Windows Domain Auth, different host only; leave blank otherwise): "
    secret: true
    default: " "
  - name: NR_CLI_MSSQL_GMSA_ACCOUNT
    prompt: "gMSA account, DOMAIN\\gMSAName$ (gMSA only; leave blank otherwise): "
    default: " "

validationNrql: "SELECT count(*) FROM Metric WHERE metricName LIKE 'sqlserver.%' AND instrumentation.provider = 'opentelemetry' SINCE 10 minutes ago"

successLinkConfig:
  type: EXPLORER

install:
  version: "3"
  silent: true

  tasks:
    write_recipe_metadata:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-write_recipe_metadata.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $metadata = '{"Metadata":{"CapturedCliOutput":"true"}}'
          try { $metadata | Set-Content {{.NR_CLI_OUTPUT}} } catch {}
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    assert_pre_req:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-assert_pre_req.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $currentPrincipal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          $isAdmin = $currentPrincipal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if (-not $isAdmin) {
            Write-Host -ForegroundColor Red "This newrelic install must be run in an Administrator PowerShell session."
            exit 131
          }

          $sqlcmdPath = Get-Command sqlcmd.exe -ErrorAction SilentlyContinue
          if (-not $sqlcmdPath) {
            Write-Host -ForegroundColor Red "sqlcmd is required to configure SQL Server monitoring. Install the sqlcmd utility (https://learn.microsoft.com/sql/tools/sqlcmd/sqlcmd-utility) and re-run this recipe."
            exit 16
          }
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    assert_auth_inputs:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-assert_auth_inputs.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $mode = "{{.NR_CLI_MSSQL_AUTH_MODE}}"

          switch ($mode) {
            "1" {
              $location = "{{.NR_CLI_MSSQL_WINAUTH_LOCATION}}"
              $winAccount = '{{.NR_CLI_MSSQL_WIN_ACCOUNT}}'
              $winPassword = '{{.NR_CLI_MSSQL_WIN_PASSWORD}}'
              if ($location -ne "1" -and $location -ne "2") {
                Write-Host -ForegroundColor Red "Error: NR_CLI_MSSQL_WINAUTH_LOCATION must be 1 (same host) or 2 (different host)."
                exit 1
              }
              if ($location -eq "2" -and ([string]::IsNullOrWhiteSpace($winAccount) -or [string]::IsNullOrWhiteSpace($winPassword))) {
                Write-Host -ForegroundColor Red "Error: A domain account (DOMAIN\username) and its password are both required when the collector runs on a different host."
                Write-Host -ForegroundColor Red "Please re-run the installation and provide valid credentials."
                exit 1
              }
            }
            "2" {
              $gmsaAccount = '{{.NR_CLI_MSSQL_GMSA_ACCOUNT}}'
              if ([string]::IsNullOrWhiteSpace($gmsaAccount) -or $gmsaAccount.Trim() -eq "") {
                Write-Host -ForegroundColor Red "Error: gMSA account is required for gMSA Auth."
                Write-Host -ForegroundColor Red "Please re-run the installation and provide a valid gMSA account."
                exit 1
              }
            }
            default {
              Write-Host -ForegroundColor Red "Error: NR_CLI_MSSQL_AUTH_MODE must be 1 or 2."
              exit 1
            }
          }
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    parse_instances:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-parse_instances.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $instancesFile = '{{.NR_CLI_MSSQL_INSTANCES_FILE}}'
          $instancesJsonPath = "$env:TEMP\nr-mssql-instances.json"
          $skipJsonPath = "$env:TEMP\nr-mssql-skip.json"
          $warnJsonPath = "$env:TEMP\nr-mssql-warn.json"

          Remove-Item $instancesJsonPath, $skipJsonPath, $warnJsonPath -ErrorAction SilentlyContinue

          if ([string]::IsNullOrWhiteSpace($instancesFile) -or -not (Test-Path $instancesFile)) {
            Write-Host -ForegroundColor Red "Instances file not found: $instancesFile"
            exit 131
          }

          # Parses the fixed 2-key-per-item shape documented in preInstall.info
          # (host, port) - not a general-purpose YAML parser.
          function Get-Value($raw) { (($raw -replace '\s+#.*$', '').Trim()).Trim('"').Trim("'") }

          $instances = @()
          $current = $null
          foreach ($line in (Get-Content $instancesFile)) {
            if ($line -match '^\s*-\s*host:(.*)$') {
              if ($current) { $instances += [PSCustomObject]$current }
              $current = @{ host = (Get-Value $matches[1]); port = $null }
            } elseif ($current -and $line -match '^\s*port:(.*)$') {
              $current.port = Get-Value $matches[1]
            }
          }
          if ($current) { $instances += [PSCustomObject]$current }

          if ($instances.Count -eq 0) {
            Write-Host -ForegroundColor Red "No instances found in $instancesFile"
            exit 131
          }
          Write-Host "Found $($instances.Count) MSSQL instance(s) in $instancesFile"

          # host is embedded in the collector datasource string and sqlcmd -S.
          $skip = @{}
          $seen = @{}
          for ($i = 0; $i -lt $instances.Count; $i++) {
            $idx = $i + 1
            $inst = $instances[$i]
            $portNum = 0
            if ([string]::IsNullOrWhiteSpace($inst.host) -or $inst.host -match '[;''"\s]') {
              $skip["$idx"] = "invalid host '$($inst.host)'"
            } elseif (-not [int]::TryParse("$($inst.port)", [ref]$portNum) -or $portNum -lt 1 -or $portNum -gt 65535) {
              $skip["$idx"] = "invalid port '$($inst.port)'"
            } else {
              $key = "$($inst.host.ToLowerInvariant()):$portNum"
              if ($seen.ContainsKey($key)) {
                $skip["$idx"] = "duplicate of instance $($seen[$key])"
              } else {
                $seen[$key] = $idx
                $inst.port = "$portNum"
              }
            }
            if ($skip.ContainsKey("$idx")) {
              Write-Host -ForegroundColor Yellow "Instance $idx ($($inst.host):$($inst.port)) SKIPPED: $($skip["$idx"])"
            }
          }

          ConvertTo-Json -InputObject @($instances) -Depth 5 | Set-Content -Path $instancesJsonPath
          $skip | ConvertTo-Json | Set-Content -Path $skipJsonPath
          @{} | ConvertTo-Json | Set-Content -Path $warnJsonPath
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    assert_sql_server_version:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-assert_sql_server_version.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $instancesJsonPath = "$env:TEMP\nr-mssql-instances.json"
          $skipJsonPath = "$env:TEMP\nr-mssql-skip.json"
          $warnJsonPath = "$env:TEMP\nr-mssql-warn.json"

          $instances = [array](Get-Content $instancesJsonPath -Raw | ConvertFrom-Json)
          $skip = @{}
          (Get-Content $skipJsonPath -Raw | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $skip[$_.Name] = $_.Value }
          $warn = @{}
          (Get-Content $warnJsonPath -Raw | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $warn[$_.Name] = $_.Value }

          function Write-InstanceSummary {
            Write-Host ""
            Write-Host "==> MSSQL instance summary:"
            Write-Host ""
            for ($i = 0; $i -lt $instances.Count; $i++) {
              $idx = $i + 1
              $inst = $instances[$i]
              if ($skip.ContainsKey("$idx")) {
                Write-Host "  [SKIP] $idx`: $($inst.host):$($inst.port) - $($skip["$idx"])"
              } elseif ($warn.ContainsKey("$idx")) {
                Write-Host "  [OK]   $idx`: $($inst.host):$($inst.port) - warning: $($warn["$idx"])"
              } else {
                Write-Host "  [OK]   $idx`: $($inst.host):$($inst.port)"
              }
            }
            Write-Host ""
          }

          for ($i = 0; $i -lt $instances.Count; $i++) {
            $idx = $i + 1
            if ($skip.ContainsKey("$idx")) { continue }
            $inst = $instances[$i]

            $query = "SET NOCOUNT ON; SELECT SERVERPROPERTY('ProductMajorVersion');"
            $result = & sqlcmd -S "$($inst.host),$($inst.port)" -E -C -b -h -1 -Q $query 2>&1
            if ($LASTEXITCODE -ne 0) {
              $skip["$idx"] = "failed to connect / check version - $($result -join ' ')"
              Write-Host -ForegroundColor Yellow "Instance $idx ($($inst.host):$($inst.port)) SKIPPED: failed to connect to check its version"
              continue
            }

            $majorVersionLine = ($result | Where-Object { $_ -match '^\s*\d+\s*$' } | Select-Object -First 1)
            $majorVersion = if ($majorVersionLine) { [int]$majorVersionLine.Trim() } else { $null }

            if (-not $majorVersion -or $majorVersion -lt 14) {
              $skip["$idx"] = "unsupported SQL Server version $majorVersion (2017 / major version 14+ required)"
              Write-Host -ForegroundColor Yellow "Instance $idx ($($inst.host):$($inst.port)) SKIPPED: unsupported SQL Server version $majorVersion"
              continue
            }

            Write-Host "Instance $idx ($($inst.host):$($inst.port)): SQL Server major version $majorVersion detected - supported."
          }

          $skip | ConvertTo-Json | Set-Content -Path $skipJsonPath

          $remaining = @(1..$instances.Count | Where-Object { -not $skip.ContainsKey("$_") })
          if ($remaining.Count -eq 0) {
            Write-InstanceSummary
            Write-Host -ForegroundColor Red "No MSSQL instance passed its checks - nothing to monitor. Aborting install."
            Remove-Item $instancesJsonPath, $skipJsonPath, $warnJsonPath -ErrorAction SilentlyContinue
            exit 1
          }
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    install_nrdot:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-install_nrdot.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          [Net.ServicePointManager]::SecurityProtocol = "tls12, tls"

          $CollectorService = "nrdot-collector"

          $LatestVersion = (Invoke-RestMethod -Uri "https://api.github.com/repos/newrelic/nrdot-collector-releases/releases/latest").tag_name
          if (-not $LatestVersion) {
            Write-Host -ForegroundColor Red "Failed to fetch the latest release version from GitHub. Please check your internet connection."
            exit 1
          }

          $ExistingService = Get-Service -Name $CollectorService -ErrorAction SilentlyContinue

          if ($ExistingService) {
            Write-Host -ForegroundColor Yellow "NRDOT Collector is already installed."
            Write-Host ""
            Write-Host "Please follow the steps below to complete the setup:"
            Write-Host ""
            Write-Host "  1. Create mssql-config.yaml"
            Write-Host "     if not present. Refer to:"
            Write-Host "     https://docs.newrelic.com/docs/opentelemetry/database/mssql/windows-hosted/"
            Write-Host ""
            Write-Host "  2. Make sure the monitoring identity is created"
            Write-Host "     and has the required permissions granted."
            Write-Host ""
            Write-Host "  3. After making the above changes, restart the NRDOT Collector:"
            Write-Host "     net stop nrdot-collector; net start nrdot-collector"
            Write-Host ""
            exit 131
          }

          Write-Host "Installing nrdot-collector version: $LatestVersion"

          $MsiPath = "$env:TEMP\nrdot-collector.msi"
          $LogPath = "$env:TEMP\nrdot_install.log"
          $DownloadUrl = "https://github.com/newrelic/nrdot-collector-releases/releases/download/$LatestVersion/nrdot-collector_${LatestVersion}_windows_x64.msi"
          Write-Host "Downloading from: $DownloadUrl"

          $WebClient = New-Object System.Net.WebClient
          $WebClient.Headers.Add("User-Agent", "Mozilla/5.0")
          if ($env:HTTPS_PROXY) {
            $WebClient.Proxy = New-Object System.Net.WebProxy($env:HTTPS_PROXY, $true)
          }
          try {
            $WebClient.DownloadFile($DownloadUrl, $MsiPath)
          } catch {
            Write-Host -ForegroundColor Red "Failed to download the nrdot-collector package: $_"
            exit 1
          }

          $Process = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$MsiPath`" /qn /norestart /L*V `"$LogPath`"" -Wait -NoNewWindow -PassThru
          if ($Process.ExitCode -ne 0) {
            Write-Host -ForegroundColor Red "msiexec failed with exit code $($Process.ExitCode). See $LogPath for details."
            exit $Process.ExitCode
          }

          Remove-Item -Path $MsiPath -ErrorAction SilentlyContinue

          $Service = Get-Service -Name $CollectorService -ErrorAction SilentlyContinue
          if (-not $Service) {
            Write-Host -ForegroundColor Red "nrdot-collector service was not found after installation."
            exit 1
          }

          Write-Host "nrdot-collector installed successfully."
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    configure_database_user:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-configure_database_user.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $mode = "{{.NR_CLI_MSSQL_AUTH_MODE}}"
          $location = "{{.NR_CLI_MSSQL_WINAUTH_LOCATION}}"
          $instancesJsonPath = "$env:TEMP\nr-mssql-instances.json"
          $skipJsonPath = "$env:TEMP\nr-mssql-skip.json"
          $warnJsonPath = "$env:TEMP\nr-mssql-warn.json"

          $instances = [array](Get-Content $instancesJsonPath -Raw | ConvertFrom-Json)
          $skip = @{}
          (Get-Content $skipJsonPath -Raw | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $skip[$_.Name] = $_.Value }
          $warn = @{}
          (Get-Content $warnJsonPath -Raw | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $warn[$_.Name] = $_.Value }

          function Write-InstanceSummary {
            Write-Host ""
            Write-Host "==> MSSQL instance summary:"
            Write-Host ""
            for ($i = 0; $i -lt $instances.Count; $i++) {
              $idx = $i + 1
              $inst = $instances[$i]
              if ($skip.ContainsKey("$idx")) {
                Write-Host "  [SKIP] $idx`: $($inst.host):$($inst.port) - $($skip["$idx"])"
              } elseif ($warn.ContainsKey("$idx")) {
                Write-Host "  [OK]   $idx`: $($inst.host):$($inst.port) - warning: $($warn["$idx"])"
              } else {
                Write-Host "  [OK]   $idx`: $($inst.host):$($inst.port)"
              }
            }
            Write-Host ""
          }

          function Protect-TempFile($path) {
            icacls $path /inheritance:r /grant:r "SYSTEM:(F)" "BUILTIN\Administrators:(F)" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host -ForegroundColor Red "Failed to restrict permissions on $path."
              exit 1
            }
          }

          $permissionCheckSql = @'
          SET NOCOUNT ON;
          DECLARE @TargetUser SYSNAME = '<ACCOUNT_USERNAME>';

          DECLARE @Checklist TABLE (Scope NVARCHAR(50), [Database] SYSNAME, [Permission] NVARCHAR(128));

          INSERT INTO @Checklist VALUES
          ('Server', 'ALL', 'VIEW SERVER STATE'),
          ('Server', 'ALL', 'VIEW ANY DEFINITION'),
          ('Server', 'ALL', 'VIEW ANY DATABASE');

          INSERT INTO @Checklist
          SELECT 'Database Role', [name], 'db_datareader' FROM sys.databases WHERE [name] NOT IN ('master', 'msdb', 'model', 'rdsadmin', 'distribution') AND [state] = 0
          UNION ALL
          SELECT 'Database Explicit', [name], 'VIEW DATABASE STATE' FROM sys.databases WHERE [name] NOT IN ('master', 'msdb', 'model', 'rdsadmin', 'distribution') AND [state] = 0
          UNION ALL
          SELECT 'Database Explicit', [name], 'VIEW DEFINITION' FROM sys.databases WHERE [name] NOT IN ('master', 'msdb', 'model', 'rdsadmin', 'distribution') AND [state] = 0;

          WITH ExplicitPerms AS (
              SELECT 'Server' AS Scope, CAST('ALL' AS NVARCHAR(128)) COLLATE DATABASE_DEFAULT AS [Database], p.permission_name COLLATE DATABASE_DEFAULT AS [Permission]
              FROM sys.server_permissions p JOIN sys.server_principals l ON p.grantee_principal_id = l.principal_id WHERE l.name = @TargetUser
              UNION ALL
              SELECT 'Database Role', d.name COLLATE DATABASE_DEFAULT, r.name COLLATE DATABASE_DEFAULT
              FROM sys.databases d CROSS APPLY (SELECT dp_role.name FROM sys.database_role_members drm JOIN sys.database_principals dp_role ON drm.role_principal_id = dp_role.principal_id JOIN sys.database_principals dp_user ON drm.member_principal_id = dp_user.principal_id JOIN sys.server_principals sp ON dp_user.sid = sp.sid WHERE sp.name = @TargetUser) r WHERE d.state = 0
              UNION ALL
              SELECT 'Database Explicit', d.name COLLATE DATABASE_DEFAULT, p.permission_name COLLATE DATABASE_DEFAULT
              FROM sys.databases d CROSS APPLY (SELECT db_p.permission_name FROM sys.database_permissions db_p JOIN sys.database_principals dp_user ON db_p.grantee_principal_id = dp_user.principal_id JOIN sys.server_principals sp ON dp_user.sid = sp.sid WHERE sp.name = @TargetUser) p WHERE d.state = 0
          )
          SELECT
              chk.Scope,
              chk.[Database],
              chk.[Permission] AS [Required Permission],
              CASE
                  WHEN exp.[Permission] IS NOT NULL THEN 'GRANTED'
                  WHEN IS_SRVROLEMEMBER('sysadmin', @TargetUser) = 1 THEN 'PASSED (via SysAdmin Role)'
                  ELSE 'MISSING'
              END AS [Verification Status]
          FROM @Checklist chk
          LEFT JOIN ExplicitPerms exp ON chk.Scope = exp.Scope AND chk.[Database] = exp.[Database] AND chk.[Permission] = exp.[Permission]
          ORDER BY chk.Scope, chk.[Database], chk.[Permission];
          '@

          function Invoke-PermissionCheck($target, $account, $idx) {
            $checkFile = "$env:TEMP\nr-mssql-permission-check-$idx.sql"
            $permissionCheckSql.Replace('<ACCOUNT_USERNAME>', $account) | Set-Content -Path $checkFile
            Protect-TempFile $checkFile
            $output = & sqlcmd -S $target -E -C -b -W -s " | " -i $checkFile 2>&1
            $checkExit = $LASTEXITCODE
            Remove-Item -Path $checkFile -ErrorAction SilentlyContinue
            Write-Host ($output | Out-String)
            return [PSCustomObject]@{ ExitCode = $checkExit; Output = $output }
          }

          function Get-GrantSql($account) {
            if ($mode -eq "1" -and $location -eq "1") {
              $sql = "USE [master];`nGO`nGRANT VIEW SERVER STATE TO [$account];`nGRANT VIEW ANY DEFINITION TO [$account];`nGRANT VIEW ANY DATABASE TO [$account];`nGO`nDECLARE @name SYSNAME;`nDECLARE @sql NVARCHAR(MAX);`nDECLARE db_cursor CURSOR READ_ONLY FORWARD_ONLY FOR`nSELECT [name]`nFROM [master].[sys].[databases]`nWHERE [name] NOT IN ('master', 'msdb', 'model', 'rdsadmin', 'distribution')`n  AND [state] = 0;`nOPEN db_cursor;`nFETCH NEXT FROM db_cursor INTO @name;`nWHILE @@FETCH_STATUS = 0`nBEGIN`n  BEGIN TRY`n    PRINT 'Granting permissions on database: ' + @name;`n    SET @sql = '`n      USE [' + @name + '];`n      IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = ''$account'')`n      BEGIN`n        CREATE USER [$account] FOR LOGIN [$account];`n      END;`n      GRANT VIEW DATABASE STATE TO [$account];`n      GRANT VIEW DEFINITION TO [$account];`n      ALTER ROLE db_datareader ADD MEMBER [$account];';`n    EXEC sp_executesql @sql;`n    PRINT 'Success: ' + @name;`n  END TRY`n  BEGIN CATCH`n    PRINT 'Error on ' + @name + ': ' + ERROR_MESSAGE();`n  END CATCH`n  FETCH NEXT FROM db_cursor INTO @name;`nEND`nCLOSE db_cursor;`nDEALLOCATE db_cursor;`nGO"
            } elseif ($mode -eq "1") {
              $sql = "USE [master];`nGO`nIF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = '$account')`n  CREATE LOGIN [$account] FROM WINDOWS;`nGO`nGRANT VIEW ANY DATABASE TO [$account];`nGRANT VIEW SERVER STATE TO [$account];`nGRANT VIEW ANY DEFINITION TO [$account];`nGO`nDECLARE @name SYSNAME;`nDECLARE db_cursor CURSOR READ_ONLY FORWARD_ONLY FOR`n  SELECT [name] FROM [master].[sys].[databases]`n  WHERE [name] NOT IN ('master','msdb','model','rdsadmin','distribution')`n    AND [state] = 0;`nOPEN db_cursor;`nFETCH NEXT FROM db_cursor INTO @name;`nWHILE @@FETCH_STATUS = 0`nBEGIN`n  BEGIN TRY`n    EXEC('USE [' + @name + '];`n    IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = ''$account'')`n    BEGIN`n      CREATE USER [$account] FOR LOGIN [$account];`n    END;`n    GRANT VIEW DATABASE STATE TO [$account];');`n  END TRY`n  BEGIN CATCH`n    PRINT 'Error on ' + @name + ': ' + ERROR_MESSAGE();`n  END CATCH`n  FETCH NEXT FROM db_cursor INTO @name;`nEND`nCLOSE db_cursor;`nDEALLOCATE db_cursor;`nGO"
            } else {
              $gmsa = $account
              $sql = "USE master;`nGO`nIF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = '$gmsa')`n  CREATE LOGIN [$gmsa] FROM WINDOWS;`nGO`nGRANT VIEW SERVER STATE TO [$gmsa];`nGRANT VIEW ANY DEFINITION TO [$gmsa];`nGRANT VIEW ANY DATABASE TO [$gmsa];`nGO`nDECLARE @name SYSNAME;`nDECLARE db_cursor CURSOR READ_ONLY FORWARD_ONLY FOR`nSELECT [name] FROM [master].[sys].[databases]`nWHERE [name] NOT IN ('master','msdb','model','rdsadmin','distribution')`nAND [state] = 0;`nOPEN db_cursor;`nFETCH NEXT FROM db_cursor INTO @name;`nWHILE @@FETCH_STATUS = 0`nBEGIN`n  BEGIN TRY`n    EXEC('USE [' + @name + '];`n    IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = ''$gmsa'')`n    BEGIN`n      CREATE USER [$gmsa] FOR LOGIN [$gmsa];`n    END;`n    GRANT VIEW DATABASE STATE TO [$gmsa];');`n  END TRY`n  BEGIN CATCH`n    PRINT 'Error on ' + @name + ': ' + ERROR_MESSAGE();`n  END CATCH`n  FETCH NEXT FROM db_cursor INTO @name;`nEND`nCLOSE db_cursor;`nDEALLOCATE db_cursor;`nGO"
            }
            return $sql
          }

          for ($i = 0; $i -lt $instances.Count; $i++) {
            $idx = $i + 1
            if ($skip.ContainsKey("$idx")) { continue }
            $inst = $instances[$i]
            $target = "$($inst.host),$($inst.port)"
            $label = "Instance $idx ($($inst.host):$($inst.port))"

            if ($mode -eq "1" -and $location -eq "1") {
              $userOutput = & sqlcmd -S $target -E -C -b -h -1 -W -Q "SET NOCOUNT ON; SELECT SYSTEM_USER;" 2>&1
              $userExit = $LASTEXITCODE
              $account = $userOutput | Where-Object { $_.ToString().Trim() } | Select-Object -First 1
              if ($userExit -ne 0 -or -not $account) {
                $skip["$idx"] = "failed to get Windows user (SELECT SYSTEM_USER) - $($userOutput -join ' ')"
                Write-Host -ForegroundColor Yellow "$label SKIPPED: failed to get the Windows user with SELECT SYSTEM_USER"
                continue
              }
              $account = $account.ToString().Trim()
              Write-Host "${label}: Windows user (SELECT SYSTEM_USER): $account"

              Write-Host "${label}: verifying SQL Server monitoring permissions for $account..."
              $check = Invoke-PermissionCheck $target $account $idx
              if ($check.ExitCode -ne 0) {
                $skip["$idx"] = "permission check failed - $($check.Output -join ' ')"
                Write-Host -ForegroundColor Yellow "$label SKIPPED: permission check failed"
                continue
              }
              if (-not ($check.Output -match '\|\s*MISSING\s*$')) {
                Write-Host "${label}: all required permissions are already granted to $account."
                continue
              }
              Write-Host "${label}: granting missing SQL Server monitoring permissions to $account..."
            } elseif ($mode -eq "1") {
              $account = '{{.NR_CLI_MSSQL_WIN_ACCOUNT}}'
              Write-Host "${label}: granting SQL Server monitoring permissions to the domain account: $account"
            } else {
              $account = '{{.NR_CLI_MSSQL_GMSA_ACCOUNT}}'
              Write-Host "${label}: granting SQL Server monitoring permissions to the gMSA account: $account"
            }

            $sqlFile = "$env:TEMP\nr-mssql-grant-$idx.sql"
            Get-GrantSql $account | Set-Content -Path $sqlFile
            Protect-TempFile $sqlFile
            $result = & sqlcmd -S $target -E -C -b -i $sqlFile 2>&1
            $sqlExit = $LASTEXITCODE
            Remove-Item -Path $sqlFile -ErrorAction SilentlyContinue

            if ($sqlExit -ne 0) {
              $reason = if ($mode -eq "1" -and $location -eq "1") { "grant script failed" } else { "monitoring identity setup failed" }
              $skip["$idx"] = "$reason - $($result -join ' ')"
              Write-Host -ForegroundColor Yellow "$label SKIPPED: $reason"
              continue
            }
            Write-Host ($result | Out-String)

            if ($mode -eq "1" -and $location -eq "1") {
              Write-Host "${label}: re-verifying SQL Server monitoring permissions for $account..."
              $check = Invoke-PermissionCheck $target $account $idx
              if ($check.ExitCode -ne 0 -or ($check.Output -match '\|\s*MISSING\s*$')) {
                $warn["$idx"] = "some permissions still MISSING (see permission check above)"
                Write-Host -ForegroundColor Yellow "${label}: some permissions are still MISSING for $account (see the table above). Monitoring for those databases may be incomplete."
              }
            }
            Write-Host "${label}: SQL Server monitoring identity configured successfully: $account"
          }

          $skip | ConvertTo-Json | Set-Content -Path $skipJsonPath
          $warn | ConvertTo-Json | Set-Content -Path $warnJsonPath

          $remaining = @(1..$instances.Count | Where-Object { -not $skip.ContainsKey("$_") })
          if ($remaining.Count -eq 0) {
            Write-InstanceSummary
            Write-Host -ForegroundColor Red "No MSSQL instance passed its checks - nothing to monitor. Aborting install."
            Remove-Item $instancesJsonPath, $skipJsonPath, $warnJsonPath -ErrorAction SilentlyContinue
            exit 1
          }
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    configure_service_identity:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-configure_service_identity.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $mode = "{{.NR_CLI_MSSQL_AUTH_MODE}}"
          $service = "nrdot-collector"

          if ($mode -eq "1" -and "{{.NR_CLI_MSSQL_WINAUTH_LOCATION}}" -eq "1") {
            Write-Host "Collector is on the same host as SQL Server - the nrdot-collector service logon account is not changed."
            exit 0
          }

          Stop-Service -Name $service -Force -ErrorAction SilentlyContinue

          if ($mode -eq "1") {
            $account = '{{.NR_CLI_MSSQL_WIN_ACCOUNT}}'
            $password = '{{.NR_CLI_MSSQL_WIN_PASSWORD}}'
            & sc.exe config "$service" obj= "$account" password= "$password"
          } else {
            $account = '{{.NR_CLI_MSSQL_GMSA_ACCOUNT}}'
            & sc.exe config "$service" obj= "$account"
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host -ForegroundColor Red "Failed to configure the nrdot-collector service to run as $account."
            exit 1
          }

          $svcInfo = Get-WmiObject Win32_Service -Filter "Name='$service'"
          Write-Host "nrdot-collector service logon account set to: $($svcInfo.StartName)"

          Start-Service -Name $service
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    create_collector_config:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-create_collector_config.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $mode = "{{.NR_CLI_MSSQL_AUTH_MODE}}"
          $preset = "{{.NR_CLI_MSSQL_CONFIG_PRESET}}"
          $region = "{{.NEW_RELIC_REGION}}"
          $licenseKey = "{{.NEW_RELIC_LICENSE_KEY}}"
          $configDir = "C:\Program Files\nrdot-collector"
          $configPath = "$configDir\mssql-config.yaml"
          $instancesJsonPath = "$env:TEMP\nr-mssql-instances.json"
          $skipJsonPath = "$env:TEMP\nr-mssql-skip.json"

          New-Item -Path $configDir -ItemType Directory -Force | Out-Null

          $instances = [array](Get-Content $instancesJsonPath -Raw | ConvertFrom-Json)
          $skip = @{}
          (Get-Content $skipJsonPath -Raw | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $skip[$_.Name] = $_.Value }
          $survivors = @(1..$instances.Count | Where-Object { -not $skip.ContainsKey("$_") })

          $interval = if ($preset -eq "2") { "30s" } else { "15s" }

          function Get-Datasource($inst) { "server=$($inst.host);port=$($inst.port);integrated security=true;encrypt=true;TrustServerCertificate=true;" }
          function Get-ReceiverFields($inst) { "    collection_interval: $interval`n    datasource: `"$(Get-Datasource $inst)`"" }

          switch ($region) {
            "staging" { $otlpEndpoint = "https://staging-otlp.nr-data.net" }
            "EU"      { $otlpEndpoint = "https://otlp.eu01.nr-data.net" }
            "JP"      { $otlpEndpoint = "https://otlp.jp.nr-data.net" }
            default   { $otlpEndpoint = "https://otlp.nr-data.net" }
          }

          if ($preset -eq "2") {
            $template = @'
          extensions:
            health_check:

          receivers:
            otlp:
              protocols:
                grpc:
                http:

            host_metrics:
              collection_interval: 30s
              scrapers:
                cpu:
                  metrics:
                    system.cpu.time:
                      enabled: false
                    system.cpu.utilization:
                      enabled: true
                load:
                memory:
                  metrics:
                    system.memory.utilization:
                      enabled: true
                paging:
                  metrics:
                    system.paging.utilization:
                      enabled: false
                    system.paging.faults:
                      enabled: false
                disk:
                  metrics:
                    system.disk.merged:
                      enabled: false
                    system.disk.pending_operations:
                      enabled: false
                    system.disk.weighted_io_time:
                      enabled: false
                network:
                  metrics:
                    system.network.connections:
                      enabled: false
                processes:
                process:
                  mute_process_name_error: true
                  mute_process_exe_error: true
                  mute_process_user_error: true
                  mute_process_io_error: true
                  metrics:
                    process.cpu.utilization:
                      enabled: true
                    process.memory.utilization:
                      enabled: true

            nrsqlserver:
          __RECEIVER_FIELDS__
              metrics:
                sqlserver.database.count:
                  enabled: true
                sqlserver.database.file.size:
                  enabled: true
                sqlserver.database.io:
                  enabled: true
                sqlserver.database.latency:
                  enabled: true
                sqlserver.database.operations:
                  enabled: true
                sqlserver.database.transactions.active:
                  enabled: true
                sqlserver.database.backup_or_restore.rate:
                  enabled: true
                sqlserver.database.execution.errors:
                  enabled: true
                sqlserver.database.full_scan.rate:
                  enabled: true
                sqlserver.database.tempdb.space:
                  enabled: true
                sqlserver.database.tempdb.version_store.size:
                  enabled: true
                sqlserver.lock.timeout.rate:
                  enabled: true
                sqlserver.lock.wait.count:
                  enabled: true
                sqlserver.deadlock.rate:
                  enabled: true
                sqlserver.transaction.delay:
                  enabled: true
                sqlserver.transaction.longest_running_time:
                  enabled: true
                sqlserver.transaction.version_cleanup.rate:
                  enabled: true
                sqlserver.transaction.version_generation.rate:
                  enabled: true
                sqlserver.memory.area:
                  enabled: true
                sqlserver.memory.cache.object.count:
                  enabled: true
                sqlserver.memory.grants.pending.count:
                  enabled: true
                sqlserver.memory.page.count:
                  enabled: true
                sqlserver.memory.usage:
                  enabled: true
                sqlserver.os.memory.usage:
                  enabled: true
                sqlserver.os.memory.utilization:
                  enabled: true
                sqlserver.os.scheduler.runnable_tasks.count:
                  enabled: true
                sqlserver.os.wait.duration:
                  enabled: true
                sqlserver.os.wait.tasks.count:
                  enabled: true
                sqlserver.page.buffer_cache.free_list.stalls.rate:
                  enabled: true
                sqlserver.page.lookup.rate:
                  enabled: true
                sqlserver.batch.compilation.utilization:
                  enabled: true
                sqlserver.batch.page_split.utilization:
                  enabled: true
                sqlserver.recompilation.ratio:
                  enabled: true
                sqlserver.parameterization.rate:
                  enabled: true
                sqlserver.plan.execution.rate:
                  enabled: true
                sqlserver.attention.rate:
                  enabled: true
                sqlserver.process.count:
                  enabled: true
                sqlserver.processes.blocked:
                  enabled: true
                sqlserver.login.rate:
                  enabled: true
                sqlserver.logout.rate:
                  enabled: true
                sqlserver.thread_pool.tasks.count:
                  enabled: true
                sqlserver.thread_pool.workers.count:
                  enabled: true
                sqlserver.thread_pool.workers.max:
                  enabled: true
                sqlserver.thread_pool.workers.utilization:
                  enabled: true
                sqlserver.tempdb.allocation.wait_time.total:
                  enabled: true
                sqlserver.tempdb.contention.waiters.count:
                  enabled: true
                sqlserver.tempdb.data_files.count:
                  enabled: true
                sqlserver.tempdb.file.size:
                  enabled: true
                sqlserver.tempdb.space.usage:
                  enabled: true
                sqlserver.latch.superlatch.count:
                  enabled: true
                sqlserver.latch.superlatch.transition.rate:
                  enabled: true
                sqlserver.latch.wait.rate:
                  enabled: true
                sqlserver.latch.wait_time.avg:
                  enabled: true
                sqlserver.latch.wait_time.total:
                  enabled: true
                sqlserver.index.search.rate:
                  enabled: true
                sqlserver.resource_pool.disk.operations:
                  enabled: true
                sqlserver.resource_pool.disk.throttled.read.rate:
                  enabled: true
                sqlserver.resource_pool.disk.throttled.write.rate:
                  enabled: true
                sqlserver.replica.data.rate:
                  enabled: true
                sqlserver.failover_cluster.ag.cluster_type:
                  enabled: true
                sqlserver.failover_cluster.ag.failure_condition_level:
                  enabled: true
                sqlserver.failover_cluster.ag.health_check_timeout:
                  enabled: true
                sqlserver.failover_cluster.ag.required_sync_secondaries:
                  enabled: true
                sqlserver.failover_cluster.replica.database.queue_size:
                  enabled: true
                sqlserver.failover_cluster.replica.database.redo.rate:
                  enabled: true
                sqlserver.failover_cluster.replica.flow_control_time:
                  enabled: true
                sqlserver.failover_cluster.replica.role:
                  enabled: true
                sqlserver.failover_cluster.replica.synchronization_health:
                  enabled: true
                sqlserver.computer.uptime:
                  enabled: true
                sqlserver.cpu.count:
                  enabled: true
                sqlserver.table.count:
                  enabled: true

              events:
                db.server.query_sample:
                  enabled: true
                db.server.top_query:
                  enabled: true

              top_query_collection:
                lookback_time: 60s
                max_query_sample_count: 500
                top_query_count: 200
                collection_interval: 60s

              collect_full_query_text: true
              allowed_comment_keys:
                - nr_service_guid

              query_sample_collection:
                max_rows_per_query: 100

          processors:
            metrics_transform:
              transforms:
                - include: system.cpu.utilization
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [state]
                      aggregation_type: mean
                - include: system.paging.operations
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [direction]
                      aggregation_type: sum

            filter/exclude_cpu_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "interrupt"'
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "nice"'
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "softirq"'

            filter/exclude_memory_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_unreclaimable"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "inactive"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "cached"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "buffered"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_reclaimable"'

            filter/exclude_memory_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "slab_unreclaimable"'
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "inactive"'

            filter/exclude_filesystem_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.utilization" and attributes["type"] == "squashfs"'

            filter/exclude_filesystem_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.usage" and attributes["type"] == "squashfs"'
                  - 'metric.name == "system.filesystem.usage" and attributes["state"] == "reserved"'

            filter/exclude_filesystem_inodes_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.inodes.usage" and attributes["type"] == "squashfs"'
                  - 'metric.name == "system.filesystem.inodes.usage" and attributes["state"] == "reserved"'

            filter/exclude_system_disk:
              metrics:
                datapoint:
                  - 'metric.name == "system.disk.operations" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.merged" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.io" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.io_time" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.operation_time" and IsMatch(attributes["device"], "^loop.*") == true'

            filter/exclude_system_paging:
              metrics:
                datapoint:
                  - 'metric.name == "system.paging.usage" and attributes["state"] == "cached"'
                  - 'metric.name == "system.paging.operations" and attributes["type"] == "cached"'

            filter/exclude_network:
              metrics:
                datapoint:
                  - 'IsMatch(metric.name, "^system.network.*") == true and attributes["device"] == "lo"'

            attributes/exclude_system_paging:
              include:
                match_type: strict
                metric_names:
                  - system.paging.operations
              actions:
                - key: type
                  action: delete

            cumulativetodelta:

            transform/host:
              metric_statements:
                - context: metric
                  statements:
                    - set(metric.description, "")
                    - set(metric.unit, "")

            batch:

            resource_detection:
              detectors: ["system"]
              system:
                hostname_sources: ["os"]
                resource_attributes:
                  host.id:
                    enabled: true

            resource_detection/cloud:
              detectors: ["gcp", "ec2", "azure"]
              timeout: 2s
              override: true

            resource_detection/env:
              detectors: ["env"]
              timeout: 2s
              override: true

          exporters:
            otlphttp:
              endpoint: __OTLP_ENDPOINT__
              headers:
                api-key: __LICENSE_KEY__
              tls:
                insecure: false
              compression: gzip

          service:
            telemetry:
              metrics:
                level: none

            extensions: [health_check]

            pipelines:
              metrics/host:
                receivers: [host_metrics, nrsqlserver]
                processors:
                  - metrics_transform
                  - filter/exclude_cpu_utilization
                  - filter/exclude_memory_utilization
                  - filter/exclude_memory_usage
                  - filter/exclude_filesystem_utilization
                  - filter/exclude_filesystem_usage
                  - filter/exclude_filesystem_inodes_usage
                  - filter/exclude_system_disk
                  - filter/exclude_network
                  - attributes/exclude_system_paging
                  - transform/host
                  - resource_detection
                  - resource_detection/cloud
                  - resource_detection/env
                  - cumulativetodelta
                  - batch
                exporters: [otlphttp]

              logs/host:
                receivers: [nrsqlserver]
                processors:
                  - resource_detection
                  - resource_detection/cloud
                  - resource_detection/env
                  - batch
                exporters: [otlphttp]

              traces:
                receivers: [otlp]
                processors: [resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlphttp]

              metrics:
                receivers: [otlp]
                processors: [resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlphttp]

              logs:
                receivers: [otlp]
                processors: [resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlphttp]
          '@
          } else {
            $template = @'
          receivers:
            nrsqlserver:
          __RECEIVER_FIELDS__
              metrics:
                sqlserver.database.count:
                  enabled: true
                sqlserver.database.io:
                  enabled: true
                sqlserver.database.latency:
                  enabled: true
                sqlserver.database.operations:
                  enabled: true
                sqlserver.database.tempdb.space:
                  enabled: true
                sqlserver.database.tempdb.version_store.size:
                  enabled: true
                sqlserver.deadlock.rate:
                  enabled: true
                sqlserver.os.wait.duration:
                  enabled: true
                sqlserver.processes.blocked:
                  enabled: true
                sqlserver.memory.grants.pending.count:
                  enabled: true
                sqlserver.database.file.size:
                  enabled: true
                sqlserver.memory.area:
                  enabled: true

              events:
                db.server.query_sample:
                  enabled: true
                db.server.top_query:
                  enabled: true

              top_query_collection:
                lookback_time: 60s
                max_query_sample_count: 1000
                top_query_count: 250
                collection_interval: 60s

              collect_full_query_text: true
              allowed_comment_keys:
                - nr_service_guid

              query_sample_collection:
                max_rows_per_query: 100

          processors:
            memory_limiter:
              check_interval: ${env:NR_MEM_LIMITER_CHECK_INTERVAL:-1s}
              limit_mib:       ${env:NR_MEM_LIMITER_LIMIT_MIB:-200}
              spike_limit_mib: ${env:NR_MEM_LIMITER_SPIKE_MIB:-50}

            batch:

          exporters:
            otlphttp:
              endpoint: __OTLP_ENDPOINT__
              headers:
                api-key: __LICENSE_KEY__
              tls:
                insecure: false
              compression: gzip

          service:
            telemetry:
              metrics:
                level: none

            pipelines:
              metrics:
                receivers: [nrsqlserver]
                processors: [memory_limiter, batch]
                exporters: [otlphttp]

              logs:
                receivers: [nrsqlserver]
                processors: [memory_limiter, batch]
                exporters: [otlphttp]
          '@
          }

          if ($survivors.Count -eq 1) {
            $configText = $template.Replace('__RECEIVER_FIELDS__', (Get-ReceiverFields $instances[$survivors[0] - 1]))
          } else {
            # Split the single-instance template into receiver / processors / exporters / pipelines and rebuild each per instance.
            $template = $template -replace "`r`n", "`n"
            $head, $rest = $template -split [regex]::Escape("  nrsqlserver:`n__RECEIVER_FIELDS__`n"), 2
            $receiverBody, $rest = $rest -split "`nprocessors:`n", 2
            $processorsBody, $rest = $rest -split "`nexporters:`n", 2
            $exportersAndService, $oldPipelines = $rest -split "`n  pipelines:`n", 2

            $receivers = New-Object System.Text.StringBuilder
            $resourceProcessors = New-Object System.Text.StringBuilder
            $instancePipelines = New-Object System.Text.StringBuilder
            $isFirst = $true
            foreach ($idx in $survivors) {
              $inst = $instances[$idx - 1]
              if ($isFirst) {
                [void]$receivers.Append("  nrsqlserver/instance$idx" + ": &nrsqlserver-common`n")
                [void]$receivers.Append((Get-ReceiverFields $inst) + "`n")
                [void]$receivers.Append($receiverBody)
                $isFirst = $false
              } else {
                [void]$receivers.Append("  nrsqlserver/instance$idx" + ":`n")
                [void]$receivers.Append("    <<: *nrsqlserver-common`n")
                [void]$receivers.Append("    datasource: `"$(Get-Datasource $inst)`"`n")
              }

              [void]$resourceProcessors.Append("`n  resource/sqlserver/instance$idx" + ":`n")
              [void]$resourceProcessors.Append("    attributes:`n")
              [void]$resourceProcessors.Append("      - key: server.address`n")
              [void]$resourceProcessors.Append("        value: `"$($inst.host)`"`n")
              [void]$resourceProcessors.Append("        action: upsert`n")
              [void]$resourceProcessors.Append("      - key: server.port`n")
              [void]$resourceProcessors.Append("        value: $($inst.port)`n")
              [void]$resourceProcessors.Append("        action: upsert`n")

              if ($preset -eq "2") {
                [void]$instancePipelines.Append("    metrics/instance$idx" + ":`n")
                [void]$instancePipelines.Append("      receivers: [nrsqlserver/instance$idx]`n")
                [void]$instancePipelines.Append("      processors:`n")
                [void]$instancePipelines.Append("        - resource/sqlserver/instance$idx`n")
                [void]$instancePipelines.Append("        - resource_detection`n")
                [void]$instancePipelines.Append("        - resource_detection/cloud`n")
                [void]$instancePipelines.Append("        - resource_detection/env`n")
                [void]$instancePipelines.Append("        - cumulativetodelta`n")
                [void]$instancePipelines.Append("        - batch`n")
                [void]$instancePipelines.Append("      exporters: [otlphttp]`n`n")
                [void]$instancePipelines.Append("    logs/instance$idx" + ":`n")
                [void]$instancePipelines.Append("      receivers: [nrsqlserver/instance$idx]`n")
                [void]$instancePipelines.Append("      processors: [resource/sqlserver/instance$idx, resource_detection, resource_detection/cloud, resource_detection/env, batch]`n")
                [void]$instancePipelines.Append("      exporters: [otlphttp]`n`n")
              } else {
                [void]$instancePipelines.Append("    metrics/instance$idx" + ":`n")
                [void]$instancePipelines.Append("      receivers: [nrsqlserver/instance$idx]`n")
                [void]$instancePipelines.Append("      processors: [resource/sqlserver/instance$idx, memory_limiter, batch]`n")
                [void]$instancePipelines.Append("      exporters: [otlphttp]`n`n")
                [void]$instancePipelines.Append("    logs/instance$idx" + ":`n")
                [void]$instancePipelines.Append("      receivers: [nrsqlserver/instance$idx]`n")
                [void]$instancePipelines.Append("      processors: [resource/sqlserver/instance$idx, memory_limiter, batch]`n")
                [void]$instancePipelines.Append("      exporters: [otlphttp]`n`n")
              }
            }

            if ($preset -eq "2") {
              # Full preset: host metrics keep their own pipeline; the otlp pipelines are kept as-is.
              $hostPipeline = ($oldPipelines -split "`n    logs/host:`n", 2)[0].Replace("receivers: [host_metrics, nrsqlserver]", "receivers: [host_metrics]")
              $otlpPipelines = $oldPipelines.Substring($oldPipelines.IndexOf("    traces:"))
              $newPipelines = $hostPipeline + "`n" + $instancePipelines.ToString() + $otlpPipelines
            } else {
              $newPipelines = $instancePipelines.ToString().TrimEnd("`n") + "`n"
            }

            $configText = $head + $receivers.ToString() + "`nprocessors:`n" + $processorsBody + $resourceProcessors.ToString() + "`nexporters:`n" + $exportersAndService + "`n  pipelines:`n" + $newPipelines
          }

          $configText = $configText.Replace('__OTLP_ENDPOINT__', $otlpEndpoint).Replace('__LICENSE_KEY__', $licenseKey)
          $configText | Set-Content -Path $configPath -Encoding utf8

          $serviceAccount = $null
          if ($mode -eq "1") {
            if ("{{.NR_CLI_MSSQL_WINAUTH_LOCATION}}" -eq "2") {
              $serviceAccount = '{{.NR_CLI_MSSQL_WIN_ACCOUNT}}'
            }
          } else {
            $serviceAccount = '{{.NR_CLI_MSSQL_GMSA_ACCOUNT}}'
          }

          $grants = @("SYSTEM:(F)", "BUILTIN\Administrators:(F)")
          if ($serviceAccount) { $grants += "${serviceAccount}:(R)" }

          icacls $configPath /inheritance:r /grant:r $grants | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host -ForegroundColor Red "Failed to restrict permissions on $configPath."
            exit 1
          }

          Write-Host "MSSQL OTel config written to $configPath ($($survivors.Count) instance(s))"
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    configure_service:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-configure_service.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $service = "nrdot-collector"
          $exePath = "C:\Program Files\nrdot-collector\nrdot-collector.exe"
          $configPath = "C:\Program Files\nrdot-collector\mssql-config.yaml"
          $regPath = "HKLM:\SYSTEM\CurrentControlSet\Services\nrdot-collector"

          $existingImagePath = (Get-ItemProperty -Path $regPath -Name "ImagePath" -ErrorAction SilentlyContinue).ImagePath

          if ($existingImagePath -and $existingImagePath -match [regex]::Escape("mssql-config.yaml")) {
            Write-Host "nrdot-collector service is already configured to use mssql-config.yaml."
          } else {
            $newImagePath = "`"$exePath`" --config `"$configPath`""
            Set-ItemProperty -Path $regPath -Name "ImagePath" -Value $newImagePath
            Write-Host "nrdot-collector service ImagePath updated to use mssql-config.yaml."
          }

          $validateOutput = & $exePath validate --config="$configPath" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host -ForegroundColor Red "mssql-config.yaml failed validation:"
            Write-Host $validateOutput
            exit 1
          }
          Write-Host "mssql-config.yaml validated successfully."
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    restart_nrdot:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-restart_nrdot.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          net stop nrdot-collector
          net start nrdot-collector
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    assert_nrdot_status_ok:
      cmds:
        - |
          NR_SCRIPT="$TEMP/nr-mssql-assert_nrdot_status_ok.ps1"
          powershell -NoProfile -Command "[Console]::In.ReadToEnd() | Set-Content -Path '$NR_SCRIPT' -NoNewline" <<'PS1EOF'
          $maxRetries = 30
          $tries = 0
          $started = $false
          Write-Host "Waiting for NRDOT Collector to start..."
          while ($tries -lt $maxRetries) {
            $tries++
            $service = Get-Service -Name "nrdot-collector" -ErrorAction SilentlyContinue
            if ($service -and $service.Status -eq "Running") {
              Write-Host "NRDOT Collector is running."
              $started = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $started) {
            Write-Host -ForegroundColor Red "NRDOT Collector did not start in time. Install log:"
            Get-Content "$env:TEMP\nrdot_install.log" -ErrorAction SilentlyContinue | Select-Object -Last 50
            exit 31
          }

          $instancesJsonPath = "$env:TEMP\nr-mssql-instances.json"
          $skipJsonPath = "$env:TEMP\nr-mssql-skip.json"
          $warnJsonPath = "$env:TEMP\nr-mssql-warn.json"
          $instances = [array](Get-Content $instancesJsonPath -Raw | ConvertFrom-Json)
          $skip = @{}
          (Get-Content $skipJsonPath -Raw | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $skip[$_.Name] = $_.Value }
          $warn = @{}
          (Get-Content $warnJsonPath -Raw | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $warn[$_.Name] = $_.Value }

          Write-Host ""
          Write-Host "==> MSSQL instance summary:"
          Write-Host ""
          for ($i = 0; $i -lt $instances.Count; $i++) {
            $idx = $i + 1
            $inst = $instances[$i]
            if ($skip.ContainsKey("$idx")) {
              Write-Host "  [SKIP] $idx`: $($inst.host):$($inst.port) - $($skip["$idx"])"
            } elseif ($warn.ContainsKey("$idx")) {
              Write-Host "  [OK]   $idx`: $($inst.host):$($inst.port) - warning: $($warn["$idx"])"
            } else {
              Write-Host "  [OK]   $idx`: $($inst.host):$($inst.port)"
            }
          }

          Remove-Item $instancesJsonPath, $skipJsonPath, $warnJsonPath -ErrorAction SilentlyContinue
          PS1EOF
          powershell -NoProfile -ExecutionPolicy Bypass -File "$NR_SCRIPT"

    default:
      cmds:
        - task: write_recipe_metadata
        - task: assert_pre_req
        - task: assert_auth_inputs
        - task: parse_instances
        - task: assert_sql_server_version
        - task: install_nrdot
        - task: configure_database_user
        - task: configure_service_identity
        - task: create_collector_config
        - task: configure_service
        - task: restart_nrdot
        - task: assert_nrdot_status_ok

postInstall:
  info: |2
      MSSQL OTel config: C:\Program Files\nrdot-collector\mssql-config.yaml
      Service status:    Get-Service nrdot-collector
      Restart service:   net stop nrdot-collector; net start nrdot-collector
