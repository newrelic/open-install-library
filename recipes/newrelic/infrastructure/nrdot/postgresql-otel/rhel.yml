# Visit our schema definition for additional information on this file format.
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition
# WORK IN PROGRESS - not for use.

name: nrdot-collector-postgresql
displayName: NRDOT PostgreSQL (RHEL/CentOS)
description: New Relic install recipe for PostgreSQL monitoring via NRDOT Collector on RHEL/CentOS self-hosted environments, one or more local instances
repository: https://github.com/newrelic/nrdot-collector-releases

installTargets:
  - type: host
    os: linux
    platform: centos
  - type: host
    os: linux
    platform: redhat

keywords:
  - PostgreSQL
  - Postgres
  - NRDOT
  - OpenTelemetry
  - OTel
  - Database
  - Linux
  - CentOS
  - RHEL

processMatch:
  - postgres

preInstall:
  discoveryMode:
    - targeted
  info: |
    To capture data from one or more local PostgreSQL instances, we need to
    create/authorize a monitoring role on each, using an existing superuser (e.g.
    'postgres', or any equivalent role) on each instance.

    Note: this installer connects to PostgreSQL over TCP using a password, so that
    superuser must have a password set on every instance, and pg_hba.conf must
    permit password-based host authentication (md5/scram-sha-256) for TCP
    connections. A fresh install has no password set on 'postgres' by default -
    set one first via:
      sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD '<password>';"
    On RHEL/CentOS, the default pg_hba.conf often does not permit password-based
    host auth at all - verify/update it and reload PostgreSQL before running this.

    You will be asked for two files:

      1. An instances file (YAML) listing every local PostgreSQL instance to
         monitor, in the order you want them numbered (instance 1, 2, 3, ...). If
         you're running a single PostgreSQL server, this is still one entry -
         multiple entries are only needed if you run multiple separate PostgreSQL
         server processes on this host (e.g. on different ports). `databases` is
         an inline list - at least one database is required per instance:

           instances:
             - host: localhost
               port: 5432
               login_name: newrelic
               databases: [app1, app2]
             - host: localhost
               port: 5433
               login_name: newrelic
               databases: [app3]

      2. A secrets file (KEY=VALUE per line) supplying a superuser username and
         password for each instance above, indexed to match the instances file's
         order (1-based). Any superuser role works - it doesn't have to be
         'postgres':

           NR_CLI_POSTGRES_SUPERUSER_USER_1=postgres
           NR_CLI_POSTGRES_SUPERUSER_PASSWORD_1=<superuser password for instance 1>
           NR_CLI_POSTGRES_SUPERUSER_USER_2=postgres
           NR_CLI_POSTGRES_SUPERUSER_PASSWORD_2=<superuser password for instance 2>

         Both NR_CLI_POSTGRES_SUPERUSER_USER_<i> and
         NR_CLI_POSTGRES_SUPERUSER_PASSWORD_<i> are required for every instance.

    Any instance that fails its version check, has no databases listed, or fails
    role setup is skipped (with a reason) rather than aborting the whole install -
    the rest are still configured.

inputVars:
  - name: NR_CLI_POSTGRES_CONFIG_PRESET
    prompt: "NRDOT configuration - 1) Standard  2) Full-feature: "
    default: "1"
  - name: NR_CLI_POSTGRES_INSTANCES_FILE
    prompt: "Path to the PostgreSQL instances YAML file: "
  - name: NR_CLI_POSTGRES_SECRETS_FILE
    prompt: "Path to the PostgreSQL secrets file (KEY=VALUE per instance): "
  - name: NR_CLI_POSTGRES_ENABLE_EXPLAIN_HELPER
    prompt: >-
      Collect query plans for locking/write statements too? Creates a
      SECURITY DEFINER helper function (otel.explain_statement) in each
      monitored database, granting the monitoring user EXPLAIN execution
      without granting DML access. PREVIEW feature (y/N):
    default: "n"

validationNrql: "SELECT count(*) FROM Metric WHERE metricName LIKE 'postgresql.%' AND instrumentation.provider = 'opentelemetry' SINCE 10 minutes ago"

successLinkConfig:
  type: EXPLORER

install:
  version: "3"
  silent: true

  vars:
    IS_SYSTEMCTL:
      sh: command -v systemctl | wc -l

  tasks:
    write_recipe_metadata:
      cmds:
        - |
          echo '{"Metadata":{"CapturedCliOutput":"true"}}' | tee {{.NR_CLI_OUTPUT}} > /dev/null

    assert_pre_req:
      cmds:
        - |
          if [ "$(id -u)" != "0" ]; then
            echo "This newrelic install must be run under sudo or root" >&2
            exit 131
          fi
        - |
          if ! command -v curl > /dev/null 2>&1; then
            echo "curl is required to run the newrelic install. Please install curl and re-run the installation." >&2
            exit 16
          fi
        - |
          if ! command -v psql > /dev/null 2>&1; then
            echo "The psql client is required to configure PostgreSQL monitoring. Please install the postgresql-client package and re-run the installation." >&2
            exit 16
          fi
        - |
          if [ "{{.IS_SYSTEMCTL}}" -eq 0 ]; then
            echo "systemd is required for the nrdot-collector service configuration." >&2
            exit 131
          fi

    parse_instances:
      cmds:
        - |
          INSTANCES_FILE="{{.NR_CLI_POSTGRES_INSTANCES_FILE}}"
          SECRETS_FILE="{{.NR_CLI_POSTGRES_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-postgres-instances.tsv"
          SKIP_FILE="/tmp/nr-postgres-skip.tmp"

          rm -f "$INSTANCES_TSV" "$SKIP_FILE"

          if [ ! -f "$INSTANCES_FILE" ]; then
            echo "Instances file not found: $INSTANCES_FILE" >&2
            exit 131
          fi
          if [ ! -f "$SECRETS_FILE" ]; then
            echo "Secrets file not found: $SECRETS_FILE" >&2
            exit 131
          fi

          SECRETS_PERMS=$(stat -c '%a' "$SECRETS_FILE" 2>/dev/null || stat -f '%Lp' "$SECRETS_FILE" 2>/dev/null)
          if [ -n "$SECRETS_PERMS" ]; then
            GROUP_OTHER_BITS=$(printf '%s' "$SECRETS_PERMS" | tail -c 2)
            if [ "$GROUP_OTHER_BITS" != "00" ]; then
              echo "WARNING: $SECRETS_FILE is readable by group/other (permissions: $SECRETS_PERMS)." >&2
              echo "         Consider running: chmod 600 $SECRETS_FILE" >&2
            fi
          fi

          # shellcheck disable=SC1090
          . "$SECRETS_FILE"

          # Parses the fixed 4-key-per-item shape documented in preInstall.info
          # (host, port, login_name, databases as an inline [a, b] list) - not a
          # general-purpose YAML parser.
          awk '
            /^[[:space:]]*-[[:space:]]*host:/ {
              if (have) { print host "\t" port "\t" login_name "\t" databases }
              host=$0; sub(/^[[:space:]]*-[[:space:]]*host:[[:space:]]*/, "", host)
              port=""; login_name=""; databases=""; have=1; next
            }
            /^[[:space:]]*port:/ { port=$0; sub(/^[[:space:]]*port:[[:space:]]*/, "", port); next }
            /^[[:space:]]*login_name:/ { login_name=$0; sub(/^[[:space:]]*login_name:[[:space:]]*/, "", login_name); next }
            /^[[:space:]]*databases:/ {
              databases=$0
              sub(/^[[:space:]]*databases:[[:space:]]*\[/, "", databases)
              sub(/\][[:space:]]*$/, "", databases)
              next
            }
            END { if (have) { print host "\t" port "\t" login_name "\t" databases } }
          ' "$INSTANCES_FILE" > "$INSTANCES_TSV"

          INSTANCE_COUNT=$(wc -l < "$INSTANCES_TSV" | tr -d ' ')
          if [ "$INSTANCE_COUNT" -eq 0 ]; then
            echo "No instances found in $INSTANCES_FILE" >&2
            exit 131
          fi
          echo "Found $INSTANCE_COUNT PostgreSQL instance(s) in $INSTANCES_FILE"

          i=0
          while IFS="$(printf '\t')" read -r ENTRY_HOST ENTRY_PORT ENTRY_LOGIN_NAME ENTRY_DATABASES; do
            i=$((i + 1))
            eval "SUPERUSER_USER_VAL=\"\${NR_CLI_POSTGRES_SUPERUSER_USER_${i}:-}\""
            eval "SUPERUSER_PASSWORD_VAL=\"\${NR_CLI_POSTGRES_SUPERUSER_PASSWORD_${i}:-}\""
            if [ -z "$SUPERUSER_USER_VAL" ] || [ -z "$SUPERUSER_PASSWORD_VAL" ]; then
              echo "${i}: missing NR_CLI_POSTGRES_SUPERUSER_USER_${i}/NR_CLI_POSTGRES_SUPERUSER_PASSWORD_${i} in secrets file" >> "$SKIP_FILE"
              echo "Instance ${i} (${ENTRY_HOST}:${ENTRY_PORT}) SKIPPED: missing superuser credentials in secrets file" >&2
              continue
            fi
            if [ -z "$(echo "$ENTRY_DATABASES" | tr -d '[:space:],')" ]; then
              echo "${i}: no databases listed in instances file" >> "$SKIP_FILE"
              echo "Instance ${i} (${ENTRY_HOST}:${ENTRY_PORT}) SKIPPED: no databases listed in instances file" >&2
            fi
          done < "$INSTANCES_TSV"

    assert_postgres_version:
      cmds:
        - |
          SECRETS_FILE="{{.NR_CLI_POSTGRES_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-postgres-instances.tsv"
          SKIP_FILE="/tmp/nr-postgres-skip.tmp"

          # shellcheck disable=SC1090
          . "$SECRETS_FILE"

          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME DATABASES; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            eval "SUPERUSER_USER=\"\${NR_CLI_POSTGRES_SUPERUSER_USER_${i}}\""
            eval "SUPERUSER_PASSWORD=\"\${NR_CLI_POSTGRES_SUPERUSER_PASSWORD_${i}}\""
            export PGPASSWORD="$SUPERUSER_PASSWORD"

            RESULT=$(psql -h "$HOST" -p "$PORT" -U "$SUPERUSER_USER" -d postgres -tA -c "SELECT current_setting('server_version_num');" 2>&1)
            VERSION_STATUS=$?

            if [ $VERSION_STATUS -ne 0 ]; then
              unset PGPASSWORD
              echo "${i}: failed to connect / check version - $(echo "$RESULT" | tr '\n' ' ' | sed 's/  */ /g')" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}:${PORT}) SKIPPED: failed to connect to check its version" >&2
              continue
            fi

            VERSION_NUM=$(echo "$RESULT" | tr -d '[:space:]')
            if [ -z "$VERSION_NUM" ] || [ "$VERSION_NUM" -lt 140000 ]; then
              unset PGPASSWORD
              echo "${i}: unsupported PostgreSQL version ${VERSION_NUM:-unknown} (14 or later required)" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}:${PORT}) SKIPPED: unsupported PostgreSQL version ${VERSION_NUM:-unknown}" >&2
              continue
            fi

            PRELOAD=$(psql -h "$HOST" -p "$PORT" -U "$SUPERUSER_USER" -d postgres -tA -c "SHOW shared_preload_libraries;" 2>&1)
            unset PGPASSWORD

            if ! echo "$PRELOAD" | grep -qi "pg_stat_statements"; then
              echo "${i}: pg_stat_statements is not loaded (shared_preload_libraries=${PRELOAD})" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}:${PORT}) SKIPPED: pg_stat_statements is not loaded" >&2
              continue
            fi

            echo "Instance ${i} (${HOST}:${PORT}): PostgreSQL version ${VERSION_NUM} detected - supported, pg_stat_statements loaded."
          done < "$INSTANCES_TSV"

    install_nrdot:
      cmds:
        - |
          COLLECTOR_DISTRO="nrdot-collector"

          if rpm -q "$COLLECTOR_DISTRO" > /dev/null 2>&1; then
            echo "NRDOT Collector is already installed."
            echo ""
            echo "Please follow the steps below to complete the setup:"
            echo ""
            echo "  1. Create postgresql-config.yaml"
            echo "     if not present. Refer to:"
            echo "     https://docs.newrelic.com/docs/opentelemetry/database/postgresql/hosted/"
            echo ""
            echo "  2. Make sure the monitoring user is created"
            echo "     and has the required permissions granted."
            echo ""
            echo "  3. After making the above changes, restart the NRDOT Collector:"
            echo "     sudo systemctl restart nrdot-collector"
            echo ""
            exit 131
          fi

          COLLECTOR_VERSION=$(curl -sf "https://api.github.com/repos/newrelic/nrdot-collector-releases/releases/latest" | grep '"tag_name":' | awk -F'"' '{print $4}')
          if [ -z "$COLLECTOR_VERSION" ]; then
            echo "Failed to fetch the latest release version from GitHub. Please check your internet connection." >&2
            exit 1
          fi

          if [ "$(uname -m)" = "aarch64" ]; then
            ARCH="arm64"
          else
            ARCH="x86_64"
          fi

          DOWNLOAD_URL="https://github.com/newrelic/nrdot-collector-releases/releases/download/${COLLECTOR_VERSION}/${COLLECTOR_DISTRO}_${COLLECTOR_VERSION}_linux_${ARCH}.rpm"
          echo "Installing ${COLLECTOR_DISTRO} version: ${COLLECTOR_VERSION}"
          echo "Downloading from: ${DOWNLOAD_URL}"

          curl -L --output /tmp/nrdot-collector.rpm "$DOWNLOAD_URL"
          if [ $? -ne 0 ]; then
            echo "Failed to download the nrdot-collector package." >&2
            exit 1
          fi

          rpm -ivh /tmp/nrdot-collector.rpm
          if [ $? -ne 0 ]; then
            echo "Failed to install the nrdot-collector package." >&2
            exit 1
          fi

          rm -f /tmp/nrdot-collector.rpm
          echo "${COLLECTOR_DISTRO} installed successfully."

    configure_database_user:
      cmds:
        - |
          SECRETS_FILE="{{.NR_CLI_POSTGRES_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-postgres-instances.tsv"
          SKIP_FILE="/tmp/nr-postgres-skip.tmp"
          PASSWORDS_FILE="/tmp/nr-postgres-passwords.tmp"
          ENABLE_EXPLAIN_HELPER="{{.NR_CLI_POSTGRES_ENABLE_EXPLAIN_HELPER}}"

          rm -f "$PASSWORDS_FILE"
          : > "$PASSWORDS_FILE"
          chmod 600 "$PASSWORDS_FILE"

          # shellcheck disable=SC1090
          . "$SECRETS_FILE"

          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME DATABASES; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            if ! printf '%s' "$LOGIN_NAME" | grep -qE '^[A-Za-z][A-Za-z0-9_]*$'; then
              echo "${i}: invalid monitoring username '${LOGIN_NAME}' in instances file" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}:${PORT}) SKIPPED: invalid monitoring username '${LOGIN_NAME}'" >&2
              continue
            fi

            eval "SUPERUSER_USER=\"\${NR_CLI_POSTGRES_SUPERUSER_USER_${i}}\""
            eval "SUPERUSER_PASSWORD=\"\${NR_CLI_POSTGRES_SUPERUSER_PASSWORD_${i}}\""
            export PGPASSWORD="$SUPERUSER_PASSWORD"

            NR_PASSWORD=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24)

            SQL_FILE=$(mktemp "/tmp/nr-postgres-grant-${i}.sql.XXXXXX")
            cat > "$SQL_FILE" << EOF
          DO \$\$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${LOGIN_NAME}') THEN
              CREATE ROLE ${LOGIN_NAME} WITH LOGIN PASSWORD '${NR_PASSWORD}';
            END IF;
          END
          \$\$;
          ALTER ROLE ${LOGIN_NAME} WITH LOGIN PASSWORD '${NR_PASSWORD}';
          ALTER ROLE ${LOGIN_NAME} INHERIT;
          GRANT pg_monitor TO ${LOGIN_NAME};
          EOF

            RESULT=$(psql -h "$HOST" -p "$PORT" -U "$SUPERUSER_USER" -d postgres -v ON_ERROR_STOP=1 -f "$SQL_FILE" 2>&1)
            ROLE_STATUS=$?
            rm -f "$SQL_FILE"

            if [ $ROLE_STATUS -ne 0 ]; then
              unset PGPASSWORD
              echo "${i}: failed to create/authorize the monitoring role - $(echo "$RESULT" | tr '\n' ' ' | sed 's/  */ /g')" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}:${PORT}) SKIPPED: failed to create/authorize the monitoring role" >&2
              continue
            fi

            PERDB_SQL_FILE=$(mktemp "/tmp/nr-postgres-perdb-${i}.sql.XXXXXX")
            cat > "$PERDB_SQL_FILE" << EOF
          CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
          CREATE SCHEMA IF NOT EXISTS otel;
          GRANT USAGE ON SCHEMA otel TO ${LOGIN_NAME};
          GRANT USAGE ON SCHEMA public TO ${LOGIN_NAME};
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO ${LOGIN_NAME};
          EOF

            # Opt-in only (NR_CLI_POSTGRES_ENABLE_EXPLAIN_HELPER) - this is a
            # SECURITY DEFINER function, a real privilege-escalation primitive, so it's
            # never created unless explicitly requested. SQL copied verbatim from
            # https://docs.newrelic.com/docs/opentelemetry/database/postgresql/explain-permissions/
            case "$ENABLE_EXPLAIN_HELPER" in
              y|Y|yes|YES|Yes)
                cat >> "$PERDB_SQL_FILE" << EOF
          CREATE OR REPLACE FUNCTION otel.explain_statement(l_query text)
          RETURNS json
          LANGUAGE plpgsql
          SECURITY DEFINER
          AS \$\$
          DECLARE
              v_plan json;
              v_param_count int;
              v_nulls text := '';
              i int;
          BEGIN
              SET TRANSACTION READ ONLY;
              SET plan_cache_mode = force_generic_plan;

              EXECUTE 'PREPARE otel_explain_stmt AS ' || l_query;

              SELECT COALESCE(array_length(parameter_types, 1), 0) INTO v_param_count
              FROM pg_prepared_statements WHERE name = 'otel_explain_stmt';

              IF v_param_count > 0 THEN
                  FOR i IN 1..v_param_count LOOP
                      v_nulls := v_nulls || CASE WHEN i > 1 THEN ', ' ELSE '' END || 'null';
                  END LOOP;
                  v_nulls := '(' || v_nulls || ')';
              END IF;

              EXECUTE 'EXPLAIN (FORMAT JSON) EXECUTE otel_explain_stmt' || v_nulls INTO v_plan;
              DEALLOCATE otel_explain_stmt;
              RETURN v_plan;
          EXCEPTION WHEN OTHERS THEN
              IF EXISTS (SELECT 1 FROM pg_prepared_statements WHERE name = 'otel_explain_stmt') THEN
                  DEALLOCATE otel_explain_stmt;
              END IF;
              RAISE;
          END;
          \$\$;

          GRANT EXECUTE ON FUNCTION otel.explain_statement(text) TO ${LOGIN_NAME};
          EOF
                ;;
            esac

            OLD_IFS="$IFS"
            IFS=','
            set -- $DATABASES
            IFS="$OLD_IFS"
            # Always configure the default 'postgres' maintenance database too - see
            # the note in the single-instance recipe this was ported from: the
            # receiver's top_query feature connects there independent of the
            # databases list. Harmless/idempotent if already included.
            set -- postgres "$@"
            PERDB_FAILED=""
            for db in "$@"; do
              db_trimmed=$(echo "$db" | xargs)
              [ -z "$db_trimmed" ] && continue
              DB_RESULT=$(psql -h "$HOST" -p "$PORT" -U "$SUPERUSER_USER" -d "$db_trimmed" -v ON_ERROR_STOP=1 -f "$PERDB_SQL_FILE" 2>&1)
              if [ $? -ne 0 ]; then
                echo "${i}: failed to configure database '${db_trimmed}' - $(echo "$DB_RESULT" | tr '\n' ' ' | sed 's/  */ /g')" >> "$SKIP_FILE"
                echo "Instance ${i} (${HOST}:${PORT}) SKIPPED: failed to configure database '${db_trimmed}'" >&2
                PERDB_FAILED=1
                break
              fi
            done
            rm -f "$PERDB_SQL_FILE"
            unset PGPASSWORD

            if [ -n "$PERDB_FAILED" ]; then
              continue
            fi

            echo "${i}=${NR_PASSWORD}" >> "$PASSWORDS_FILE"
            echo "Instance ${i} (${HOST}:${PORT}): PostgreSQL monitoring identity configured successfully: $LOGIN_NAME"
          done < "$INSTANCES_TSV"

    create_collector_config:
      cmds:
        - |
          PRESET="{{.NR_CLI_POSTGRES_CONFIG_PRESET}}"
          REGION="{{.NEW_RELIC_REGION}}"
          LICENSE_KEY="{{.NEW_RELIC_LICENSE_KEY}}"
          CONFIG_DIR="/etc/nrdot-collector"
          CONFIG_PATH="${CONFIG_DIR}/postgresql-config.yaml"
          ENV_FILE="${CONFIG_DIR}/nrdot-collector.conf"
          INSTANCES_TSV="/tmp/nr-postgres-instances.tsv"
          SKIP_FILE="/tmp/nr-postgres-skip.tmp"
          PASSWORDS_FILE="/tmp/nr-postgres-passwords.tmp"
          COLLECTION_INTERVAL="15s"

          mkdir -p "$CONFIG_DIR"

          case "$REGION" in
            staging) OTLP_ENDPOINT="https://staging-otlp.nr-data.net:4317" ;;
            EU)      OTLP_ENDPOINT="https://otlp.eu01.nr-data.net:4317" ;;
            JP)      OTLP_ENDPOINT="https://otlp.jp.nr-data.net:4317" ;;
            *)       OTLP_ENDPOINT="https://otlp.nr-data.net:4317" ;;
          esac

          # Shared receiver settings (collection_interval/events/query_sample_collection/
          # top_query_collection/metrics) are identical for every instance. Captured once
          # here and echoed per instance below instead of relying on the collector's YAML
          # loader to support merge-key aliases via a fragile split - endpoint/username/
          # password/databases are the only fields that vary per instance and are always
          # written explicitly.
          RECEIVER_DEFAULTS=$(cat << 'BLOCK'
              collection_interval: 15s

              events:
                db.server.top_query:
                  enabled: true
                db.server.query_sample:
                  enabled: true

              query_sample_collection:
                max_rows_per_query: 1000
                allowed_comment_keys: [nr_service_guid]

              top_query_collection:
                max_rows_per_query: 1000
                top_n_query: 200
                collection_interval: 60s
                allowed_comment_keys: [nr_service_guid]

              # Metrics needed for the out-of-the-box dashboard but disabled by default -
              # see "Available metrics" in the docs for the full default-on/default-off breakdown.
              metrics:
                postgresql.database.locks:
                  enabled: true
                postgresql.deadlocks:
                  enabled: true
                postgresql.function.calls:
                  enabled: true
                postgresql.query.conflicts:
                  enabled: true
                postgresql.sequential_scans:
                  enabled: true
                postgresql.temp.io:
                  enabled: true
                postgresql.temp_files:
                  enabled: true
          BLOCK
          )

          if [ "$PRESET" = "2" ]; then
            cat > "$CONFIG_PATH" << 'EOF'
          extensions:
            health_check:

          receivers:
            otlp:
              protocols:
                grpc:
                http:

            host_metrics:
              collection_interval: 30s
              scrapers:
                cpu:
                  metrics:
                    system.cpu.time:
                      enabled: false
                    system.cpu.utilization:
                      enabled: true
                load:
                memory:
                  metrics:
                    system.memory.utilization:
                      enabled: true
                paging:
                  metrics:
                    system.paging.utilization:
                      enabled: false
                    system.paging.faults:
                      enabled: false
                filesystem:
                  metrics:
                    system.filesystem.utilization:
                      enabled: true
                disk:
                  metrics:
                    system.disk.merged:
                      enabled: false
                    system.disk.pending_operations:
                      enabled: false
                    system.disk.weighted_io_time:
                      enabled: false
                network:
                  metrics:
                    system.network.connections:
                      enabled: false
                # Uncomment to enable process metrics
                # processes:
                # process:
                #  metrics:
                #    process.cpu.utilization:
                #      enabled: true
                #    process.cpu.time:
                #      enabled: false
          EOF
          else
            cat > "$CONFIG_PATH" << 'EOF'
          receivers:
          EOF
          fi

          # Count survivors up front to decide whether the anchor/merge-key pattern
          # documented at https://docs.newrelic.com/docs/opentelemetry/database/postgresql/multi-receiver/
          # applies - a single instance has nothing to merge into, so it gets a plain
          # receiver, matching that doc's naming convention (nrpostgresql/dbN).
          SURVIVOR_COUNT=0
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME DATABASES; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi
            SURVIVOR_COUNT=$((SURVIVOR_COUNT + 1))
          done < "$INSTANCES_TSV"

          MONITORED_COUNT=0
          IS_FIRST_SURVIVOR=1
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME DATABASES; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            # Reuse the password configure_database_user already set on this role -
            # no need to generate and apply a second one.
            NR_PASSWORD=$(grep "^${i}=" "$PASSWORDS_FILE" 2>/dev/null | head -1 | cut -d= -f2-)
            if [ -z "$NR_PASSWORD" ]; then
              echo "${i}: monitoring role password not found - configure_database_user did not record one" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}:${PORT}) SKIPPED: monitoring role password not found" >&2
              continue
            fi

            DATABASES_YAML=""
            OLD_IFS="$IFS"
            IFS=','
            set -- $DATABASES
            IFS="$OLD_IFS"
            for db in "$@"; do
              db_trimmed=$(echo "$db" | xargs)
              [ -z "$db_trimmed" ] && continue
              DATABASES_YAML="${DATABASES_YAML}      - ${db_trimmed}
          "
            done

            if [ "$SURVIVOR_COUNT" -eq 1 ]; then
              {
                echo "  nrpostgresql/db${i}:"
                echo "    endpoint: \"${HOST}:${PORT}\""
                echo "    username: \"${LOGIN_NAME}\""
                echo "    password: \"${NR_PASSWORD}\""
                echo "    databases:"
                printf '%s' "$DATABASES_YAML"
                echo "$RECEIVER_DEFAULTS"
              } >> "$CONFIG_PATH"
            elif [ "$IS_FIRST_SURVIVOR" -eq 1 ]; then
              {
                echo "  nrpostgresql/db${i}: &nrpostgresql-common"
                echo "    endpoint: \"${HOST}:${PORT}\""
                echo "    username: \"${LOGIN_NAME}\""
                echo "    password: \"${NR_PASSWORD}\""
                echo "    databases:"
                printf '%s' "$DATABASES_YAML"
                echo "$RECEIVER_DEFAULTS"
              } >> "$CONFIG_PATH"
              IS_FIRST_SURVIVOR=0
            else
              {
                echo "  nrpostgresql/db${i}:"
                echo "    <<: *nrpostgresql-common"
                echo "    endpoint: \"${HOST}:${PORT}\""
                echo "    username: \"${LOGIN_NAME}\""
                echo "    password: \"${NR_PASSWORD}\""
                echo "    databases:"
                printf '%s' "$DATABASES_YAML"
              } >> "$CONFIG_PATH"
            fi

            MONITORED_COUNT=$((MONITORED_COUNT + 1))
          done < "$INSTANCES_TSV"

          if [ "$MONITORED_COUNT" -eq 0 ]; then
            echo "No PostgreSQL instance passed its checks - nothing to monitor. Aborting install." >&2
            exit 1
          fi

          if [ "$PRESET" = "2" ]; then
            cat >> "$CONFIG_PATH" << 'EOF'

          processors:
            metrics_transform:
              transforms:
                - include: system.cpu.utilization
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [state]
                      aggregation_type: mean
                - include: system.paging.operations
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [direction]
                      aggregation_type: sum

            filter/exclude_cpu_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "interrupt"'
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "nice"'
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "softirq"'

            filter/exclude_memory_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_unreclaimable"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "inactive"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "cached"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "buffered"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_reclaimable"'

            filter/exclude_memory_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "slab_unreclaimable"'
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "inactive"'

            filter/exclude_filesystem_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.utilization" and attributes["type"] == "squashfs"'

            filter/exclude_filesystem_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.usage" and attributes["type"] == "squashfs"'
                  - 'metric.name == "system.filesystem.usage" and attributes["state"] == "reserved"'

            filter/exclude_filesystem_inodes_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.inodes.usage" and attributes["type"] == "squashfs"'
                  - 'metric.name == "system.filesystem.inodes.usage" and attributes["state"] == "reserved"'

            filter/exclude_system_disk:
              metrics:
                datapoint:
                  - 'metric.name == "system.disk.operations" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.merged" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.io" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.io_time" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.operation_time" and IsMatch(attributes["device"], "^loop.*") == true'

            filter/exclude_network:
              metrics:
                datapoint:
                  - 'IsMatch(metric.name, "^system.network.*") == true and attributes["device"] == "lo"'

            attributes/exclude_system_paging:
              include:
                match_type: strict
                metric_names:
                  - system.paging.operations
              actions:
                - key: type
                  action: delete

            cumulative_to_delta:

            transform:
              trace_statements:
                - context: span
                  statements:
                    - truncate_all(span.attributes, 4095)
                    - truncate_all(resource.attributes, 4095)

            transform/host:
              metric_statements:
                - context: metric
                  statements:
                    - set(metric.description, "")
                    - set(metric.unit, "")

            batch:

            resource_detection:
              detectors: ["system"]
              system:
                hostname_sources: ["os"]
                resource_attributes:
                  host.id:
                    enabled: true
            resource_detection/cloud:
              detectors: ["gcp", "ec2", "azure"]
              timeout: 2s
              override: true
            resource_detection/env:
              detectors: ["env"]
              timeout: 2s
              override: true
          EOF
          else
            cat >> "$CONFIG_PATH" << 'EOF'

          processors:
            batch:
          EOF
          fi

          # Static server.address/server.port per instance, reusing the same HOST/PORT
          # already set on that instance's receiver `endpoint` field above - with
          # receiver.nrpostgresql.useOTelSemconv enabled, service.instance.id becomes a
          # UUID v5 hash rather than a "host:port" string, so a per-instance processor
          # is used instead of deriving these from that field.
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME DATABASES; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi
            cat >> "$CONFIG_PATH" << EOF

            resource/postgresql/db${i}:
              attributes:
                - key: server.address
                  value: "${HOST}"
                  action: upsert
                - key: server.port
                  value: ${PORT}
                  action: upsert
          EOF
          done < "$INSTANCES_TSV"

          cat >> "$CONFIG_PATH" << EOF

          exporters:
            otlp/newrelic:
              endpoint: "${OTLP_ENDPOINT}"
              headers:
                api-key: "${LICENSE_KEY}"
              compression: gzip
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_interval: 30s
                max_elapsed_time: 300s

          service:
          EOF

          if [ "$PRESET" = "2" ]; then
            cat >> "$CONFIG_PATH" << 'EOF'
            telemetry:
              metrics:
                level: none

            extensions: [health_check]

            pipelines:
              metrics/host:
                receivers: [host_metrics]
                processors:
                  - metrics_transform
                  - filter/exclude_cpu_utilization
                  - filter/exclude_memory_utilization
                  - filter/exclude_memory_usage
                  - filter/exclude_filesystem_utilization
                  - filter/exclude_filesystem_usage
                  - filter/exclude_filesystem_inodes_usage
                  - filter/exclude_system_disk
                  - filter/exclude_network
                  - attributes/exclude_system_paging
                  - transform/host
                  - resource_detection
                  - resource_detection/cloud
                  - resource_detection/env
                  - cumulative_to_delta
                  - batch
                exporters: [otlp/newrelic]
          EOF
          else
            cat >> "$CONFIG_PATH" << 'EOF'
            pipelines:
          EOF
          fi

          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME DATABASES; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi
            if [ "$PRESET" = "2" ]; then
              cat >> "$CONFIG_PATH" << EOF
              metrics/postgresql/db${i}:
                receivers: [nrpostgresql/db${i}]
                processors:
                  - resource/postgresql/db${i}
                  - resource_detection
                  - resource_detection/cloud
                  - resource_detection/env
                  - batch
                exporters: [otlp/newrelic]

              logs/postgresql/db${i}:
                receivers: [nrpostgresql/db${i}]
                processors:
                  - resource/postgresql/db${i}
                  - resource_detection
                  - resource_detection/cloud
                  - resource_detection/env
                  - batch
                exporters: [otlp/newrelic]
          EOF
            else
              cat >> "$CONFIG_PATH" << EOF
              metrics/db${i}:
                receivers: [nrpostgresql/db${i}]
                processors: [resource/postgresql/db${i}, batch]
                exporters: [otlp/newrelic]
              logs/db${i}:
                receivers: [nrpostgresql/db${i}]
                processors: [resource/postgresql/db${i}, batch]
                exporters: [otlp/newrelic]
          EOF
            fi
          done < "$INSTANCES_TSV"

          if [ "$PRESET" = "2" ]; then
            cat >> "$CONFIG_PATH" << 'EOF'

              traces:
                receivers: [otlp]
                processors: [transform, resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlp/newrelic]

              metrics:
                receivers: [otlp]
                processors: [resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlp/newrelic]

              logs:
                receivers: [otlp]
                processors: [resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlp/newrelic]
          EOF
          fi

          cat > "$ENV_FILE" << EOF
          OTELCOL_OPTIONS="--config=${CONFIG_PATH}"
          EOF

          chown nrdot-collector:nrdot-collector "$CONFIG_PATH"
          chmod 600 "$CONFIG_PATH"

          echo "PostgreSQL OTel config written to ${CONFIG_PATH} (${MONITORED_COUNT} instance(s))"
          echo "Env file written to ${ENV_FILE}"

    restart_nrdot:
      cmds:
        - |
          systemctl restart nrdot-collector

          echo "Waiting for NRDOT Collector to start..."
          NR_STARTED=""
          for i in $(seq 1 30); do
            if systemctl is-active --quiet nrdot-collector; then
              echo "NRDOT Collector is running."
              NR_STARTED=1
              break
            fi
            sleep 2
          done

          if [ -z "$NR_STARTED" ]; then
            echo "NRDOT Collector did not start in time. Check logs:" >&2
            journalctl -u nrdot-collector --no-pager -n 50 >&2
            exit 31
          fi

          INSTANCES_TSV="/tmp/nr-postgres-instances.tsv"
          SKIP_FILE="/tmp/nr-postgres-skip.tmp"

          echo ""
          echo "==> PostgreSQL instance summary:"
          echo ""
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME DATABASES; do
            i=$((i + 1))
            REASON=$(grep "^${i}:" "$SKIP_FILE" 2>/dev/null | sed "s/^${i}: //")
            if [ -n "$REASON" ]; then
              echo "  [SKIP] ${i}: ${HOST}:${PORT} - ${REASON}"
            else
              echo "  [OK]   ${i}: ${HOST}:${PORT} (databases: ${DATABASES})"
            fi
          done < "$INSTANCES_TSV"

          rm -f /tmp/nr-postgres-grant-*.sql.* /tmp/nr-postgres-perdb-*.sql.* "$INSTANCES_TSV" "$SKIP_FILE" /tmp/nr-postgres-passwords.tmp

    default:
      cmds:
        - task: write_recipe_metadata
        - task: assert_pre_req
        - task: parse_instances
        - task: assert_postgres_version
        - task: install_nrdot
        - task: configure_database_user
        - task: create_collector_config
        - task: restart_nrdot

postInstall:
  info: |2
      PostgreSQL OTel config: /etc/nrdot-collector/postgresql-config.yaml
      Env file:               /etc/nrdot-collector/nrdot-collector.conf
      Service status:         systemctl status nrdot-collector
      View logs:               journalctl -u nrdot-collector -f
      Restart service:         sudo systemctl restart nrdot-collector

      Note: query plans for locking or write statements are only collected if
      you opted in during install (creates an otel.explain_statement()
      SECURITY DEFINER helper function in each monitored database, granting
      the monitoring user EXPLAIN execution without DML access - a PREVIEW
      feature). If you skipped that prompt, you can still enable it later by
      running the recipe again or creating the function manually - see:
      https://docs.newrelic.com/docs/opentelemetry/database/postgresql/explain-permissions/
