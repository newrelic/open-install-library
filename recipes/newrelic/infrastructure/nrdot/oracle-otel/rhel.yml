# Visit our schema definition for additional information on this file format.
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition

name: nrdot-collector-oracle
displayName: NRDOT Oracle Database (RHEL/CentOS/OEL)
description: New Relic install recipe for Oracle Database monitoring via NRDOT Collector on RHEL/CentOS/OEL self-hosted environments
repository: https://github.com/newrelic/nrdot-collector-releases

installTargets:
  - type: host
    os: linux
    platform: centos
  - type: host
    os: linux
    platform: redhat
  - type: host
    os: linux
    platform: oracle

keywords:
  - Oracle
  - Oracle Database
  - NRDOT
  - OpenTelemetry
  - OTel
  - Database
  - Linux
  - CentOS
  - RHEL
  - OEL

processMatch:
  - tnslsnr

preInstall:
  discoveryMode:
    - targeted
  info: |
    To capture data from Oracle Database, we need to create/authorize a monitoring
    identity (a database user). This requires SYS/SYSDBA access on the account
    running this installation.

inputVars:
  - name: NR_CLI_ORACLE_CONFIG_PRESET
    prompt: "NRDOT configuration - 1) Database only  2) Host + Database: "
    default: "1"
  - name: NR_CLI_ORACLE_CONTAINER_TYPE
    prompt: "Oracle container type - 1) CDB (monitor all PDBs)  2) PDB (single PDB): "
    default: "1"
  - name: NR_CLI_ORACLE_PDB_NAME
    prompt: "PDB name (mode 2 only; leave blank for CDB mode): "
  - name: NR_CLI_ORACLE_HOST
    prompt: "Oracle Database host (e.g. localhost): "
    default: "localhost"
  - name: NR_CLI_ORACLE_PORT
    prompt: "Oracle listener port: "
    default: "1521"
  - name: NR_CLI_ORACLE_SYS_PASSWORD
    prompt: "SYS password (used once to create the monitoring user and grant privileges): "
    secret: true
  - name: NR_CLI_ORACLE_LOGIN_NAME
    prompt: "Monitoring username (CDB mode creates it as c##<name>): "
    default: "newrelic"
  - name: NR_CLI_ORACLE_LOGIN_PASSWORD
    prompt: "Password for the monitoring login (leave blank to auto-generate a random password): "
    secret: true
  - name: NR_CLI_ORACLE_SERVICE_NAME
    prompt: "CDB or PDB service name for the collector connection: "

validationNrql: "SELECT count(*) FROM Metric WHERE metricName LIKE 'oracledb.%' AND instrumentation.provider = 'opentelemetry' SINCE 10 minutes ago"

successLinkConfig:
  type: EXPLORER

install:
  version: "3"
  silent: true

  vars:
    IS_SYSTEMCTL:
      sh: command -v systemctl | wc -l

  tasks:
    write_recipe_metadata:
      cmds:
        - |
          echo '{"Metadata":{"CapturedCliOutput":"true"}}' | tee {{.NR_CLI_OUTPUT}} > /dev/null

    assert_pre_req:
      cmds:
        - |
          if [ "$(id -u)" != "0" ]; then
            echo "This newrelic install must be run under sudo or root" >&2
            exit 131
          fi
        - |
          if ! command -v curl > /dev/null 2>&1; then
            echo "curl is required to run the newrelic install. Please install curl and re-run the installation." >&2
            exit 16
          fi
        - |
          if [ "{{.IS_SYSTEMCTL}}" -eq 0 ]; then
            echo "systemd is required for the nrdot-collector service configuration." >&2
            exit 131
          fi

    assert_container_type_inputs:
      cmds:
        - |
          CONTAINER_TYPE="{{.NR_CLI_ORACLE_CONTAINER_TYPE}}"
          PDB_NAME="{{.NR_CLI_ORACLE_PDB_NAME}}"

          case "$CONTAINER_TYPE" in
            1) ;;
            2)
              if [ -z "$PDB_NAME" ]; then
                echo "NR_CLI_ORACLE_PDB_NAME is required when NR_CLI_ORACLE_CONTAINER_TYPE is 2 (PDB)." >&2
                exit 1
              fi
              ;;
            *)
              echo "NR_CLI_ORACLE_CONTAINER_TYPE must be 1 (CDB) or 2 (PDB)." >&2
              exit 1
              ;;
          esac

    assert_oracle_version:
      cmds:
        - |
          HOST="{{.NR_CLI_ORACLE_HOST}}"
          PORT="{{.NR_CLI_ORACLE_PORT}}"
          SERVICE_NAME="{{.NR_CLI_ORACLE_SERVICE_NAME}}"
          SYS_PASSWORD="{{.NR_CLI_ORACLE_SYS_PASSWORD}}"

          VERSION_OUTPUT=$(sqlplus -S "sys/${SYS_PASSWORD}@${HOST}:${PORT}/${SERVICE_NAME}" AS SYSDBA << 'SQL'
          WHENEVER SQLERROR EXIT SQL.SQLCODE
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 TRIMSPOOL ON
          SELECT version FROM v$instance;
          EXIT;
          SQL
          )
          if [ $? -ne 0 ]; then
            echo "Failed to connect to Oracle Database to check its version:" >&2
            echo "$VERSION_OUTPUT" >&2
            exit 1
          fi

          MAJOR_VERSION=$(echo "$VERSION_OUTPUT" | grep -oE '^[0-9]+' | head -1)

          if [ -z "$MAJOR_VERSION" ] || [ "$MAJOR_VERSION" -lt 19 ]; then
            echo "Oracle Database version ${MAJOR_VERSION:-unknown} is not supported. Oracle Database 19c or later is required." >&2
            exit 1
          fi

          echo "Oracle Database major version ${MAJOR_VERSION} detected - supported."

    install_nrdot:
      cmds:
        - |
          COLLECTOR_DISTRO="nrdot-collector"

          if rpm -q "$COLLECTOR_DISTRO" > /dev/null 2>&1; then
            echo "NRDOT Collector is already installed."
            echo ""
            echo "Please follow the steps below to complete the setup:"
            echo ""
            echo "  1. Create oracle-config.yaml"
            echo "     if not present. Refer to:"
            echo "     https://docs.newrelic.com/docs/opentelemetry/database/otel-oracledb/"
            echo ""
            echo "  2. Make sure the monitoring user is created"
            echo "     and has the required permissions granted."
            echo ""
            echo "  3. After making the above changes, restart the NRDOT Collector:"
            echo "     sudo systemctl restart nrdot-collector"
            echo ""
            exit 131
          fi

          COLLECTOR_VERSION=$(curl -sf "https://api.github.com/repos/newrelic/nrdot-collector-releases/releases/latest" | grep '"tag_name":' | awk -F'"' '{print $4}')
          if [ -z "$COLLECTOR_VERSION" ]; then
            echo "Failed to fetch the latest release version from GitHub. Please check your internet connection." >&2
            exit 1
          fi

          if [ "$(uname -m)" = "aarch64" ]; then
            ARCH="arm64"
          else
            ARCH="x86_64"
          fi

          DOWNLOAD_URL="https://github.com/newrelic/nrdot-collector-releases/releases/download/${COLLECTOR_VERSION}/${COLLECTOR_DISTRO}_${COLLECTOR_VERSION}_linux_${ARCH}.rpm"
          echo "Installing ${COLLECTOR_DISTRO} version: ${COLLECTOR_VERSION}"
          echo "Downloading from: ${DOWNLOAD_URL}"

          curl -L --output /tmp/nrdot-collector.rpm "$DOWNLOAD_URL"
          if [ $? -ne 0 ]; then
            echo "Failed to download the nrdot-collector package." >&2
            exit 1
          fi

          rpm -ivh /tmp/nrdot-collector.rpm
          if [ $? -ne 0 ]; then
            echo "Failed to install the nrdot-collector package." >&2
            exit 1
          fi

          rm -f /tmp/nrdot-collector.rpm
          echo "${COLLECTOR_DISTRO} installed successfully."

    configure_database_user:
      cmds:
        - |
          CONTAINER_TYPE="{{.NR_CLI_ORACLE_CONTAINER_TYPE}}"
          PDB_NAME="{{.NR_CLI_ORACLE_PDB_NAME}}"
          LOGIN_NAME="{{.NR_CLI_ORACLE_LOGIN_NAME}}"
          HOST="{{.NR_CLI_ORACLE_HOST}}"
          PORT="{{.NR_CLI_ORACLE_PORT}}"
          SERVICE_NAME="{{.NR_CLI_ORACLE_SERVICE_NAME}}"
          SYS_PASSWORD="{{.NR_CLI_ORACLE_SYS_PASSWORD}}"
          PW_FILE="/tmp/nr-oracle-newrelic-pw.tmp"

          if [ -z "{{.NR_CLI_ORACLE_LOGIN_PASSWORD}}" ]; then
            NR_PASSWORD=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24)
          else
            NR_PASSWORD="{{.NR_CLI_ORACLE_LOGIN_PASSWORD}}"
          fi
          printf '%s' "$NR_PASSWORD" > "$PW_FILE"
          chmod 600 "$PW_FILE"

          if [ "$CONTAINER_TYPE" = "1" ]; then
            RESULT=$(sqlplus -S "sys/${SYS_PASSWORD}@${HOST}:${PORT}/${SERVICE_NAME}" AS SYSDBA << SQL 2>&1
          WHENEVER SQLERROR EXIT SQL.SQLCODE
          ALTER SESSION SET CONTAINER = CDB\$ROOT;
          CREATE USER c##${LOGIN_NAME} IDENTIFIED BY "${NR_PASSWORD}" CONTAINER=ALL;
          GRANT CREATE SESSION TO c##${LOGIN_NAME} CONTAINER=ALL;
          ALTER USER c##${LOGIN_NAME} SET CONTAINER_DATA=ALL CONTAINER=CURRENT;
          GRANT SELECT ON V_\$INSTANCE TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$DATABASE TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$CONTAINERS TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$DATAFILE TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$SYSSTAT TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$CON_SYSSTAT TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$SYSMETRIC TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$CON_SYSMETRIC TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$SESSION TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$RESOURCE_LIMIT TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$OSSTAT TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$SGAINFO TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$ROWCACHE TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$PARAMETER TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON CDB_TABLESPACE_USAGE_METRICS TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON CDB_TABLESPACES TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON DBA_DATA_FILES TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON DBA_FREE_SPACE TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON DBA_RECYCLEBIN TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$SQL TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$SQL_PLAN TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$LOCK TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON V_\$SESSION_EVENT TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON DBA_PROCEDURES TO c##${LOGIN_NAME} CONTAINER=ALL;
          GRANT SELECT ON DBA_OBJECTS TO c##${LOGIN_NAME} CONTAINER=ALL;
          EXIT;
          SQL
          )
          else
            RESULT=$(sqlplus -S "sys/${SYS_PASSWORD}@${HOST}:${PORT}/${SERVICE_NAME}" AS SYSDBA << SQL 2>&1
          WHENEVER SQLERROR EXIT SQL.SQLCODE
          ALTER SESSION SET CONTAINER = "${PDB_NAME}";
          CREATE USER ${LOGIN_NAME} IDENTIFIED BY "${NR_PASSWORD}";
          GRANT CREATE SESSION TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$INSTANCE TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$DATABASE TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$CONTAINERS TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$DATAFILE TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$SYSSTAT TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$SYSMETRIC TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$SESSION TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$RESOURCE_LIMIT TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$OSSTAT TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$SGAINFO TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$ROWCACHE TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$PARAMETER TO ${LOGIN_NAME};
          GRANT SELECT ON DBA_TABLESPACE_USAGE_METRICS TO ${LOGIN_NAME};
          GRANT SELECT ON DBA_TABLESPACES TO ${LOGIN_NAME};
          GRANT SELECT ON DBA_DATA_FILES TO ${LOGIN_NAME};
          GRANT SELECT ON DBA_FREE_SPACE TO ${LOGIN_NAME};
          GRANT SELECT ON DBA_RECYCLEBIN TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$SQL TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$SQL_PLAN TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$LOCK TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$SESSION_EVENT TO ${LOGIN_NAME};
          GRANT SELECT ON DBA_PROCEDURES TO ${LOGIN_NAME};
          GRANT SELECT ON DBA_OBJECTS TO ${LOGIN_NAME};
          GRANT SELECT ON V_\$PDBS TO ${LOGIN_NAME};
          EXIT;
          SQL
          )
          fi

          if [ $? -ne 0 ]; then
            echo "SQL script failed:" >&2
            echo "$RESULT" >&2
            exit 1
          fi
          echo "$RESULT"

          echo "Oracle Database monitoring identity configured successfully."
