# Visit our schema definition for additional information on this file format.
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition

name: nrdot-collector-oracle
displayName: NRDOT Oracle Database (Oracle Linux)
description: New Relic install recipe for Oracle Database monitoring via NRDOT Collector on Oracle Linux (OCI) self-hosted environments, one or more instances
repository: https://github.com/newrelic/nrdot-collector-releases

installTargets:
  - type: host
    os: linux
    platform: "oracle"
    platformFamily: rhel
    platformVersion: "((7|8|9)\\.?.*)"

keywords:
  - Oracle
  - Oracle Database
  - NRDOT
  - OpenTelemetry
  - OTel
  - Database
  - Linux
  - RHEL
  - OEL

processMatch: []

preInstall:
  discoveryMode:
    - targeted
  info: |
    To capture data from one or more Oracle Database hosts, we need to
    create/authorize a monitoring identity (a database user) on each. Since no SYS
    password is collected, this is done via SSH into each Oracle Database host and
    OS-authenticated SYSDBA access (sudo su - oracle -c 'sqlplus / as sysdba'). Connect
    to this host with SSH agent forwarding (ssh -A) so the forwarded key can be reused
    to reach every Database host, and make sure the SSH user for each one can run
    'sudo su - oracle' without a password prompt.

    You will be asked for two files:

      1. An instances file (YAML) listing every Oracle Database host to monitor, in the
         order you want them numbered (instance 1, 2, 3, ...). `pdb_name` is only
         required when `container_type` is 2 (PDB):

           instances:
             - host: dbhost1.example.com
               port: 1521
               ssh_user: opc
               container_type: 1
               pdb_name:
               service: ORCLCDB
               login_name: newrelic
             - host: dbhost2.example.com
               port: 1521
               ssh_user: opc
               container_type: 2
               pdb_name: ORCLPDB1
               service: ORCLPDB1
               login_name: newrelic

      2. A secrets file (KEY=VALUE per line), optional. Unlike other NRDOT database
         recipes, no admin password is needed here at all - the one-time grant step
         authenticates entirely via SSH + OS-level SYSDBA access. This file only lets
         you pin a specific monitoring password per instance instead of letting the
         recipe auto-generate one:

           NR_CLI_ORACLE_LOGIN_PASSWORD_1=<optional fixed password for instance 1>

         Leave the secrets file path blank (or point it at a file that doesn't exist)
         if you don't need to pin any passwords - every instance will auto-generate its
         own.

    Any instance that fails its version check or user setup is skipped (with a reason)
    rather than aborting the whole install - the rest are still configured.

inputVars:
  - name: NR_CLI_ORACLE_CONFIG_PRESET
    prompt: "NRDOT configuration - 1) Basic  2) Advanced: "
    default: "1"
  - name: NR_CLI_ORACLE_INSTANCES_FILE
    prompt: "Path to the Oracle instances YAML file: "
  - name: NR_CLI_ORACLE_SECRETS_FILE
    prompt: "Path to an optional secrets file for password overrides (leave blank if none): "
    default: ""

validationNrql: "SELECT count(*) FROM Metric WHERE metricName LIKE 'oracledb.%' AND instrumentation.provider = 'opentelemetry' SINCE 10 minutes ago"

successLinkConfig:
  type: EXPLORER

install:
  version: "3"
  silent: true

  vars:
    IS_SYSTEMCTL:
      sh: command -v systemctl | wc -l

  tasks:
    write_recipe_metadata:
      cmds:
        - |
          echo '{"Metadata":{"CapturedCliOutput":"true"}}' | tee {{.NR_CLI_OUTPUT}} > /dev/null

    assert_pre_req:
      cmds:
        - |
          if [ "$(id -u)" != "0" ]; then
            echo "This newrelic install must be run under sudo or root" >&2
            exit 131
          fi
        - |
          if ! command -v curl > /dev/null 2>&1; then
            echo "curl is required to run the newrelic install. Please install curl and re-run the installation." >&2
            exit 16
          fi
        - |
          if [ "{{.IS_SYSTEMCTL}}" -eq 0 ]; then
            echo "systemd is required for the nrdot-collector service configuration." >&2
            exit 131
          fi
        - |
          if [ -z "${SSH_AUTH_SOCK:-}" ]; then
            SSH_AUTH_SOCK=$(ls /tmp/ssh-*/agent.* 2>/dev/null | head -1)
          fi
          if [ -z "${SSH_AUTH_SOCK:-}" ]; then
            echo "SSH agent socket not found." >&2
            echo "Please connect to this host using SSH agent forwarding: ssh -A <user>@<this-host-ip>" >&2
            exit 131
          fi

    parse_instances:
      cmds:
        - |
          INSTANCES_FILE="{{.NR_CLI_ORACLE_INSTANCES_FILE}}"
          SECRETS_FILE="{{.NR_CLI_ORACLE_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-oracle-instances.tsv"
          SKIP_FILE="/tmp/nr-oracle-skip.tmp"

          rm -f "$INSTANCES_TSV" "$SKIP_FILE"

          if [ ! -f "$INSTANCES_FILE" ]; then
            echo "Instances file not found: $INSTANCES_FILE" >&2
            exit 131
          fi

          # Unlike other NRDOT database recipes, the secrets file here is optional -
          # there is no required admin password (the grant step authenticates via SSH +
          # OS-level SYSDBA), only an optional per-instance monitoring password override.
          if [ -n "$SECRETS_FILE" ] && [ -f "$SECRETS_FILE" ]; then
            SECRETS_PERMS=$(stat -c '%a' "$SECRETS_FILE" 2>/dev/null || stat -f '%Lp' "$SECRETS_FILE" 2>/dev/null)
            if [ -n "$SECRETS_PERMS" ]; then
              GROUP_OTHER_BITS=$(printf '%s' "$SECRETS_PERMS" | tail -c 2)
              if [ "$GROUP_OTHER_BITS" != "00" ]; then
                echo "$SECRETS_FILE is readable by group/other (permissions: $SECRETS_PERMS) - refusing to proceed." >&2
                echo "Run: chmod 600 $SECRETS_FILE" >&2
                exit 131
              fi
            fi
            # Parse KEY=VALUE pairs without executing the file as shell script
            # (unlike sourcing, which would run any shell syntax in it with this
            # recipe's root privileges).
            while IFS='=' read -r SECRET_KEY SECRET_VALUE; do
              case "$SECRET_KEY" in ''|'#'*) continue ;; esac
              printf '%s' "$SECRET_KEY" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*$' || continue
              export "$SECRET_KEY=$SECRET_VALUE"
            done < "$SECRETS_FILE"
          fi

          # Parses the fixed 7-key-per-item shape documented in preInstall.info
          # (host, port, ssh_user, container_type, pdb_name, service, login_name) - not
          # a general-purpose YAML parser.
          awk '
            /^[[:space:]]*-[[:space:]]*host:/ {
              if (have) { print host "|" port "|" ssh_user "|" container_type "|" pdb_name "|" service "|" login_name }
              host=$0; sub(/^[[:space:]]*-[[:space:]]*host:[[:space:]]*/, "", host)
              port=""; ssh_user=""; container_type=""; pdb_name=""; service=""; login_name=""; have=1; next
            }
            /^[[:space:]]*port:/ { port=$0; sub(/^[[:space:]]*port:[[:space:]]*/, "", port); next }
            /^[[:space:]]*ssh_user:/ { ssh_user=$0; sub(/^[[:space:]]*ssh_user:[[:space:]]*/, "", ssh_user); next }
            /^[[:space:]]*container_type:/ { container_type=$0; sub(/^[[:space:]]*container_type:[[:space:]]*/, "", container_type); next }
            /^[[:space:]]*pdb_name:/ { pdb_name=$0; sub(/^[[:space:]]*pdb_name:[[:space:]]*/, "", pdb_name); next }
            /^[[:space:]]*service:/ { service=$0; sub(/^[[:space:]]*service:[[:space:]]*/, "", service); next }
            /^[[:space:]]*login_name:/ { login_name=$0; sub(/^[[:space:]]*login_name:[[:space:]]*/, "", login_name); next }
            END { if (have) { print host "|" port "|" ssh_user "|" container_type "|" pdb_name "|" service "|" login_name } }
          ' "$INSTANCES_FILE" > "$INSTANCES_TSV"

          INSTANCE_COUNT=$(wc -l < "$INSTANCES_TSV" | tr -d ' ')
          if [ "$INSTANCE_COUNT" -eq 0 ]; then
            echo "No instances found in $INSTANCES_FILE" >&2
            exit 131
          fi
          echo "Found $INSTANCE_COUNT Oracle instance(s) in $INSTANCES_FILE"

          i=0
          while IFS='|' read -r ENTRY_HOST ENTRY_PORT ENTRY_SSH_USER ENTRY_CONTAINER_TYPE ENTRY_PDB_NAME ENTRY_SERVICE ENTRY_LOGIN_NAME; do
            i=$((i + 1))
            case "$ENTRY_CONTAINER_TYPE" in
              1) ;;
              2)
                if [ -z "$ENTRY_PDB_NAME" ]; then
                  echo "${i}: pdb_name is required when container_type is 2 (PDB)" >> "$SKIP_FILE"
                  echo "Instance ${i} (${ENTRY_HOST}) SKIPPED: pdb_name is required when container_type is 2 (PDB)" >&2
                fi
                ;;
              *)
                echo "${i}: container_type must be 1 (CDB) or 2 (PDB)" >> "$SKIP_FILE"
                echo "Instance ${i} (${ENTRY_HOST}) SKIPPED: container_type must be 1 (CDB) or 2 (PDB)" >&2
                ;;
            esac
            if [ -z "$ENTRY_SSH_USER" ]; then
              echo "${i}: ssh_user is required in instances file" >> "$SKIP_FILE"
              echo "Instance ${i} (${ENTRY_HOST}) SKIPPED: ssh_user is required in instances file" >&2
            fi
          done < "$INSTANCES_TSV"

    assert_oracle_version:
      cmds:
        - |
          INSTANCES_TSV="/tmp/nr-oracle-instances.tsv"
          SKIP_FILE="/tmp/nr-oracle-skip.tmp"

          if [ -z "${SSH_AUTH_SOCK:-}" ]; then
            SSH_AUTH_SOCK=$(ls /tmp/ssh-*/agent.* 2>/dev/null | head -1)
            export SSH_AUTH_SOCK
          fi

          i=0
          while IFS='|' read -r HOST PORT SSH_USER CONTAINER_TYPE PDB_NAME SERVICE_NAME LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            VERSION_OUTPUT=$(ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "${SSH_USER}@${HOST}" \
              "printf 'SET HEADING OFF FEEDBACK OFF PAGESIZE 0 TRIMSPOOL ON\nSELECT version FROM v\$instance;\nEXIT;\n' | sudo su - oracle -c 'sqlplus -S / as sysdba'")

            if [ -z "$VERSION_OUTPUT" ] || echo "$VERSION_OUTPUT" | grep -qi "ORA-\|error"; then
              echo "${i}: failed to connect via SSH to check version - $(echo "$VERSION_OUTPUT" | tr '\n' ' ' | sed 's/  */ /g')" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: failed to connect via SSH to check its version" >&2
              continue
            fi

            MAJOR_VERSION=$(echo "$VERSION_OUTPUT" | grep -oE '^[0-9]+' | head -1)

            if [ -z "$MAJOR_VERSION" ] || [ "$MAJOR_VERSION" -lt 19 ]; then
              echo "${i}: unsupported Oracle Database version ${MAJOR_VERSION:-unknown} (19c or later required)" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: unsupported Oracle Database version ${MAJOR_VERSION:-unknown}" >&2
              continue
            fi

            echo "Instance ${i} (${HOST}): Oracle Database major version ${MAJOR_VERSION} detected - supported."
          done < "$INSTANCES_TSV"

    install_nrdot:
      cmds:
        - |
          COLLECTOR_DISTRO="nrdot-collector"

          if rpm -q "$COLLECTOR_DISTRO" > /dev/null 2>&1; then
            echo "NRDOT Collector is already installed."
            echo ""
            echo "Please follow the steps below to complete the setup:"
            echo ""
            echo "  1. Create oracle-config.yaml"
            echo "     if not present. Refer to:"
            echo "     https://docs.newrelic.com/docs/opentelemetry/database/otel-oracledb/"
            echo ""
            echo "  2. Make sure the monitoring user is created"
            echo "     and has the required permissions granted."
            echo ""
            echo "  3. After making the above changes, restart the NRDOT Collector:"
            echo "     sudo systemctl restart nrdot-collector"
            echo ""
            exit 131
          fi

          COLLECTOR_VERSION=$(curl -sf "https://api.github.com/repos/newrelic/nrdot-collector-releases/releases/latest" | grep '"tag_name":' | awk -F'"' '{print $4}')
          if [ -z "$COLLECTOR_VERSION" ]; then
            echo "Failed to fetch the latest release version from GitHub. Please check your internet connection." >&2
            exit 1
          fi

          if [ "$(uname -m)" = "aarch64" ]; then
            ARCH="arm64"
          else
            ARCH="x86_64"
          fi

          DOWNLOAD_URL="https://github.com/newrelic/nrdot-collector-releases/releases/download/${COLLECTOR_VERSION}/${COLLECTOR_DISTRO}_${COLLECTOR_VERSION}_linux_${ARCH}.rpm"
          echo "Installing ${COLLECTOR_DISTRO} version: ${COLLECTOR_VERSION}"
          echo "Downloading from: ${DOWNLOAD_URL}"

          curl -L --output /tmp/nrdot-collector.rpm "$DOWNLOAD_URL"
          if [ $? -ne 0 ]; then
            echo "Failed to download the nrdot-collector package." >&2
            exit 1
          fi

          rpm -ivh /tmp/nrdot-collector.rpm
          if [ $? -ne 0 ]; then
            echo "Failed to install the nrdot-collector package." >&2
            exit 1
          fi

          rm -f /tmp/nrdot-collector.rpm
          echo "${COLLECTOR_DISTRO} installed successfully."

    configure_database_user:
      cmds:
        - |
          SECRETS_FILE="{{.NR_CLI_ORACLE_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-oracle-instances.tsv"
          SKIP_FILE="/tmp/nr-oracle-skip.tmp"

          if [ -n "$SECRETS_FILE" ] && [ -f "$SECRETS_FILE" ]; then
            # Parse KEY=VALUE pairs without executing the file as shell script
            # (unlike sourcing, which would run any shell syntax in it with this
            # recipe's root privileges) - permissions already validated in
            # parse_instances.
            while IFS='=' read -r SECRET_KEY SECRET_VALUE; do
              case "$SECRET_KEY" in ''|'#'*) continue ;; esac
              printf '%s' "$SECRET_KEY" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*$' || continue
              export "$SECRET_KEY=$SECRET_VALUE"
            done < "$SECRETS_FILE"
          fi

          if [ -z "${SSH_AUTH_SOCK:-}" ]; then
            SSH_AUTH_SOCK=$(ls /tmp/ssh-*/agent.* 2>/dev/null | head -1)
            export SSH_AUTH_SOCK
          fi

          INSTANCE_COUNT=$(wc -l < "$INSTANCES_TSV" | tr -d ' ')
          i=0
          while [ "$i" -lt "$INSTANCE_COUNT" ]; do
            i=$((i + 1))
            LINE=$(sed -n "${i}p" "$INSTANCES_TSV")
            HOST=$(printf '%s' "$LINE" | cut -d'|' -f1)
            PORT=$(printf '%s' "$LINE" | cut -d'|' -f2)
            SSH_USER=$(printf '%s' "$LINE" | cut -d'|' -f3)
            CONTAINER_TYPE=$(printf '%s' "$LINE" | cut -d'|' -f4)
            PDB_NAME=$(printf '%s' "$LINE" | cut -d'|' -f5)
            LOGIN_NAME=$(printf '%s' "$LINE" | cut -d'|' -f7)

            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            if ! printf '%s' "$LOGIN_NAME" | grep -qE '^[A-Za-z][A-Za-z0-9_]*$'; then
              echo "${i}: invalid monitoring username '${LOGIN_NAME}' in instances file" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: invalid monitoring username '${LOGIN_NAME}'" >&2
              continue
            fi

            eval "LOGIN_PASSWORD_OVERRIDE=\"\${NR_CLI_ORACLE_LOGIN_PASSWORD_${i}:-}\""

            PW_FILE="/tmp/nr-oracle-newrelic-pw-${i}.tmp"
            USER_FILE="/tmp/nr-oracle-db-user-${i}.tmp"

            (
              NR_SUCCESS=""
              trap 'if [ "$NR_SUCCESS" != "1" ]; then rm -f "$PW_FILE" "$USER_FILE"; fi' EXIT

              if [ "$CONTAINER_TYPE" = "1" ]; then
                DB_USER="c##${LOGIN_NAME}"
                SET_CONTAINER="ALTER SESSION SET CONTAINER = CDB\$ROOT;"
              else
                DB_USER="${LOGIN_NAME}"
                SET_CONTAINER="ALTER SESSION SET CONTAINER = \"${PDB_NAME}\";"
              fi

              DB_USER_UPPER=$(echo "$DB_USER" | tr '[:lower:]' '[:upper:]')

              EXISTS_SQL=$(cat << SQLEOF
          SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF
          ${SET_CONTAINER}
          SELECT username FROM dba_users WHERE username='${DB_USER_UPPER}';
          EXIT;
          SQLEOF
              )
              EXISTS_RESULT=$(ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "${SSH_USER}@${HOST}" \
                "sudo su - oracle -c 'sqlplus -S / as sysdba'" <<< "$EXISTS_SQL") || true

              if echo "$EXISTS_RESULT" | grep -qi "^[[:space:]]*${DB_USER_UPPER}[[:space:]]*$"; then
                echo ""
                echo "Instance ${i} (${HOST}): monitoring user $DB_USER already exists."
                echo ""
                echo "What would you like to do?"
                echo "  1. Use the existing user $DB_USER (you will be asked for the password)"
                echo "  2. Create a new username"
                echo ""
                read -rp "Enter your choice (1 or 2): " USER_CHOICE

                case "$USER_CHOICE" in
                  1)
                    echo ""
                    stty -echo
                    read -rp "Enter the existing password for $DB_USER: " NR_PASSWORD
                    stty echo
                    echo ""
                    printf '%s' "$NR_PASSWORD" > "$PW_FILE"
                    chmod 600 "$PW_FILE"
                    echo "$DB_USER" > "$USER_FILE"
                    chmod 600 "$USER_FILE"
                    echo "Using existing user: $DB_USER"
                    NR_SUCCESS=1
                    exit 0
                    ;;
                  2)
                    echo ""
                    echo "  Note: Just type the name without the c## prefix in CDB mode; it will be added automatically."
                    read -rp "Enter new monitoring username for instance ${i}: " NEW_USERNAME
                    LOGIN_NAME="$NEW_USERNAME"
                    if ! printf '%s' "$LOGIN_NAME" | grep -qE '^[A-Za-z][A-Za-z0-9_]*$'; then
                      echo "Invalid monitoring username: $LOGIN_NAME" >&2
                      echo "Usernames must start with a letter and contain only letters, digits, and underscores." >&2
                      exit 1
                    fi
                    if [ "$CONTAINER_TYPE" = "1" ]; then
                      DB_USER="c##${LOGIN_NAME}"
                    else
                      DB_USER="${LOGIN_NAME}"
                    fi
                    ;;
                  *)
                    echo "Invalid choice. Please re-run and enter 1 or 2." >&2
                    exit 1
                    ;;
                esac
              fi

              echo "$DB_USER" > "$USER_FILE"
              chmod 600 "$USER_FILE"

              if [ -z "$LOGIN_PASSWORD_OVERRIDE" ]; then
                _FIRST=$(cat /dev/urandom | tr -dc 'A-Z' | head -c 1)
                _UPPER=$(cat /dev/urandom | tr -dc 'A-Z' | head -c 2)
                _LOWER=$(cat /dev/urandom | tr -dc 'a-z' | head -c 6)
                _DIGITS=$(cat /dev/urandom | tr -dc '0-9' | head -c 4)
                _REST=$(printf '%s' "${_UPPER}${_LOWER}${_DIGITS}#_" | fold -w1 | shuf | tr -d '\n')
                NR_PASSWORD="${_FIRST}${_REST}"
                unset _FIRST _UPPER _LOWER _DIGITS _REST
              else
                NR_PASSWORD="$LOGIN_PASSWORD_OVERRIDE"
              fi
              printf '%s' "$NR_PASSWORD" > "$PW_FILE"
              chmod 600 "$PW_FILE"

              if [ "$CONTAINER_TYPE" = "1" ]; then
                GRANT_SQL=$(cat << SQLEOF
          WHENEVER SQLERROR EXIT SQL.SQLCODE
          ALTER SESSION SET CONTAINER = CDB\$ROOT;
          CREATE USER ${DB_USER} IDENTIFIED BY "${NR_PASSWORD}" CONTAINER=ALL;
          GRANT CREATE SESSION TO ${DB_USER} CONTAINER=ALL;
          ALTER USER ${DB_USER} SET CONTAINER_DATA=ALL CONTAINER=CURRENT;
          GRANT SELECT ON V_\$INSTANCE TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$DATABASE TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$CONTAINERS TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$DATAFILE TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$SYSSTAT TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$CON_SYSSTAT TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$SYSMETRIC TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$CON_SYSMETRIC TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$SESSION TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$RESOURCE_LIMIT TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$OSSTAT TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$SGAINFO TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$ROWCACHE TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$PARAMETER TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON CDB_TABLESPACE_USAGE_METRICS TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON CDB_TABLESPACES TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON CDB_DATA_FILES TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON DBA_DATA_FILES TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON DBA_FREE_SPACE TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON DBA_RECYCLEBIN TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$SQL TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$SQL_PLAN_STATISTICS_ALL TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$LOCK TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$SESSION_EVENT TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON DBA_PROCEDURES TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON DBA_OBJECTS TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON CDB_PROCEDURES TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON CDB_OBJECTS TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$PDBS TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON CDB_SERVICES TO ${DB_USER} CONTAINER=ALL;
          -- Optional: only needed to collect ASM diskgroup/disk metrics.
          GRANT SELECT ON V_\$ASM_DISKGROUP_STAT TO ${DB_USER} CONTAINER=ALL;
          GRANT SELECT ON V_\$ASM_DISK_STAT TO ${DB_USER} CONTAINER=ALL;
          EXIT;
          SQLEOF
                )
              else
                GRANT_SQL=$(cat << SQLEOF
          WHENEVER SQLERROR EXIT SQL.SQLCODE
          ALTER SESSION SET CONTAINER = "${PDB_NAME}";
          CREATE USER ${DB_USER} IDENTIFIED BY "${NR_PASSWORD}";
          GRANT CREATE SESSION TO ${DB_USER};
          GRANT SELECT ON V_\$INSTANCE TO ${DB_USER};
          GRANT SELECT ON V_\$DATABASE TO ${DB_USER};
          GRANT SELECT ON V_\$CONTAINERS TO ${DB_USER};
          GRANT SELECT ON V_\$DATAFILE TO ${DB_USER};
          GRANT SELECT ON V_\$SYSSTAT TO ${DB_USER};
          GRANT SELECT ON V_\$SYSMETRIC TO ${DB_USER};
          GRANT SELECT ON V_\$SESSION TO ${DB_USER};
          GRANT SELECT ON V_\$RESOURCE_LIMIT TO ${DB_USER};
          GRANT SELECT ON V_\$OSSTAT TO ${DB_USER};
          GRANT SELECT ON V_\$SGAINFO TO ${DB_USER};
          GRANT SELECT ON V_\$ROWCACHE TO ${DB_USER};
          GRANT SELECT ON V_\$PARAMETER TO ${DB_USER};
          GRANT SELECT ON DBA_TABLESPACE_USAGE_METRICS TO ${DB_USER};
          GRANT SELECT ON DBA_TABLESPACES TO ${DB_USER};
          GRANT SELECT ON DBA_DATA_FILES TO ${DB_USER};
          GRANT SELECT ON DBA_FREE_SPACE TO ${DB_USER};
          GRANT SELECT ON DBA_RECYCLEBIN TO ${DB_USER};
          GRANT SELECT ON V_\$SQL TO ${DB_USER};
          GRANT SELECT ON V_\$SQL_PLAN_STATISTICS_ALL TO ${DB_USER};
          GRANT SELECT ON V_\$LOCK TO ${DB_USER};
          GRANT SELECT ON V_\$SESSION_EVENT TO ${DB_USER};
          GRANT SELECT ON DBA_PROCEDURES TO ${DB_USER};
          GRANT SELECT ON DBA_OBJECTS TO ${DB_USER};
          GRANT SELECT ON V_\$PDBS TO ${DB_USER};
          GRANT SELECT ON CDB_SERVICES TO ${DB_USER};
          GRANT SELECT ON V_\$PROCESS TO ${DB_USER};
          GRANT SELECT ON V_\$TRANSACTION TO ${DB_USER};
          -- Optional: only needed to collect ASM diskgroup/disk metrics.
          GRANT SELECT ON V_\$ASM_DISKGROUP_STAT TO ${DB_USER};
          GRANT SELECT ON V_\$ASM_DISK_STAT TO ${DB_USER};
          EXIT;
          SQLEOF
                )
              fi

              RESULT=$(ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "${SSH_USER}@${HOST}" \
                "sudo su - oracle -c 'sqlplus -S / as sysdba'" <<< "$GRANT_SQL" 2>&1)

              SSH_STATUS=$?
              REDACT_PATTERN=$(printf '%s' "$NR_PASSWORD" | sed -e 's/[.[\*^$/]/\\&/g')
              redact() {
                if [ -n "$REDACT_PATTERN" ]; then
                  sed "s/${REDACT_PATTERN}/[REDACTED]/g"
                else
                  cat
                fi
              }

              if [ $SSH_STATUS -ne 0 ] || echo "$RESULT" | grep -qi "ORA-"; then
                echo "SQL script failed:" >&2
                echo "$RESULT" | redact >&2
                exit 1
              fi
              echo "$RESULT" | redact

              NR_SUCCESS=1
              echo "Oracle Database monitoring identity configured successfully for instance ${i}: $DB_USER"
            )
            SUBSHELL_STATUS=$?
            if [ $SUBSHELL_STATUS -ne 0 ]; then
              echo "${i}: monitoring user setup failed (see errors above)" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: monitoring user setup failed" >&2
            fi
          done

