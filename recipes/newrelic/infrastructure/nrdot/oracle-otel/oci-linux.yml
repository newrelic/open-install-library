          )

          # Preset 1 = Basic (essential metrics), 2 = Advanced (full metric list).
          if [ "$PRESET" = "2" ]; then
            RECEIVER_METRICS="$RECEIVER_METRICS_ADVANCED"
          else
            RECEIVER_METRICS="$RECEIVER_METRICS_BASIC"
          fi
          RECEIVER_DEFAULTS=$(printf '%s\n%s' "$RECEIVER_COMMON" "$RECEIVER_METRICS")

          cat > "$CONFIG_PATH" << 'EOF'
          receivers:
          EOF

          # Count survivors up front to decide whether the anchor/merge-key pattern from
          # https://docs.newrelic.com/docs/opentelemetry/database/otel-oracledb/#rds-multi-receiver-config
          # applies - a single instance has nothing to merge into, so it gets a plain
          # unsuffixed receiver (nroracledb); with several, each is named nroracledb/<i>.
          SURVIVOR_COUNT=0
          i=0
          while IFS='|' read -r HOST PORT SSH_USER CONTAINER_TYPE PDB_NAME SERVICE_NAME LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi
            SURVIVOR_COUNT=$((SURVIVOR_COUNT + 1))
          done < "$INSTANCES_TSV"

          MONITORED_COUNT=0
          IS_FIRST_SURVIVOR=1
          RECEIVER_LIST=""
          i=0
          while IFS='|' read -r HOST PORT SSH_USER CONTAINER_TYPE PDB_NAME SERVICE_NAME LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            PW_FILE="/tmp/nr-oracle-newrelic-pw-${i}.tmp"
            USER_FILE="/tmp/nr-oracle-db-user-${i}.tmp"
            if [ ! -f "$PW_FILE" ] || [ ! -f "$USER_FILE" ]; then
              echo "${i}: monitoring credentials missing at config-generation time" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: monitoring credentials missing at config-generation time" >&2
              continue
            fi

            NR_PASSWORD=$(cat "$PW_FILE")
            CONFIGURED_LOGIN_NAME=$(cat "$USER_FILE")

            if [ "$SURVIVOR_COUNT" -eq 1 ]; then
              RECEIVER_NAME="nroracledb"
              {
                echo "  ${RECEIVER_NAME}:"
                echo "    endpoint: \"${HOST}:${PORT}\""
                echo "    username: \"${CONFIGURED_LOGIN_NAME}\""
                echo "    password: \"${NR_PASSWORD}\""
                echo "    service: \"${SERVICE_NAME}\""
                echo "$RECEIVER_DEFAULTS"
              } >> "$CONFIG_PATH"
            elif [ "$IS_FIRST_SURVIVOR" -eq 1 ]; then
              RECEIVER_NAME="nroracledb/${i}"
              {
                echo "  ${RECEIVER_NAME}: &nroracledb-common"
                echo "    endpoint: \"${HOST}:${PORT}\""
                echo "    username: \"${CONFIGURED_LOGIN_NAME}\""
                echo "    password: \"${NR_PASSWORD}\""
                echo "    service: \"${SERVICE_NAME}\""
                echo "$RECEIVER_DEFAULTS"
              } >> "$CONFIG_PATH"
              IS_FIRST_SURVIVOR=0
            else
              RECEIVER_NAME="nroracledb/${i}"
              {
                echo "  ${RECEIVER_NAME}:"
                echo "    <<: *nroracledb-common"
                echo "    endpoint: \"${HOST}:${PORT}\""
                echo "    username: \"${CONFIGURED_LOGIN_NAME}\""
                echo "    password: \"${NR_PASSWORD}\""
                echo "    service: \"${SERVICE_NAME}\""
              } >> "$CONFIG_PATH"
            fi

            RECEIVER_LIST="${RECEIVER_LIST}${RECEIVER_LIST:+, }${RECEIVER_NAME}"
            MONITORED_COUNT=$((MONITORED_COUNT + 1))
          done < "$INSTANCES_TSV"

          if [ "$MONITORED_COUNT" -eq 0 ]; then
            echo "No Oracle instance passed its checks - nothing to monitor. Aborting install." >&2
            exit 1
          fi

          cat >> "$CONFIG_PATH" << EOF

          exporters:
            otlp/newrelic:
              endpoint: ${OTLP_ENDPOINT}
              headers:
                api-key: ${LICENSE_KEY}
              compression: gzip
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_interval: 30s
                max_elapsed_time: 300s
              sending_queue:
                enabled: true
                sizer: bytes
                queue_size: 100_000_000
                num_consumers: 10
                batch:
                  sizer: bytes
                  max_size: 1_000_000
                  min_size: 0
                  flush_timeout: 5s

          service:
            pipelines:
          EOF

          cat >> "$CONFIG_PATH" << EOF
              metrics/oracledb:
                receivers: [${RECEIVER_LIST}]
                exporters: [otlp/newrelic]
              logs/oracledb:
                receivers: [${RECEIVER_LIST}]
                exporters: [otlp/newrelic]
          EOF

          chown nrdot-collector:nrdot-collector "$CONFIG_PATH"
          chmod 600 "$CONFIG_PATH"

          EXISTING_OPTIONS=$(grep "^OTELCOL_OPTIONS=" "$ENV_FILE" 2>/dev/null | sed 's/^OTELCOL_OPTIONS=//' | tr -d '"')
          if echo "$EXISTING_OPTIONS" | grep -q -- "--config=${CONFIG_PATH}"; then
            OTELCOL_OPTIONS="$EXISTING_OPTIONS"
          else
            OTELCOL_OPTIONS="--config=${CONFIG_PATH}"
          fi

          if grep -q "^OTELCOL_OPTIONS=" "$ENV_FILE" 2>/dev/null; then
            sed -i "s|^OTELCOL_OPTIONS=.*|OTELCOL_OPTIONS=\"${OTELCOL_OPTIONS}\"|" "$ENV_FILE"
          else
            echo "OTELCOL_OPTIONS=\"${OTELCOL_OPTIONS}\"" | tee -a "$ENV_FILE" > /dev/null
          fi

          echo "Oracle OTel config written to ${CONFIG_PATH} (${MONITORED_COUNT} instance(s))"
          echo "OTELCOL_OPTIONS updated in ${ENV_FILE}: ${OTELCOL_OPTIONS}"

    restart_nrdot:
      cmds:
        - |
          echo ""
          echo "==> Restarting NRDOT Collector..."
          sudo systemctl restart nrdot-collector

          echo ""
          echo "==> NRDOT Collector service status:"
          echo ""
          sudo systemctl status nrdot-collector --no-pager

          if sudo systemctl is-active --quiet nrdot-collector; then
            echo ""
            echo -e "\e[32mNRDOT Collector is running successfully.\e[0m"
          else
            echo ""
            echo -e "\e[31mERROR:\e[0m NRDOT Collector failed to start. Check the status output above." >&2
            exit 131
          fi

          INSTANCES_TSV="/tmp/nr-oracle-instances.tsv"
          SKIP_FILE="/tmp/nr-oracle-skip.tmp"

          echo ""
          echo "==> Oracle instance summary:"
          echo ""
          i=0
          while IFS='|' read -r HOST PORT SSH_USER CONTAINER_TYPE PDB_NAME SERVICE_NAME LOGIN_NAME; do
            i=$((i + 1))
            REASON=$(grep "^${i}:" "$SKIP_FILE" 2>/dev/null | sed "s/^${i}: //")
            if [ -n "$REASON" ]; then
              echo "  [SKIP] ${i}: ${HOST} (service ${SERVICE_NAME}) - ${REASON}"
            else
              echo "  [OK]   ${i}: ${HOST} (service ${SERVICE_NAME})"
            fi
          done < "$INSTANCES_TSV"

          rm -f /tmp/nr-oracle-newrelic-pw-*.tmp /tmp/nr-oracle-db-user-*.tmp "$INSTANCES_TSV" "$SKIP_FILE"

    default:
      cmds:
        - task: write_recipe_metadata
        - task: assert_pre_req
        - task: parse_instances
        - task: assert_oracle_version
        - task: install_nrdot
        - task: configure_database_user
        - task: create_collector_config
        - task: restart_nrdot

postInstall:
  info: |2
      Oracle OTel config: /etc/nrdot-collector/oracle-config.yaml
      Env file:            /etc/nrdot-collector/nrdot-collector.conf
      Service status:      systemctl status nrdot-collector
      View logs:            journalctl -u nrdot-collector -f
      Restart service:      sudo systemctl restart nrdot-collector
