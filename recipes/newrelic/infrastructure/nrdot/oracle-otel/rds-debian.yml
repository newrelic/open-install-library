# Visit our schema definition for additional information on this file format.
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition
# WORK IN PROGRESS - not for use.

name: nrdot-collector-oracle-rds
displayName: NRDOT Oracle Database (AWS RDS, Debian/Ubuntu collector host)
description: New Relic install recipe for Oracle Database monitoring via NRDOT Collector against one or more AWS RDS Oracle instances, collector installed on Debian/Ubuntu
repository: https://github.com/newrelic/nrdot-collector-releases

installTargets:
  - type: host
    os: linux
    platformFamily: debian
  - type: host
    os: linux
    platform: ubuntu

keywords:
  - Oracle
  - Oracle Database
  - RDS
  - NRDOT
  - OpenTelemetry
  - OTel
  - Database
  - Linux
  - Debian
  - Ubuntu

processMatch: []

preInstall:
  discoveryMode:
    - targeted
  info: |
    To capture data from one or more RDS Oracle Databases, we need to create/authorize a
    monitoring identity (a database user) on each instance, using each instance's RDS
    master user credentials.

    You will be asked for two files:

      1. An instances file (YAML) listing every RDS Oracle instance to monitor, in the
         order you want them numbered (instance 1, 2, 3, ...):

           instances:
             - host: rds-orders.xxxx.us-east-1.rds.amazonaws.com
               port: 1521
               service: ORDERSDB
               login_name: newrelic
             - host: rds-billing.xxxx.us-east-1.rds.amazonaws.com
               port: 1521
               service: BILLINGDB
               login_name: newrelic

      2. A secrets file (KEY=VALUE per line) supplying the RDS master credentials for
         each instance above, indexed to match the instances file's order (1-based):

           NR_CLI_ORACLE_ADMIN_USER_1=admin
           NR_CLI_ORACLE_ADMIN_PASSWORD_1=<master password for instance 1>
           NR_CLI_ORACLE_ADMIN_USER_2=admin
           NR_CLI_ORACLE_ADMIN_PASSWORD_2=<master password for instance 2>
           NR_CLI_ORACLE_LOGIN_PASSWORD_1=<optional - leave unset to auto-generate>

         NR_CLI_ORACLE_ADMIN_USER_<i> / NR_CLI_ORACLE_ADMIN_PASSWORD_<i> are required
         for every instance. NR_CLI_ORACLE_LOGIN_PASSWORD_<i> is optional.

    Any instance that fails its version check or user setup is skipped (with a reason)
    rather than aborting the whole install - the rest are still configured.

inputVars:
  - name: NR_CLI_ORACLE_CONFIG_PRESET
    prompt: "NRDOT configuration - 1) Database only  2) Host + Database: "
    default: "1"
  - name: NR_CLI_ORACLE_INSTANCES_FILE
    prompt: "Path to the Oracle RDS instances YAML file: "
  - name: NR_CLI_ORACLE_SECRETS_FILE
    prompt: "Path to the Oracle RDS secrets file (KEY=VALUE per instance): "

validationNrql: "SELECT count(*) FROM Metric WHERE metricName LIKE 'oracledb.%' AND instrumentation.provider = 'opentelemetry' SINCE 10 minutes ago"

successLinkConfig:
  type: EXPLORER

install:
  version: "3"
  silent: true

  vars:
    IS_SYSTEMCTL:
      sh: command -v systemctl | wc -l

  tasks:
    write_recipe_metadata:
      cmds:
        - |
          echo '{"Metadata":{"CapturedCliOutput":"true"}}' | tee {{.NR_CLI_OUTPUT}} > /dev/null

    assert_pre_req:
      cmds:
        - |
          if [ "$(id -u)" != "0" ]; then
            echo "This newrelic install must be run under sudo or root" >&2
            exit 131
          fi
        - |
          if ! command -v curl > /dev/null 2>&1; then
            echo "curl is required to run the newrelic install. Please install curl and re-run the installation." >&2
            exit 16
          fi
        - |
          if [ "{{.IS_SYSTEMCTL}}" -eq 0 ]; then
            echo "systemd is required for the nrdot-collector service configuration." >&2
            exit 131
          fi

    parse_instances:
      cmds:
        - |
          INSTANCES_FILE="{{.NR_CLI_ORACLE_INSTANCES_FILE}}"
          SECRETS_FILE="{{.NR_CLI_ORACLE_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-oracle-rds-instances.tsv"
          SKIP_FILE="/tmp/nr-oracle-rds-skip.tmp"

          rm -f "$INSTANCES_TSV" "$SKIP_FILE"

          if [ ! -f "$INSTANCES_FILE" ]; then
            echo "Instances file not found: $INSTANCES_FILE" >&2
            exit 131
          fi
          if [ ! -f "$SECRETS_FILE" ]; then
            echo "Secrets file not found: $SECRETS_FILE" >&2
            exit 131
          fi

          SECRETS_PERMS=$(stat -c '%a' "$SECRETS_FILE" 2>/dev/null || stat -f '%Lp' "$SECRETS_FILE" 2>/dev/null)
          if [ -n "$SECRETS_PERMS" ]; then
            GROUP_OTHER_BITS=$(printf '%s' "$SECRETS_PERMS" | tail -c 2)
            if [ "$GROUP_OTHER_BITS" != "00" ]; then
              echo "WARNING: $SECRETS_FILE is readable by group/other (permissions: $SECRETS_PERMS)." >&2
              echo "         Consider running: chmod 600 $SECRETS_FILE" >&2
            fi
          fi

          # shellcheck disable=SC1090
          . "$SECRETS_FILE"

          # Parses the fixed 4-key-per-item shape documented in preInstall.info
          # (host, port, service, login_name) - not a general-purpose YAML parser.
          awk '
            /^[[:space:]]*-[[:space:]]*host:/ {
              if (have) { print host "\t" port "\t" service "\t" login_name }
              host=$0; sub(/^[[:space:]]*-[[:space:]]*host:[[:space:]]*/, "", host)
              port=""; service=""; login_name=""; have=1; next
            }
            /^[[:space:]]*port:/ { port=$0; sub(/^[[:space:]]*port:[[:space:]]*/, "", port); next }
            /^[[:space:]]*service:/ { service=$0; sub(/^[[:space:]]*service:[[:space:]]*/, "", service); next }
            /^[[:space:]]*login_name:/ { login_name=$0; sub(/^[[:space:]]*login_name:[[:space:]]*/, "", login_name); next }
            END { if (have) { print host "\t" port "\t" service "\t" login_name } }
          ' "$INSTANCES_FILE" > "$INSTANCES_TSV"

          INSTANCE_COUNT=$(wc -l < "$INSTANCES_TSV" | tr -d ' ')
          if [ "$INSTANCE_COUNT" -eq 0 ]; then
            echo "No instances found in $INSTANCES_FILE" >&2
            exit 131
          fi
          echo "Found $INSTANCE_COUNT Oracle RDS instance(s) in $INSTANCES_FILE"

          i=0
          while IFS="$(printf '\t')" read -r ENTRY_HOST ENTRY_PORT ENTRY_SERVICE ENTRY_LOGIN_NAME; do
            i=$((i + 1))
            eval "ADMIN_USER_VAL=\"\${NR_CLI_ORACLE_ADMIN_USER_${i}:-}\""
            eval "ADMIN_PASSWORD_VAL=\"\${NR_CLI_ORACLE_ADMIN_PASSWORD_${i}:-}\""
            if [ -z "$ADMIN_USER_VAL" ] || [ -z "$ADMIN_PASSWORD_VAL" ]; then
              echo "${i}: missing NR_CLI_ORACLE_ADMIN_USER_${i}/NR_CLI_ORACLE_ADMIN_PASSWORD_${i} in secrets file" >> "$SKIP_FILE"
              echo "Instance ${i} (${ENTRY_HOST}) SKIPPED: missing admin credentials in secrets file" >&2
            fi
          done < "$INSTANCES_TSV"

    assert_oracle_version:
      cmds:
        - |
          SECRETS_FILE="{{.NR_CLI_ORACLE_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-oracle-rds-instances.tsv"
          SKIP_FILE="/tmp/nr-oracle-rds-skip.tmp"

          # shellcheck disable=SC1090
          . "$SECRETS_FILE"

          i=0
          while IFS="$(printf '\t')" read -r HOST PORT SERVICE_NAME LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            eval "ADMIN_USER=\"\${NR_CLI_ORACLE_ADMIN_USER_${i}}\""
            eval "ADMIN_PASSWORD=\"\${NR_CLI_ORACLE_ADMIN_PASSWORD_${i}}\""

            VERSION_OUTPUT=$(sqlplus -S /nolog << EOF
          WHENEVER SQLERROR EXIT SQL.SQLCODE
          CONNECT ${ADMIN_USER}/${ADMIN_PASSWORD}@${HOST}:${PORT}/${SERVICE_NAME}
          SET HEADING OFF FEEDBACK OFF PAGESIZE 0 TRIMSPOOL ON
          SELECT version FROM v\$instance;
          EXIT;
          EOF
          )
            if [ $? -ne 0 ] || echo "$VERSION_OUTPUT" | grep -qi "ORA-\|SP2-"; then
              echo "${i}: failed to connect / check version - $(echo "$VERSION_OUTPUT" | tr '\n' ' ' | sed 's/  */ /g')" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: failed to connect to check its version" >&2
              continue
            fi

            MAJOR_VERSION=$(echo "$VERSION_OUTPUT" | grep -oE '^[0-9]+' | head -1)

            if [ -z "$MAJOR_VERSION" ] || [ "$MAJOR_VERSION" -lt 19 ]; then
              echo "${i}: unsupported Oracle Database version ${MAJOR_VERSION:-unknown} (19c or later required)" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: unsupported Oracle Database version ${MAJOR_VERSION:-unknown}" >&2
              continue
            fi

            echo "Instance ${i} (${HOST}): Oracle Database major version ${MAJOR_VERSION} detected - supported."
          done < "$INSTANCES_TSV"

    install_nrdot:
      cmds:
        - |
          COLLECTOR_DISTRO="nrdot-collector"

          if dpkg -l | grep -q "^ii.*${COLLECTOR_DISTRO} "; then
            echo "NRDOT Collector is already installed."
            echo ""
            echo "Please follow the steps below to complete the setup:"
            echo ""
            echo "  1. Create oracle-config.yaml"
            echo "     if not present. Refer to:"
            echo "     https://docs.newrelic.com/docs/opentelemetry/database/otel-oracledb/"
            echo ""
            echo "  2. Make sure the monitoring user is created"
            echo "     and has the required permissions granted."
            echo ""
            echo "  3. After making the above changes, restart the NRDOT Collector:"
            echo "     sudo systemctl restart nrdot-collector"
            echo ""
            exit 131
          fi

          COLLECTOR_VERSION=$(curl -sf "https://api.github.com/repos/newrelic/nrdot-collector-releases/releases/latest" | grep '"tag_name":' | awk -F'"' '{print $4}')
          if [ -z "$COLLECTOR_VERSION" ]; then
            echo "Failed to fetch the latest release version from GitHub. Please check your internet connection." >&2
            exit 1
          fi

          if [ "$(uname -m)" = "aarch64" ]; then
            ARCH="arm64"
          else
            ARCH="amd64"
          fi

          DOWNLOAD_URL="https://github.com/newrelic/nrdot-collector-releases/releases/download/${COLLECTOR_VERSION}/${COLLECTOR_DISTRO}_${COLLECTOR_VERSION}_linux_${ARCH}.deb"
          echo "Installing ${COLLECTOR_DISTRO} version: ${COLLECTOR_VERSION}"
          echo "Downloading from: ${DOWNLOAD_URL}"

          curl -L --output /tmp/nrdot-collector.deb "$DOWNLOAD_URL"
          if [ $? -ne 0 ]; then
            echo "Failed to download the nrdot-collector package." >&2
            exit 1
          fi

          DEBIAN_FRONTEND=noninteractive dpkg -i /tmp/nrdot-collector.deb
          if [ $? -ne 0 ]; then
            echo "dpkg install failed, attempting to fix broken dependencies..." >&2
            apt-get -o DPkg::Lock::Timeout=60 install -f -y
            if [ $? -ne 0 ]; then
              echo "Failed to install the nrdot-collector package." >&2
              exit 1
            fi
          fi

          rm -f /tmp/nrdot-collector.deb
          echo "${COLLECTOR_DISTRO} installed successfully."

    configure_database_user:
      cmds:
        - |
          SECRETS_FILE="{{.NR_CLI_ORACLE_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-oracle-rds-instances.tsv"
          SKIP_FILE="/tmp/nr-oracle-rds-skip.tmp"

          # shellcheck disable=SC1090
          . "$SECRETS_FILE"

          INSTANCE_COUNT=$(wc -l < "$INSTANCES_TSV" | tr -d ' ')
          i=0
          while [ "$i" -lt "$INSTANCE_COUNT" ]; do
            i=$((i + 1))
            LINE=$(sed -n "${i}p" "$INSTANCES_TSV")
            HOST=$(printf '%s' "$LINE" | cut -f1)
            PORT=$(printf '%s' "$LINE" | cut -f2)
            SERVICE_NAME=$(printf '%s' "$LINE" | cut -f3)
            LOGIN_NAME=$(printf '%s' "$LINE" | cut -f4)

            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            eval "ADMIN_USER=\"\${NR_CLI_ORACLE_ADMIN_USER_${i}}\""
            eval "ADMIN_PASSWORD=\"\${NR_CLI_ORACLE_ADMIN_PASSWORD_${i}}\""
            eval "LOGIN_PASSWORD_OVERRIDE=\"\${NR_CLI_ORACLE_LOGIN_PASSWORD_${i}:-}\""

            PW_FILE="/tmp/nr-oracle-rds-newrelic-pw-${i}.tmp"
            USER_FILE="/tmp/nr-oracle-rds-db-user-${i}.tmp"

            (
              NR_SUCCESS=""
              trap 'if [ "$NR_SUCCESS" != "1" ]; then rm -f "$PW_FILE" "$USER_FILE"; fi' EXIT

              if ! printf '%s' "$LOGIN_NAME" | grep -qE '^[A-Za-z][A-Za-z0-9_]*$'; then
                echo "Invalid monitoring username: $LOGIN_NAME" >&2
                echo "Usernames must start with a letter and contain only letters, digits, and underscores." >&2
                exit 1
              fi

              LOGIN_UPPER=$(echo "$LOGIN_NAME" | tr '[:lower:]' '[:upper:]')

              EXISTS_RESULT=$(sqlplus -S /nolog << SQL 2>&1
          CONNECT ${ADMIN_USER}/${ADMIN_PASSWORD}@${HOST}:${PORT}/${SERVICE_NAME}
          SET PAGESIZE 0 FEEDBACK OFF VERIFY OFF HEADING OFF ECHO OFF
          SELECT username FROM dba_users WHERE username='${LOGIN_UPPER}';
          EXIT;
          SQL
          ) || true

              if echo "$EXISTS_RESULT" | grep -qi "^[[:space:]]*${LOGIN_UPPER}[[:space:]]*$"; then
                echo ""
                echo "Instance ${i} (${HOST}): monitoring user $LOGIN_NAME already exists."
                echo ""
                echo "What would you like to do?"
                echo "  1. Use the existing user $LOGIN_NAME (you will be asked for the password)"
                echo "  2. Create a new username"
                echo ""
                read -rp "Enter your choice (1 or 2): " USER_CHOICE

                case "$USER_CHOICE" in
                  1)
                    echo ""
                    stty -echo
                    read -rp "Enter the existing password for $LOGIN_NAME: " NR_PASSWORD
                    stty echo
                    echo ""
                    printf '%s' "$NR_PASSWORD" > "$PW_FILE"
                    chmod 600 "$PW_FILE"
                    echo "$LOGIN_NAME" > "$USER_FILE"
                    chmod 600 "$USER_FILE"
                    echo "Using existing user: $LOGIN_NAME"
                    NR_SUCCESS=1
                    exit 0
                    ;;
                  2)
                    echo ""
                    read -rp "Enter new monitoring username for instance ${i}: " NEW_USERNAME
                    LOGIN_NAME="$NEW_USERNAME"
                    LOGIN_UPPER=$(echo "$LOGIN_NAME" | tr '[:lower:]' '[:upper:]')
                    ;;
                  *)
                    echo "Invalid choice. Please re-run and enter 1 or 2." >&2
                    exit 1
                    ;;
                esac
              fi

              if ! printf '%s' "$LOGIN_NAME" | grep -qE '^[A-Za-z][A-Za-z0-9_]*$'; then
                echo "Invalid monitoring username: $LOGIN_NAME" >&2
                echo "Usernames must start with a letter and contain only letters, digits, and underscores." >&2
                exit 1
              fi

              echo "$LOGIN_NAME" > "$USER_FILE"
              chmod 600 "$USER_FILE"

              if [ -z "$LOGIN_PASSWORD_OVERRIDE" ]; then
                NR_PASSWORD=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 24)
              else
                NR_PASSWORD="$LOGIN_PASSWORD_OVERRIDE"
              fi
              printf '%s' "$NR_PASSWORD" > "$PW_FILE"
              chmod 600 "$PW_FILE"

              RESULT=$(sqlplus -S /nolog << SQL 2>&1
          WHENEVER SQLERROR EXIT SQL.SQLCODE
          CONNECT ${ADMIN_USER}/${ADMIN_PASSWORD}@${HOST}:${PORT}/${SERVICE_NAME}
          CREATE USER ${LOGIN_NAME} IDENTIFIED BY "${NR_PASSWORD}";
          GRANT CONNECT TO ${LOGIN_NAME};
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$SYSMETRIC', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$CON_SYSMETRIC', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$CONTAINERS', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$SESSION', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$SESSION_EVENT', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$SYSSTAT', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$CON_SYSSTAT', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$OSSTAT', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$SGAINFO', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$SQL', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$SQLSTATS', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$SQL_PLAN', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$PARAMETER', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$ROWCACHE', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$RESOURCE_LIMIT', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$LOCK', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$DATABASE', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$INSTANCE', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$DATAFILE', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('V_\$PDBS', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('DBA_DATA_FILES', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('DBA_FREE_SPACE', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('DBA_RECYCLEBIN', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('DBA_TABLESPACES', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('DBA_TABLESPACE_USAGE_METRICS', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('DBA_PROCEDURES', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('DBA_OBJECTS', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('CDB_TABLESPACE_USAGE_METRICS', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('CDB_TABLESPACES', '${LOGIN_UPPER}', 'SELECT', false);
          EXEC rdsadmin.rdsadmin_util.grant_sys_object('CDB_SERVICES', '${LOGIN_UPPER}', 'SELECT', false);
          GRANT CREATE SESSION TO ${LOGIN_UPPER};
          EXIT;
          SQL
          )

              SQLPLUS_STATUS=$?
              REDACT_PATTERN=$(printf '%s' "$NR_PASSWORD" | sed -e 's/[.[\*^$/]/\\&/g')
              redact() {
                if [ -n "$REDACT_PATTERN" ]; then
                  sed "s/${REDACT_PATTERN}/[REDACTED]/g"
                else
                  cat
                fi
              }

              if [ $SQLPLUS_STATUS -ne 0 ] || echo "$RESULT" | grep -qi "ORA-"; then
                echo "SQL script failed:" >&2
                echo "$RESULT" | redact >&2
                exit 1
              fi
              echo "$RESULT" | redact

              NR_SUCCESS=1
              echo "RDS Oracle Database monitoring identity configured successfully for instance ${i}: $LOGIN_NAME"
            )
            SUBSHELL_STATUS=$?
            if [ $SUBSHELL_STATUS -ne 0 ]; then
              echo "${i}: monitoring user setup failed (see errors above)" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: monitoring user setup failed" >&2
            fi
          done

    create_collector_config:
      cmds:
        - |
          PRESET="{{.NR_CLI_ORACLE_CONFIG_PRESET}}"
          REGION="{{.NEW_RELIC_REGION}}"
          LICENSE_KEY="{{.NEW_RELIC_LICENSE_KEY}}"
          CONFIG_DIR="/etc/nrdot-collector"
          CONFIG_PATH="${CONFIG_DIR}/oracle-config.yaml"
          ENV_FILE="${CONFIG_DIR}/nrdot-collector.conf"
          INSTANCES_TSV="/tmp/nr-oracle-rds-instances.tsv"
          SKIP_FILE="/tmp/nr-oracle-rds-skip.tmp"

          mkdir -p "$CONFIG_DIR"

          case "$REGION" in
            staging) OTLP_ENDPOINT="https://staging-otlp.nr-data.net:4317" ;;
            EU)      OTLP_ENDPOINT="https://otlp.eu01.nr-data.net:4317" ;;
            JP)      OTLP_ENDPOINT="https://otlp.jp.nr-data.net:4317" ;;
            *)       OTLP_ENDPOINT="https://otlp.nr-data.net:4317" ;;
          esac

          # Shared receiver settings (events/top_query/query_sample/session_wait/metrics/
          # resource_attributes) are identical for every instance. Captured once here and
          # echoed per instance below instead of relying on the collector's YAML loader to
          # support merge-key aliases (unverified) - this keeps the generated file plain,
          # fully-resolved YAML.
          RECEIVER_DEFAULTS=$(cat << 'BLOCK'
              collection_interval: 10s
              events:
                db.server.query_sample:
                  enabled: true
                db.server.top_query:
                  enabled: true
                db.server.session.wait_sample:
                  enabled: true
              top_query_collection:
                max_query_sample_count: 1000
                top_query_count: 200
                collection_interval: 60s
                allowed_comment_keys:
                  - nr_service_guid
              query_sample_collection:
                max_rows_per_query: 100
                allowed_comment_keys:
                  - nr_service_guid
              session_wait_event_collection:
                max_rows_per_query: 100
              metrics:
                oracledb.cpu_time:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                # DISABLED on RDS: v$sysmetric empty in PDB.
                oracledb.database.cpu.utilization:
                  enabled: false
                  attributes:
                    - oracle.db.pdb
                # DISABLED on RDS: v$sysmetric empty in PDB.
                oracledb.host.cpu.utilization:
                  enabled: false
                  attributes:
                    - oracle.db.pdb
                oracledb.executions:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                # DISABLED on RDS: v$sysmetric empty in PDB.
                oracledb.execution.utilization:
                  enabled: false
                  attributes:
                    - oracledb.parse.type
                    - oracle.db.pdb
                oracledb.parse_calls:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                # DISABLED on RDS: v$sysmetric empty in PDB.
                oracledb.parse.rate:
                  enabled: false
                  attributes:
                    - oracledb.parse.result
                    - oracle.db.pdb
                # DISABLED on RDS: v$sysmetric empty in PDB.
                oracledb.parse.utilization:
                  enabled: false
                  attributes:
                    - oracle.db.pdb
                oracledb.hard_parses:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.logical_reads:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.physical_reads:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.physical_reads_direct:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.physical_writes:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.physical_writes_direct:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.physical_read_io_requests:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.physical_write_io_requests:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.physical_io.cache_writes:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.physical_io.requests:
                  enabled: true
                  attributes:
                    - disk.io.direction
                    - disk.io.block_size
                    - oracle.db.pdb
                oracledb.physical_io.transferred:
                  enabled: true
                  attributes:
                    - disk.io.direction
                    - disk.io.type
                    - oracle.db.pdb
                oracledb.sqlnet.io.transferred:
                  enabled: true
                  attributes:
                    - network.io.direction
                    - destination.type
                    - oracle.db.pdb
                oracledb.consistent_gets:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.db_block_gets:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                # DISABLED on RDS: v$sysmetric empty in PDB.
                oracledb.buffer_cache.utilization:
                  enabled: false
                  attributes:
                    - oracle.db.pdb
                # DISABLED on RDS: v$sysmetric empty in PDB.
                oracledb.library_cache.utilization:
                  enabled: false
                  attributes:
                    - oracle.db.pdb
                oracledb.data_dictionary.hit_ratio:
                  enabled: true
                # DISABLED on RDS: v$sysmetric empty in PDB.
                oracledb.shared_pool.utilization:
                  enabled: false
                  attributes:
                    - oracle.db.pdb
                oracledb.pga_memory:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.sga.limit:
                  enabled: true
                oracledb.sga.usage:
                  enabled: true
                  attributes:
                    - oracledb.sga.component.name
                # DISABLED on RDS: v$sysmetric empty in PDB.
                oracledb.database.wait.utilization:
                  enabled: false
                  attributes:
                    - oracle.db.pdb
                # DISABLED on RDS: v$resource_limit empty in PDB.
                oracledb.dml_locks.limit:
                  enabled: false
                oracledb.dml_locks.usage:
                  enabled: false
                oracledb.enqueue_locks.limit:
                  enabled: false
                oracledb.enqueue_locks.usage:
                  enabled: false
                oracledb.enqueue_resources.limit:
                  enabled: false
                oracledb.enqueue_resources.usage:
                  enabled: false
                oracledb.enqueue_deadlocks:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.exchange_deadlocks:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                # DISABLED on RDS: v$resource_limit empty in PDB.
                oracledb.processes.limit:
                  enabled: false
                oracledb.processes.usage:
                  enabled: false
                oracledb.sessions.limit:
                  enabled: false
                # KEEP enabled: sessions.usage is sourced from v$session, not v$resource_limit.
                oracledb.sessions.usage:
                  enabled: true
                  attributes:
                    - session_type
                    - session_status
                    - oracle.db.pdb
                oracledb.logons:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                # DISABLED on RDS: v$resource_limit empty in PDB.
                oracledb.transactions.limit:
                  enabled: false
                oracledb.transactions.usage:
                  enabled: false
                oracledb.user_commits:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.user_rollbacks:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.tablespace_size.limit:
                  enabled: true
                  attributes:
                    - tablespace_name
                    - oracle.db.pdb
                oracledb.tablespace_size.usage:
                  enabled: true
                  attributes:
                    - tablespace_name
                    - oracle.db.pdb
                oracledb.storage.usage:
                  enabled: true
                oracledb.storage.utilization:
                  enabled: true
                oracledb.recycle_bin.limit:
                  enabled: true
                oracledb.queries_parallelized:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.ddl_statements_parallelized:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.dml_statements_parallelized:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.parallel_operations_not_downgraded:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.parallel_operations_downgraded_1_to_25_pct:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.parallel_operations_downgraded_25_to_50_pct:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.parallel_operations_downgraded_50_to_75_pct:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.parallel_operations_downgraded_75_to_99_pct:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                oracledb.parallel_operations_downgraded_to_serial:
                  enabled: true
                  attributes:
                    - oracle.db.pdb
                # DISABLED on RDS: v$sysmetric empty in PDB.
                oracledb.redo_allocation.utilization:
                  enabled: false
                  attributes:
                    - oracle.db.pdb
                # DISABLED on RDS: v$sysmetric empty in PDB.
                oracledb.sort.ratio:
                  enabled: false
                  attributes:
                    - oracledb.sort.type
                    - oracle.db.pdb
                # DISABLED on RDS: v$sysmetric empty in PDB.
                oracledb.sql_service.response.duration:
                  enabled: false
                  attributes:
                    - oracle.db.pdb
              resource_attributes:
                host.name:
                  enabled: true
                oracle.db.hosting_type:
                  enabled: true
                oracle.db.open_mode:
                  enabled: true
                oracle.db.role:
                  enabled: true
                oracle.db.version:
                  enabled: true
                oracledb.instance.name:
                  enabled: true
                service.instance.id:
                  enabled: true
          BLOCK
          )

          if [ "$PRESET" = "2" ]; then
            cat > "$CONFIG_PATH" << 'EOF'
          extensions:
            health_check:

          receivers:
            otlp:
              protocols:
                grpc:
                http:

            hostmetrics:
              collection_interval: 60s
              scrapers:
                cpu:
                  metrics:
                    system.cpu.time:
                      enabled: false
                    system.cpu.utilization:
                      enabled: true
                load:
                memory:
                  metrics:
                    system.memory.utilization:
                      enabled: true
                paging:
                  metrics:
                    system.paging.utilization:
                      enabled: false
                    system.paging.faults:
                      enabled: false
                filesystem:
                  metrics:
                    system.filesystem.utilization:
                      enabled: true
                disk:
                  metrics:
                    system.disk.merged:
                      enabled: false
                    system.disk.pending_operations:
                      enabled: false
                    system.disk.weighted_io_time:
                      enabled: false
                network:
                  metrics:
                    system.network.connections:
                      enabled: false

            filelog:
              include:
                - /var/log/syslog
                - /var/log/auth.log
                - /var/log/dpkg.log
          EOF
          else
            cat > "$CONFIG_PATH" << 'EOF'
          receivers:
          EOF
          fi

          # Count survivors up front to decide whether the anchor/merge-key pattern from
          # https://docs.newrelic.com/docs/opentelemetry/database/otel-oracledb/#rds-multi-receiver-config
          # applies - a single instance has nothing to merge into, so it gets a plain receiver.
          SURVIVOR_COUNT=0
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT SERVICE_NAME LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi
            SURVIVOR_COUNT=$((SURVIVOR_COUNT + 1))
          done < "$INSTANCES_TSV"

          MONITORED_COUNT=0
          IS_FIRST_SURVIVOR=1
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT SERVICE_NAME LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            PW_FILE="/tmp/nr-oracle-rds-newrelic-pw-${i}.tmp"
            USER_FILE="/tmp/nr-oracle-rds-db-user-${i}.tmp"
            if [ ! -f "$PW_FILE" ] || [ ! -f "$USER_FILE" ]; then
              echo "${i}: monitoring credentials missing at config-generation time" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: monitoring credentials missing at config-generation time" >&2
              continue
            fi

            NR_PASSWORD=$(cat "$PW_FILE")
            CONFIGURED_LOGIN_NAME=$(cat "$USER_FILE")

            if [ "$SURVIVOR_COUNT" -eq 1 ]; then
              {
                echo "  nroracledb/${i}:"
                echo "    endpoint: \"${HOST}:${PORT}\""
                echo "    username: \"${CONFIGURED_LOGIN_NAME}\""
                echo "    password: \"${NR_PASSWORD}\""
                echo "    service: \"${SERVICE_NAME}\""
                echo "$RECEIVER_DEFAULTS"
              } >> "$CONFIG_PATH"
            elif [ "$IS_FIRST_SURVIVOR" -eq 1 ]; then
              {
                echo "  nroracledb/${i}: &nroracledb-rds-common"
                echo "    endpoint: \"${HOST}:${PORT}\""
                echo "    username: \"${CONFIGURED_LOGIN_NAME}\""
                echo "    password: \"${NR_PASSWORD}\""
                echo "    service: \"${SERVICE_NAME}\""
                echo "$RECEIVER_DEFAULTS"
              } >> "$CONFIG_PATH"
              IS_FIRST_SURVIVOR=0
            else
              {
                echo "  nroracledb/${i}:"
                echo "    <<: *nroracledb-rds-common"
                echo "    endpoint: \"${HOST}:${PORT}\""
                echo "    username: \"${CONFIGURED_LOGIN_NAME}\""
                echo "    password: \"${NR_PASSWORD}\""
                echo "    service: \"${SERVICE_NAME}\""
              } >> "$CONFIG_PATH"
            fi

            MONITORED_COUNT=$((MONITORED_COUNT + 1))
          done < "$INSTANCES_TSV"

          if [ "$MONITORED_COUNT" -eq 0 ]; then
            echo "No Oracle RDS instance passed its checks - nothing to monitor. Aborting install." >&2
            exit 1
          fi

          if [ "$PRESET" = "2" ]; then
            cat >> "$CONFIG_PATH" << 'EOF'

          processors:
            metricstransform:
              transforms:
                - include: system.cpu.utilization
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [state]
                      aggregation_type: mean
                - include: system.paging.operations
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [direction]
                      aggregation_type: sum

            filter/exclude_cpu_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "interrupt"'
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "nice"'
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "softirq"'

            filter/exclude_memory_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_unreclaimable"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "inactive"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "cached"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "buffered"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_reclaimable"'

            filter/exclude_memory_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "slab_unreclaimable"'
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "inactive"'

            filter/exclude_filesystem_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.utilization" and attributes["type"] == "squashfs"'

            filter/exclude_filesystem_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.usage" and attributes["type"] == "squashfs"'
                  - 'metric.name == "system.filesystem.usage" and attributes["state"] == "reserved"'

            filter/exclude_filesystem_inodes_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.inodes.usage" and attributes["type"] == "squashfs"'
                  - 'metric.name == "system.filesystem.inodes.usage" and attributes["state"] == "reserved"'

            filter/exclude_system_disk:
              metrics:
                datapoint:
                  - 'metric.name == "system.disk.operations" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.merged" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.io" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.io_time" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.operation_time" and IsMatch(attributes["device"], "^loop.*") == true'

            filter/exclude_system_paging:
              metrics:
                datapoint:
                  - 'metric.name == "system.paging.usage" and attributes["state"] == "cached"'
                  - 'metric.name == "system.paging.operations" and attributes["type"] == "cached"'

            filter/exclude_network:
              metrics:
                datapoint:
                  - 'IsMatch(metric.name, "^system.network.*") == true and attributes["device"] == "lo"'

            attributes/exclude_system_paging:
              include:
                match_type: strict
                metric_names:
                  - system.paging.operations
              actions:
                - key: type
                  action: delete

            transform/clear_metadata:
              metric_statements:
                - context: metric
                  statements:
                    - set(metric.description, "")
                    - set(metric.unit, "")

            transform/host:
              metric_statements:
                - context: metric
                  statements:
                    - set(metric.description, "")
                    - set(metric.unit, "")

            transform:
              trace_statements:
                - context: span
                  statements:
                    - truncate_all(span.attributes, 4095)
                    - truncate_all(resource.attributes, 4095)
              log_statements:
                - context: log
                  statements:
                    - truncate_all(log.attributes, 4095)
                    - truncate_all(resource.attributes, 4095)
          EOF

            cat >> "$CONFIG_PATH" << EOF

            memory_limiter:
              check_interval: 1s
              limit_mib: \${env:NEW_RELIC_MEMORY_LIMIT_MIB:-100}

            batch:
          EOF
          else
            cat >> "$CONFIG_PATH" << 'EOF'

          processors:
            batch:
          EOF
          fi

          i=0
          while IFS="$(printf '\t')" read -r HOST PORT SERVICE_NAME LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi
            cat >> "$CONFIG_PATH" << EOF

            resource/add_event_name/${i}:
              attributes:
                - key: host.address
                  value: "${HOST}"
                  action: upsert
          EOF
          done < "$INSTANCES_TSV"

          if [ "$PRESET" = "2" ]; then
            cat >> "$CONFIG_PATH" << 'EOF'

            resourcedetection:
              detectors: ["system"]
              system:
                hostname_sources: ["os"]
                resource_attributes:
                  host.id:
                    enabled: true

            resourcedetection/db_safe:
              detectors: ["system"]
              override: false
              system:
                hostname_sources: ["os"]
                resource_attributes:
                  host.id:
                    enabled: true

            resourcedetection/cloud:
              detectors: ["gcp", "ec2", "azure"]
              timeout: 2s
              override: true

            resourcedetection/env:
              detectors: ["env"]
              timeout: 2s
              override: true

          exporters:
            otlp:
              endpoint: ${OTLP_ENDPOINT}
              headers:
                api-key: ${LICENSE_KEY}
              compression: gzip

          service:
            pipelines:
              metrics/host:
                receivers: [hostmetrics]
                processors:
                  - memory_limiter
                  - metricstransform
                  - filter/exclude_cpu_utilization
                  - filter/exclude_memory_utilization
                  - filter/exclude_memory_usage
                  - filter/exclude_filesystem_utilization
                  - filter/exclude_filesystem_usage
                  - filter/exclude_filesystem_inodes_usage
                  - filter/exclude_system_disk
                  - filter/exclude_network
                  - attributes/exclude_system_paging
                  - transform/host
                  - resourcedetection
                  - resourcedetection/cloud
                  - resourcedetection/env
                  - batch
                exporters: [otlp]
              traces:
                receivers: [otlp]
                processors: [memory_limiter, transform, resourcedetection, resourcedetection/cloud, resourcedetection/env, batch]
                exporters: [otlp]
              metrics:
                receivers: [otlp]
                processors: [memory_limiter, transform, resourcedetection, resourcedetection/cloud, resourcedetection/env, batch]
                exporters: [otlp]
              logs:
                receivers: [otlp]
                processors: [memory_limiter, transform, resourcedetection, resourcedetection/cloud, resourcedetection/env, batch]
                exporters: [otlp]
          EOF
          else
            cat >> "$CONFIG_PATH" << EOF

          exporters:
            otlp/newrelic:
              endpoint: ${OTLP_ENDPOINT}
              headers:
                api-key: ${LICENSE_KEY}
              compression: gzip
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_interval: 30s
                max_elapsed_time: 300s

          service:
            pipelines:
          EOF
          fi

          EXPORTER_NAME="otlp/newrelic"
          if [ "$PRESET" = "2" ]; then
            EXPORTER_NAME="otlp"
          fi

          i=0
          while IFS="$(printf '\t')" read -r HOST PORT SERVICE_NAME LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi
            cat >> "$CONFIG_PATH" << EOF
              metrics/oracledb/${i}:
                receivers: [nroracledb/${i}]
                processors: [resource/add_event_name/${i}, batch]
                exporters: [${EXPORTER_NAME}]
              logs/oracledb/${i}:
                receivers: [nroracledb/${i}]
                processors: [resource/add_event_name/${i}, batch]
                exporters: [${EXPORTER_NAME}]
          EOF
          done < "$INSTANCES_TSV"

          if [ "$PRESET" = "2" ]; then
            cat >> "$CONFIG_PATH" << 'EOF'
            extensions: [health_check]
          EOF
          fi

          chown nrdot-collector:nrdot-collector "$CONFIG_PATH"
          chmod 600 "$CONFIG_PATH"

          cat > "$ENV_FILE" << EOF
          OTELCOL_OPTIONS="--config=${CONFIG_PATH}"
          EOF

          echo "Oracle OTel config written to ${CONFIG_PATH} (${MONITORED_COUNT} instance(s))"
          echo "Env file written to ${ENV_FILE}"

    restart_nrdot:
      cmds:
        - |
          echo ""
          echo "==> Restarting NRDOT Collector..."
          sudo systemctl restart nrdot-collector

          echo ""
          echo "==> NRDOT Collector service status:"
          echo ""
          sudo systemctl status nrdot-collector --no-pager

          if sudo systemctl is-active --quiet nrdot-collector; then
            echo ""
            echo -e "\e[32mNRDOT Collector is running successfully.\e[0m"
          else
            echo ""
            echo -e "\e[31mERROR:\e[0m NRDOT Collector failed to start. Check the status output above." >&2
            exit 131
          fi

          INSTANCES_TSV="/tmp/nr-oracle-rds-instances.tsv"
          SKIP_FILE="/tmp/nr-oracle-rds-skip.tmp"

          echo ""
          echo "==> Oracle RDS instance summary:"
          echo ""
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT SERVICE_NAME LOGIN_NAME; do
            i=$((i + 1))
            REASON=$(grep "^${i}:" "$SKIP_FILE" 2>/dev/null | sed "s/^${i}: //")
            if [ -n "$REASON" ]; then
              echo "  [SKIP] ${i}: ${HOST} (service ${SERVICE_NAME}) - ${REASON}"
            else
              echo "  [OK]   ${i}: ${HOST} (service ${SERVICE_NAME})"
            fi
          done < "$INSTANCES_TSV"

          rm -f /tmp/nr-oracle-rds-newrelic-pw-*.tmp /tmp/nr-oracle-rds-db-user-*.tmp "$INSTANCES_TSV" "$SKIP_FILE"

    default:
      cmds:
        - task: write_recipe_metadata
        - task: assert_pre_req
        - task: parse_instances
        - task: assert_oracle_version
        - task: install_nrdot
        - task: configure_database_user
        - task: create_collector_config
        - task: restart_nrdot

postInstall:
  info: |2
      Oracle OTel config: /etc/nrdot-collector/oracle-config.yaml
      Env file:            /etc/nrdot-collector/nrdot-collector.conf
      Service status:      systemctl status nrdot-collector
      View logs:            journalctl -u nrdot-collector -f
      Restart service:      sudo systemctl restart nrdot-collector
