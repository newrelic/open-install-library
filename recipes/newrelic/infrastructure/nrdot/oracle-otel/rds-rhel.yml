# Visit our schema definition for additional information on this file format.
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition

name: nrdot-collector-oracle-rds
displayName: NRDOT Oracle Database (AWS RDS, RHEL/CentOS/OEL collector host)
description: New Relic install recipe for Oracle Database monitoring via NRDOT Collector against an AWS RDS Oracle instance, collector installed on RHEL/CentOS/OEL
repository: https://github.com/newrelic/nrdot-collector-releases

installTargets:
  - type: host
    os: linux
    platform: centos
  - type: host
    os: linux
    platform: redhat
  - type: host
    os: linux
    platform: oracle

keywords:
  - Oracle
  - Oracle Database
  - RDS
  - NRDOT
  - OpenTelemetry
  - OTel
  - Database
  - Linux
  - CentOS
  - RHEL
  - OEL

processMatch: []

preInstall:
  discoveryMode:
    - targeted
  info: |
    To capture data from your RDS Oracle Database, we need to create/authorize a
    monitoring identity (a database user) using the RDS master user's credentials.

inputVars:
  - name: NR_CLI_ORACLE_HOST
    prompt: "RDS Oracle endpoint: "
  - name: NR_CLI_ORACLE_PORT
    prompt: "Oracle listener port: "
    default: "1521"
  - name: NR_CLI_ORACLE_ADMIN_USER
    prompt: "RDS master username (used once to create the monitoring user and grant privileges): "
  - name: NR_CLI_ORACLE_ADMIN_PASSWORD
    prompt: "RDS master password: "
    secret: true
  - name: NR_CLI_ORACLE_LOGIN_NAME
    prompt: "Monitoring username: "
    default: "newrelic"
  - name: NR_CLI_ORACLE_LOGIN_PASSWORD
    prompt: "Password for the monitoring login (leave blank to auto-generate a random password): "
    secret: true
  - name: NR_CLI_ORACLE_SERVICE_NAME
    prompt: "RDS DB service name for the collector connection: "

validationNrql: "SELECT count(*) FROM Metric WHERE metricName LIKE 'oracledb.%' AND instrumentation.provider = 'opentelemetry' SINCE 10 minutes ago"

successLinkConfig:
  type: EXPLORER

install:
  version: "3"
  silent: true

  tasks: {}
