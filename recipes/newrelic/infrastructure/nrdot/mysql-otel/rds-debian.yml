# Visit our schema definition for additional information on this file format.
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition
# WORK IN PROGRESS - not for use.

name: nrdot-collector-mysql-rds
displayName: NRDOT MySQL RDS (Debian/Ubuntu)
description: New Relic install recipe for MySQL monitoring via NRDOT Collector on Debian/Ubuntu hosts connecting to one or more AWS RDS/Aurora MySQL instances
repository: https://github.com/newrelic/nrdot-collector-releases

installTargets:
  - type: host
    os: linux
    platformFamily: debian
  - type: host
    os: linux
    platform: ubuntu

keywords:
  - MySQL
  - MariaDB
  - NRDOT
  - OpenTelemetry
  - OTel
  - Database
  - Linux
  - Debian
  - Ubuntu
  - RDS
  - AWS

processMatch: []

preInstall:
  discoveryMode:
    - targeted
  info: |
    To capture data from one or more AWS RDS/Aurora MySQL instances, we need to
    create/authorize a monitoring identity (a MySQL user) on each instance, using
    each instance's RDS master user credentials.

    You will be asked for two files:

      1. An instances file (YAML) listing every RDS MySQL instance to monitor, in the
         order you want them numbered (instance 1, 2, 3, ...):

           instances:
             - host: mydb1.xxxx.us-east-1.rds.amazonaws.com
               port: 3306
               login_name: newrelic
             - host: mydb2.xxxx.us-east-1.rds.amazonaws.com
               port: 3306
               login_name: newrelic

      2. A secrets file (KEY=VALUE per line) supplying the RDS master credentials for
         each instance above, indexed to match the instances file's order (1-based):

           NR_CLI_MYSQL_ADMIN_USER_1=admin
           NR_CLI_MYSQL_ADMIN_PASSWORD_1=<master password for instance 1>
           NR_CLI_MYSQL_ADMIN_USER_2=admin
           NR_CLI_MYSQL_ADMIN_PASSWORD_2=<master password for instance 2>

         NR_CLI_MYSQL_ADMIN_USER_<i> / NR_CLI_MYSQL_ADMIN_PASSWORD_<i> are required for
         every instance.

    Any instance that fails its version check or user setup is skipped (with a reason)
    rather than aborting the whole install - the rest are still configured.

    This also requires network connectivity from this host to every RDS endpoint
    listed (inbound access on the MySQL port in each instance's RDS security group).

inputVars:
  - name: NR_CLI_MYSQL_CONFIG_PRESET
    prompt: "NRDOT configuration - 1) Standard  2) Full-feature: "
    default: "1"
  - name: NR_CLI_MYSQL_INSTANCES_FILE
    prompt: "Path to the MySQL RDS instances YAML file: "
  - name: NR_CLI_MYSQL_SECRETS_FILE
    prompt: "Path to the MySQL RDS secrets file (KEY=VALUE per instance): "
  - name: NR_CLI_MYSQL_TLS_CA_FILE
    prompt: "Path to a CA certificate file for validating the server's TLS certificate (leave blank to skip CA validation): "
    default: ""

validationNrql: "SELECT count(*) FROM Metric WHERE metricName LIKE 'mysql.%' AND instrumentation.provider = 'opentelemetry' SINCE 10 minutes ago"

successLinkConfig:
  type: EXPLORER

install:
  version: "3"
  silent: true

  vars:
    IS_SYSTEMCTL:
      sh: command -v systemctl | wc -l

  tasks:
    write_recipe_metadata:
      cmds:
        - |
          echo '{"Metadata":{"CapturedCliOutput":"true"}}' | tee {{.NR_CLI_OUTPUT}} > /dev/null

    assert_pre_req:
      cmds:
        - |
          if [ "$(id -u)" != "0" ]; then
            echo "This newrelic install must be run under sudo or root" >&2
            exit 131
          fi
        - |
          if ! command -v curl > /dev/null 2>&1; then
            echo "curl is required to run the newrelic install. Please install curl and re-run the installation." >&2
            exit 16
          fi
        - |
          if ! command -v mysql > /dev/null 2>&1; then
            echo "The mysql client is required to configure MySQL monitoring. Please install the mysql-client package and re-run the installation." >&2
            exit 16
          fi
        - |
          if [ "{{.IS_SYSTEMCTL}}" -eq 0 ]; then
            echo "systemd is required for the nrdot-collector service configuration." >&2
            exit 131
          fi

    parse_instances:
      cmds:
        - |
          INSTANCES_FILE="{{.NR_CLI_MYSQL_INSTANCES_FILE}}"
          SECRETS_FILE="{{.NR_CLI_MYSQL_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-mysql-rds-instances.tsv"
          SKIP_FILE="/tmp/nr-mysql-rds-skip.tmp"

          rm -f "$INSTANCES_TSV" "$SKIP_FILE"

          if [ ! -f "$INSTANCES_FILE" ]; then
            echo "Instances file not found: $INSTANCES_FILE" >&2
            exit 131
          fi
          if [ ! -f "$SECRETS_FILE" ]; then
            echo "Secrets file not found: $SECRETS_FILE" >&2
            exit 131
          fi

          SECRETS_PERMS=$(stat -c '%a' "$SECRETS_FILE" 2>/dev/null || stat -f '%Lp' "$SECRETS_FILE" 2>/dev/null)
          if [ -n "$SECRETS_PERMS" ]; then
            GROUP_OTHER_BITS=$(printf '%s' "$SECRETS_PERMS" | tail -c 2)
            if [ "$GROUP_OTHER_BITS" != "00" ]; then
              echo "WARNING: $SECRETS_FILE is readable by group/other (permissions: $SECRETS_PERMS)." >&2
              echo "         Consider running: chmod 600 $SECRETS_FILE" >&2
            fi
          fi

          # shellcheck disable=SC1090
          . "$SECRETS_FILE"

          # Parses the fixed 3-key-per-item shape documented in preInstall.info
          # (host, port, login_name) - not a general-purpose YAML parser.
          awk '
            /^[[:space:]]*-[[:space:]]*host:/ {
              if (have) { print host "\t" port "\t" login_name }
              host=$0; sub(/^[[:space:]]*-[[:space:]]*host:[[:space:]]*/, "", host)
              port=""; login_name=""; have=1; next
            }
            /^[[:space:]]*port:/ { port=$0; sub(/^[[:space:]]*port:[[:space:]]*/, "", port); next }
            /^[[:space:]]*login_name:/ { login_name=$0; sub(/^[[:space:]]*login_name:[[:space:]]*/, "", login_name); next }
            END { if (have) { print host "\t" port "\t" login_name } }
          ' "$INSTANCES_FILE" > "$INSTANCES_TSV"

          INSTANCE_COUNT=$(wc -l < "$INSTANCES_TSV" | tr -d ' ')
          if [ "$INSTANCE_COUNT" -eq 0 ]; then
            echo "No instances found in $INSTANCES_FILE" >&2
            exit 131
          fi
          echo "Found $INSTANCE_COUNT MySQL RDS instance(s) in $INSTANCES_FILE"

          i=0
          while IFS="$(printf '\t')" read -r ENTRY_HOST ENTRY_PORT ENTRY_LOGIN_NAME; do
            i=$((i + 1))
            eval "ADMIN_USER_VAL=\"\${NR_CLI_MYSQL_ADMIN_USER_${i}:-}\""
            eval "ADMIN_PASSWORD_VAL=\"\${NR_CLI_MYSQL_ADMIN_PASSWORD_${i}:-}\""
            if [ -z "$ADMIN_USER_VAL" ] || [ -z "$ADMIN_PASSWORD_VAL" ]; then
              echo "${i}: missing NR_CLI_MYSQL_ADMIN_USER_${i}/NR_CLI_MYSQL_ADMIN_PASSWORD_${i} in secrets file" >> "$SKIP_FILE"
              echo "Instance ${i} (${ENTRY_HOST}) SKIPPED: missing admin credentials in secrets file" >&2
            fi
          done < "$INSTANCES_TSV"

    assert_mysql_version:
      cmds:
        - |
          SECRETS_FILE="{{.NR_CLI_MYSQL_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-mysql-rds-instances.tsv"
          SKIP_FILE="/tmp/nr-mysql-rds-skip.tmp"

          # shellcheck disable=SC1090
          . "$SECRETS_FILE"

          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            eval "ADMIN_USER=\"\${NR_CLI_MYSQL_ADMIN_USER_${i}}\""
            eval "ADMIN_PASSWORD=\"\${NR_CLI_MYSQL_ADMIN_PASSWORD_${i}}\""

            CNF_FILE=$(mktemp "/tmp/nr-mysql-admin-${i}.cnf.XXXXXX")
            chmod 600 "$CNF_FILE"
            cat > "$CNF_FILE" << EOF
          [client]
          user=${ADMIN_USER}
          host=${HOST}
          port=${PORT}
          EOF
            export MYSQL_PWD="$ADMIN_PASSWORD"

            RESULT=$(mysql --defaults-extra-file="$CNF_FILE" -N -e "SELECT VERSION();" 2>&1 < /dev/null)
            VERSION_STATUS=$?

            if [ $VERSION_STATUS -ne 0 ]; then
              rm -f "$CNF_FILE"
              unset MYSQL_PWD
              echo "${i}: failed to connect / check version - $(echo "$RESULT" | tr '\n' ' ' | sed 's/  */ /g')" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: failed to connect to check its version" >&2
              continue
            fi

            MAJOR=$(echo "$RESULT" | grep -oE '^[0-9]+' | head -1)
            MINOR=$(echo "$RESULT" | grep -oE '^[0-9]+\.[0-9]+' | head -1 | cut -d. -f2)

            if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 5 ] || { [ "$MAJOR" -eq 5 ] && [ "${MINOR:-0}" -lt 7 ]; }; then
              rm -f "$CNF_FILE"
              unset MYSQL_PWD
              echo "${i}: unsupported MySQL version ${RESULT:-unknown} (5.7 or later required)" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: unsupported MySQL version ${RESULT:-unknown}" >&2
              continue
            fi

            PS_STATUS=$(mysql --defaults-extra-file="$CNF_FILE" -N -e "SHOW VARIABLES LIKE 'performance_schema';" 2>&1 < /dev/null | awk '{print $2}')
            rm -f "$CNF_FILE"
            unset MYSQL_PWD

            if [ "$PS_STATUS" != "ON" ]; then
              echo "${i}: performance_schema is disabled (enable performance_schema=ON in the parameter group)" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: performance_schema is disabled" >&2
              continue
            fi

            echo "Instance ${i} (${HOST}): MySQL version ${RESULT} detected - supported, performance_schema enabled."
          done < "$INSTANCES_TSV"

    install_nrdot:
      cmds:
        - |
          COLLECTOR_DISTRO="nrdot-collector"

          if dpkg -l | grep -q "^ii.*${COLLECTOR_DISTRO} "; then
            echo "NRDOT Collector is already installed."
            echo ""
            echo "Please follow the steps below to complete the setup:"
            echo ""
            echo "  1. Create mysql-config.yaml"
            echo "     if not present. Refer to:"
            echo "     https://docs.newrelic.com/docs/opentelemetry/database/mysql/rds/"
            echo ""
            echo "  2. Make sure the monitoring user is created"
            echo "     and has the required permissions granted."
            echo ""
            echo "  3. After making the above changes, restart the NRDOT Collector:"
            echo "     sudo systemctl restart nrdot-collector"
            echo ""
            exit 131
          fi

          COLLECTOR_VERSION=$(curl -sf "https://api.github.com/repos/newrelic/nrdot-collector-releases/releases/latest" | grep '"tag_name":' | awk -F'"' '{print $4}')
          if [ -z "$COLLECTOR_VERSION" ]; then
            echo "Failed to fetch the latest release version from GitHub. Please check your internet connection." >&2
            exit 1
          fi

          if [ "$(uname -m)" = "aarch64" ]; then
            ARCH="arm64"
          else
            ARCH="amd64"
          fi

          DOWNLOAD_URL="https://github.com/newrelic/nrdot-collector-releases/releases/download/${COLLECTOR_VERSION}/${COLLECTOR_DISTRO}_${COLLECTOR_VERSION}_linux_${ARCH}.deb"
          echo "Installing ${COLLECTOR_DISTRO} version: ${COLLECTOR_VERSION}"
          echo "Downloading from: ${DOWNLOAD_URL}"

          curl -L --output /tmp/nrdot-collector.deb "$DOWNLOAD_URL"
          if [ $? -ne 0 ]; then
            echo "Failed to download the nrdot-collector package." >&2
            exit 1
          fi

          dpkg -i /tmp/nrdot-collector.deb
          if [ $? -ne 0 ]; then
            echo "Failed to install the nrdot-collector package." >&2
            exit 1
          fi

          rm -f /tmp/nrdot-collector.deb
          echo "${COLLECTOR_DISTRO} installed successfully."

    configure_database_user:
      cmds:
        - |
          SECRETS_FILE="{{.NR_CLI_MYSQL_SECRETS_FILE}}"
          INSTANCES_TSV="/tmp/nr-mysql-rds-instances.tsv"
          SKIP_FILE="/tmp/nr-mysql-rds-skip.tmp"
          PASSWORDS_FILE="/tmp/nr-mysql-rds-passwords.tmp"

          rm -f "$PASSWORDS_FILE"
          : > "$PASSWORDS_FILE"
          chmod 600 "$PASSWORDS_FILE"

          # shellcheck disable=SC1090
          . "$SECRETS_FILE"

          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            if ! printf '%s' "$LOGIN_NAME" | grep -qE '^[A-Za-z][A-Za-z0-9_]*$'; then
              echo "${i}: invalid monitoring username '${LOGIN_NAME}' in instances file" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: invalid monitoring username '${LOGIN_NAME}'" >&2
              continue
            fi

            eval "ADMIN_USER=\"\${NR_CLI_MYSQL_ADMIN_USER_${i}}\""
            eval "ADMIN_PASSWORD=\"\${NR_CLI_MYSQL_ADMIN_PASSWORD_${i}}\""

            CNF_FILE=$(mktemp "/tmp/nr-mysql-admin-${i}.cnf.XXXXXX")
            SQL_FILE=$(mktemp "/tmp/nr-mysql-grant-${i}.sql.XXXXXX")
            chmod 600 "$CNF_FILE" "$SQL_FILE"
            cat > "$CNF_FILE" << EOF
          [client]
          user=${ADMIN_USER}
          host=${HOST}
          port=${PORT}
          EOF
            export MYSQL_PWD="$ADMIN_PASSWORD"

            NR_PASSWORD="$(tr -dc 'a-z' < /dev/urandom | head -c 6)$(tr -dc 'A-Z' < /dev/urandom | head -c 6)$(tr -dc '0-9' < /dev/urandom | head -c 6)$(tr -dc '_+=.~^-' < /dev/urandom | head -c 6)"

            cat > "$SQL_FILE" << EOF
          CREATE USER IF NOT EXISTS '${LOGIN_NAME}'@'%' IDENTIFIED BY '${NR_PASSWORD}';
          ALTER USER '${LOGIN_NAME}'@'%' IDENTIFIED BY '${NR_PASSWORD}';
          GRANT SELECT ON performance_schema.* TO '${LOGIN_NAME}'@'%';
          GRANT UPDATE ON performance_schema.setup_consumers TO '${LOGIN_NAME}'@'%';
          FLUSH PRIVILEGES;
          EOF

            RESULT=$(mysql --defaults-extra-file="$CNF_FILE" < "$SQL_FILE" 2>&1)
            SQL_STATUS=$?
            rm -f "$CNF_FILE" "$SQL_FILE"
            unset MYSQL_PWD

            if [ $SQL_STATUS -ne 0 ]; then
              echo "${i}: monitoring user setup failed - $(echo "$RESULT" | tr '\n' ' ' | sed 's/  */ /g')" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: monitoring user setup failed" >&2
              continue
            fi

            echo "${i}=${NR_PASSWORD}" >> "$PASSWORDS_FILE"
            echo "Instance ${i} (${HOST}): MySQL monitoring identity configured successfully: $LOGIN_NAME"
          done < "$INSTANCES_TSV"

    create_collector_config:
      cmds:
        - |
          PRESET="{{.NR_CLI_MYSQL_CONFIG_PRESET}}"
          TLS_CA_FILE="{{.NR_CLI_MYSQL_TLS_CA_FILE}}"
          REGION="{{.NEW_RELIC_REGION}}"
          LICENSE_KEY="{{.NEW_RELIC_LICENSE_KEY}}"
          CONFIG_DIR="/etc/nrdot-collector"
          CONFIG_PATH="${CONFIG_DIR}/mysql-config.yaml"
          ENV_FILE="${CONFIG_DIR}/nrdot-collector.conf"
          INSTANCES_TSV="/tmp/nr-mysql-rds-instances.tsv"
          SKIP_FILE="/tmp/nr-mysql-rds-skip.tmp"
          PASSWORDS_FILE="/tmp/nr-mysql-rds-passwords.tmp"

          mkdir -p "$CONFIG_DIR"

          case "$REGION" in
            staging) OTLP_ENDPOINT="https://staging-otlp.nr-data.net:4317" ;;
            EU)      OTLP_ENDPOINT="https://otlp.eu01.nr-data.net:4317" ;;
            JP)      OTLP_ENDPOINT="https://otlp.jp.nr-data.net:4317" ;;
            *)       OTLP_ENDPOINT="https://otlp.nr-data.net:4317" ;;
          esac

          if [ -n "$TLS_CA_FILE" ]; then
            CA_FILE_LINE="      ca_file: ${TLS_CA_FILE}"
          else
            CA_FILE_LINE="      # ca_file: /path/to/global-bundle.pem"
          fi

          # Shared receiver settings (transport/collection_interval/tls/explain_mode/
          # statement_events/query_sample_collection/top_query_collection/events) are
          # identical for every instance. Captured once here and echoed per instance
          # below instead of relying on the collector's YAML loader to support
          # merge-key aliases via a fragile multi-anchor split - this keeps the
          # ca_file line (the one field that needs runtime interpolation inside the
          # shared block) spliced in via a plain variable rather than baked into the
          # heredoc.
          RECEIVER_DEFAULTS_HEAD=$(cat << 'BLOCK'
              transport: tcp
              collection_interval: 10s
              initial_delay: 1s
              tls:
                insecure: false
                insecure_skip_verify: false
                # Required for Amazon RDS/Aurora with SSL/TLS enforcement -- see
                # Prerequisites -> Network access -> Amazon RDS / Aurora for MySQL.
          BLOCK
          )

          RECEIVER_DEFAULTS_TAIL=$(cat << 'BLOCK'
              # "procedure" collects EXPLAIN plans for write statements (UPDATE/DELETE/INSERT/REPLACE)
              # without granting DML to the monitoring user, via a SQL SECURITY DEFINER procedure.
              # Falls back to "inline" (default) automatically if the procedure is absent for a schema.
              # Requires one-time setup per schema -- see Prerequisites -> DML query plan collection.
              explain_mode: procedure
              statement_events:
                digest_text_limit: 4096
                time_limit: 24h
                limit: 500
              query_sample_collection:
                max_rows_per_query: 100
                # APM-DB correlation: surfaces the nr_service_guid SQL comment tag (e.g. injected by
                # transaction_tracer.sql_metadata_comments in the Java agent) as db.query.comment_tags /
                # db.query.comment_tags.nr_service_guid. Empty list by default -- nothing is extracted
                # unless the key is explicitly allow-listed here.
                allowed_comment_keys: [nr_service_guid]
              top_query_collection:
                lookback_time: 120
                max_query_sample_count: 5000
                top_query_count: 200
                collection_interval: 60s
                query_plan_cache_size: 1000
                query_plan_cache_ttl: 1h
                allowed_comment_keys: [nr_service_guid]
              events:
                db.server.query_sample:
                  enabled: true
                db.server.top_query:
                  enabled: true
          BLOCK
          )

          if [ "$PRESET" = "2" ]; then
            cat > "$CONFIG_PATH" << 'EOF'
          extensions:
            health_check:

          receivers:
            otlp:
              protocols:
                grpc:
                http:

            host_metrics:
              collection_interval: 30s
              scrapers:
                cpu:
                  metrics:
                    system.cpu.time:
                      enabled: false
                    system.cpu.utilization:
                      enabled: true
                load:
                memory:
                  metrics:
                    system.memory.utilization:
                      enabled: true
                paging:
                  metrics:
                    system.paging.utilization:
                      enabled: false
                    system.paging.faults:
                      enabled: false
                filesystem:
                  metrics:
                    system.filesystem.utilization:
                      enabled: true
                disk:
                  metrics:
                    system.disk.merged:
                      enabled: false
                    system.disk.pending_operations:
                      enabled: false
                    system.disk.weighted_io_time:
                      enabled: false
                network:
                  metrics:
                    system.network.connections:
                      enabled: false
                # Uncomment to enable process metrics, which can be noisy but valuable.
                # processes:
                # process:
                #  metrics:
                #    process.cpu.utilization:
                #      enabled: true
                #    process.cpu.time:
                #      enabled: false
          EOF
          else
            cat > "$CONFIG_PATH" << 'EOF'
          receivers:
          EOF
          fi

          # Count survivors up front to decide whether the anchor/merge-key pattern
          # documented at https://docs.newrelic.com/docs/opentelemetry/database/mysql/multi-receiver/
          # applies - a single instance has nothing to merge into, so it gets a plain
          # receiver, matching that doc's naming convention (nrmysql/instanceN).
          SURVIVOR_COUNT=0
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi
            SURVIVOR_COUNT=$((SURVIVOR_COUNT + 1))
          done < "$INSTANCES_TSV"

          MONITORED_COUNT=0
          IS_FIRST_SURVIVOR=1
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi

            # Reuse the password configure_database_user already set on this user - no
            # need to generate and apply a second one.
            NR_PASSWORD=$(grep "^${i}=" "$PASSWORDS_FILE" 2>/dev/null | head -1 | cut -d= -f2-)
            if [ -z "$NR_PASSWORD" ]; then
              echo "${i}: monitoring user password not found - configure_database_user did not record one" >> "$SKIP_FILE"
              echo "Instance ${i} (${HOST}) SKIPPED: monitoring user password not found" >&2
              continue
            fi

            if [ "$SURVIVOR_COUNT" -eq 1 ]; then
              {
                echo "  nrmysql/instance${i}:"
                echo "    endpoint: \"${HOST}:${PORT}\""
                echo "    username: \"${LOGIN_NAME}\""
                echo "    password: \"${NR_PASSWORD}\""
                echo "$RECEIVER_DEFAULTS_HEAD"
                echo "$CA_FILE_LINE"
                echo "$RECEIVER_DEFAULTS_TAIL"
              } >> "$CONFIG_PATH"
            elif [ "$IS_FIRST_SURVIVOR" -eq 1 ]; then
              {
                echo "  nrmysql/instance${i}: &nrmysql-common"
                echo "    endpoint: \"${HOST}:${PORT}\""
                echo "    username: \"${LOGIN_NAME}\""
                echo "    password: \"${NR_PASSWORD}\""
                echo "$RECEIVER_DEFAULTS_HEAD"
                echo "$CA_FILE_LINE"
                echo "$RECEIVER_DEFAULTS_TAIL"
              } >> "$CONFIG_PATH"
              IS_FIRST_SURVIVOR=0
            else
              {
                echo "  nrmysql/instance${i}:"
                echo "    <<: *nrmysql-common"
                echo "    endpoint: \"${HOST}:${PORT}\""
                echo "    username: \"${LOGIN_NAME}\""
                echo "    password: \"${NR_PASSWORD}\""
              } >> "$CONFIG_PATH"
            fi

            MONITORED_COUNT=$((MONITORED_COUNT + 1))
          done < "$INSTANCES_TSV"

          if [ "$MONITORED_COUNT" -eq 0 ]; then
            echo "No MySQL RDS instance passed its checks - nothing to monitor. Aborting install." >&2
            exit 1
          fi

          if [ "$PRESET" = "2" ]; then
            cat >> "$CONFIG_PATH" << 'EOF'

          processors:
            metrics_transform:
              transforms:
                - include: system.cpu.utilization
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [state]
                      aggregation_type: mean
                - include: system.paging.operations
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [direction]
                      aggregation_type: sum

            filter/exclude_cpu_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "interrupt"'
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "nice"'
                  - 'metric.name == "system.cpu.utilization" and attributes["state"] == "softirq"'

            filter/exclude_memory_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_unreclaimable"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "inactive"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "cached"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "buffered"'
                  - 'metric.name == "system.memory.utilization" and attributes["state"] == "slab_reclaimable"'

            filter/exclude_memory_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "slab_unreclaimable"'
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "inactive"'

            filter/exclude_filesystem_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.utilization" and attributes["type"] == "squashfs"'

            filter/exclude_filesystem_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.usage" and attributes["type"] == "squashfs"'
                  - 'metric.name == "system.filesystem.usage" and attributes["state"] == "reserved"'

            filter/exclude_filesystem_inodes_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.inodes.usage" and attributes["type"] == "squashfs"'
                  - 'metric.name == "system.filesystem.inodes.usage" and attributes["state"] == "reserved"'

            filter/exclude_system_disk:
              metrics:
                datapoint:
                  - 'metric.name == "system.disk.operations" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.merged" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.io" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.io_time" and IsMatch(attributes["device"], "^loop.*") == true'
                  - 'metric.name == "system.disk.operation_time" and IsMatch(attributes["device"], "^loop.*") == true'

            filter/exclude_network:
              metrics:
                datapoint:
                  - 'IsMatch(metric.name, "^system.network.*") == true and attributes["device"] == "lo"'

            attributes/exclude_system_paging:
              include:
                match_type: strict
                metric_names:
                  - system.paging.operations
              actions:
                - key: type
                  action: delete

            cumulative_to_delta:

            transform:
              trace_statements:
                - context: span
                  statements:
                    - truncate_all(span.attributes, 4095)
                    - truncate_all(resource.attributes, 4095)

            transform/host:
              metric_statements:
                - context: metric
                  statements:
                    - set(metric.description, "")
                    - set(metric.unit, "")

            batch:

            resource_detection:
              detectors: ["system"]
              system:
                hostname_sources: ["os"]
                resource_attributes:
                  host.id:
                    enabled: true

            resource_detection/cloud:
              detectors: ["gcp", "ec2", "azure"]
              timeout: 2s
              override: true

            resource_detection/env:
              detectors: ["env"]
              timeout: 2s
              override: true
          EOF
          else
            cat >> "$CONFIG_PATH" << 'EOF'

          processors:
            batch:
          EOF
          fi

          # Static server.address/server.port per instance, reusing the same HOST/PORT
          # already set on that instance's receiver `endpoint` field above -- nrmysql
          # itself emits no server.address/server.port, only its own
          # mysql.instance.endpoint (a combined "host:port" string).
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi
            cat >> "$CONFIG_PATH" << EOF

            resource/mysql/instance${i}:
              attributes:
                - key: server.address
                  value: "${HOST}"
                  action: upsert
                - key: server.port
                  value: ${PORT}
                  action: upsert
          EOF
          done < "$INSTANCES_TSV"

          cat >> "$CONFIG_PATH" << EOF

          exporters:
            otlp/newrelic:
              endpoint: "${OTLP_ENDPOINT}"
              headers:
                api-key: "${LICENSE_KEY}"
              compression: gzip
              retry_on_failure:
                enabled: true
                initial_interval: 5s
                max_interval: 30s
                max_elapsed_time: 300s

          service:
          EOF

          if [ "$PRESET" = "2" ]; then
            cat >> "$CONFIG_PATH" << 'EOF'
            telemetry:
              metrics:
                level: none

            extensions: [health_check]

            pipelines:
              metrics/host:
                receivers: [host_metrics]
                processors:
                  - metrics_transform
                  - filter/exclude_cpu_utilization
                  - filter/exclude_memory_utilization
                  - filter/exclude_memory_usage
                  - filter/exclude_filesystem_utilization
                  - filter/exclude_filesystem_usage
                  - filter/exclude_filesystem_inodes_usage
                  - filter/exclude_system_disk
                  - filter/exclude_network
                  - attributes/exclude_system_paging
                  - transform/host
                  - resource_detection
                  - resource_detection/cloud
                  - resource_detection/env
                  - cumulative_to_delta
                  - batch
                exporters: [otlp/newrelic]
          EOF
          else
            cat >> "$CONFIG_PATH" << 'EOF'
            pipelines:
          EOF
          fi

          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))
            if grep -q "^${i}:" "$SKIP_FILE" 2>/dev/null; then
              continue
            fi
            if [ "$PRESET" = "2" ]; then
              cat >> "$CONFIG_PATH" << EOF
              metrics/mysql/instance${i}:
                receivers: [nrmysql/instance${i}]
                processors:
                  - resource/mysql/instance${i}
                  - resource_detection
                  - resource_detection/cloud
                  - resource_detection/env
                  - batch
                exporters: [otlp/newrelic]

              logs/mysql/instance${i}:
                receivers: [nrmysql/instance${i}]
                processors:
                  - resource/mysql/instance${i}
                  - resource_detection
                  - resource_detection/cloud
                  - resource_detection/env
                  - batch
                exporters: [otlp/newrelic]
          EOF
            else
              cat >> "$CONFIG_PATH" << EOF
              metrics/instance${i}:
                receivers: [nrmysql/instance${i}]
                processors: [resource/mysql/instance${i}, batch]
                exporters: [otlp/newrelic]
              logs/instance${i}:
                receivers: [nrmysql/instance${i}]
                processors: [resource/mysql/instance${i}, batch]
                exporters: [otlp/newrelic]
          EOF
            fi
          done < "$INSTANCES_TSV"

          if [ "$PRESET" = "2" ]; then
            cat >> "$CONFIG_PATH" << 'EOF'

              traces:
                receivers: [otlp]
                processors: [transform, resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlp/newrelic]

              metrics:
                receivers: [otlp]
                processors: [resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlp/newrelic]

              logs:
                receivers: [otlp]
                processors: [resource_detection, resource_detection/cloud, resource_detection/env, batch]
                exporters: [otlp/newrelic]
          EOF
          fi

          cat > "$ENV_FILE" << EOF
          OTELCOL_OPTIONS="--config=${CONFIG_PATH}"
          EOF

          chown nrdot-collector:nrdot-collector "$CONFIG_PATH"
          chmod 600 "$CONFIG_PATH"

          echo "MySQL OTel config written to ${CONFIG_PATH} (${MONITORED_COUNT} instance(s))"
          echo "Env file written to ${ENV_FILE}"

    restart_nrdot:
      cmds:
        - |
          systemctl restart nrdot-collector

          echo "Waiting for NRDOT Collector to start..."
          NR_STARTED=""
          for i in $(seq 1 30); do
            if systemctl is-active --quiet nrdot-collector; then
              echo "NRDOT Collector is running."
              NR_STARTED=1
              break
            fi
            sleep 2
          done

          if [ -z "$NR_STARTED" ]; then
            echo "NRDOT Collector did not start in time. Check logs:" >&2
            journalctl -u nrdot-collector --no-pager -n 50 >&2
            exit 31
          fi

          INSTANCES_TSV="/tmp/nr-mysql-rds-instances.tsv"
          SKIP_FILE="/tmp/nr-mysql-rds-skip.tmp"

          echo ""
          echo "==> MySQL RDS instance summary:"
          echo ""
          i=0
          while IFS="$(printf '\t')" read -r HOST PORT LOGIN_NAME; do
            i=$((i + 1))
            REASON=$(grep "^${i}:" "$SKIP_FILE" 2>/dev/null | sed "s/^${i}: //")
            if [ -n "$REASON" ]; then
              echo "  [SKIP] ${i}: ${HOST} - ${REASON}"
            else
              echo "  [OK]   ${i}: ${HOST}"
            fi
          done < "$INSTANCES_TSV"

          rm -f /tmp/nr-mysql-admin-*.cnf.* /tmp/nr-mysql-grant-*.sql.* "$INSTANCES_TSV" "$SKIP_FILE" /tmp/nr-mysql-rds-passwords.tmp

    default:
      cmds:
        - task: write_recipe_metadata
        - task: assert_pre_req
        - task: parse_instances
        - task: assert_mysql_version
        - task: install_nrdot
        - task: configure_database_user
        - task: create_collector_config
        - task: restart_nrdot

postInstall:
  info: |2
      MySQL OTel config: /etc/nrdot-collector/mysql-config.yaml
      Env file:           /etc/nrdot-collector/nrdot-collector.conf
      Service status:     systemctl status nrdot-collector
      View logs:           journalctl -u nrdot-collector -f
      Restart service:     sudo systemctl restart nrdot-collector

      Note: explain_mode is set to "procedure" to collect query plans for
      write statements without granting DML privileges to the monitoring
      user. This falls back to "inline" automatically for any schema where
      the one-time explain_statement stored procedure hasn't been created -
      see:
      https://docs.newrelic.com/docs/opentelemetry/database/mysql/advanced-config/

      Note: on RDS/Aurora, the events_waits_current Performance Schema
      consumer does not persist across restarts or failovers (the
      mysql8.0/mysql8.4 parameter group families do not expose
      performance_schema_consumer_* parameters). The monitoring user's
      GRANT UPDATE ON performance_schema.setup_consumers privilege lets the
      collector re-enable it on reconnect; otherwise re-run:
        UPDATE performance_schema.setup_consumers SET enabled='YES'
          WHERE name = 'events_waits_current';
      after every restart/failover.
