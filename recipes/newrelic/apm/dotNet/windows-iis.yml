# Visit our schema definition for additional information on this file format
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition

name: dotnet-agent-installer
displayName: .NET Agent
description: New Relic install recipe for .NET application on Windows
repository: https://github.com/newrelic/newrelic-dotnet-agent

installTargets:
  - type: application
    os: windows

keywords:
  - Apm
  - .NET
  - dotnet
  - aspnet
  - core

processMatch: []

preInstall:
  requireAtDiscovery: |
    powershell -command '
    $iisEnabled = Get-WindowsOptionalFeature -Online -FeatureName IIS-WebServer | select State
    if ($iisEnabled.State -ne "Enabled") {
      # IIS is not installed
      exit 3
    }

    # IIS is installed
    exit 0
    '
    
validationNrql: "SELECT count(*) FROM NrIntegrationError WHERE purpose = 'New Relic CLI configuration validation' AND hostname like '{{.HOSTNAME}}%' since 10 minutes ago"

successLinkConfig:
  type: EXPLORER
  filter: '"`tags.language` = ''dotnet''"'

# Go-task Taskfile executed by the New Relic CLI installer.
install:
  version: "3"
  silent: true

  tasks:
    # Runs the tasks below in order to install, configure, and validate the agent.
    default:
      cmds:
        - task: verify_continue
        - task: assert_admin_perms
        - task: ensure_strong_crypto
        - task: stop
        - task: remove_any_previous
        - task: assert_required_powershell
        - task: download
        - task: install
        - task: configure
        - task: start
        - task: cli_validate
        - task: ensure_sites_started

    # Shows a warning that IIS will restart, then prompts to continue unless NEW_RELIC_ASSUME_YES=true.
    # Exits 130 if the user declines.
    verify_continue:
      cmds:
        - |
          powershell -command '
          Write-Host ""
          Write-Host -ForegroundColor Yellow "================================================================================"
          Write-Host -ForegroundColor Yellow "=                                                                              ="
          Write-Host -ForegroundColor Yellow "=                                   Warning                                    ="
          Write-Host -ForegroundColor Yellow "=                                                                              ="
          Write-Host -ForegroundColor Yellow "=       This installation will automatically restart IIS upon completion.      ="
          Write-Host -ForegroundColor Yellow "=                                                                              ="
          Write-Host -ForegroundColor Yellow "================================================================================"
          Write-Host ""
          Write-Host "If you are not hosting your .NET application using IIS please see our other installation options:"
          Write-Host "https://docs.newrelic.com/docs/agents/net-agent/installation/install-net-agent-windows/."
          Write-Host ""
          # If NEW_RELIC_ASSUME_YES is set to true, will not prompt input URL
          $NEW_RELIC_ASSUME_YES = "{{.NEW_RELIC_ASSUME_YES}}"
          if ($NEW_RELIC_ASSUME_YES -ieq "false") {
            WHILE ($true) {
              Write-Host "Do you want to install the .NET Agent Y/N (default: Y)? " -NoNewLine
              $NEW_RELIC_CONTINUE = $Host.UI.ReadLine()
              if ([string]::IsNullOrWhiteSpace($NEW_RELIC_CONTINUE))
              {
                $NEW_RELIC_CONTINUE = "y"
              }

              if ($NEW_RELIC_CONTINUE -ieq "n") {
                Write-Host "Exiting the installation..."
                exit 130 # often used to represent Ctrl+C.
              }
              elseif ($NEW_RELIC_CONTINUE -ieq "y") {
                Write-Host "Starting installation of the New Relic .NET Agent..."
                break
              }

              Write-Host "Please type y or n only."
            }
          }
          '
    # Exits 131 if the current PowerShell session is not running as Administrator.
    assert_admin_perms:
      cmds:
        - |
          powershell -command '
          $currentPrincipal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if (! $currentPrincipal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            Write-Host -ForegroundColor Red "The installation for the .NET Agent on Windows must be run in Powershell with Administrator permissions. Please restart Powershell in Administrator, and re-run the newrelic-cli command."
            exit 131
          }
          '

    # Checks for missing SchUseStrongCrypto/SystemDefaultTlsVersions on .NET Framework 4 registry keys;
    # prompts to enable it (unless NEW_RELIC_ASSUME_YES=true) and sets the registry value if approved.
    # ignore_error: true, so this task never fails the install.
    ensure_strong_crypto:
      ignore_error: true
      cmds:
        - |
          powershell -command '
          $keyPaths = @(
            "HKLM:\SOFTWARE\Microsoft\.NETFramework\v4.0.30319",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\.NETFramework\v4.0.30319"
          )
          $docsUrl = "https://docs.newrelic.com/docs/apm/agents/net-agent/troubleshooting/no-data-appears-after-disabling-tls-10/#windows-registry"

          $foundCount = 0
          $missing = @()
          foreach ($keyPath in $keyPaths) {
            if (-not (Test-Path $keyPath)) { continue }
            $foundCount++
            $props = Get-ItemProperty -Path $keyPath -ErrorAction SilentlyContinue
            if ($props.SchUseStrongCrypto -eq 1 -or $props.SystemDefaultTlsVersions -eq 1) { continue }
            $missing += $keyPath
          }

          if ($foundCount -eq 0) {
            Write-Host "NR_DOTNET_STRONG_CRYPTO: skipped; no .NET Framework 4 registry key found"
            exit 0
          }
          if ($missing.Count -eq 0) {
            Write-Host "NR_DOTNET_STRONG_CRYPTO: already-enabled"
            exit 0
          }

          $missingList = $missing -join ", "
          function Write-ManualFix {
            param ([string[]]$Paths)
            Write-Host -ForegroundColor Yellow "To enable TLS 1.2 for .NET Framework manually, run these commands as Administrator, then run iisreset:"
            foreach ($path in $Paths) {
              $regPath = $path -replace "^HKLM:", "HKLM"
              Write-Host -ForegroundColor Yellow "  reg add $regPath /v SchUseStrongCrypto /t REG_DWORD /d 1 /f"
            }
            Write-Host -ForegroundColor Yellow "More information: $docsUrl"
          }

          Write-Host ""
          Write-Host -ForegroundColor Yellow "WARNING: .NET Framework applications on this server, including those hosted in IIS, will be unable to connect to New Relic, because TLS 1.2 is not enabled for .NET Framework."
          Write-Host -ForegroundColor Yellow "The installer can fix this by setting the registry value SchUseStrongCrypto=1. This change affects all .NET Framework applications on this server."
          Write-Host -ForegroundColor Yellow "Registry keys to change: $missingList"
          Write-Host ""

          $answer = "y"
          $NEW_RELIC_ASSUME_YES = "{{.NEW_RELIC_ASSUME_YES}}"
          if ($NEW_RELIC_ASSUME_YES -ieq "false") {
            while ($true) {
              Write-Host "Do you want to enable TLS 1.2 for .NET Framework Y/N (default: Y)? " -NoNewLine
              $answer = $Host.UI.ReadLine()
              if ([string]::IsNullOrWhiteSpace($answer)) { $answer = "y" }
              if ($answer -ieq "y" -or $answer -ieq "n") { break }
              Write-Host "Please type y or n only."
            }
          }

          if ($answer -ieq "n") {
            Write-Host "NR_DOTNET_STRONG_CRYPTO: declined by user; .NET Framework applications on this server will be unable to connect to New Relic (not set: $missingList)"
            Write-ManualFix -Paths $missing
            exit 0
          }

          $failed = @()
          foreach ($keyPath in $missing) {
            try {
              New-ItemProperty -Path $keyPath -Name "SchUseStrongCrypto" -PropertyType DWord -Value 1 -Force -ErrorAction Stop | Out-Null
              Write-Host "NR_DOTNET_STRONG_CRYPTO: set SchUseStrongCrypto=1 in $keyPath"
            }
            catch {
              $failed += $keyPath
              Write-Host "NR_DOTNET_STRONG_CRYPTO: set-failed for $keyPath ($($_.Exception.Message))"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host -ForegroundColor Yellow "Warning: the installer could not enable TLS 1.2 for .NET Framework. .NET Framework applications on this server will be unable to connect to New Relic until it is enabled."
            Write-ManualFix -Paths $failed
          }
          exit 0
          '

    # Stops IIS via iisreset, retrying up to 30 times with a 2 second delay between attempts.
    # Exits 134 if IIS never stops.
    stop:
      cmds:
        - |
          powershell -command '
          function Stop-IIS {
            try {
              iisreset /stop | Out-Null
              return $true
            }
            catch { return $false }
          }

          $stopped = $false
          for ($tries = 0; $tries -lt 30; $tries++) {
            if ((Stop-IIS)) {
              $stopped = $true
              break
            }
            # Try to stop IIS again after a delay
            Start-Sleep -s 2
          }

          if (-not $stopped) {
            Write-Host -ForegroundColor Red "Failed to stop IIS after multiple attempts. Please ensure the World Wide Web Publishing Service (W3SVC) is running and that you have permission to stop it, then re-run the installer."
            exit 134 # failed to stop IIS
          }
          '

    # Finds any existing New Relic .NET Agent MSI install (32 and 64 bit registry Uninstall keys)
    # and uninstalls it silently via msiexec.
    # ignore_error: true, so this task never fails the install.
    remove_any_previous:
      ignore_error: true
      cmds:
        - |
          powershell -command '
          function Find-UninstallGuids {
            param (
              [Parameter(Mandatory)]
              [string]$Match
            )

            $baseKeys = Get-ChildItem -Path HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall `
            | % { $_.Name.TrimStart("HKEY_LOCAL_MACHINE\") }

            $wowKeys = Get-ChildItem -Path HKLM:\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall `
            | % { $_.Name.TrimStart("HKEY_LOCAL_MACHINE\") }

            $allKeys = $baseKeys + $wowKeys

            $uninstallIds = New-Object System.Collections.ArrayList
            foreach ($key in $allKeys) {
              try {
                $keyData = Get-Item -Path HKLM:\$key -ErrorAction SilentlyContinue
                $name = $keyData.GetValue("DisplayName")
                if ($name -and $name -match $Match) {
                  $keyId = Split-Path $key -Leaf
                  $uninstallIds.Add($keyId) | Out-Null
                }
              }
              catch {}
            }

            if ($uninstallIds.Count -eq 0) {
              return @()
            }

            return $uninstallIds
          }

          $uninstallIds = Find-UninstallGuids -Match "New Relic .NET Agent"
          foreach ($uninstallId in $uninstallIds) {
            try {
              Start-Process -FilePath msiexec.exe -ArgumentList "/qn","/x $uninstallId" -Wait -NoNewWindow
            }
            catch {
              Write-Host -ForegroundColor Yellow "Warning: failed to launch msiexec.exe to remove previous New Relic .NET Agent install ($uninstallId): $($_.Exception.Message)"
            }
          }
          '

    # Exits 131 if powershell.exe is not available on the system.
    assert_required_powershell:
      cmds:
        - |
          powershell -command '
          $powershellEnabled = ""
          try {
            $powershellEnabled = Get-Command -All powershell.exe | select Name
          }
          catch { }
          if ($powershellEnabled.Name -ne "powershell.exe") {
            Write-Host -ForegroundColor Red "Powershell is required. Please start Powershell in Administrator, and re-run the newrelic-cli command."
            exit 131;
          }
          '

    # Enables TLS 1.2/1.3 for the download, then downloads the agent MSI (using HTTPS_PROXY if set).
    # Exits with a download-specific error code (24 unknown, 25 web error, 26 file/IO or access error) on failure.
    download:
      cmds:
        - |
          powershell -command '
          try {
            [Net.ServicePointManager]::SecurityProtocol = "tls";
            [Net.ServicePointManager]::SecurityProtocol = "tls12, tls";
            [Net.ServicePointManager]::SecurityProtocol = "tls13, tls12, tls"
          }
          catch {}

          $WebClient = New-Object System.Net.WebClient
          if ($env:HTTPS_PROXY) {
            $WebClient.Proxy = New-Object System.Net.WebProxy($env:HTTPS_PROXY, $true)
          }

          try {
            $WebClient.DownloadFile("{{.NEW_RELIC_DOWNLOAD_URL}}dot_net_agent/latest_release/NewRelicDotNetAgent_x64.msi", "$env:TEMP\NewRelicDotNetAgent_x64.msi")
          }
          catch {
            $baseException = $_.Exception.GetBaseException()
            Write-Host -ForegroundColor Red "Failed to download New Relic .NET Agent ($($baseException.Message))"
            $errorCode = 24 # unknown download error

            switch ($baseException) {
              { $_ -is [Net.WebException] }            { $errorCode = 25 } # web download error
              { $_ -is [IO.IOException] }              { $errorCode = 26 } # file io error
              { $_ -is [UnauthorizedAccessException] } { $errorCode = 26 } # file io error
            }

            exit $errorCode
          }
          '

    # Runs the downloaded MSI silently with the license key.
    # Treats exit codes 0, 1641, and 3010 as success; any other msiexec exit code is raised as this task's exit code.
    # Exits 139 if msiexec.exe cannot be launched.
    install:
      cmds:
        - |
          powershell -command '
          try {
            $installCode = (Start-Process -FilePath msiexec.exe -ArgumentList "/qn","/i","$env:TEMP\NewRelicDotNetAgent_x64.msi","NR_LICENSE_KEY={{.NEW_RELIC_LICENSE_KEY}}" -PassThru -Wait -NoNewWindow -RedirectStandardOutput ".\NUL").ExitCode
          }
          catch {
            Write-Host -ForegroundColor Red "Failed to launch msiexec.exe to install the New Relic .NET Agent: $($_.Exception.Message)"
            Write-Host -ForegroundColor Red "This can happen if antivirus/endpoint protection software is blocking msiexec.exe, or if the current user lacks permission to execute it."
            exit 139 # failed to start installer process
          }

          # https://docs.microsoft.com/en-us/windows/win32/msi/error-codes
          if (@(0,1641,3010) -NotContains $installCode) {
            Write-Host -ForegroundColor Red "Failed to install New Relic .NET Agent ($installCode)"
            exit $installCode # install code error
          }
          '
        - echo "New Relic .NET Agent installed"

    # Edits newrelic.config: clears existing <application> entries, points at the staging collector
    # if NEW_RELIC_REGION is STAGING, adds proxy settings from HTTPS_PROXY, enables application logging
    # and log forwarding, and adds NEW_RELIC_CLI_TAGS as labels. Exits 136 on failure.
    configure:
      cmds:
        - |
          powershell -command '
          try {
          $configPath = "$env:ProgramData\New Relic\.NET Agent\newrelic.config"
          $file = Resolve-Path("$configPath")
          $xdoc = New-Object System.Xml.XmlDocument
          $xdoc.PreserveWhitespace = $true
          $xdoc.Load($file)
          if ($xdoc.GetElementsByTagName("application")[0].HasChildNodes) {
            $xdoc.configuration.application.RemoveAll()
          }
          if ("{{.NEW_RELIC_REGION}}" -like "STAGING") {
            $xdoc.configuration.service.SetAttribute("host", "staging-collector.newrelic.com")
          }
          if ("$env:HTTPS_PROXY") {
            $uri = ""
            try {
              $uri = [System.Uri]::new("$env:HTTPS_PROXY")
            }
            catch { }
            if ($uri) {
              $proxy = $xdoc.GetElementsByTagName("proxy")[0]
              if ($proxy) {
                $xdoc.configuration.service.RemoveChild($proxy) | Out-Null
              }
              $child = $xdoc.CreateElement("proxy", "urn:newrelic-config")
              $child.SetAttribute("host", $uri.Host)
              $child.SetAttribute("port", $uri.Port)
              if ($uri.PathAndQuery -and $uri.PathAndQuery -ne "/" ) {
                $child.SetAttribute("uriPath", $uri.PathAndQuery)
              }
              if ($uri.UserInfo) {
                $parts = $uri.UserInfo.Split(":")
                if ($parts.Length -ge 1) {
                  $child.SetAttribute("user", $parts[0])
                }
                if ($parts.Length -ge 2) {
                  $password = $uri.UserInfo.Substring($uri.UserInfo.IndexOf(":")+1)
                  $child.SetAttribute("password", $password);
                }
              }
              $xdoc.configuration.service.AppendChild($child) | Out-Null
            }
          }

          if ($xdoc.GetElementsByTagName("applicationLogging")[0]) {
            $xdoc.configuration.applicationLogging.SetAttribute("enabled", "true")
            if ($xdoc.GetElementsByTagName("forwarding")[0]) {
              $xdoc.configuration.applicationLogging.forwarding.SetAttribute("enabled", "true")
            }
            else {
              $child = $xdoc.CreateElement("forwarding", "urn:newrelic-config")
              $child.SetAttribute("enabled", "true")
              $xdoc.configuration.applicationLogging.AppendChild($child) | Out-Null
            }
          }
          else {
            $child = $xdoc.CreateElement("applicationLogging", "urn:newrelic-config")
            $child.SetAttribute("enabled", "true")
            $xdoc.configuration.AppendChild($child) | Out-Null
            $child = $xdoc.CreateElement("forwarding", "urn:newrelic-config")
            $child.SetAttribute("enabled", "true")
            $xdoc.configuration.applicationLogging.AppendChild($child) | Out-Null
          }
          
          $tags = "{{.NEW_RELIC_CLI_TAGS}}"
          if ($tags) {
            $child = $xdoc.CreateElement("labels", "urn:newrelic-config")
            $text = $xdoc.CreateTextNode($tags)
            $child.AppendChild($text) | Out-Null
            $xdoc.configuration.AppendChild($child) | Out-Null
          }

          $xdoc.Save($configPath)
          }
          catch {
            Write-Host -ForegroundColor Red "Failed to configure the New Relic .NET Agent: $($_.Exception.Message)"
            Write-Host -ForegroundColor Red "This can happen if newrelic.config was not found at the expected location (install may not have completed successfully), or if it could not be read/written due to permissions."
            exit 136 # failed to configure agent
          }
          '
        - echo "New Relic .NET Agent configured"

    # Starts IIS via iisreset, retrying up to 30 times with a 2 second delay between attempts.
    # Exits 135 if IIS never starts.
    start:
      cmds:
        - |
          powershell -command '
          function Start-IIS {
            try {
              iisreset /start | Out-Null
              return $true
            }
            catch { return $false }
          }

          $started = $false
          for ($tries = 0; $tries -lt 30; $tries++) {
            if ((Start-IIS)) {
              $started = $true
              break
            }
            # Try to start IIS again after a delay
            Start-Sleep -s 2
          }

          if (-not $started) {
            Write-Host -ForegroundColor Red "Failed to start IIS after multiple attempts. The New Relic .NET Agent was installed, but IIS may not be running. Please start IIS manually (iisreset /start) and verify your sites are running."
            exit 135 # failed to start IIS
          }
          '

    # Runs newrelic.exe diagnose validate to confirm the agent is reporting data.
    # A non-zero validate exit code only prints a warning; it does not fail the install.
    # Exits 133 only if newrelic.exe cannot be launched.
    cli_validate:
      cmds:
        - |
          powershell -command '
          $env:NEW_RELIC_REGION="{{.NEW_RELIC_REGION}}"
          $env:NEW_RELIC_API_KEY="{{.NEW_RELIC_API_KEY}}"
          $env:NEW_RELIC_ACCOUNT_ID="{{.NEW_RELIC_ACCOUNT_ID}}"
          $env:NEW_RELIC_LICENSE_KEY="{{.NEW_RELIC_LICENSE_KEY}}"
          try {
            $validateCode = (Start-Process -FilePath "C:\Program Files\New Relic\New Relic CLI\newrelic.exe" -ArgumentList "diagnose","validate" -PassThru -Wait -NoNewWindow -RedirectStandardOutput ".\NUL").ExitCode
          }
          catch {
            Write-Host -ForegroundColor Red "Failed to launch newrelic.exe to validate the installation: $($_.Exception.Message)"
            Write-Host -ForegroundColor Red "This can happen if antivirus/endpoint protection software is blocking newrelic.exe, or if the current user lacks permission to execute it."
            exit 133 # failed to start CLI validation process
          }

          if ($validateCode -ne 0) {
            Write-Host -ForegroundColor Yellow "Warning: New Relic CLI validation exited with a non-zero code ($validateCode). The .NET Agent was installed, but reporting data to New Relic could not be confirmed."
          }
          '

    # ignore_error: true, so this task never fails the install.
    # Calls Get-WebURL on IIS sites and discards the result; any error is caught and ignored.
    ensure_sites_started:
      ignore_error: true
      cmds:
        - |
          powershell -command '
          try {
            Get-WebURL "IIS:\Sites\*" | Out-Null
          }
          catch {}
          '
