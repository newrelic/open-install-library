# Visit our schema definition for additional information on this file format
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition

name: dotnet-agent-installer
displayName: .NET Agent
description: New Relic install recipe for .NET application on Windows
repository: https://github.com/newrelic/newrelic-dotnet-agent

installTargets:
  # Server 2008
  - type: application
    os: windows
    platformVersion: "6\\.0\\.6003 Build 6003"
  # Server 2008 R2
  - type: application
    os: windows
    platformVersion: "6\\.1\\.7601 Build 7601"
  # Server 2012
  - type: application
    os: windows
    platformVersion: "6\\.2\\.9200 Build 9200"
  # Server 2012 R2
  - type: application
    os: windows
    platformVersion: "6\\.3\\.9600 Build 9600"
  
keywords:
  - Apm
  - .NET
  - dotnet
  - aspnet
  - core

processMatch: []

preInstall:
  # The CLI shows the last line written to stderr before a non-zero exit as the reason.
  # The reason is the Windows version either way, so a user isn't led to enable IIS
  # on a version of Windows that this recipe will never install the agent on.
  requireAtDiscovery: |
    powershell -command '
    $reason = "Guided install does not support the .NET agent on this version of Windows. For other installation options, see https://docs.newrelic.com/docs/agents/net-agent/installation/install-net-agent-windows/"

    $iisEnabled = Get-WindowsOptionalFeature -Online -FeatureName IIS-WebServer | select State
    if ($iisEnabled.State -ne "Enabled") {
      # Nothing for the agent to instrument, so skip the recipe without reporting it
      [Console]::Error.WriteLine($reason)
      exit 3
    }

    # The CLI reports exit 131 as unsupported and does not run the install section
    [Console]::Error.WriteLine($reason)
    exit 131
    '

successLinkConfig:
  type: EXPLORER
  filter: '"`tags.language` = ''dotnet''"'

install:
  version: "3"
  silent: true

  tasks:
    default:
      cmds:
        - task: unsupported

    # preInstall keeps the CLI from running this, but if it does run, report unsupported
    # (exit 131, with the last stderr line as the reason), not canceled (exit 130).
    unsupported:
      cmds:
        - |
          powershell -command '
          [Console]::Error.WriteLine("Guided install does not support the .NET agent on this version of Windows. For other installation options, see https://docs.newrelic.com/docs/agents/net-agent/installation/install-net-agent-windows/")
          exit 131
          '
