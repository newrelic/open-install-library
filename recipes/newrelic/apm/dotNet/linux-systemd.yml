# Visit our schema definition for additional information on this file format
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition

name: dotnet-agent-installer
displayName: .NET Agent
description: New Relic install recipe for instrumenting .NET applications on Linux
repository: https://github.com/newrelic/newrelic-dotnet-agent

installTargets:
  - type: application
    os: linux
    kernelArch: x86_64
  - type: application
    os: linux
    kernelArch: aarch64

keywords:
  - Apm
  - .NET
  - dotnet
  - aspnet
  - core

processMatch: []

preInstall:
  # The install section's find_dotnet_services task runs this same script (the YAML alias
  # *dotnet_discovery), with DOTNET_SERVICES_FILE set so the script writes the services it finds.
  requireAtDiscovery: &dotnet_discovery |
    # The CLI shows the last line written to stderr before a non-zero exit as the reason.

    # Find .NET processes on any architecture: CoreCLR-based processes map libcoreclr.so,
    # however .NET was installed (OS package, dotnet-install.sh, tarball, or a self-contained
    # app). Native AOT apps don't, and the agent doesn't support them. Reading other users'
    # /proc/<pid>/maps requires root, which guided install runs as.
    DOTNET_PIDS=""
    for maps in /proc/[0-9]*/maps; do
      grep -qsi '/libcoreclr\.so$' "$maps" || continue
      pid=${maps#/proc/}
      pid=${pid%/maps}
      comm=$(tr '[:upper:]' '[:lower:]' 2>/dev/null < "/proc/${pid}/comm") || continue
      # Process name deny list: skip common system and user processes that are not relevant for instrumentation
      # Source: https://github.com/newrelic/nri-introspector-dotnet/blob/main/src/nri-introspector-dotnet/AllowDenyLists.cs
      case "$comm" in
        chrome*|code*|com.docker*|dbgsvc*|docker*|dpotelemetrysvc*|firefox*|idle*|iexplore*|intellitrace*|lms*|mdnsresponder*|"memory compression"*|microsoft.*|openconsole*|powershell*|pwsh*|sihost*|sqlwriter*|system*|vpnkit*|vmmem*) continue ;;
      esac
      DOTNET_PIDS="${DOTNET_PIDS} ${pid}"
    done

    if [[ -z "$DOTNET_PIDS" ]]
    then
      printf '%s\n' "No CoreCLR-based .NET processes were detected. Start your .NET application and run the installer again." >&2
      exit 3
    fi

    # Find the systemd services whose main process is one of them
    DOTNET_SERVICES=""
    for sn in $(systemctl list-unit-files --type service | awk '{ print $1 }'); do
      mainpid=$(systemctl show --property MainPID "$sn" 2>/dev/null | sed 's/MainPID=//')
      for pid in $DOTNET_PIDS; do
        if [[ "$mainpid" -eq "$pid" ]]
        then
          echo "Found .NET service: ${sn}"
          DOTNET_SERVICES="${DOTNET_SERVICES} ${sn}"
        fi
      done
    done

    if [[ -z "$DOTNET_SERVICES" ]]
    then
      echo ".NET processes were found, but none are running as systemd services. This installer only instruments .NET applications run by systemd." >&2
      exit 132
    fi

    if [[ -n "${DOTNET_SERVICES_FILE:-}" ]]
    then
      printf '%s\n' $DOTNET_SERVICES > "$DOTNET_SERVICES_FILE"
    fi

validationNrql: "SELECT count(*) FROM NrIntegrationError WHERE purpose = 'New Relic CLI configuration validation' AND hostname like '{{.HOSTNAME}}%' since 10 minutes ago"

successLinkConfig:
   type: EXPLORER
   filter: '"`tags.language` = ''dotnet''"'

install:

  version: "3"
  silent: true

  tasks:
    default:
      cmds:
        - task: verify_continue
        - task: assert_pre_req
        - task: add_gnupg2_if_required
        - task: find_dotnet_services
        - task: setup_repo
        # Runs when this task exits, success or failure. Restarts the services if a later step failed after stopping them.
        - defer: { task: restore_services_on_failure }
        - task: stop
        - task: remove_any_previous
        - task: install
        - task: configure
        - task: start
        - task: cli_validate
        - task: ensure_sites_started
        - task: cleanup_temp_files

    verify_continue:
      cmds:
        - |
          YELLOW='\033[0;33m'
          NOCOLOR='\033[0m'
          echo -e "${YELLOW}
          ================================================================================
          =                                                                              =
          =                                   Warning                                    =
          =                                                                              =
          =       This installation will automatically restart all systemd services      =
          =       that run .NET applications upon completion.                            =
          =                                                                              =
          ================================================================================
          ${NOCOLOR}"
          echo "
          If you are hosting your .NET application differently then check out our other installation options:
          https://docs.newrelic.com/docs/agents/net-agent/installation/install-net-agent-linux/.
          "
          NEW_RELIC_ASSUME_YES="{{.NEW_RELIC_ASSUME_YES}}"
          if [[ "$NEW_RELIC_ASSUME_YES" != "true" ]]; then
            while :; do
              echo -n "Do you want to install the .NET Agent Y/N (default: Y)? "
              read answer
              echo ""
              NEW_RELIC_CONTINUE=$(echo "${answer^^}" | cut -c1-1)
              if [[ -z "$NEW_RELIC_CONTINUE" ]]; then
                NEW_RELIC_CONTINUE="Y"
              fi
              if [[ "$NEW_RELIC_CONTINUE" == "N" ]]; then
                echo "Exiting the installation"
                exit 130
              fi
              if [[ "$NEW_RELIC_CONTINUE" == "Y" ]]; then
                break
              fi
              echo -e "Please type Y or N only."
            done
          fi

    assert_pre_req:
      cmds:
        - |
          IS_SYSTEMCTL_INSTALLED=$(which systemctl | wc -l)
          if [ "$IS_SYSTEMCTL_INSTALLED" -eq 0 ]
          then
            echo "This installation recipe for the New Relic .NET agent on Linux only supports services managed by 'systemd'." >&2
            exit 20
          fi
        - |
          # Map of tool names to the associated error code
          required_tools_and_error_codes="grep:10 sed:11 awk:12 cat:13 tee:14"

          for tuple in $required_tools_and_error_codes; do
            tool=$(echo ${tuple} |cut -d':' -f1)
            code=$(echo ${tuple} |cut -d':' -f2)

            IS_TOOL_INSTALLED=$(which ${tool} | wc -l)
            if [ "$IS_TOOL_INSTALLED" -eq 0 ]
            then
              echo "This installation recipe for the New Relic .NET agent on Linux requires '${tool}' to be installed." >&2
              exit ${code}
            fi
          done
          
    add_gnupg2_if_required:
      cmds:
        - |
          IS_YUM_INSTALLED=$(which yum 2>&1 || true)
          IS_ZYPPER_INSTALLED=$(which zypper 2>/dev/null || true)
          if [[ -z "$IS_YUM_INSTALLED" && -z "$IS_ZYPPER_INSTALLED" ]]; then
            if [ $(({{.DEBIAN_VERSION}})) -ge 10 ]; then
              sudo apt-get install gnupg2 -y
            fi
          fi
      vars:
        DEBIAN_VERSION:
          sh: awk -F= '/VERSION_ID/ {print $2}' /etc/os-release

    # Runs the preInstall discovery script again, since the services may have changed since
    # discovery, and writes the services it finds to dotnet_services.txt for the later tasks
    find_dotnet_services:
      env:
        DOTNET_SERVICES_FILE: /tmp/dotnet-introspector/dotnet_services.txt
      cmds:
        - rm -rf /tmp/dotnet-introspector
        - mkdir -p /tmp/dotnet-introspector
        - chmod -R 777 /tmp/dotnet-introspector
        - *dotnet_discovery
        - echo "Done finding .NET services"

    # Repository, key, and package download happen before any services are stopped,
    # so a network or key failure leaves the customer's services running.
    setup_repo:
      cmds:
        - |
          IS_YUM_INSTALLED=$(which yum 2>&1 || true)
          IS_ZYPPER_INSTALLED=$(which zypper 2>/dev/null || true)
          IS_APT_INSTALLED=$(which apt-get 2>/dev/null || true)
          if [[ "$(uname -m)" == "aarch64" && -z "$IS_APT_INSTALLED" ]]
          then
            # There is no ARM64 rpm of the agent, so ARM64 hosts without apt install the tarball.
            curl -fsSL --retry 3 {{.NEW_RELIC_DOWNLOAD_URL}}dot_net_agent/latest_release/newrelic-dotnet-agent_arm64.tar.gz -o /tmp/dotnet-introspector/newrelic-dotnet-agent_arm64.tar.gz
            tar -tzf /tmp/dotnet-introspector/newrelic-dotnet-agent_arm64.tar.gz > /dev/null
          elif [[ -n "$IS_ZYPPER_INSTALLED" ]]
          then
            # SLES: zypper reads the same rpm-md repository as yum, but it can't parse the
            # yum .repo file as published (CRLF line endings, $basearch in baseurl), so
            # download it and adapt it for zypper. The recipe only targets x86_64.
            # The repository metadata is unsigned (yum's gpgcheck only checks packages), so
            # check package signatures but not the metadata signature, matching yum.
            REPO_TMP=$(mktemp -d)
            curl -fsS --retry 3 https://download.newrelic.com/dot_net_agent/yum/newrelic-dotnet-agent.repo -o "${REPO_TMP}/newrelic-dotnet-agent.repo"
            sed -i \
              -e 's/\r$//' \
              -e 's/\$basearch/x86_64/g' \
              -e '/^\(type\|autorefresh\|repo_gpgcheck\|pkg_gpgcheck\)=/d' \
              -e '$a\' \
              "${REPO_TMP}/newrelic-dotnet-agent.repo"
            # The zypper settings are appended to the end of the file, which is only correct
            # if the file still has a single [newrelic-dotnet-agent-repo] section.
            if [[ "$(grep -c '^\[' "${REPO_TMP}/newrelic-dotnet-agent.repo")" -ne 1 ]] \
              || ! grep -q '^\[newrelic-dotnet-agent-repo\]$' "${REPO_TMP}/newrelic-dotnet-agent.repo"
            then
              rm -rf "${REPO_TMP}"
              echo "The New Relic .NET agent repository file has an unexpected format and can't be adapted for zypper." >&2
              exit 1
            fi
            printf '%s\n' 'type=rpm-md' 'autorefresh=1' 'repo_gpgcheck=0' 'pkg_gpgcheck=1' >> "${REPO_TMP}/newrelic-dotnet-agent.repo"
            sudo install -m 644 "${REPO_TMP}/newrelic-dotnet-agent.repo" /etc/zypp/repos.d/newrelic-dotnet-agent.repo
            rm -rf "${REPO_TMP}"
            KEY_TMP=$(mktemp -d)
            curl -fsS --retry 3 -o "${KEY_TMP}/NEWRELIC_APT_2DAD550E.public" {{.NEW_RELIC_DOWNLOAD_URL}}NEWRELIC_APT_2DAD550E.public
            sudo rpm --import "${KEY_TMP}/NEWRELIC_APT_2DAD550E.public"
            rm -rf "${KEY_TMP}"
            # Another process (e.g. registration on a newly booted host) may hold the zypper
            # lock, so every zypper call waits up to 5 minutes for it instead of failing.
            # sudo resets the environment, so the variable is set after sudo.
            sudo ZYPP_LOCK_TIMEOUT=300 zypper -n --quiet refresh -r newrelic-dotnet-agent-repo
            # --force makes zypper download the package even when it is already installed (i.e. on a rerun)
            sudo ZYPP_LOCK_TIMEOUT=300 zypper -n --quiet install --force --download-only newrelic-dotnet-agent
          elif [[ -z "$IS_YUM_INSTALLED" ]]
          then
            # apt-get can transiently fail with exit 100 ("Unable to lock directory
            # /var/lib/apt/lists/") if another process (e.g. unattended-upgrades,
            # cloud-init) is holding the apt/dpkg lock. Retry with backoff instead
            # of failing the whole install on that transient contention.
            run_apt_with_retry() {
              local max_attempts=10
              local delay=3
              local attempt=1
              while [ $attempt -le $max_attempts ]; do
                "$@" && return 0
                echo "apt-get is locked by another process, retrying in ${delay}s (attempt ${attempt}/${max_attempts})..." >&2
                sleep $delay
                attempt=$((attempt + 1))
              done
              echo "Giving up: apt-get is still locked by another process after ${max_attempts} attempts." >&2
              exit 27
            }

            echo 'deb [signed-by=/usr/share/keyrings/newrelic-apt.gpg] http://apt.newrelic.com/debian/ newrelic non-free' | sudo tee /etc/apt/sources.list.d/newrelic.list > /dev/null

            # Build the keyring in a temp dir so a failed download never touches the existing keyring.
            # --batch --yes keeps gpg from prompting (and failing without a tty) when the output exists.
            KEY_TMP=$(mktemp -d)
            wget -q -O "${KEY_TMP}/newrelic-apt.public" {{.NEW_RELIC_DOWNLOAD_URL}}NEWRELIC_APT_2DAD550E.public
            gpg --batch --yes --dearmor -o "${KEY_TMP}/newrelic-apt.gpg" "${KEY_TMP}/newrelic-apt.public"
            sudo install -m 644 "${KEY_TMP}/newrelic-apt.gpg" /usr/share/keyrings/newrelic-apt.gpg
            rm -rf "${KEY_TMP}"

            run_apt_with_retry sudo apt-get -o Acquire::Check-Valid-Until=false update >/dev/null
            # --reinstall makes apt download the package even when it is already installed (i.e. on a rerun)
            run_apt_with_retry sudo apt-get install --download-only --reinstall newrelic-dotnet-agent -y -qq > /dev/null
          else
            # -f fails on an HTTP error instead of writing the error page over the existing .repo file
            curl -fsS --retry 3 https://download.newrelic.com/dot_net_agent/yum/newrelic-dotnet-agent.repo -o /etc/yum.repos.d/newrelic-dotnet-agent.repo
            # Some yum versions (e.g. Amazon Linux 2) fetch the repository's GPG keys only when they
            # install the package, which needs the network, so import them now. Only the current
            # signing key is imported: the legacy key (548C16BF) only signed agent versions
            # <=10.47.0, which are out of support, and RHEL 10+ crypto policy rejects it.
            KEY_TMP=$(mktemp -d)
            curl -fsS --retry 3 -o "${KEY_TMP}/NEWRELIC_APT_2DAD550E.public" {{.NEW_RELIC_DOWNLOAD_URL}}NEWRELIC_APT_2DAD550E.public
            sudo rpm --import "${KEY_TMP}/NEWRELIC_APT_2DAD550E.public"
            rm -rf "${KEY_TMP}"
            sudo yum makecache -q
            # Download the package now so install doesn't need the network. On a rerun the agent is
            # already installed, and install --downloadonly does nothing; reinstall fails if it isn't.
            if rpm -q newrelic-dotnet-agent > /dev/null 2>&1
            then
              sudo yum reinstall -y -q --downloadonly newrelic-dotnet-agent
            else
              sudo yum install -y -q --downloadonly newrelic-dotnet-agent
            fi
          fi
        - echo "Done setting up the New Relic package repository"

    stop:
      cmds:
        # Marks that services are down; restore_services_on_failure restarts them if this marker is still present.
        - touch /tmp/dotnet-introspector/.services_stopped
        - |
          for sn in `cat /tmp/dotnet-introspector/dotnet_services.txt`; do
            sudo systemctl stop $sn
          done
        - echo "Done stopping services"

    remove_any_previous:
      ignore_error: true
      cmds:
        - |
          IS_YUM_INSTALLED=$(which yum 2>&1 || true)
          IS_ZYPPER_INSTALLED=$(which zypper 2>/dev/null || true)
          IS_APT_INSTALLED=$(which apt-get 2>/dev/null || true)
          if [[ "$(uname -m)" == "aarch64" && -z "$IS_APT_INSTALLED" ]]
          then
            # Tarball installs are upgraded in place by the install task, which keeps newrelic.config
            true
          elif [[ -n "$IS_ZYPPER_INSTALLED" ]]
          then
            sudo ZYPP_LOCK_TIMEOUT=300 zypper -n remove newrelic-netcore20-agent >/dev/null 2>&1 || true
            sudo ZYPP_LOCK_TIMEOUT=300 zypper -n remove newrelic-dotnet-agent >/dev/null 2>&1 || true
          elif [[ -z "$IS_YUM_INSTALLED" ]]
          then
            sudo DEBIAN_FRONTEND=noninteractive dpkg -r newrelic-netcore20-agent >/dev/null 2>&1 || true
            sudo DEBIAN_FRONTEND=noninteractive dpkg -r newrelic-dotnet-agent >/dev/null 2>&1 || true
          else
            sudo yum remove newrelic-netcore20-agent -y >/dev/null 2>&1 || true
            sudo yum remove newrelic-dotnet-agent -y >/dev/null 2>&1 || true
          fi

        - |
          for sn in `cat /tmp/dotnet-introspector/dotnet_services.txt`; do
            if [[ -f "/etc/systemd/system/$sn.d/nr_dotnet_agent_env.conf" ]]
            then
              sudo rm -f /etc/systemd/system/$sn.d/nr_dotnet_agent_env.conf
            fi

            sudo rmdir /etc/systemd/system/$sn.d >/dev/null 2>&1 || true
          done
        - echo "Done removing previous versions of the agent"

    install:
      cmds:
        - |
          IS_YUM_INSTALLED=$(which yum 2>&1 || true)
          IS_ZYPPER_INSTALLED=$(which zypper 2>/dev/null || true)
          IS_APT_INSTALLED=$(which apt-get 2>/dev/null || true)
          if [[ "$(uname -m)" == "aarch64" && -z "$IS_APT_INSTALLED" ]]
          then
            # The tarball was downloaded in setup_repo. Install it the way the deb and rpm packages do.
            NEWRELIC_HOME=/usr/local/newrelic-dotnet-agent
            TARBALL=/tmp/dotnet-introspector/newrelic-dotnet-agent_arm64.tar.gz
            MANIFEST=${NEWRELIC_HOME}/.tarball-files

            # Like a package upgrade, remove the files the previous tarball install added, so files
            # the new version no longer ships don't linger. Logs and custom extension files aren't
            # in the list, so they stay.
            if [[ -f "$MANIFEST" ]]
            then
              while read -r f; do
                case "$f" in
                  */|newrelic-dotnet-agent/newrelic.config) continue ;;
                esac
                sudo rm -f "/usr/local/${f}"
              done < "$MANIFEST"
            fi

            # newrelic.config is a config file in the packages, so keep the existing one
            if [[ -f "${NEWRELIC_HOME}/newrelic.config" ]]
            then
              sudo tar -xzf "$TARBALL" -C /usr/local --exclude newrelic-dotnet-agent/newrelic.config
            else
              sudo tar -xzf "$TARBALL" -C /usr/local
            fi
            tar -tzf "$TARBALL" | sudo tee "$MANIFEST" > /dev/null

            # The same setup as the packages' postinst scripts
            sudo mkdir -p "${NEWRELIC_HOME}/logs" /var/log/newrelic
            sudo chmod o+w "${NEWRELIC_HOME}/logs"
            sudo ln -sTf "${NEWRELIC_HOME}/logs" /var/log/newrelic/dotnet
            echo "export CORECLR_NEWRELIC_HOME=${NEWRELIC_HOME}" | sudo tee /etc/profile.d/newrelic-dotnet-agent-path.sh > /dev/null
            sudo chmod +x ${NEWRELIC_HOME}/*.sh
          elif [[ -n "$IS_ZYPPER_INSTALLED" ]]
          then
            # The repository was set up and the package downloaded in setup_repo
            sudo ZYPP_LOCK_TIMEOUT=300 zypper -n --quiet install newrelic-dotnet-agent
          elif [[ -z "$IS_YUM_INSTALLED" ]]
          then
            # Same lock-contention retry as in setup_repo (each task cmd runs in its own shell).
            run_apt_with_retry() {
              local max_attempts=10
              local delay=3
              local attempt=1
              while [ $attempt -le $max_attempts ]; do
                "$@" && return 0
                echo "apt-get is locked by another process, retrying in ${delay}s (attempt ${attempt}/${max_attempts})..." >&2
                sleep $delay
                attempt=$((attempt + 1))
              done
              echo "Giving up: apt-get is still locked by another process after ${max_attempts} attempts." >&2
              exit 27
            }

            # The repository was set up and the package downloaded in setup_repo
            run_apt_with_retry sudo apt-get install newrelic-dotnet-agent -y -qq > /dev/null
          else
            sudo yum install newrelic-dotnet-agent -q -y
          fi
        - echo "New Relic .NET agent installed"

    configure:
      cmds:
        - |
          for sn in `cat /tmp/dotnet-introspector/dotnet_services.txt`; do
            if [[ ! -d "/etc/systemd/system/${sn}.d" ]]
            then
              sudo mkdir -p "/etc/systemd/system/${sn}.d"
            fi
            cat << EOF | sudo tee "/etc/systemd/system/${sn}.d/nr_dotnet_agent_env.conf" >/dev/null
          [Service]
          Environment="CORECLR_ENABLE_PROFILING=1"
          Environment="CORECLR_PROFILER={36032161-FFC0-4B61-B559-F6C5D41BAE5A}"
          Environment="CORECLR_NEWRELIC_HOME=/usr/local/newrelic-dotnet-agent"
          Environment="CORECLR_PROFILER_PATH=/usr/local/newrelic-dotnet-agent/libNewRelicProfiler.so"
          Environment="NEW_RELIC_LICENSE_KEY={{.NEW_RELIC_LICENSE_KEY}}"
          Environment="NEW_RELIC_APP_NAME=${sn}"
          Environment="NEW_RELIC_APPLICATION_LOGGING_ENABLED=true"
          Environment="NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED=true"
          Environment="NEW_RELIC_LABELS={{.NEW_RELIC_CLI_TAGS}}"
          EOF

            nr_region="{{.NEW_RELIC_REGION}}"
            if [[ "${nr_region^^}" == "STAGING" ]]; then
              echo Detected running in STAGING, configuring agent to report to staging
              echo "Environment=\"NEW_RELIC_HOST=staging-collector.newrelic.com\"" |sudo tee -a "/etc/systemd/system/${sn}.d/nr_dotnet_agent_env.conf" >/dev/null
            fi

          done
        - echo "New Relic .NET agent configured"

    start:
      cmds:
        - sudo systemctl daemon-reload
        - |
          for sn in `cat /tmp/dotnet-introspector/dotnet_services.txt`; do
            echo "Restarting $sn"
            sudo systemctl restart $sn
          done
        - rm -f /tmp/dotnet-introspector/.services_stopped
        - echo "Services restarted"

    restore_services_on_failure:
      cmds:
        - |
          if [[ -f /tmp/dotnet-introspector/.services_stopped ]]
          then
            echo "The New Relic .NET agent installation failed after stopping services. Restarting them." >&2
            sudo systemctl daemon-reload || true
            for sn in `cat /tmp/dotnet-introspector/dotnet_services.txt`; do
              echo "Starting $sn" >&2
              sudo systemctl start $sn || echo "Failed to start $sn" >&2
            done
            rm -f /tmp/dotnet-introspector/.services_stopped
          fi

    cli_validate:
      cmds:
        - sudo NEW_RELIC_REGION={{.NEW_RELIC_REGION}} NEW_RELIC_API_KEY={{.NEW_RELIC_API_KEY}} NEW_RELIC_ACCOUNT_ID={{.NEW_RELIC_ACCOUNT_ID}} NEW_RELIC_LICENSE_KEY={{.NEW_RELIC_LICENSE_KEY}} /usr/local/bin/newrelic diagnose validate

    ensure_sites_started:
      ignore_error: true
      cmds:
        # Wait to give the services we just (re)started time to get going
        - |
          sleep 10
        # Get the current PIDs of the services
        - |
          for sn in `cat /tmp/dotnet-introspector/dotnet_services.txt`; do
            pid=$(systemctl show --property MainPID $sn 2>/dev/null | sed 's/MainPID=//')
            echo "${pid}" >> /tmp/dotnet-introspector/dotnet_service_pids.txt
          done
        # For each PID, get the port(s) it is listening on by inspecting /proc/${pid}/fd (open files)
        # and comparing them with open TCP ports in /proc/net/tcp
        - |
          realAwk=$(readlink -f $(which awk))
          awkArgs=''
          if [[ "${realAwk}" == "/usr/bin/gawk" ]]; then
            awkArgs="--non-decimal-data"
          fi
          for pid in `cat /tmp/dotnet-introspector/dotnet_service_pids.txt`; do
            for socket in $(sudo ls -l /proc/${pid}/fd |grep socket |sed 's/.*\[//' |sed 's/\]//' |uniq); do
              hexport=$(sudo grep ${socket} /proc/net/tcp |awk '{print $2}' |cut -d':' -f2)
              if [[ "${hexport}" -ne "" ]]; then
                echo "${hexport}" | awk $awkArgs '{ printf("%d\n","0x"$1) }' | tee -a /tmp/dotnet-introspector/ports.txt
              fi
            done
          done
        # Get the root (/) URL for the service listening on each port found
        - |
          for pn in `cat /tmp/dotnet-introspector/ports.txt`; do
            echo "Pinging http://localhost:$pn"
            for i in {1..3}; do
              sleep 1
              curl --silent http://localhost:$pn > /dev/null || true
            done
          done
        - echo "Done pinging sites"

    cleanup_temp_files:
      ignore_error: true
      cmds:
        - rm -rf /tmp/dotnet-introspector
        - echo "Done cleaning up"
