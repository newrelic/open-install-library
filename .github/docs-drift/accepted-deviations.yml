# Intentional differences between a recipe and the docs. Matching findings are listed
# under "Accepted deviations" in the report and do not count as drift.
#
# Every field except `path` is optional and defaults to "*". Globs use fnmatch syntax.
#   product:  key under `products:` in manifest.yml, e.g. oracle
#   scenario: grant/config scenario name from manifest.yml, or "links"
#   path:     config path (e.g. "receivers.nroracledb.collection_interval"), a grant
#             statement as printed in the report, or a doc URL for link findings
#   reason:   why the recipe intentionally differs - required, shown in the report
accepted:
  - product: oracle
    scenario: "*host + database*"
    path: receivers.filelog.include
    reason: >-
      The docs list the union of Debian and RHEL log paths; the -debian/-rhel recipes
      each tail only the files that exist on their OS family.
